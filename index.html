<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carro 3D Customizável</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: Arial, sans-serif; background: #111; }
  #canvas-container { width: 100vw; height: 100vh; }

  #ui {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    padding: 15px 25px;
    border-radius: 12px;
    display: flex;
    gap: 15px;
    align-items: center;
    color: #fff;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }

  #ui label { font-size: 14px; }

  input[type="color"] {
    width: 50px;
    height: 35px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
  }

  button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: #ff3b3b;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  button:hover { background: #ff5555; }

  #loading {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 18px;
  }
</style>
</head>
<body>

<div id="loading">Carregando carro 3D...</div>
<div id="canvas-container"></div>

<div id="ui">
  <label>Cor do carro:</label>
  <input type="color" id="colorPicker" value="#ff0000">
  <button id="spinBtn">Girar Auto</button>
  <button id="resetBtn">Resetar Câmera</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Cena
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// Câmera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(5, 2.5, 6);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Controles
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 0.7, 0);

// Luzes
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(5, 10, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4488ff, 1.5);
rimLight.position.set(-5, 5, -5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xffaa00, 1, 20);
fillLight.position.set(-3, 2, 3);
scene.add(fillLight);

// Chão
const groundGeo = new THREE.CircleGeometry(15, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x222233,
  roughness: 0.4,
  metalness: 0.6
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grade no chão
const grid = new THREE.GridHelper(30, 30, 0x444466, 0x222244);
grid.position.y = 0.01;
scene.add(grid);

// Variável do carro
let carro = null;
const bodyMaterials = [];

// Carregar modelo GLB
const loader = new GLTFLoader();
const CAR_URL = 'https://threejs.org/examples/models/gltf/ferrari.glb';

loader.load(
  CAR_URL,
  (gltf) => {
    carro = gltf.scene;

    carro.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;

        if (child.name && child.name.toLowerCase().includes('body')) {
          if (child.material) {
            child.material = child.material.clone();
            child.material.color = new THREE.Color(0xff0000);
            child.material.metalness = 0.9;
            child.material.roughness = 0.25;
            bodyMaterials.push(child.material);
          }
        }
      }
    });

    scene.add(carro);
    document.getElementById('loading').style.display = 'none';
  },
  (xhr) => {
    const pct = Math.round((xhr.loaded / xhr.total) * 100);
    document.getElementById('loading').textContent = `Carregando... ${pct}%`;
  },
  (err) => {
    console.error(err);
    document.getElementById('loading').textContent = 'Erro ao carregar o modelo 😢';
  }
);

// Trocar cor
document.getElementById('colorPicker').addEventListener('input', (e) => {
  const cor = new THREE.Color(e.target.value);
  bodyMaterials.forEach(mat => {
    mat.color.set(cor);
  });
});

// Girar automático
let girando = false;
document.getElementById('spinBtn').addEventListener('click', () => {
  girando = !girando;
  controls.autoRotate = girando;
  controls.autoRotateSpeed = 2.0;
});

// Resetar câmera
document.getElementById('resetBtn').addEventListener('click', () => {
  camera.position.set(5, 2.5, 6);
  controls.target.set(0, 0.7, 0);
  controls.update();
});

// Responsivo
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Loop de animação
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
