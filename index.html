<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADVENTURES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 675px;
            background: #111;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI OVERLAYS --- */
        .hud-element {
            position: absolute;
            z-index: 10;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        #lang-selector {
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #ffcc00;
            color: #000;
            border-color: #ffcc00;
        }

        #coin-hud-left {
            top: 55px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-size: 18px;
        }

        #coin-hud-right {
            top: 15px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-size: 18px;
        }

        .coin-icon {
            width: 22px;
            height: 22px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #ffaa00;
            box-shadow: 0 0 8px #ffd700;
            display: inline-block;
        }

        #level-hud {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 22px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        #btn-pause {
            top: 15px;
            right: 15px;
            background: rgba(231, 76, 60, 0.8);
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            z-index: 12;
        }

        /* --- MENUS --- */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 15px;
        }

        .title {
            font-size: 56px;
            color: #ffcc00;
            text-shadow: 4px 4px 0px #ff3300, 8px 8px 0px #000;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-main {
            width: 240px;
            padding: 14px 0;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s;
            text-align: center;
            text-transform: uppercase;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e8449, 0 5px 10px rgba(0,0,0,0.5);
        }

        .btn-fases {
            background: linear-gradient(180deg, #3498db, #2980b9);
            box-shadow: 0 6px 0 #1f618d, 0 10px 15px rgba(0,0,0,0.5);
        }

        .btn-reset {
            background: linear-gradient(180deg, #e67e22, #d35400);
            box-shadow: 0 6px 0 #a04000, 0 10px 15px rgba(0,0,0,0.5);
        }

        .btn-quit {
            background: linear-gradient(180deg, #e74c3c, #c0392b);
            box-shadow: 0 6px 0 #922b21, 0 10px 15px rgba(0,0,0,0.5);
        }

        #levels-menu { display: none; }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 80%;
            max-height: 60%;
            overflow-y: auto;
            padding: 10px;
        }

        .level-btn {
            width: 60px;
            height: 60px;
            background: #34495e;
            border: 2px solid #fff;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .level-btn.unlocked {
            background: #e67e22;
            box-shadow: 0 4px 0 #d35400;
        }

        .btn-back {
            background: #e74c3c;
            box-shadow: 0 4px 0 #c0392b;
            margin-top: 10px;
            width: 150px;
            padding: 10px;
            font-size: 16px;
        }

        #pause-menu { display: none; }

        /* --- CONTROLES TOUCH --- */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 90px;
            z-index: 15;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .touch-group-left, .touch-group-right {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .basket-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .square-jump-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD SELEÇÃO DE IDIOMAS -->
    <div id="lang-selector" class="hud-element">
        <button class="lang-btn active" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <!-- HUD MOEDAS -->
    <div id="coin-hud-left" class="hud-element">
        <span class="coin-icon"></span>
        <span id="coin-count-left">0</span>
    </div>

    <div id="coin-hud-right" class="hud-element">
        <span class="coin-icon"></span>
        <span id="coin-count-right">0</span>
    </div>

    <!-- HUD FASE ATUAL -->
    <div id="level-hud" class="hud-element">
        <span id="level-text">FASE 1</span>
    </div>

    <!-- BOTÃO PAUSE -->
    <button id="btn-pause" class="hud-element" onclick="togglePause()">|| PAUSE</button>

    <!-- MENU INICIAL -->
    <div id="main-menu" class="menu-screen">
        <h1 class="title">ADVENTURES</h1>
        <button id="btn-play" class="btn-main" onclick="startGame()">PLAY</button>
        <button id="btn-fases" class="btn-main btn-fases" onclick="showLevels()">FASES</button>
    </div>

    <!-- MENU SELEÇÃO DE FASES -->
    <div id="levels-menu" class="menu-screen">
        <h1 class="title" id="select-level-title">FASES</h1>
        <div class="levels-grid" id="levels-grid"></div>
        <button id="btn-back" class="btn-main btn-back" onclick="hideLevels()">VOLTAR</button>
    </div>

    <!-- MENU PAUSE -->
    <div id="pause-menu" class="menu-screen">
        <h1 class="title" id="pause-title">PAUSADO</h1>
        <button id="btn-resume" class="btn-main" onclick="togglePause()">CONTINUAR</button>
        <button id="btn-reset" class="btn-main btn-reset" onclick="resetCurrentMatch()">REINICIAR</button>
        <button id="btn-quit" class="btn-main btn-quit" onclick="quitToMenu()">MENU</button>
    </div>

    <!-- CONTROLES TOUCH -->
    <div id="touch-controls">
        <div class="touch-group-left">
            <div class="basket-btn" id="btn-left">&lt;</div>
            <div class="basket-btn" id="btn-right">&gt;</div>
        </div>
        <div class="touch-group-right">
            <div class="square-jump-btn" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
/* --- TEXTOS E IDIOMAS --- */
const i18n = {
    pt: {
        play: "PLAY",
        fases: "FASES",
        selectLevel: "SELECIONE A FASE",
        back: "VOLTAR",
        level: "FASE",
        jump: "PULAR",
        win: "FASE CONCLUÍDA!",
        gameover: "VOCÊ MORREU!",
        paused: "PAUSADO",
        resume: "CONTINUAR",
        reset: "REINICIAR",
        quit: "MENU"
    },
    en: {
        play: "PLAY",
        fases: "LEVELS",
        selectLevel: "SELECT LEVEL",
        back: "BACK",
        level: "LEVEL",
        jump: "JUMP",
        win: "LEVEL COMPLETE!",
        gameover: "YOU DIED!",
        paused: "PAUSED",
        resume: "RESUME",
        reset: "RESTART",
        quit: "MENU"
    }
};

let currentLang = 'pt';

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if(lang === 'pt') document.querySelectorAll('.lang-btn')[0].classList.add('active');
    else document.querySelectorAll('.lang-btn')[1].classList.add('active');

    document.getElementById('btn-play').innerText = i18n[lang].play;
    document.getElementById('btn-fases').innerText = i18n[lang].fases;
    document.getElementById('select-level-title').innerText = i18n[lang].selectLevel;
    document.getElementById('btn-back').innerText = i18n[lang].back;
    document.getElementById('btn-jump').innerText = i18n[lang].jump;
    document.getElementById('pause-title').innerText = i18n[lang].paused;
    document.getElementById('btn-resume').innerText = i18n[lang].resume;
    document.getElementById('btn-reset').innerText = i18n[lang].reset;
    document.getElementById('btn-quit').innerText = i18n[lang].quit;
    updateLevelHUD();
}

/* --- MOEDAS E PROGRESSO --- */
let totalCoins = parseInt(localStorage.getItem('adventures_coins')) || 0;
let unlockedLevel = parseInt(localStorage.getItem('adventures_level')) || 1;
let currentLevel = 1;

function updateCoinHUD() {
    document.getElementById('coin-count-left').innerText = totalCoins;
    document.getElementById('coin-count-right').innerText = totalCoins;
    localStorage.setItem('adventures_coins', totalCoins);
}

function saveProgress() {
    localStorage.setItem('adventures_coins', totalCoins);
    if (currentLevel >= unlockedLevel && unlockedLevel < 20) {
        unlockedLevel = currentLevel + 1;
        localStorage.setItem('adventures_level', unlockedLevel);
    }
}

/* --- CANVAS & ENGINE --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 675;

let isPlaying = false;
let isPaused = false;
let keys = { left: false, right: false, up: false };

const player = {
    x: 80,
    y: 300,
    width: 26,     // Tamanho ajustado e proporcional
    height: 42,
    vx: 0,
    vy: 0,
    baseSpeed: 5.0,
    speed: 5.0,
    jumpForce: -13.0,
    gravity: 0.6,
    grounded: false,
    facing: 'right',
    animFrame: 0,
    speedBoostTimer: 0 // Bônus da Maçã Vermelha
};

let platforms = [];
let obstacles = [];
let coins = [];
let enemies = [];
let plants = [];
let apples = []; // Maçãs Vermelhas de Agilidade
let particles = [];
let mountains = [];
let flag = null;
let globalTime = 0;

/* --- GERADOR DE FASES --- */
function generateLevel(lvl) {
    platforms = [];
    obstacles = [];
    coins = [];
    enemies = [];
    plants = [];
    apples = [];
    particles = [];
    mountains = [];
    player.speedBoostTimer = 0;

    platforms.push({ x: 0, y: 500, w: 260, h: 175, type: 'grass' });

    let currentX = 260;
    const levelLength = 25 + lvl * 5;

    // GERAR MONTANHAS LARGAS NO FUNDO
    let mountainX = -300;
    for (let m = 0; m < levelLength / 2; m++) {
        let mW = 600 + Math.random() * 500; // Montanhas bem mais largas!
        let mH = 260 + Math.random() * 160;
        mountains.push({
            x: mountainX,
            y: 580 - mH,
            w: mW,
            h: mH,
            color: m % 2 === 0 ? '#2c3e50' : '#1f2d3d'
        });
        mountainX += mW - 150;
    }

    const slugColors = ['#8e44ad', '#e74c3c', '#2980b9']; // Cores Sortidas: Roxa, Vermelha e Azul

    for (let i = 0; i < levelLength; i++) {
        let gap = 80 + Math.random() * 70 + (lvl * 2);
        currentX += gap;

        let platWidth = Math.max(160, 280 - lvl * 4 + Math.random() * 60);
        let platY = 380 + Math.random() * 130;

        platforms.push({ x: currentX, y: platY, w: platWidth, h: 675 - platY, type: 'grass' });

        // MAÇÃ VERMELHA NORMAL (FLUTUANTE & DÁ AGILIDADE)
        if (i > 1 && Math.random() < 0.25) {
            apples.push({
                x: currentX + platWidth / 2,
                baseY: platY - 45,
                y: platY - 45,
                w: 20,
                h: 20,
                eaten: false,
                floatOffset: Math.random() * Math.PI * 2
            });
        }

        // VENUSPINO / PLANTA CARNÍVORA MELHORADA
        if (i > 1 && Math.random() > 0.4) {
            plants.push({
                x: currentX + 40 + Math.random() * (platWidth - 90),
                y: platY,
                w: 42,
                h: 36,
                timer: 0,
                triggered: false,
                mouthAngle: 0
            });
        }

        // OBSTÁCULOS
        if (Math.random() > 0.5) {
            let obsType = Math.random() > 0.5 ? 'stone' : 'trunk';
            let obsW = obsType === 'stone' ? 36 : 48;
            let obsH = obsType === 'stone' ? 30 : 26;
            
            obstacles.push({
                x: currentX + platWidth / 2 - obsW / 2,
                y: platY - obsH,
                w: obsW,
                h: obsH,
                type: obsType
            });
        }

        // LESMAS MELHORADAS COM CORES SORTIDAS
        if (i > 0 && Math.random() > 0.3) {
            let randomColor = slugColors[Math.floor(Math.random() * slugColors.length)];
            enemies.push({
                x: currentX + 20,
                y: platY - 22,
                w: 36,
                h: 22,
                vx: 1.2,
                hp: 2,
                platMin: currentX,
                platMax: currentX + platWidth,
                animTimer: 0,
                color: randomColor
            });
        }

        // TRONCO FLUTUANTE
        if (gap > 110 && Math.random() > 0.3) {
            let logX = currentX - gap / 2 - 30;
            let logY = 490;
            platforms.push({ x: logX, y: logY, w: 65, h: 22, type: 'floating_wood' });
        }

        // MOEDAS
        let coinsInPlat = 1 + Math.floor(Math.random() * 3);
        for (let c = 0; c < coinsInPlat; c++) {
            coins.push({
                x: currentX + 25 + (c * 35),
                y: platY - 50 - (Math.random() * 30),
                w: 28,
                h: 28,
                collected: false
            });
        }

        currentX += platWidth;
    }

    currentX += 100;
    platforms.push({ x: currentX, y: 480, w: 280, h: 200, type: 'grass' });
    flag = { x: currentX + 180, y: 380, w: 20, h: 100 };

    player.x = 80;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
}

function spawnSmoke(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x + Math.random() * 20 - 10,
            y: y + Math.random() * 10,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            size: 6 + Math.random() * 10,
            alpha: 1,
            color: '#bdc3c7'
        });
    }
}

let cameraX = 0;

function update() {
    if (!isPlaying || isPaused) return;

    globalTime += 0.05;

    // Lógica do Bônus de Agilidade da Maçã Vermelha
    if (player.speedBoostTimer > 0) {
        player.speedBoostTimer -= 1 / 60;
        player.speed = player.baseSpeed * 1.6; // Dobra/Aumenta velocidade
    } else {
        player.speed = player.baseSpeed;
    }

    // Movimento do Jogador
    if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.animFrame += 0.2;
    } else if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.animFrame += 0.2;
    } else {
        player.vx = 0;
        player.animFrame = 0;
    }

    if (keys.up && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
    }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Colisão com Plataformas
    player.grounded = false;
    for (let p of platforms) {
        if (
            player.x < p.x + p.w &&
            player.x + player.width > p.x &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.h + player.vy + 4 &&
            player.vy >= 0
        ) {
            player.grounded = true;
            player.vy = 0;
            player.y = p.y - player.height;
        }
    }

    // MAÇÃ FLUTUANTE (EFEITO BOBBING)
    for (let apple of apples) {
        if (!apple.eaten) {
            apple.y = apple.baseY + Math.sin(globalTime * 2 + apple.floatOffset) * 6;

            if (
                player.x < apple.x + apple.w &&
                player.x + player.width > apple.x &&
                player.y < apple.y + apple.h &&
                player.y + player.height > apple.y
            ) {
                apple.eaten = true;
                player.speedBoostTimer = 10; // 10 Segundos de Super Agilidade!
            }
        }
    }

    // VENUSPINO (PLANTA CARNÍVORA MELHORADA)
    for (let plant of plants) {
        let dist = Math.abs((player.x + player.width / 2) - (plant.x + plant.w / 2));
        
        if (dist < 80) {
            plant.triggered = true;
        }

        if (plant.triggered) {
            plant.timer += 0.08;
            plant.mouthAngle = Math.abs(Math.sin(plant.timer)) * 1.2;

            if (
                player.x < plant.x + plant.w &&
                player.x + player.width > plant.x &&
                player.y + player.height > plant.y - plant.h &&
                player.y < plant.y
            ) {
                alert(i18n[currentLang].gameover);
                generateLevel(currentLevel);
                return;
            }
        }
    }

    // Obstáculos
    for (let obs of obstacles) {
        if (
            player.x < obs.x + obs.w &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.h &&
            player.y + player.height > obs.y
        ) {
            if (player.vx > 0 && player.x + player.width - player.vx <= obs.x) {
                player.x = obs.x - player.width;
            } else if (player.vx < 0 && player.x - player.vx >= obs.x + obs.w) {
                player.x = obs.x + obs.w;
            } else if (player.vy > 0 && player.y + player.height - player.vy <= obs.y) {
                player.grounded = true;
                player.vy = 0;
                player.y = obs.y - player.height;
            }
        }
    }

    // LESMAS SORTIDAS MELHORADAS
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x += e.vx;
        e.animTimer += 0.15;

        if (e.x <= e.platMin || e.x + e.w >= e.platMax) {
            e.vx *= -1;
        }

        if (
            player.x < e.x + e.w &&
            player.x + player.width > e.x &&
            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ) {
            if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 10) {
                player.vy = -9;
                e.hp -= 1;

                if (e.hp === 1) {
                    e.h = 14;
                    e.y += 8;
                } else if (e.hp <= 0) {
                    spawnSmoke(e.x + e.w / 2, e.y + e.h / 2);
                    coins.push({
                        x: e.x + 4,
                        y: e.y - 10,
                        w: 28,
                        h: 28,
                        collected: false
                    });
                    enemies.splice(i, 1);
                    continue;
                }
            } else {
                alert(i18n[currentLang].gameover);
                generateLevel(currentLevel);
                return;
            }
        }
    }

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.size += 0.2;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    // Coleta Moedas
    for (let coin of coins) {
        if (!coin.collected &&
            player.x < coin.x + coin.w &&
            player.x + player.width > coin.x &&
            player.y < coin.y + coin.h &&
            player.y + player.height > coin.y) {
            coin.collected = true;
            totalCoins += 10;
            updateCoinHUD();
        }
    }

    // Câmera
    cameraX = player.x - 200;
    if (cameraX < 0) cameraX = 0;

    // Queda
    if (player.y > canvas.height) {
        alert(i18n[currentLang].gameover);
        generateLevel(currentLevel);
    }

    // Vitória
    if (flag && player.x > flag.x) {
        saveProgress();
        alert(i18n[currentLang].win);
        if (currentLevel < 20) {
            currentLevel++;
            updateLevelHUD();
            generateLevel(currentLevel);
        } else {
            showMainMenu();
        }
    }
}

/* --- RENDERIZAÇÃO GRÁFICA --- */
function render() {
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#2c3e50');
    skyGradient.addColorStop(1, '#516b8b');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // MONTANHAS LARGAS COM PARALLAX
    for (let m of mountains) {
        let mParallaxX = m.x - (cameraX * 0.25);
        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.moveTo(mParallaxX, m.y + m.h);
        ctx.lineTo(mParallaxX + m.w / 2, m.y);
        ctx.lineTo(mParallaxX + m.w, m.y + m.h);
        ctx.fill();

        // Neve no topo
        ctx.fillStyle = '#ecf0f1';
        ctx.beginPath();
        ctx.moveTo(mParallaxX + m.w / 2 - 40, m.y + 50);
        ctx.lineTo(mParallaxX + m.w / 2, m.y);
        ctx.lineTo(mParallaxX + m.w / 2 + 40, m.y + 50);
        ctx.fill();
    }

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Rio
    ctx.fillStyle = '#1e73be';
    ctx.fillRect(cameraX, 580, canvas.width, 100);

    // PLATAFORMAS
    const BLOCK_SIZE = 20;
    for (let p of platforms) {
        if (p.type === 'grass') {
            for (let bx = p.x; bx < p.x + p.w; bx += BLOCK_SIZE) {
                let bw = Math.min(BLOCK_SIZE, p.x + p.w - bx);
                for (let by = p.y + 16; by < p.y + p.h; by += BLOCK_SIZE) {
                    let bh = Math.min(BLOCK_SIZE, p.y + p.h - by);
                    let isDark = ((Math.floor(bx/BLOCK_SIZE) + Math.floor(by/BLOCK_SIZE)) % 2 === 0);
                    ctx.fillStyle = isDark ? '#73462c' : '#5c3520';
                    ctx.fillRect(bx, by, bw, bh);
                }
            }

            ctx.fillStyle = '#47a025';
            ctx.fillRect(p.x, p.y, p.w, 16);
            ctx.fillStyle = '#5bc22e';
            ctx.fillRect(p.x, p.y, p.w, 5);
        } else if (p.type === 'floating_wood') {
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(p.x, p.y, 4, p.h);
            ctx.fillRect(p.x + p.w - 4, p.y, 4, p.h);
        }
    }

    // MAÇÃ VERMELHA NORMAL (FLUTUANTE)
    for (let apple of apples) {
        if (!apple.eaten) {
            let ax = apple.x;
            let ay = apple.y;

            // Fruta Vermelha
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(ax + 3, ay + 3, 14, 14);
            ctx.fillRect(ax + 5, ay + 1, 10, 18);
            ctx.fillRect(ax + 1, ay + 5, 18, 10);

            // Brilho
            ctx.fillStyle = '#ff7979';
            ctx.fillRect(ax + 4, ay + 4, 4, 4);

            // Cabinho & Folha Verde
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(ax + 9, ay - 3, 3, 4);
            ctx.fillRect(ax + 12, ay - 3, 4, 2);
        }
    }

    // VENUSPINO (PLANTA CARNÍVORA MELHORADA)
    for (let plant of plants) {
        let px = plant.x;
        let py = plant.y;

        // Caule / Vaso no chão
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(px + 16, py - 18, 10, 18);

        // Cabeça do Venuspino
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath();
        ctx.arc(px + 21, py - 24, 18, 0, Math.PI * 2);
        ctx.fill();

        // Boca / Dentes Animados
        ctx.fillStyle = '#c0392b';
        let openHeight = Math.sin(globalTime * 6) * 8 + 4;
        ctx.fillRect(px + 8, py - 28 - openHeight / 2, 26, openHeight);

        // Dentes Afiados
        ctx.fillStyle = '#ffffff';
        for (let d = 10; d < 32; d += 6) {
            ctx.fillRect(px + d, py - 28 - openHeight / 2, 3, 3);
            ctx.fillRect(px + d, py - 28 + openHeight / 2 - 3, 3, 3);
        }
    }

    // LESMAS SORTIDAS (ROXA, VERMELHA, AZUL)
    for (let e of enemies) {
        let squish = Math.sin(e.animTimer * 4) * 3;
        let ew = e.w + squish;
        let eh = e.h - squish;

        // Corpo Principal da Lesma
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x - squish / 2, e.y + squish, ew, eh);

        // Textura/Brilho nas Costas
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(e.x + 4, e.y + squish + 3, ew - 10, 4);

        // Olhos Retráteis Pixelados
        ctx.fillStyle = '#fff';
        let eyeX = e.vx > 0 ? e.x + ew - 8 : e.x + 2;
        ctx.fillRect(eyeX, e.y + squish - 4, 5, 5);
        ctx.fillStyle = '#000';
        ctx.fillRect(eyeX + (e.vx > 0 ? 2 : 0), e.y + squish - 3, 3, 3);
    }

    // OBSTÁCULOS
    for (let obs of obstacles) {
        if (obs.type === 'stone') {
            ctx.fillStyle = '#636e72';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#b2bec3';
            ctx.fillRect(obs.x, obs.y, obs.w, 4);
        } else {
            ctx.fillStyle = '#6e473b';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#d7ccc8';
            ctx.fillRect(obs.x + 2, obs.y + 2, 6, obs.h - 4);
        }
    }

    // MOEDAS PIXELADAS
    for (let coin of coins) {
        if (!coin.collected) {
            let cx = coin.x;
            let cy = coin.y;
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(cx + 4, cy + 4, 20, 20);
            ctx.fillStyle = '#fff';
            ctx.fillRect(cx + 6, cy + 6, 4, 4);
        }
    }

    // PARTÍCULAS
    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
    }

    // BANDEIRA FINAL
    if (flag) {
        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(flag.x, flag.y, 6, flag.h);
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.moveTo(flag.x + 6, flag.y);
        ctx.lineTo(flag.x + 48, flag.y + 20);
        ctx.lineTo(flag.x + 6, flag.y + 40);
        ctx.fill();
    }

    // PERSONAGEM HUMANOIDE MELHORADO (CABEÇA, BRAÇOS, PERNAS)
    let px = player.x;
    let py = player.y;

    // Animação de Passos (Pernas)
    let legOffset = Math.sin(player.animFrame * 2) * 5;

    // Cabeça
    ctx.fillStyle = '#f1c40f'; // Capacete/Cabelo Amarelo
    ctx.fillRect(px + 4, py, 18, 12);
    ctx.fillStyle = '#ffdbac'; // Pele
    ctx.fillRect(px + 6, py + 8, 14, 8);

    // Olhos
    ctx.fillStyle = '#000';
    let eyeOffsetX = player.facing === 'right' ? 14 : 6;
    ctx.fillRect(px + eyeOffsetX, py + 10, 3, 3);

    // Tronco (Camisa Vermelha ou Azul se tiver Agilidade)
    ctx.fillStyle = player.speedBoostTimer > 0 ? '#00d2d3' : '#e74c3c';
    ctx.fillRect(px + 4, py + 16, 18, 14);

    // Braços Animados
    ctx.fillStyle = '#ffdbac';
    if (player.facing === 'right') {
        ctx.fillRect(px + 2, py + 18 - legOffset, 4, 10);
        ctx.fillRect(px + 20, py + 18 + legOffset, 4, 10);
    } else {
        ctx.fillRect(px + 2, py + 18 + legOffset, 4, 10);
        ctx.fillRect(px + 20, py + 18 - legOffset, 4, 10);
    }

    // Calça / Pernas Animadas
    ctx.fillStyle = '#2980b9';
    ctx.fillRect(px + 5 - legOffset / 2, py + 30, 7, 12);
    ctx.fillRect(px + 14 + legOffset / 2, py + 30, 7, 12);

    // Sapatos
    ctx.fillStyle = '#34495e';
    ctx.fillRect(px + 4 - legOffset / 2, py + 39, 8, 3);
    ctx.fillRect(px + 14 + legOffset / 2, py + 39, 8, 3);

    ctx.restore();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

/* --- PAUSE E CONTROLE DE MENUS --- */
function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
}

function resetCurrentMatch() {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
    generateLevel(currentLevel);
}

function quitToMenu() {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
    showMainMenu();
}

function updateLevelHUD() {
    document.getElementById('level-text').innerText = `${i18n[currentLang].level} ${currentLevel}`;
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    isPlaying = true;
    isPaused = false;
    generateLevel(currentLevel);
}

function showLevels() {
    document.getElementById('main-menu').style.display = 'none';
    const grid = document.getElementById('levels-grid');
    grid.innerHTML = '';

    for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${i <= unlockedLevel ? 'unlocked' : ''}`;
        btn.innerText = i;
        if (i <= unlockedLevel) {
            btn.onclick = () => {
                currentLevel = i;
                updateLevelHUD();
                document.getElementById('levels-menu').style.display = 'none';
                startGame();
            };
        }
        grid.appendChild(btn);
    }

    document.getElementById('levels-menu').style.display = 'flex';
}

function hideLevels() {
    document.getElementById('levels-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function showMainMenu() {
    isPlaying = false;
    isPaused = false;
    document.getElementById('main-menu').style.display = 'flex';
}

/* --- EVENTOS DE CONTROLE --- */
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = false;
});

function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    el.addEventListener('mousedown', () => { keys[keyProp] = true; });
    el.addEventListener('mouseup', () => { keys[keyProp] = false; });
}

bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'up');

updateCoinHUD();
setLanguage('pt');
requestAnimationFrame(gameLoop);

</script>
