<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bike 2D - Pulo, Grau e Mortal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; user-select: none; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 12px; left: 12px; color: #fff;
    font-size: 18px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,.6);
    pointer-events: none; line-height: 1.5;
  }
  #hud .best { font-size: 13px; opacity: .8; font-weight: 500; }

  #combo {
    position: fixed; top: 12px; right: 12px; color: #ffd166;
    font-size: 20px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.6);
    pointer-events: none; opacity: 0; transition: opacity .2s;
    text-align: right;
  }
  #combo.on { opacity: 1; }
  #combo .flip { display: block; color: #4ecdc4; font-size: 16px; }

  /* Botões */
  .btn {
    position: fixed;
    width: 88px; height: 88px;
    border-radius: 18px;
    border: 3px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    touch-action: none; cursor: pointer;
    transition: transform .08s, background .12s, border-color .12s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    padding: 0;
  }
  .btn svg { width: 62%; height: 62%; display: block; }
  .btn:active, .btn.pressed {
    transform: scale(0.93);
    background: rgba(255,255,255,0.28);
    border-color: #fff;
  }

  /* Botão PULAR — fica em cima do GRAU, à esquerda */
  #btnJump {
    right: 128px; bottom: 22px;
    border-color: rgba(78, 205, 196, 0.75);
    background: rgba(78, 205, 196, 0.15);
  }
  #btnJump:active, #btnJump.pressed {
    background: rgba(78, 205, 196, 0.5);
    border-color: #4ecdc4;
  }

  /* Botão GRAU — canto inferior direito */
  #btnGrau {
    right: 22px; bottom: 22px;
    border-color: rgba(255, 82, 82, 0.75);
    background: rgba(255, 82, 82, 0.15);
  }
  #btnGrau:active, #btnGrau.pressed {
    background: rgba(255, 82, 82, 0.5);
    border-color: #ff5252;
  }

  /* Botão MORTAL — em cima, no meio dos dois */
  #btnFlip {
    right: 75px; bottom: 122px;
    border-color: rgba(255, 209, 102, 0.8);
    background: rgba(255, 209, 102, 0.15);
  }
  #btnFlip:active, #btnFlip.pressed {
    background: rgba(255, 209, 102, 0.55);
    border-color: #ffd166;
    box-shadow: 0 0 22px rgba(255, 209, 102, 0.7);
  }

  @media (max-height: 520px) {
    .btn { width: 72px; height: 72px; border-radius: 14px; }
    #btnJump { right: 104px; bottom: 14px; }
    #btnGrau { right: 14px; bottom: 14px; }
    #btnFlip { right: 59px; bottom: 96px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>Pontos: <span id="score">0</span></div>
  <div class="best">Recorde: <span id="best">0</span></div>
</div>
<div id="combo"></div>

<!-- Botão PULAR: seta pra cima -->
<button class="btn" id="btnJump" aria-label="Pular">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 14 L82 52 H66 V86 H34 V52 H18 Z"
          fill="#4ecdc4" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 26 L70 50 H60 V78 H40 V50 H30 Z"
          fill="rgba(255,255,255,0.35)"/>
  </svg>
</button>

<!-- Botão GRAU: bike empinada -->
<button class="btn" id="btnGrau" aria-label="Grau">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="6" y1="86" x2="94" y2="86" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="72" r="14" fill="none" stroke="#ff5252" stroke-width="5"/>
    <circle cx="26" cy="72" r="3" fill="#ff5252"/>
    <circle cx="72" cy="30" r="12" fill="none" stroke="#ff5252" stroke-width="5"/>
    <circle cx="72" cy="30" r="3" fill="#ff5252"/>
    <path d="M26 72 L44 58 L60 44 L72 30"
          stroke="#ff5252" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="62" x2="50" y2="54" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="44" x2="68" y2="38" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="52" cy="42" r="7" fill="#4ecdc4" stroke="#ffffff" stroke-width="3"/>
    <path d="M48 58 L54 48 L64 42"
          stroke="#4ecdc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- Botão MORTAL: seta circular (giro 360) -->
<button class="btn" id="btnFlip" aria-label="Mortal">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- arco circular quase completo -->
    <path d="M72 28 A30 30 0 1 1 28 28"
          stroke="#ffd166" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- ponta da seta -->
    <path d="M28 28 L22 40 L36 38 Z"
          fill="#ffd166" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- bike girando no centro (pequena) -->
    <circle cx="50" cy="52" r="7" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="50" cy="52" r="1.8" fill="#ffffff"/>
    <line x1="50" y1="52" x2="60" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="52" x2="42" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </svg>
</button>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const btnJump = document.getElementById('btnJump');
  const btnGrau = document.getElementById('btnGrau');
  const btnFlip = document.getElementById('btnFlip');

  let W = 0, H = 0, DPR = 1;
  let groundY = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H - Math.max(80, H * 0.16);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Estado ----------
  const bike = {
    x: 0, y: 0, vy: 0,
    angle: 0,          // rotação visual total
    wheelie: 0,        // 0..1 grau
    spin: 0,           // rotação do mortal (radianos)
    spinSpeed: 0,
    onGround: true,
    wheelRadius: 0
  };

  const GRAVITY = 2600;
  const JUMP_VELOCITY = -1000;
  const MAX_WHEELIE = 0.85;
  const WHEELIE_UP = 3.5;
  const WHEELIE_DOWN = 4.5;

  const FLIP_SPEED = 9.0;    // rad/s de giro
  const FLIP_MAX = Math.PI * 2;

  let jumpHeld = false;
  let grauHeld = false;
  let flipHeld = false;

  const obstacles = [];
  let obstacleTimer = 0;

  // rampas fixas (rolam com o mundo)
  const ramps = [];
  let rampTimer = 0;

  let speed = 420;
  let score = 0;
  let best = +(localStorage.getItem('bikeBest') || 0);
  bestEl.textContent = Math.floor(best);

  let worldOffset = 0;
  let gameOver = false;

  let airTime = 0;
  let wheelieTime = 0;
  let comboMult = 1;
  let comboTimer = 0;
  let flipScorePending = 0;

  const particles = [];

  const clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * 2000,
      y: Math.random() * (H * 0.42) + 20,
      s: 0.6 + Math.random() * 0.9,
      sp: 0.15 + Math.random() * 0.25
    });
  }

  function reset() {
    bike.x = W * 0.22;
    bike.y = groundY;
    bike.vy = 0;
    bike.angle = 0;
    bike.wheelie = 0;
    bike.spin = 0;
    bike.spinSpeed = 0;
    bike.onGround = true;
    bike.wheelRadius = Math.max(14, Math.min(W, H) * 0.032);

    obstacles.length = 0;
    ramps.length = 0;
    particles.length = 0;
    obstacleTimer = 1.5;
    rampTimer = 2.5;
    speed = 420;
    score = 0;
    airTime = 0;
    wheelieTime = 0;
    comboMult = 1;
    comboTimer = 0;
    flipScorePending = 0;
    worldOffset = 0;
    gameOver = false;
    jumpHeld = false;
    grauHeld = false;
    flipHeld = false;
    btnJump.classList.remove('pressed');
    btnGrau.classList.remove('pressed');
    btnFlip.classList.remove('pressed');
    comboEl.classList.remove('on');
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = Math.floor(score);
  }

  // ---------- Entrada ----------
  function onJumpDown(e) {
    e && e.preventDefault();
    if (gameOver) { reset(); return; }
    jumpHeld = true;
    btnJump.classList.add('pressed');
    if (bike.onGround) {
      bike.vy = JUMP_VELOCITY;
      bike.onGround = false;
      spawnDust(bike.x - bike.wheelRadius, groundY, 8);
    }
  }
  function onJumpUp(e) {
    e && e.preventDefault();
    jumpHeld = false;
    btnJump.classList.remove('pressed');
  }
  function onGrauDown(e) {
    e && e.preventDefault();
    if (gameOver) { reset(); return; }
    grauHeld = true;
    btnGrau.classList.add('pressed');
    if (bike.onGround) spawnDust(bike.x - bike.wheelRadius, groundY, 4);
  }
  function onGrauUp(e) {
    e && e.preventDefault();
    grauHeld = false;
    btnGrau.classList.remove('pressed');
  }
  function onFlipDown(e) {
    e && e.preventDefault();
    if (gameOver) { reset(); return; }
    flipHeld = true;
    btnFlip.classList.add('pressed');
    // se está no chão, dá um impulso pra cima e começa o mortal
    if (bike.onGround) {
      bike.vy = JUMP_VELOCITY * 1.15;
      bike.onGround = false;
      spawnDust(bike.x - bike.wheelRadius, groundY, 10);
    }
    // só gira se estiver no ar
    if (!bike.onGround) {
      bike.spinSpeed = FLIP_SPEED;
    }
  }
  function onFlipUp(e) {
    e && e.preventDefault();
    flipHeld = false;
    btnFlip.classList.remove('pressed');
  }

  btnJump.addEventListener('pointerdown', onJumpDown);
  btnJump.addEventListener('pointerup', onJumpUp);
  btnJump.addEventListener('pointercancel', onJumpUp);
  btnJump.addEventListener('pointerleave', onJumpUp);
  btnGrau.addEventListener('pointerdown', onGrauDown);
  btnGrau.addEventListener('pointerup', onGrauUp);
  btnGrau.addEventListener('pointercancel', onGrauUp);
  btnGrau.addEventListener('pointerleave', onGrauUp);
  btnFlip.addEventListener('pointerdown', onFlipDown);
  btnFlip.addEventListener('pointerup', onFlipUp);
  btnFlip.addEventListener('pointercancel', onFlipUp);
  btnFlip.addEventListener('pointerleave', onFlipUp);

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) onJumpDown(e);
    if (e.code === 'ArrowUp' && !e.repeat) onGrauDown(e);
    if (e.code === 'KeyF' && !e.repeat) onFlipDown(e);
    if (gameOver && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyF')) reset();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') onJumpUp(e);
    if (e.code === 'ArrowUp') onGrauUp(e);
    if (e.code === 'KeyF') onFlipUp(e);
  });

  // ---------- Obstáculos e rampas ----------
  function spawnObstacle() {
    const r = Math.random();
    if (r < 0.4) {
      const w = 26 + Math.random() * 28;
      obstacles.push({ type: 'rock', x: W + 40, w, h: w * (0.9 + Math.random() * 0.5) });
    } else if (r < 0.75) {
      const w = 40 + Math.random() * 40;
      obstacles.push({ type: 'box', x: W + 40, w, h: w * (0.7 + Math.random() * 0.4) });
    } else {
      const w = 70 + Math.random() * 70;
      obstacles.push({ type: 'rock', x: W + 40, w, h: 18 + Math.random() * 24 });
    }
  }

  function spawnRamp() {
    // rampa de voada: bem larga e alta
    const w = 130 + Math.random() * 70;
    ramps.push({ x: W + 60, w, h: 90 + Math.random() * 40 });
  }

  // ---------- Partículas ----------
  function spawnDust(x, y, n) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: -60 - Math.random() * 120,
        vy: -40 - Math.random() * 120,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 0.8,
        size: 2 + Math.random() * 4,
        color: Math.random() < 0.5 ? '#e0c9a6' : '#b8a087'
      });
    }
  }
  function spawnSparks(x, y, colorA, colorB) {
    for (let i = 0; i < 3; i++) {
      particles.push({
        x, y,
        vx: -100 - Math.random() * 200,
        vy: -30 - Math.random() * 120,
        life: 0.25 + Math.random() * 0.2,
        maxLife: 0.45,
        size: 1.5 + Math.random() * 2,
        color: Math.random() < 0.5 ? (colorA || '#ffd166') : (colorB || '#ff8c42')
      });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 600 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (gameOver) return;

    speed = 420 + Math.min(score * 1.2, 560);

    // ---- Física vertical ----
    const inAir = !bike.onGround;
    if (jumpHeld && inAir && bike.vy < 0) {
      bike.vy += GRAVITY * 0.35 * dt;
    } else {
      bike.vy += GRAVITY * dt;
    }
    bike.y += bike.vy * dt;

    // ---- Mortal (flip) ----
    if (flipHeld && !bike.onGround) {
      bike.spinSpeed = FLIP_SPEED;
    } else {
      // desacelera se soltar
      bike.spinSpeed *= 0.94;
      if (Math.abs(bike.spinSpeed) < 0.1) bike.spinSpeed = 0;
    }
    bike.spin += bike.spinSpeed * dt;

    // Se completou uma volta no ar -> pontos de mortal
    if (!bike.onGround && Math.abs(bike.spin) >= FLIP_MAX - 0.15 && flipScorePending === 0) {
      flipScorePending = 1;
      spawnSparks(bike.x, bike.y, '#4ecdc4', '#ffd166');
    }

    // ---- Aterrissagem ----
    if (bike.y >= groundY) {
      if (!bike.onGround) {
        // bônus de tempo no ar
        score += airTime * 80;
        // bônus de mortal
        if (flipScorePending === 1) {
          score += 500;
          comboEl.innerHTML = 'MORTAL! +500<span class="flip">GRAU x' + comboMult.toFixed(1) + '</span>';
          comboEl.classList.add('on');
          comboTimer = 1.2;
          flipScorePending = 0;
        }
        if (airTime > 0.15) spawnDust(bike.x, groundY, 6);
        airTime = 0;
      }
      bike.y = groundY;
      bike.vy = 0;
      bike.onGround = true;
      // zera rotação do mortal ao pousar (alinha com o chão)
      bike.spin = 0;
      bike.spinSpeed = 0;
      flipScorePending = 0;
    } else {
      bike.onGround = false;
      airTime += dt;
    }

    // ---- Grau (wheelie) ----
    if (grauHeld && bike.onGround) {
      bike.wheelie = Math.min(MAX_WHEELIE, bike.wheelie + WHEELIE_UP * dt);
      if (bike.wheelie > 0.5 && Math.random() < 0.5) {
        spawnSparks(bike.x - bike.wheelRadius * 1.5, groundY - 2);
      }
    } else {
      bike.wheelie = Math.max(0, bike.wheelie - WHEELIE_DOWN * dt);
    }

    // ---- Ângulo visual = grau + mortal ----
    bike.angle = -bike.wheelie + bike.spin;

    // ---- Pontos por grau ----
    if (bike.onGround && bike.wheelie > 0.35) {
      wheelieTime += dt;
      comboMult = 1 + Math.min(bike.wheelie * 2.5, 2.5);
      comboTimer = 0.6;
      score += dt * 40 * bike.wheelie * comboMult;
      comboEl.innerHTML = 'GRAU x' + comboMult.toFixed(1);
      comboEl.classList.add('on');
    } else {
      if (comboTimer > 0 && flipScorePending === 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) {
          comboEl.classList.remove('on');
          comboMult = 1;
        }
      }
    }

    score += dt * 12;
    worldOffset += speed * dt;

    // ---- Spawn ----
    obstacleTimer -= dt;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      const interval = Math.max(0.85, 1.7 - score * 0.0014);
      obstacleTimer = interval * (0.75 + Math.random() * 0.6);
    }
    rampTimer -= dt;
    if (rampTimer <= 0) {
      spawnRamp();
      rampTimer = 3.5 + Math.random() * 2.5;
    }

    // ---- Colisão com rampas (sobe pela inclinação) ----
    const r = bike.wheelRadius;
    for (let i = ramps.length - 1; i >= 0; i--) {
      const rp = ramps[i];
      rp.x -= speed * dt;
      if (rp.x + rp.w < -100) { ramps.splice(i, 1); continue; }

      // A rampa vai do chão (esquerda) até o topo (direita, mais alta)
      // Como a bike anda pra direita, ela sobe a rampa.
      const rearX = bike.x - r * 1.7;
      const frontX = bike.x + r * 1.7;

      // se a bike está sobre a rampa horizontalmente
      if (frontX > rp.x && rearX < rp.x + rp.w) {
        // altura da rampa na posição da bike (interpolação linear)
        const t = Math.max(0, Math.min(1, (bike.x - rp.x) / rp.w));
        const rampTopY = groundY - t * rp.h;

        // se a bike está no chão ou abaixo do topo da rampa
        if (bike.y >= rampTopY - 2) {
          bike.y = rampTopY;
          bike.onGround = true;
          bike.vy = 0;
        } else if (bike.y < rampTopY) {
          bike.onGround = false;
        }
      }

      // saiu pela ponta direita -> lança pra cima (voada!)
      if (rearX >= rp.x + rp.w - 2 && bike.onGround === false && bike.vy >= 0) {
        // impulso extra de voada
        if (bike.y <= groundY - rp.h * 0.6) {
          bike.vy = -1150;
          bike.onGround = false;
          spawnDust(bike.x, bike.y, 10);
        }
      }
    }

    // ---- Colisão com obstáculos ----
    const cos = Math.cos(bike.angle);
    const sin = Math.sin(bike.angle);
    const rearX = bike.x + (-r * 1.7) * cos;
    const rearY = bike.y + (-r * 1.7) * sin;
    const frontX = bike.x + (r * 1.7) * cos;
    const frontY = bike.y + (r * 1.7) * sin;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * dt;
      if (o.x + o.w < -80) { obstacles.splice(i, 1); continue; }

      const top = groundY - o.h;
      if (circleRect(rearX, rearY, r * 0.85, o.x, top, o.w, o.h) ||
          circleRect(frontX, frontY, r * 0.85, o.x, top, o.w, o.h)) {
        gameOver = true;
        best = Math.max(best, score);
        localStorage.setItem('bikeBest', Math.floor(best));
        bestEl.textContent = Math.floor(best);
        for (let k = 0; k < 25; k++) spawnSparks(bike.x, bike.y - r);
        return;
      }
    }

    for (const c of clouds) {
      c.x -= (speed * 0.06 + c.sp * 30) * dt;
      if (c.x < -150) {
        c.x = W + Math.random() * 300;
        c.y = Math.random() * (H * 0.42) + 20;
      }
    }

    updateHUD();
  }

  function circleRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  // ---------- Render ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1a2e');
    g.addColorStop(0.45, '#2d3561');
    g.addColorStop(0.75, '#a85a7a');
    g.addColorStop(1, '#f4a261');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const sx = W * 0.78, sy = H * 0.3;
    const sr = Math.min(W, H) * 0.08;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.5);
    sg.addColorStop(0, 'rgba(255, 220, 150, 0.95)');
    sg.addColorStop(0.4, 'rgba(255, 200, 120, 0.5)');
    sg.addColorStop(1, 'rgba(255, 200, 120, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, sr * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe0a3';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(30, 25, 55, 0.7)';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    const mOff = (worldOffset * 0.15) % 400;
    for (let x = -mOff - 200; x < W + 400; x += 200) {
      ctx.lineTo(x, groundY - 80 - Math.sin((x + worldOffset * 0.05) * 0.01) * 40);
      ctx.lineTo(x + 100, groundY - 140);
      ctx.lineTo(x + 200, groundY - 80);
    }
    ctx.lineTo(W, groundY);
    ctx.closePath();
    ctx.fill();

    for (const c of clouds) {
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      const r = 30 * c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.arc(c.x + r * 0.9, c.y + r * 0.15, r * 0.75, 0, Math.PI * 2);
      ctx.arc(c.x - r * 0.9, c.y + r * 0.2, r * 0.65, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, '#3a2b4a');
    g.addColorStop(1, '#100a1a');
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);

    ctx.strokeStyle = 'rgba(244, 162, 97, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 3;
    const dashW = 60;
    const offset = worldOffset % (dashW * 2);
    for (let x = -offset; x < W; x += dashW * 2) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 16);
      ctx.lineTo(x + dashW, groundY + 16);
      ctx.stroke();
    }
  }

  function drawRamp(rp) {
    const topY = groundY - rp.h;
    // lateral da rampa
    ctx.fillStyle = '#8a6a3a';
    ctx.beginPath();
    ctx.moveTo(rp.x, groundY);
    ctx.lineTo(rp.x + rp.w, topY);
    ctx.lineTo(rp.x + rp.w, groundY);
    ctx.closePath();
    ctx.fill();

    // topo brilhante (pista)
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(rp.x, groundY);
    ctx.lineTo(rp.x + rp.w, topY);
    ctx.stroke();

    // listras de "voadora"
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
      const t = i / 4;
      const x1 = rp.x + rp.w * t;
      const y1 = groundY - rp.h * t;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - 12, y1);
      ctx.stroke();
    }

    // brilho na ponta
    ctx.fillStyle = 'rgba(255, 209, 102, 0.5)';
    ctx.beginPath();
    ctx.arc(rp.x + rp.w, topY, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacle(o) {
    const top = groundY - o.h;
    if (o.type === 'rock') {
      ctx.fillStyle = '#5a4a6a';
      ctx.beginPath();
      ctx.moveTo(o.x, groundY);
      ctx.lineTo(o.x + o.w * 0.5, top);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.moveTo(o.x + o.w * 0.5, top);
      ctx.lineTo(o.x + o.w * 0.75, groundY);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = '#8a6a3a';
      ctx.fillRect(o.x, top, o.w, o.h);
      ctx.strokeStyle = '#5a4020';
      ctx.lineWidth = 3;
      ctx.strokeRect(o.x, top, o.w, o.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.moveTo(o.x, top);
      ctx.lineTo(o.x + o.w, top + o.h);
      ctx.moveTo(o.x + o.w, top);
      ctx.lineTo(o.x, top + o.h);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBike() {
    const r = bike.wheelRadius;

    const shadowScale = Math.max(0.15, 1 - (groundY - bike.y) / 350);
    ctx.fillStyle = `rgba(0,0,0,${0.3 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(bike.x, groundY + 3, r * 1.9 * shadowScale, r * 0.4 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // rastro do mortal (arco brilhante quando girando rápido)
    if (Math.abs(bike.spinSpeed) > 4) {
      ctx.strokeStyle = 'rgba(78, 205, 196, 0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(bike.x, bike.y - r, r * 2.6, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = Math.max(3, r * 0.24);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const rearWX = -r * 1.7, rearWY = 0;
    const frontWX = r * 1.7, frontWY = 0;
    const seatX = -r * 0.25, seatY = -r * 1.55;
    const handleX = r * 1.35, handleY = -r * 1.35;
    const centerX = r * 0.85, centerY = -r * 0.15;

    ctx.beginPath();
    ctx.moveTo(rearWX, rearWY);
    ctx.lineTo(seatX, seatY);
    ctx.lineTo(handleX, handleY);
    ctx.moveTo(seatX, seatY);
    ctx.lineTo(centerX, centerY);
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(frontWX, frontWY);
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(rearWX, rearWY);
    ctx.stroke();

    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.ellipse(seatX, seatY - r * 0.05, r * 0.55, r * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = Math.max(2, r * 0.13);
    ctx.beginPath();
    ctx.moveTo(handleX, handleY);
    ctx.lineTo(handleX + r * 0.2, handleY - r * 0.45);
    ctx.stroke();

    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = Math.max(3, r * 0.3);
    ctx.beginPath();
    ctx.moveTo(seatX + r * 0.15, seatY - r * 0.35);
    ctx.lineTo(handleX - r * 0.3, handleY + r * 0.25);
    ctx.stroke();
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = Math.max(2, r * 0.2);
    ctx.beginPath();
    ctx.moveTo(handleX - r * 0.3, handleY + r * 0.25);
    ctx.lineTo(handleX, handleY + r * 0.05);
    ctx.stroke();
    ctx.fillStyle = '#4ecdc4';
    ctx.beginPath();
    ctx.arc(handleX - r * 0.35, handleY - r * 0.05, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff5252';
    ctx.beginPath();
    ctx.arc(handleX - r * 0.35, handleY - r * 0.15, r * 0.45, Math.PI, 0);
    ctx.fill();

    function drawWheel(wx, wy, rr) {
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(wx, wy, rr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = Math.max(2, rr * 0.15);
      ctx.beginPath();
      ctx.arc(wx, wy, rr * 0.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#888';
      ctx.lineWidth = Math.max(1.5, rr * 0.1);
      ctx.beginPath();
      ctx.arc(wx, wy, rr * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      const rot = (worldOffset / rr) % (Math.PI * 2);
      for (let i = 0; i < 4; i++) {
        const a = rot + i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + Math.cos(a) * rr * 0.85, wy + Math.sin(a) * rr * 0.85);
        ctx.stroke();
      }
    }
    drawWheel(rearWX, rearWY, r);
    drawWheel(frontWX, frontWY, r);

    ctx.restore();
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W * 0.09, 56)}px system-ui, sans-serif`;
    ctx.fillText('Bateu!', W / 2, H * 0.4);

    ctx.font = `600 ${Math.min(W * 0.055, 30)}px system-ui, sans-serif`;
    ctx.fillStyle = '#f4a261';
    ctx.fillText('Pontos: ' + Math.floor(score), W / 2, H * 0.5);

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = `500 ${Math.min(W * 0.04, 20)}px system-ui, sans-serif`;
    ctx.fillText('Toque em qualquer botão para reiniciar', W / 2, H * 0.6);
  }

  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    update(dt);

    drawSky();
    drawGround();
    for (const rp of ramps) drawRamp(rp);
    for (const o of obstacles) drawObstacle(o);
    drawParticles();
    drawBike();

    if (gameOver) drawGameOver();

    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
