<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bus Simulator — Slow Roads Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden; background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none; touch-action: none;
    width: 100%; height: 100%;
  }
  canvas { display: block; }

  /* ==== HUD TOPO ==== */
  #topHud {
    position: fixed; top: 18px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    z-index: 30; pointer-events: none;
  }
  .chip {
    background: rgba(10,14,20,0.55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 40px;
    padding: 8px 20px;
    color: #e6f0ff; font-weight: 600; font-size: 13px;
    letter-spacing: 1.5px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  #timeChip { color: #ffd27a; }

  /* ==== PAINEL INFERIOR DIREITO ==== */
  #rightHud {
    position: fixed; right: 26px; bottom: 26px;
    display: flex; flex-direction: column; gap: 14px;
    align-items: flex-end; z-index: 25;
  }
  .dashboard {
    background: rgba(10,14,20,0.62);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 12px 22px;
    display: flex; align-items: center; gap: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .speedo { text-align: center; min-width: 78px; }
  .speedo .v {
    font-size: 40px; font-weight: 800; line-height: 1;
    color: #c9f4ff; letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(80,200,255,0.7);
    font-variant-numeric: tabular-nums;
  }
  .speedo .u {
    font-size: 11px; color: #8fb8cc; letter-spacing: 2px; margin-top: 2px;
  }
  .gearbox {
    display: flex; flex-direction: column; gap: 3px;
  }
  .gear-item {
    font-size: 12px; font-weight: 700; color: #4a5a68;
    padding: 2px 10px; border-radius: 6px; transition: all 0.15s;
    letter-spacing: 1px; text-align: center;
  }
  .gear-item.active {
    color: #ffb84a;
    background: rgba(255,184,74,0.12);
    box-shadow: 0 0 12px rgba(255,184,74,0.4);
    text-shadow: 0 0 10px rgba(255,184,74,0.9);
  }

  /* ==== PEDAIS ==== */
  .pedals {
    display: flex; gap: 16px; padding: 16px 20px;
    background: rgba(10,14,20,0.62);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 26px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .pedal {
    width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #dfe9f2;
    letter-spacing: 1px;
    background: linear-gradient(160deg, #2a3240, #161c26);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 0 #0a0e14, 0 12px 22px rgba(0,0,0,0.55), inset 0 2px 2px rgba(255,255,255,0.06);
    transition: transform 0.06s, box-shadow 0.06s, background 0.12s;
    cursor: pointer; touch-action: none;
    position: relative; overflow: hidden;
  }
  .pedal::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.15), transparent 60%);
    pointer-events: none;
  }
  .pedal.active {
    transform: translateY(7px);
    box-shadow: 0 1px 0 #0a0e14, 0 4px 12px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.15);
  }
  #pedalBrake { background: linear-gradient(160deg, #6b1f1f, #3a0f0f); }
  #pedalBrake.active { background: linear-gradient(160deg, #b52b2b, #6b1f1f); }
  #pedalAccel { background: linear-gradient(160deg, #1f5c34, #0f3320); }
  #pedalAccel.active { background: linear-gradient(160deg, #2ea85c, #1f5c34); }

  /* ==== FREIO DE MÃO ==== */
  .handbrake {
    display: flex; align-items: center; gap: 10px;
    background: rgba(10,14,20,0.62);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 40px; padding: 11px 22px;
    color: #cfd8e3; font-weight: 700; font-size: 13px;
    letter-spacing: 1.4px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: all 0.2s; touch-action: none;
  }
  .hb-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #333; box-shadow: inset 0 1px 3px #000;
    transition: all 0.25s;
  }
  .handbrake.on {
    background: rgba(180,35,35,0.75);
    border-color: rgba(255,90,80,0.6);
    color: #fff;
    box-shadow: 0 0 30px rgba(255,70,50,0.5), 0 8px 24px rgba(0,0,0,0.5);
  }
  .handbrake.on .hb-dot {
    background: #ff5a3a;
    box-shadow: 0 0 16px #ff5a3a, inset 0 1px 3px rgba(255,255,255,0.3);
  }

  /* ==== VOLANTE ==== */
  #wheelWrap {
    position: fixed; left: 24px; bottom: 24px;
    width: 240px; height: 240px;
    z-index: 26; touch-action: none;
    cursor: grab;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65));
  }
  #wheelWrap:active { cursor: grabbing; }
  #wheelSvg {
    width: 100%; height: 100%;
    transform-origin: center center;
    will-change: transform;
    transition: transform 0.02s linear;
  }

  /* Responsivo */
  @media (max-width: 820px) {
    #wheelWrap { width: 170px; height: 170px; left: 14px; bottom: 14px; }
    #rightHud { right: 14px; bottom: 14px; gap: 10px; }
    .pedal { width: 58px; height: 58px; font-size: 11px; }
    .pedals { padding: 12px 14px; gap: 10px; border-radius: 20px; }
    .dashboard { padding: 8px 16px; gap: 14px; border-radius: 18px; }
    .speedo .v { font-size: 28px; }
    .handbrake { padding: 8px 14px; font-size: 11px; }
    .chip { padding: 6px 14px; font-size: 11px; letter-spacing: 1px; }
  }
  @media (max-width: 520px) {
    #wheelWrap { width: 130px; height: 130px; }
    .pedal { width: 48px; height: 48px; font-size: 10px; }
    .speedo .v { font-size: 22px; }
    .speedo { min-width: 58px; }
    #topHud { gap: 8px; }
  }
</style>
</head>
<body>

<!-- HUD Topo -->
<div id="topHud">
  <div class="chip" id="timeChip">☀ 12:00</div>
  <div class="chip" id="distChip">0.00 km</div>
</div>

<!-- Painel direito -->
<div id="rightHud">
  <div class="dashboard">
    <div class="speedo">
      <div class="v" id="speedDisplay">0</div>
      <div class="u">KM/H</div>
    </div>
    <div class="gearbox" id="gearBox">
      <div class="gear-item" data-g="P">P</div>
      <div class="gear-item" data-g="R">R</div>
      <div class="gear-item" data-g="N">N</div>
      <div class="gear-item active" data-g="D">D</div>
    </div>
  </div>

  <div class="pedals">
    <div class="pedal" id="pedalBrake">RÉ</div>
    <div class="pedal" id="pedalAccel">ACEL</div>
  </div>

  <div class="handbrake" id="handbrakeBtn">
    <div class="hb-dot"></div> FREIO DE MÃO
  </div>
</div>

<!-- Volante -->
<div id="wheelWrap">
  <svg id="wheelSvg" viewBox="0 0 240 240">
    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="30%">
        <stop offset="0%" stop-color="#3a4250"/>
        <stop offset="100%" stop-color="#10151c"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#2a323d"/>
        <stop offset="100%" stop-color="#0d1116"/>
      </radialGradient>
    </defs>
    <!-- Anel externo -->
    <circle cx="120" cy="120" r="112" fill="none" stroke="#05080c" stroke-width="4"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="url(#rimGrad)" stroke-width="22"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="#4d5666" stroke-width="2" opacity="0.5"/>
    <circle cx="120" cy="120" r="92" fill="none" stroke="#1a1f27" stroke-width="3"/>

    <!-- Raios -->
    <g stroke="#1a1f27" stroke-width="16" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="70"/>
      <line x1="120" y1="170" x2="120" y2="210"/>
      <line x1="30" y1="120" x2="70" y2="120"/>
      <line x1="170" y1="120" x2="210" y2="120"/>
    </g>

    <!-- Centro -->
    <circle cx="120" cy="120" r="38" fill="url(#centerGrad)" stroke="#3a4250" stroke-width="3"/>
    <circle cx="120" cy="120" r="26" fill="none" stroke="#2a323d" stroke-width="2"/>
    <!-- Logo marcação central -->
    <path d="M120 108 L126 120 L120 132 L114 120 Z" fill="#c9a24a" opacity="0.9"/>
    <!-- Marcação topo -->
    <rect x="117" y="22" width="6" height="14" rx="3" fill="#ffb84a" opacity="0.8"/>
  </svg>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   CENA / RENDERER
========================================================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fc0d8, 40, 320);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 800);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* =========================================================
   ILUMINAÇÃO
========================================================= */
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x3a5a3a, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

const ambient = new THREE.AmbientLight(0x404a5a, 0.35);
scene.add(ambient);

/* =========================================================
   COCKPIT (filho da câmera — primeira pessoa)
========================================================= */
const cockpit = new THREE.Group();
camera.add(cockpit);
scene.add(camera);

// materiais do painel
const matDark = new THREE.MeshStandardMaterial({ color: 0x14181f, roughness: 0.85, metalness: 0.15 });
const matMid  = new THREE.MeshStandardMaterial({ color: 0x1e242c, roughness: 0.7,  metalness: 0.2  });
const matTrim = new THREE.MeshStandardMaterial({ color: 0x0a0d12, roughness: 0.95 });

// Painel superior (teto/visor)
const visor = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.18, 0.55), matDark);
visor.position.set(0, 0.72, -1.35);
cockpit.add(visor);

// Barra do teto
const roofBar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 0.12), matTrim);
roofBar.position.set(0, 0.6, -1.05);
cockpit.add(roofBar);

// Painel inferior (dashboard principal)
const dash = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.42, 1.05), matMid);
dash.position.set(0, -0.48, -1.15);
cockpit.add(dash);

// Console central (túnel do volante)
const consoleC = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.28, 0.9), matDark);
consoleC.position.set(0, -0.36, -0.85);
cockpit.add(consoleC);

// Moldura do para-brisa (pilares)
const pillarGeo = new THREE.BoxGeometry(0.09, 1.0, 0.09);
const pilL = new THREE.Mesh(pillarGeo, matTrim);
pilL.position.set(-1.28, 0.2, -1.45);
cockpit.add(pilL);
const pilR = new THREE.Mesh(pillarGeo, matTrim);
pilR.position.set(1.28, 0.2, -1.45);
cockpit.add(pilR);

// Coluna A superior (travessa)
const trav = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.08, 0.1), matTrim);
trav.position.set(0, 0.72, -1.45);
cockpit.add(trav);

// Para-brisa (vidro com transparência)
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaccee, transparent: true, opacity: 0.06,
  roughness: 0.05, metalness: 0, transmission: 0.95, side: THREE.DoubleSide
});
const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 0.95), glassMat);
glass.position.set(0, 0.2, -1.44);
cockpit.add(glass);

// Volante 3D visível (dentro do cockpit)
const wheelGroup = new THREE.Group();
wheelGroup.position.set(0, -0.28, -0.78);
wheelGroup.rotation.x = -0.35;
cockpit.add(wheelGroup);

const wRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.19, 0.026, 12, 40),
  new THREE.MeshStandardMaterial({ color: 0x151a20, roughness: 0.55, metalness: 0.2 })
);
wheelGroup.add(wRim);
const wRim2 = new THREE.Mesh(
  new THREE.TorusGeometry(0.19, 0.014, 8, 40),
  new THREE.MeshStandardMaterial({ color: 0x3a4250, roughness: 0.4 })
);
wRim2.position.z = 0.02;
wheelGroup.add(wRim2);
// raios
for (let i=0;i<3;i++){
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.32, 0.02), matTrim);
  sp.rotation.z = (i*Math.PI*2)/3 + Math.PI/2;
  wheelGroup.add(sp);
}
const wHub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05, 0.05, 0.035, 16),
  new THREE.MeshStandardMaterial({ color: 0x0c1014, roughness: 0.5, metalness: 0.5 })
);
wHub.rotation.x = Math.PI/2;
wheelGroup.add(wHub);

// Espelhos retrovisores (esquerdo e direito)
function makeMirror(x, y, z) {
  const g = new THREE.Group();
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.4), matTrim);
  arm.position.set(0.2 * Math.sign(x) * (x>0?-1:-1), 0, 0);
  // Braço
  const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.42, 8), matTrim);
  armMesh.rotation.z = Math.PI/2;
  armMesh.position.x = 0.2 * Math.sign(x);
  g.add(armMesh);
  // Caixa
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.16, 0.06), matDark);
  body.position.x = 0.4 * Math.sign(x);
  g.add(body);
  // Espelho
  const glassM = new THREE.Mesh(
    new THREE.PlaneGeometry(0.24, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x668899, roughness: 0.1, metalness: 0.9 })
  );
  glassM.position.set(0.4 * Math.sign(x), 0, -0.035);
  g.add(glassM);
  g.position.set(x, y, z);
  return g;
}
cockpit.add(makeMirror(-1.35, 0.3, -1.25));
cockpit.add(makeMirror(1.35, 0.3, -1.25));

/* =========================================================
   MUNDO PROCEDURAL — A ESTRADA QUE SERPENTEIA SEM FIM
   Abordagem: chunk grid de terreno. O jogador se move no mundo real,
   e o terreno é gerado em grade ao redor. A estrada segue uma função
   matemática (seno + ruído suave) para ser contínua e infinita.
========================================================= */
const world = new THREE.Group();
scene.add(world);

// --- Função de curva da estrada (retorna o deslocamento X da estrada em determinado Z) ---
// Combinação de senoides para curvas suaves e imprevisíveis (Slow Roads style)
function roadOffsetX(z) {
  return (
    Math.sin(z * 0.008) * 42 +
    Math.sin(z * 0.0023 + 1.7) * 65 +
    Math.sin(z * 0.0015 + 0.3) * 90 +
    Math.sin(z * 0.0007 - 2.1) * 120
  );
}
// Direção da estrada (derivada)
function roadTangent(z) {
  const d = 0.5;
  const dx = roadOffsetX(z + d) - roadOffsetX(z - d);
  return Math.atan2(dx, d * 2); // rotação no plano XZ
}

// --- Texturas procedurais via Canvas (asfalto + grama) ---
function makeAsphaltTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2a2d33'; ctx.fillRect(0,0,256,256);
  for (let i=0;i<2400;i++){
    const v = 30 + Math.random()*45;
    ctx.fillStyle = `rgba(${v},${v},${v+5},${Math.random()*0.5})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a6b3a'; ctx.fillRect(0,0,256,256);
  for (let i=0;i<3000;i++){
    const g = 60 + Math.random()*80;
    ctx.fillStyle = `rgba(${g*0.4},${g},${g*0.35},${Math.random()*0.6})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const asphaltTex = makeAsphaltTexture();
asphaltTex.repeat.set(1, 20);
const grassTex = makeGrassTexture();
grassTex.repeat.set(40, 40);

// --- Chão (grande plano que segue o jogador para dar sensação de infinito) ---
const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, color: 0x88aa77, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.15;
ground.receiveShadow = true;
scene.add(ground);

// --- Sistema de chunks da estrada ---
const CHUNK_LEN = 40;      // comprimento de cada segmento da estrada
const ROAD_W = 14;         // largura
const VIEW_AHEAD = 500;    // até onde renderizamos à frente
const VIEW_BEHIND = 120;

const roadChunks = new Map(); // key: chunk index -> mesh
const propChunks = new Map(); // key: chunk index -> [props]

const roadMatBase = new THREE.MeshStandardMaterial({ map: asphaltTex, color: 0x9aa0a8, roughness: 0.95 });
const lineMat = new THREE.MeshStandardMaterial({ color: 0xf0f0d0, roughness: 0.7, emissive: 0x222211 });
const lineMatYellow = new THREE.MeshStandardMaterial({ color: 0xe0b040, roughness: 0.7, emissive: 0x2a1e00 });
const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x5a5f66, roughness: 1 });
const signPostMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.5, metalness: 0.6 });
const signFaceMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });

const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3324, roughness: 1 });
const treeLeafMat  = new THREE.MeshStandardMaterial({ color: 0x2d5f2d, roughness: 1 });
const treeLeafMat2 = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, roughness: 1 });

// Geometrias reutilizáveis
const trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 2.5, 6);
const leafGeo = new THREE.SphereGeometry(1.3, 6, 5);
const rockGeo = new THREE.DodecahedronGeometry(0.8, 0);

// Sinalização tipo placa
function makeSign(type) {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 6), signPostMat);
  post.position.y = 1.1;
  post.castShadow = true;
  g.add(post);
  const face = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.05), signFaceMat);
  face.position.y = 2.1;
  face.castShadow = true;
  g.add(face);
  return g;
}

// Criação de um chunk da estrada
function buildRoadChunk(index) {
  const group = new THREE.Group();
  const zStart = index * CHUNK_LEN;
  const zEnd = zStart + CHUNK_LEN;
  const zMid = zStart + CHUNK_LEN / 2;
  const xMid = roadOffsetX(zMid);
  const angle = roadTangent(zMid);

  // Pista: usamos um plano subdividido e deformamos para acompanhar a curva
  const segs = 8;
  const roadGeo = new THREE.PlaneGeometry(ROAD_W, CHUNK_LEN, 2, segs);
  const pos = roadGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const lx = pos.getX(i);
    const ly = pos.getY(i);
    // posição local: y no plano é -z (após rotacionar). Vamos trabalhar com coordenadas world
    const localZ = -ly;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    pos.setX(i, lx + cx);
    pos.setY(i, localZ + zMid - zMid); // mantém
  }
  roadGeo.computeVertexNormals();
  const roadMesh = new THREE.Mesh(roadGeo, roadMatBase);
  roadMesh.rotation.x = -Math.PI / 2;
  roadMesh.position.set(0, 0.01, 0);
  roadMesh.receiveShadow = true;
  // Reposiciona cada vértice no espaço mundial. Como rotacionamos o plano, 
  // é mais simples posicionar o grupo no zStart e ajustar as coordenadas X dentro do geo.
  // Vamos usar uma abordagem diferente: geometria no mundo real.
  // Melhor: reconstruir com coordenadas reais.

  // Refazendo de forma correta: criar plano no plano XZ com vértices em coordenadas mundiais
  roadGeo.dispose();
  const roadGeo2 = new THREE.PlaneGeometry(ROAD_W, CHUNK_LEN, 3, segs);
  const p2 = roadGeo2.attributes.position;
  for (let i=0;i<p2.count;i++){
    const lx = p2.getX(i);
    const ly = p2.getY(i);
    // ly vai de -CHUNK_LEN/2 a +CHUNK_LEN/2 (local z)
    const worldZ = zMid + ly;
    const cx = roadOffsetX(worldZ);
    p2.setX(i, lx + cx);
    p2.setZ(i, worldZ);
    p2.setY(i, 0); // plano Y=0
  }
  roadGeo2.computeVertexNormals();
  // Ajusta para o plano XZ
  // Nota: PlaneGeometry está no plano XY. Precisamos rotacionar? 
  // Vamos reescrever usando BufferGeometry manualmente para clareza.

  // Abordagem final e limpa: criar BufferGeometry manualmente com grade de pontos
  const geo = new THREE.BufferGeometry();
  const NX = 4, NZ = segs;
  const verts = [];
  const uvs = [];
  const indices = [];
  for (let iz=0; iz<=NZ; iz++){
    const tz = iz/NZ;
    const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    for (let ix=0; ix<=NX; ix++){
      const tx = ix/NX;
      const x = cx + (tx - 0.5) * ROAD_W;
      verts.push(x, 0, worldZ);
      uvs.push(tx, tz * 8);
    }
  }
  for (let iz=0; iz<NZ; iz++){
    for (let ix=0; ix<NX; ix++){
      const a = iz*(NX+1)+ix;
      const b = a+1;
      const c = a+(NX+1);
      const d = c+1;
      indices.push(a,b,c, b,d,c);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const roadMesh2 = new THREE.Mesh(geo, roadMatBase);
  roadMesh2.receiveShadow = true;
  group.add(roadMesh2);

  // Linhas centrais tracejadas
  const dashGroup = new THREE.Group();
  const numDashes = Math.floor(CHUNK_LEN / 8);
  for (let i=0;i<numDashes;i++){
    const tz = (i + 0.5) / numDashes;
    const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    const ang = roadTangent(worldZ);

    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.015, 3.2), lineMatYellow);
    dash.position.set(cx, 0.02, worldZ);
    dash.rotation.y = ang;
    dash.receiveShadow = true;
    dashGroup.add(dash);
  }
  group.add(dashGroup);

  // Linhas laterais contínuas (bordas)
  for (let side = -1; side <= 1; side += 2) {
    const edgeGeo = new THREE.BufferGeometry();
    const ev = [];
    const ei = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      const x = cx + side * (ROAD_W/2 - 0.4);
      ev.push(x, 0.02, worldZ);
      if (iz>0){
        const a = (iz-1)*2;
        const b = (iz-1)*2+1;
        const c = iz*2;
        const d = iz*2+1;
        ei.push(a,b,c, b,d,c);
      }
    }
    // Cada linha tem 2 vértices por segmento
    const evFinal = [];
    const eiFinal = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      const x1 = cx + side * (ROAD_W/2 - 0.55);
      const x2 = cx + side * (ROAD_W/2 - 0.25);
      evFinal.push(x1, 0.025, worldZ);
      evFinal.push(x2, 0.025, worldZ);
    }
    for (let iz=0; iz<NZ; iz++){
      const a = iz*2;
      const b = iz*2+1;
      const c = (iz+1)*2;
      const d = (iz+1)*2+1;
      eiFinal.push(a,b,c, b,d,c);
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(evFinal, 3));
    lineGeo.setIndex(eiFinal);
    lineGeo.computeVertexNormals();
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.receiveShadow = true;
    group.add(line);
  }

  // Acostamento (faixa cinza ao lado da estrada)
  for (let side = -1; side <= 1; side += 2){
    const edgeGeo = new THREE.BufferGeometry();
    const ev = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      ev.push(cx + side * (ROAD_W/2), 0.005, worldZ);
      ev.push(cx + side * (ROAD_W/2 + 1.2), 0.005, worldZ);
    }
    const ei = [];
    for (let iz=0; iz<NZ; iz++){
      const a = iz*2;
      const b = iz*2+1;
      const c = (iz+1)*2;
      const d = (iz+1)*2+1;
      ei.push(a,b,c, b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(ev, 3));
    g.setIndex(ei);
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, shoulderMat);
    mesh.receiveShadow = true;
    group.add(mesh);
  }

  // Props: árvores, pedras, placas
  const props = [];
  const seedRandom = (s) => { const x = Math.sin(s*127.1)*43758.5453; return x - Math.floor(x); };
  const count = 6;
  for (let i=0;i<count;i++){
    const r1 = seedRandom(index*17 + i*7.3);
    const r2 = seedRandom(index*29 + i*3.1);
    const r3 = seedRandom(index*41 + i*11.7);
    const localZ = -CHUNK_LEN/2 + r1 * CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    const side = r2 > 0.5 ? 1 : -1;
    const dist = 3 + r3 * 25;
    const px = cx + side * (ROAD_W/2 + dist);
    const py = 0;
    // Árvores
    if (r3 > 0.2) {
      const trunk = new THREE.Mesh(trunkGeo, treeTrunkMat);
      const scale = 0.7 + r1 * 0.9;
      trunk.scale.setScalar(scale);
      trunk.position.set(px, 1.25*scale, worldZ);
      trunk.castShadow = true; trunk.receiveShadow = true;
      group.add(trunk);
      const leaf = new THREE.Mesh(leafGeo, r3 > 0.6 ? treeLeafMat2 : treeLeafMat);
      leaf.scale.setScalar(scale * (0.9 + r2*0.3));
      leaf.position.set(px, 2.5*scale + 0.6, worldZ);
      leaf.castShadow = true;
      group.add(leaf);
    } else if (r3 > 0.1) {
      // Pedra
      const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({ color: 0x666a70, roughness: 1, flatShading: true }));
      rock.scale.setScalar(0.5 + r1 * 1.2);
      rock.position.set(px, 0.3, worldZ);
      rock.rotation.set(r1*3, r2*3, r3*3);
      rock.castShadow = true; rock.receiveShadow = true;
      group.add(rock);
    } else if (r3 < 0.05) {
      // Placa
      const sign = makeSign();
      sign.position.set(px, 0, worldZ);
      sign.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
      group.add(sign);
    }
  }

  group.userData.index = index;
  group.userData.zStart = zStart;
  group.userData.zEnd = zEnd;
  return group;
}

// Gerenciamento de chunks
function ensureChunks(playerZ) {
  const startIdx = Math.floor((playerZ - VIEW_BEHIND) / CHUNK_LEN);
  const endIdx = Math.floor((playerZ + VIEW_AHEAD) / CHUNK_LEN);

  // Cria faltantes
  for (let i = startIdx; i <= endIdx; i++){
    if (!roadChunks.has(i)){
      const chunk = buildRoadChunk(i);
      world.add(chunk);
      roadChunks.set(i, chunk);
    }
  }
  // Remove antigos
  for (const [idx, chunk] of roadChunks){
    if (idx < startIdx - 2 || idx > endIdx + 2){
      world.remove(chunk);
      chunk.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      roadChunks.delete(idx);
    }
  }
}

/* =========================================================
   MONTANHAS E NUVENS DE FUNDO
========================================================= */
const mountains = new THREE.Group();
scene.add(mountains);
const mountainMat1 = new THREE.MeshStandardMaterial({ color: 0x6a7a8a, roughness: 1, flatShading: true });
const mountainMat2 = new THREE.MeshStandardMaterial({ color: 0x8794a4, roughness: 1, flatShading: true });

function createMountainRing(radius, count, height, mat) {
  for (let i=0;i<count;i++){
    const angle = (i/count) * Math.PI * 2 + Math.random()*0.3;
    const h = height * (0.5 + Math.random()*0.9);
    const geo = new THREE.ConeGeometry(h*0.8, h, 5 + Math.floor(Math.random()*3));
    const m = new THREE.Mesh(geo, mat);
    m.position.set(Math.cos(angle)*radius, h*0.45, Math.sin(angle)*radius);
    m.rotation.y = Math.random()*Math.PI;
    mountains.add(m);
  }
}
createMountainRing(750, 26, 90, mountainMat1);
createMountainRing(950, 30, 130, mountainMat2);
createMountainRing(1150, 22, 160, mountainMat1);

/* =========================================================
   ESTADO DO ÔNIBUS
========================================================= */
const bus = {
  pos: new THREE.Vector3(0, 0, 0),   // posição no mundo
  yaw: 0,                             // rotação horizontal (rad)
  speed: 0,                           // m/s (positivo para frente, negativo ré)
  maxSpeed: 32,                       // ~115 km/h
  maxReverse: -8,
  accel: 8,                           // m/s^2
  brakeForce: 14,
  engineBrake: 2.5,
  steer: 0,                           // -1..1 suavizado
  steerTarget: 0,
  steerMaxRate: 2.6,                  // rad/s máx do volante
  handbrake: false,
  gear: 'P',
  // para efeito visual
  wheelRoll: 0,
  steerWheelVisual: 0,
  cameraRoll: 0,
  vibration: 0,
  distance: 0,
};

/* =========================================================
   INPUTS
========================================================= */
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === ' ') toggleHandbrake();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Pedais
const pedalAccelEl = document.getElementById('pedalAccel');
const pedalBrakeEl = document.getElementById('pedalBrake');
const handbrakeBtn = document.getElementById('handbrakeBtn');

let touchAccel = false, touchBrake = false;

function bindPedal(el, setter) {
  const on = e => { e.preventDefault(); setter(true); el.classList.add('active'); };
  const off = e => { e.preventDefault(); setter(false); el.classList.remove('active'); };
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
}
bindPedal(pedalAccelEl, v => touchAccel = v);
bindPedal(pedalBrakeEl, v => touchBrake = v);

function toggleHandbrake() {
  bus.handbrake = !bus.handbrake;
  handbrakeBtn.classList.toggle('on', bus.handbrake);
}
handbrakeBtn.addEventListener('click', e => { e.preventDefault(); toggleHandbrake(); });
handbrakeBtn.addEventListener('touchstart', e => { e.preventDefault(); toggleHandbrake(); }, { passive: false });

/* =========================================================
   VOLANTE (SVG) — arrasto suave com retorno natural
========================================================= */
const wheelWrap = document.getElementById('wheelWrap');
const wheelSvg  = document.getElementById('wheelSvg');

let dragging = false;
let dragStartAngle = 0;
let dragStartSteer = 0;
const MAX_WHEEL_ANGLE = Math.PI * 0.75;   // 135°

function pointerAngle(e) {
  const r = wheelWrap.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
  return Math.atan2(y, x);
}

function wheelDown(e){
  e.preventDefault();
  dragging = true;
  dragStartAngle = pointerAngle(e);
  dragStartSteer = bus.steerTarget;
  wheelWrap.style.cursor = 'grabbing';
}
function wheelMove(e){
  if (!dragging) return;
  e.preventDefault();
  const a = pointerAngle(e);
  let delta = a - dragStartAngle;
  // Normalizar para -PI..PI
  while (delta > Math.PI) delta -= Math.PI*2;
  while (delta < -Math.PI) delta += Math.PI*2;
  // Converte delta angular em steer (-1..1)
  let steer = dragStartSteer + (delta / MAX_WHEEL_ANGLE) * 1.0;
  bus.steerTarget = Math.max(-1, Math.min(1, steer));
}
function wheelUp(e){
  dragging = false;
  wheelWrap.style.cursor = 'grab';
}
wheelWrap.addEventListener('mousedown', wheelDown);
addEventListener('mousemove', wheelMove);
addEventListener('mouseup', wheelUp);
wheelWrap.addEventListener('touchstart', wheelDown, { passive: false });
addEventListener('touchmove', wheelMove, { passive: false });
addEventListener('touchend', wheelUp);
addEventListener('touchcancel', wheelUp);

/* =========================================================
   LOOP PRINCIPAL
========================================================= */
const speedDisplay = document.getElementById('speedDisplay');
const gearItems = document.querySelectorAll('.gear-item');
const timeChip = document.getElementById('timeChip');
const distChip = document.getElementById('distChip');

// Ciclo dia/noite — hora do dia em [0,24)
let timeOfDay = 8.5;
const DAY_DURATION = 300; // segundos para um dia completo (5 min)

let last = performance.now();

function updateBus(dt) {
  // === Inputs combinados ===
  const accel = keys['w'] || keys['arrowup'] || touchAccel;
  const brake = keys['s'] || keys['arrowdown'] || touchBrake;
  const left  = keys['a'] || keys['arrowleft'];
  const right = keys['d'] || keys['arrowright'];

  // === Direção — alvo pelo teclado (adiciona ao arrasto do volante) ===
  if (left && !dragging) bus.steerTarget -= 1.6 * dt;
  if (right && !dragging) bus.steerTarget += 1.6 * dt;
  if (!dragging && !left && !right) {
    // retorno suave do volante ao centro
    bus.steerTarget *= Math.pow(0.02, dt);
    if (Math.abs(bus.steerTarget) < 0.002) bus.steerTarget = 0;
  }
  bus.steerTarget = Math.max(-1, Math.min(1, bus.steerTarget));

  // Steer suavizado segue o alvo (inércia)
  const steerDiff = bus.steerTarget - bus.steer;
  bus.steer += steerDiff * Math.min(1, 8 * dt);

  // === Aceleração / Frenagem ===
  if (bus.handbrake) {
    bus.speed *= Math.pow(0.02, dt);
  } else if (accel && !brake) {
    bus.speed += bus.accel * dt;
  } else if (brake && !accel) {
    if (bus.speed > 0.1) bus.speed -= bus.brakeForce * dt;
    else bus.speed -= bus.accel * 0.55 * dt; // ré
  } else {
    // motor freio
    if (bus.speed > 0) bus.speed -= bus.engineBrake * dt;
    else if (bus.speed < 0) bus.speed += bus.engineBrake * dt;
    if (Math.abs(bus.speed) < 0.15) bus.speed = 0;
  }

  // Limites
  bus.speed = Math.max(bus.maxReverse, Math.min(bus.maxSpeed, bus.speed));

  // === Física: velocidade de rotação em função do steering e velocidade ===
  // quanto mais rápido, mais gira por segundo (mas satura em alta velocidade)
  const speedFactor = Math.min(1, Math.abs(bus.speed) / 10);
  const turnRate = bus.steer * 1.6 * (0.3 + 0.7 * speedFactor) * Math.sign(bus.speed || 1);
  bus.yaw += turnRate * dt * Math.min(1, Math.abs(bus.speed) * 0.4);

  // === Movimento no mundo ===
  // O ônibus sempre anda para frente no seu próprio eixo Z
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), bus.yaw);
  bus.pos.addScaledVector(forward, bus.speed * dt);
  bus.distance += Math.abs(bus.speed) * dt;

  // === Câmera ===
  // altura base da cabine do ônibus
  const baseY = 3.0; // altura do motorista
  // vibração da suspensão conforme velocidade
  const speedAbs = Math.abs(bus.speed);
  const vibAmp = Math.min(0.05, speedAbs * 0.0018);
  const t = performance.now() * 0.02;
  const vx = Math.sin(t * 5.7) * vibAmp;
  const vy = Math.sin(t * 7.3 + 1.2) * vibAmp;
  const vz = Math.sin(t * 6.1 + 2.4) * vibAmp;

  camera.position.set(bus.pos.x + vx, bus.pos.y + baseY + vy, bus.pos.z + vz);
  // A câmera olha na direção do ônibus
  const lookDir = new THREE.Vector3(
    bus.pos.x + forward.x * 10,
    bus.pos.y + baseY - 0.15,
    bus.pos.z + forward.z * 10
  );
  camera.lookAt(lookDir);

  // Roll da câmera em curvas
  const targetRoll = -bus.steer * 0.06 * Math.min(1, speedAbs / 12);
  bus.cameraRoll += (targetRoll - bus.cameraRoll) * Math.min(1, 4*dt);
  camera.rotateZ(bus.cameraRoll);

  // === Atualiza posição do mundo ===
  // O mundo contém o chão e as montanhas; movemos para manter o jogador sempre próximo ao "centro"
  ground.position.x = bus.pos.x;
  ground.position.z = bus.pos.z;
  mountains.position.x = bus.pos.x;
  mountains.position.z = bus.pos.z;

  // Chunks são gerados com coordenadas MUNDIAIS absolutas — não precisam seguir o jogador.
  // Só precisamos garantir que os chunks ao redor do jogador existam.
  ensureChunks(bus.pos.z);

  // === Volante visual (SVG) — rotaciona conforme o steer suavizado ===
  bus.steerWheelVisual += (bus.steer - bus.steerWheelVisual) * Math.min(1, 12*dt);
  const wheelDeg = bus.steerWheelVisual * MAX_WHEEL_ANGLE * (180/Math.PI);
  wheelSvg.style.transform = `rotate(${wheelDeg}deg)`;

  // === Volante 3D do cockpit ===
  wheelGroup.rotation.z = -bus.steerWheelVisual * 1.5;

  // === Marcha ===
  let gear = 'P';
  if (bus.handbrake) gear = 'P';
  else if (bus.speed > 0.5) gear = 'D';
  else if (bus.speed < -0.5) gear = 'R';
  else gear = 'N';
  if (gear !== bus.gear) {
    bus.gear = gear;
    gearItems.forEach(el => el.classList.toggle('active', el.dataset.g === gear));
  }

  // === HUD ===
  const kmh = Math.round(speedAbs * 3.6);
  speedDisplay.textContent = kmh;

  // === Ciclo dia/noite ===
  timeOfDay = (timeOfDay + (24 / DAY_DURATION) * dt) % 24;
  const sunAngle = ((timeOfDay - 6) / 24) * Math.PI * 2; // 6h = nascer
  const sunHeight = Math.sin(sunAngle);
  const sunDist = 200;
  sun.position.set(
    bus.pos.x + Math.cos(sunAngle) * sunDist,
    Math.max(5, sunHeight * sunDist),
    bus.pos.z + Math.sin(sunAngle*0.3) * 60
  );
  sun.target.position.set(bus.pos.x, 0, bus.pos.z);
  sun.target.updateMatrixWorld();

  // Intensidade e cores
  const dayFactor = Math.max(0, sunHeight);
  sun.intensity = 0.15 + dayFactor * 1.6;
  hemi.intensity = 0.25 + dayFactor * 0.85;
  ambient.intensity = 0.15 + dayFactor * 0.4;

  // Cor do céu e fog
  const skyColor = new THREE.Color();
  if (sunHeight > 0.25) {
    skyColor.setHSL(0.58, 0.55, 0.55 + dayFactor * 0.15);
  } else if (sunHeight > -0.15) {
    const k = (sunHeight + 0.15) / 0.4;
    skyColor.lerpColors(new THREE.Color(0x1a1a2e), new THREE.Color(0x9fc0d8), k);
  } else {
    skyColor.setHex(0x0a0a1a);
  }
  scene.background = skyColor;
  scene.fog.color.copy(skyColor);
  scene.fog.near = 40;
  scene.fog.far = 180 + dayFactor * 220;

  // HUD tempo
  const hh = Math.floor(timeOfDay).toString().padStart(2, '0');
  const mm = Math.floor((timeOfDay % 1) * 60).toString().padStart(2, '0');
  const icon = sunHeight > 0.15 ? '☀' : (sunHeight > -0.1 ? '🌅' : '🌙');
  timeChip.textContent = `${icon} ${hh}:${mm}`;
  distChip.textContent = (bus.distance/1000).toFixed(2) + ' km';
}

function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  updateBus(dt);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Inicializa com alguns chunks já prontos
ensureChunks(0);

// Volante começa centralizado
wheelSvg.style.transform = 'rotate(0deg)';

// Ajuste inicial da câmera
camera.position.set(0, 3, 0);
camera.lookAt(0, 3, -10);

// resize
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
