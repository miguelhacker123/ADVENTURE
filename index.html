<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bus Simulator Pro — Realistic Driving</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden; background: #000;
    font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    user-select: none; touch-action: none;
    width: 100%; height: 100%;
    color: #fff;
  }
  canvas { display: block; }

  /* ============ TOP HUD ============ */
  #topHud {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
    z-index: 30; pointer-events: none;
  }
  .chip {
    background: rgba(8,12,18,0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    padding: 9px 22px;
    color: #e6f0ff; font-weight: 600; font-size: 13px;
    letter-spacing: 1.5px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.45);
    display: flex; align-items: center; gap: 10px;
  }
  .chip svg { width: 14px; height: 14px; }

  /* ============ RIGHT HUD (dash + pedals) ============ */
  #rightHud {
    position: fixed; right: 24px; bottom: 24px;
    display: flex; flex-direction: column; gap: 12px;
    align-items: flex-end; z-index: 25;
  }

  /* Dashboard */
  .dashboard {
    background: linear-gradient(145deg, rgba(8,12,18,0.75), rgba(4,6,10,0.75));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 26px;
    padding: 16px 24px;
    display: flex; align-items: center; gap: 26px;
    box-shadow: 0 14px 50px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.5);
  }

  .speedo {
    display: flex; flex-direction: column; align-items: center;
    min-width: 100px;
  }
  .speedo .val {
    font-size: 46px; font-weight: 900; line-height: 0.9;
    color: #d4f6ff; letter-spacing: -1px;
    text-shadow: 0 0 22px rgba(90,200,255,0.85), 0 0 8px rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum';
  }
  .speedo .unit {
    font-size: 10px; color: #7fa8c4; letter-spacing: 3px;
    margin-top: 4px; font-weight: 700;
  }

  /* RPM barra */
  .rpm-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 90px;
  }
  .rpm-bar {
    width: 80px; height: 8px; border-radius: 6px;
    background: rgba(0,0,0,0.6);
    overflow: hidden;
    box-shadow: inset 0 1px 3px #000;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .rpm-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3aa0ff 0%, #58d68d 45%, #f4d03f 75%, #e74c3c 100%);
    border-radius: 6px;
    transition: width 0.08s linear;
    box-shadow: 0 0 10px rgba(255,120,80,0.6);
  }
  .rpm-label {
    font-size: 9px; color: #7fa8c4; letter-spacing: 2px; font-weight: 700;
  }

  /* Marchas */
  .gearbox {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 4px;
  }
  .gear-item {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
    color: #394a58;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.15s;
    letter-spacing: 0;
  }
  .gear-item.active {
    color: #ffbe4a;
    background: linear-gradient(145deg, rgba(255,190,74,0.2), rgba(255,140,30,0.1));
    border-color: rgba(255,190,74,0.6);
    box-shadow: 0 0 18px rgba(255,180,60,0.65), inset 0 0 8px rgba(255,180,60,0.3);
    text-shadow: 0 0 10px rgba(255,190,74,1);
  }
  .gear-item.active.rev {
    color: #ff6b5a;
    background: linear-gradient(145deg, rgba(255,90,70,0.22), rgba(200,40,30,0.1));
    border-color: rgba(255,90,70,0.65);
    box-shadow: 0 0 18px rgba(255,80,60,0.65);
  }

  /* Pedais */
  .pedals {
    display: flex; gap: 14px; padding: 16px 20px;
    background: linear-gradient(145deg, rgba(8,12,18,0.75), rgba(4,6,10,0.75));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px;
    box-shadow: 0 14px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .pedal {
    width: 78px; height: 78px; border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 800; font-size: 11px; color: #dfe9f2;
    letter-spacing: 1.4px;
    background: radial-gradient(circle at 50% 25%, #2a3240, #0f131a 70%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 0 #05080c, 0 14px 30px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.08);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
    cursor: pointer; touch-action: none;
    position: relative; overflow: hidden;
  }
  .pedal::before {
    content: ''; position: absolute; inset: 6px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 60%);
    pointer-events: none;
  }
  .pedal .ico {
    font-size: 20px; line-height: 1; margin-bottom: 2px;
  }
  .pedal.active {
    transform: translateY(8px);
    box-shadow: 0 0px 0 #05080c, 0 4px 14px rgba(0,0,0,0.7), inset 0 0 25px rgba(255,255,255,0.2);
  }
  #pedalBrake { background: radial-gradient(circle at 50% 25%, #6b1f1f, #2a0808 70%); }
  #pedalBrake.active { background: radial-gradient(circle at 50% 25%, #d63a2a, #6b1f1f 70%); }
  #pedalAccel { background: radial-gradient(circle at 50% 25%, #1f5c34, #08210f 70%); }
  #pedalAccel.active { background: radial-gradient(circle at 50% 25%, #35c46a, #1f5c34 70%); }

  /* Freio de mão */
  .handbrake {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(145deg, rgba(8,12,18,0.8), rgba(4,6,10,0.8));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 40px; padding: 13px 26px;
    color: #cfd8e3; font-weight: 700; font-size: 13px;
    letter-spacing: 1.6px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all 0.2s; touch-action: none;
    position: relative;
  }
  .hb-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #333; box-shadow: inset 0 1px 3px #000, 0 0 0 rgba(255,80,60,0);
    transition: all 0.25s;
  }
  .handbrake.on {
    background: linear-gradient(145deg, rgba(180,30,30,0.85), rgba(80,10,10,0.85));
    border-color: rgba(255,90,80,0.7);
    color: #fff;
    box-shadow: 0 0 35px rgba(255,70,50,0.6), 0 10px 30px rgba(0,0,0,0.55);
  }
  .handbrake.on .hb-dot {
    background: #ff5a3a;
    box-shadow: 0 0 18px #ff5a3a, inset 0 1px 3px rgba(255,255,255,0.4);
  }

  /* ============ VOLANTE ============ */
  #wheelWrap {
    position: fixed; left: 26px; bottom: 26px;
    width: 260px; height: 260px;
    z-index: 26; touch-action: none;
    cursor: grab;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,0.7));
  }
  #wheelWrap:active { cursor: grabbing; }
  #wheelSvg {
    width: 100%; height: 100%;
    transform-origin: center center;
    will-change: transform;
    transition: transform 0.016s linear;
  }

  /* Alerta */
  #alertMsg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #ff6a4a; font-size: 22px; font-weight: 800;
    letter-spacing: 3px; opacity: 0;
    pointer-events: none; z-index: 100;
    text-shadow: 0 0 20px rgba(255,80,50,0.9);
    transition: opacity 0.3s;
  }

  @media (max-width: 820px) {
    #wheelWrap { width: 180px; height: 180px; left: 14px; bottom: 14px; }
    #rightHud { right: 12px; bottom: 12px; gap: 8px; }
    .pedal { width: 60px; height: 60px; font-size: 10px; }
    .pedal .ico { font-size: 16px; }
    .pedals { padding: 12px 14px; gap: 10px; border-radius: 24px; }
    .dashboard { padding: 12px 16px; gap: 16px; border-radius: 20px; }
    .speedo .val { font-size: 32px; }
    .speedo { min-width: 70px; }
    .rpm-wrap { min-width: 60px; }
    .rpm-bar { width: 55px; height: 6px; }
    .gear-item { width: 24px; height: 24px; font-size: 11px; }
    .handbrake { padding: 10px 16px; font-size: 11px; letter-spacing: 1px; gap: 8px; }
    .chip { padding: 6px 14px; font-size: 11px; letter-spacing: 1px; }
  }
  @media (max-width: 520px) {
    #wheelWrap { width: 140px; height: 140px; }
    .pedal { width: 50px; height: 50px; font-size: 9px; }
    .pedal .ico { font-size: 14px; }
    .speedo .val { font-size: 24px; }
    .speedo { min-width: 56px; }
    .gearbox { grid-template-columns: repeat(2, 1fr); gap: 3px; }
    .gear-item { width: 20px; height: 20px; font-size: 10px; }
  }
</style>
</head>
<body>

<!-- Alert -->
<div id="alertMsg">⚠ FRENAGEM DE EMERGÊNCIA</div>

<!-- HUD Topo -->
<div id="topHud">
  <div class="chip" id="timeChip">☀ 08:30</div>
  <div class="chip" id="distChip">0.00 km</div>
  <div class="chip" id="fpsChip">60 FPS</div>
</div>

<!-- Painel direito -->
<div id="rightHud">
  <div class="dashboard">
    <div class="speedo">
      <div class="val" id="speedDisplay">0</div>
      <div class="unit">KM/H</div>
    </div>
    <div class="rpm-wrap">
      <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
      <div class="rpm-label" id="rpmLabel">RPM</div>
    </div>
    <div class="gearbox" id="gearBox">
      <div class="gear-item" data-g="1">1</div>
      <div class="gear-item" data-g="2">2</div>
      <div class="gear-item" data-g="3">3</div>
      <div class="gear-item" data-g="4">4</div>
      <div class="gear-item" data-g="5">5</div>
      <div class="gear-item" data-g="6">6</div>
      <div class="gear-item" data-g="N">N</div>
      <div class="gear-item rev" data-g="R">R</div>
    </div>
  </div>

  <div class="pedals">
    <div class="pedal" id="pedalBrake">
      <span class="ico">🛑</span>RÉ
    </div>
    <div class="pedal" id="pedalAccel">
      <span class="ico">⚡</span>ACEL
    </div>
  </div>

  <div class="handbrake" id="handbrakeBtn">
    <div class="hb-dot"></div> FREIO DE MÃO
  </div>
</div>

<!-- Volante -->
<div id="wheelWrap">
  <svg id="wheelSvg" viewBox="0 0 240 240">
    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="30%">
        <stop offset="0%" stop-color="#3a4250"/>
        <stop offset="100%" stop-color="#0a0d12"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#2a323d"/>
        <stop offset="100%" stop-color="#080b10"/>
      </radialGradient>
    </defs>
    <circle cx="120" cy="120" r="112" fill="none" stroke="#05080c" stroke-width="5"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="url(#rimGrad)" stroke-width="24"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="#4d5666" stroke-width="1.5" opacity="0.6"/>
    <circle cx="120" cy="120" r="90" fill="none" stroke="#1a1f27" stroke-width="3"/>

    <g stroke="#1a1f27" stroke-width="18" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="72"/>
      <line x1="120" y1="168" x2="120" y2="210"/>
      <line x1="30" y1="120" x2="72" y2="120"/>
      <line x1="168" y1="120" x2="210" y2="120"/>
    </g>

    <circle cx="120" cy="120" r="38" fill="url(#centerGrad)" stroke="#3a4250" stroke-width="3"/>
    <circle cx="120" cy="120" r="24" fill="none" stroke="#2a323d" stroke-width="2"/>
    <path d="M120 106 L128 120 L120 134 L112 120 Z" fill="#c9a24a" opacity="0.95"/>
    <rect x="116" y="20" width="8" height="16" rx="4" fill="#ffb84a" opacity="0.85"/>
  </svg>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   RENDERER
========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

/* =========================================================
   CENA + CÂMERA
========================================================= */
const scene = new THREE.Scene();
const FOG_COLOR_DAY = new THREE.Color(0xaac4dd);
scene.fog = new THREE.Fog(FOG_COLOR_DAY, 60, 380);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1200);
camera.rotation.order = 'YXZ';

/* =========================================================
   ILUMINAÇÃO
========================================================= */
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x2a3a2a, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d8, 1.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 500;
sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

const ambient = new THREE.AmbientLight(0x404a5a, 0.4);
scene.add(ambient);

/* =========================================================
   COCKPIT — 1ª pessoa
========================================================= */
const cockpit = new THREE.Group();
camera.add(cockpit);
scene.add(camera);

// === Materiais do cockpit ===
const matBlack  = new THREE.MeshStandardMaterial({ color: 0x08090c, roughness: 0.95, metalness: 0.1 });
const matDash   = new THREE.MeshStandardMaterial({ color: 0x14181e, roughness: 0.75, metalness: 0.15 });
const matPlastic= new THREE.MeshStandardMaterial({ color: 0x1e242c, roughness: 0.6,  metalness: 0.25 });
const matChrome = new THREE.MeshStandardMaterial({ color: 0x8a92a0, roughness: 0.25, metalness: 0.9 });
const matRubber = new THREE.MeshStandardMaterial({ color: 0x0d1015, roughness: 0.95, metalness: 0.02 });
const matLed    = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x33dd66, emissiveIntensity: 1.2 });
const matLedRed = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xff3322, emissiveIntensity: 1.2 });

// === Painel superior (visor/parasol) ===
const visor = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.16, 0.7), matBlack);
visor.position.set(0, 0.82, -1.45);
cockpit.add(visor);

// Borda inferior do visor
const visorLip = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.06, 0.05), matRubber);
visorLip.position.set(0, 0.72, -1.12);
cockpit.add(visorLip);

// === Teto ===
const roof = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.12, 2.0), matDash);
roof.position.set(0, 0.92, -0.5);
cockpit.add(roof);

// === Pilares A ===
const pillarGeo = new THREE.BoxGeometry(0.12, 1.2, 0.14);
const pilL = new THREE.Mesh(pillarGeo, matBlack);
pilL.position.set(-1.42, 0.25, -1.55);
cockpit.add(pilL);
const pilR = new THREE.Mesh(pillarGeo, matBlack);
pilR.position.set(1.42, 0.25, -1.55);
cockpit.add(pilR);

// Travessa superior (topo da janela)
const trav = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.14, 0.16), matBlack);
trav.position.set(0, 0.82, -1.55);
cockpit.add(trav);

// === Painel inferior (dashboard principal) ===
const dashMain = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.5, 1.2), matDash);
dashMain.position.set(0, -0.55, -1.25);
cockpit.add(dashMain);

// Console central do volante (túnel)
const consoleC = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.35, 1.0), matBlack);
consoleC.position.set(0, -0.42, -0.9);
cockpit.add(consoleC);

// Tampa superior do console (com brilho)
const consoleTop = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.05, 1.0), matChrome);
consoleTop.position.set(0, -0.25, -0.9);
cockpit.add(consoleTop);

// === Instrumentação digital no dashboard (fundo escuro com LEDs) ===
const screenMat = new THREE.MeshStandardMaterial({ color: 0x050810, emissive: 0x001122, emissiveIntensity: 0.7 });
const screen = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.28, 0.04), screenMat);
screen.position.set(0, -0.45, -0.68);
screen.rotation.x = 0.15;
cockpit.add(screen);

// LED verde pequeno
const ledG = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.01), matLed);
ledG.position.set(-0.28, -0.38, -0.66);
cockpit.add(ledG);

// LED vermelho
const ledR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.01), matLedRed);
ledR.position.set(-0.20, -0.38, -0.66);
cockpit.add(ledR);

// === Botões (pequenos) ===
for (let i=0; i<4; i++) {
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.02, 12), matPlastic);
  btn.rotation.x = Math.PI/2;
  btn.position.set(0.15 + i * 0.11, -0.42, -0.66);
  cockpit.add(btn);
}

// === Volante 3D ===
const wheelGroup = new THREE.Group();
wheelGroup.position.set(0, -0.32, -0.82);
wheelGroup.rotation.x = -0.4;
cockpit.add(wheelGroup);

// Aro externo
const wRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.21, 0.028, 14, 44),
  new THREE.MeshStandardMaterial({ color: 0x10141a, roughness: 0.45, metalness: 0.3 })
);
wheelGroup.add(wRim);

// Aro decorativo
const wRim2 = new THREE.Mesh(
  new THREE.TorusGeometry(0.21, 0.008, 8, 44),
  matChrome
);
wRim2.position.z = 0.015;
wheelGroup.add(wRim2);

// Raios
for (let i=0; i<3; i++){
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.36, 0.025), matPlastic);
  sp.rotation.z = (i * Math.PI * 2) / 3 + Math.PI/2;
  wheelGroup.add(sp);
}

// Cubo
const wHub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.055, 0.055, 0.04, 20),
  new THREE.MeshStandardMaterial({ color: 0x0a0d12, roughness: 0.4, metalness: 0.6 })
);
wHub.rotation.x = Math.PI/2;
wheelGroup.add(wHub);

// Logo
const wLogo = new THREE.Mesh(new THREE.CircleGeometry(0.025, 20), matChrome);
wLogo.position.z = 0.021;
wheelGroup.add(wLogo);

// === Alavanca de marcha (lado direito, embaixo) ===
const shifter = new THREE.Group();
shifter.position.set(0.55, -0.32, -0.75);
cockpit.add(shifter);

const shifterBase = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.1), matBlack);
shifterBase.position.y = -0.05;
shifter.add(shifterBase);

const shifterRod = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.22, 8), matChrome);
shifterRod.position.y = 0.06;
shifter.add(shifterRod);

const shifterKnob = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), matBlack);
shifterKnob.position.y = 0.19;
shifter.add(shifterKnob);

// === Espelhos retrovisores ===
function makeMirror(x, y, z) {
  const g = new THREE.Group();
  // Braço
  const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.45, 8), matBlack);
  armMesh.rotation.z = Math.PI/2;
  armMesh.position.x = 0.22 * Math.sign(x);
  g.add(armMesh);
  // Caixa suporte
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.07), matBlack);
  body.position.x = 0.45 * Math.sign(x);
  g.add(body);
  // Vidro do espelho
  const mirror = new THREE.Mesh(
    new THREE.PlaneGeometry(0.28, 0.14),
    new THREE.MeshStandardMaterial({ color: 0x88a0b8, roughness: 0.05, metalness: 0.95 })
  );
  mirror.position.set(0.45 * Math.sign(x), 0, -0.038);
  g.add(mirror);
  g.position.set(x, y, z);
  return g;
}
cockpit.add(makeMirror(-1.5, 0.35, -1.35));
cockpit.add(makeMirror(1.5, 0.35, -1.35));

// === Vidro do para-brisa ===
const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(2.85, 1.05),
  new THREE.MeshPhysicalMaterial({

function makeAsphaltTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2a2d33'; ctx.fillRect(0,0,512,512);
  // grão
  for (let i=0; i<12000; i++){
    const v = 25 + Math.random()*55;
    ctx.fillStyle = `rgba(${v},${v},${v+4},${Math.random()*0.6})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 1.5, 1.5);
  }
  // fissuras
  ctx.strokeStyle = 'rgba(20,20,22,0.5)';
  ctx.lineWidth = 1;
  for (let i=0; i<10; i++){
    ctx.beginPath();
    let x = Math.random()*512, y = Math.random()*512;
    ctx.moveTo(x,y);
    for (let j=0; j<8; j++){
      x += (Math.random()-0.5)*40; y += (Math.random()-0.5)*40;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0,0,512,512);
  grd.addColorStop(0, '#3a6b3a');
  grd.addColorStop(0.5, '#4d7a3a');
  grd.addColorStop(1, '#3a6b3a');
  ctx.fillStyle = grd; ctx.fillRect(0,0,512,512);
  for (let i=0; i<8000; i++){
    const g = 60 + Math.random()*90;
    ctx.fillStyle = `rgba(${g*0.45},${g},${g*0.35},${Math.random()*0.7})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

// Curva da estrada — combinação de senoides (nunca repete visualmente)
function roadOffsetX(z) {
  return (
    Math.sin(z * 0.0045) * 55 +
    Math.sin(z * 0.0018 + 1.7) * 90 +
    Math.sin(z * 0.0009 + 0.3) * 140 +
    Math.sin(z * 0.00045 - 2.1) * 200
  );
}
function roadOffsetXPrime(z) {
  return (
    Math.cos(z * 0.0045) * 55 * 0.0045 +
    Math.cos(z * 0.0018 + 1.7) * 90 * 0.0018 +
    Math.cos(z * 0.0009 + 0.3) * 140 * 0.0009 +
    Math.cos(z * 0.00045 - 2.1) * 200 * 0.00045
  );
}
function roadTangent(z) {
  return Math.atan(roadOffsetXPrime(z));
}

const CHUNK_LEN = 32;
const ROAD_W = 15;
const VIEW_AHEAD = 700;
const VIEW_BEHIND = 100;

const roadMatBase = new THREE.MeshStandardMaterial({

const lineMatWhite = new THREE.MeshStandardMaterial({ color: 0xf0f0d0, roughness: 0.7, emissive: 0x222211 });
const lineMatYellow = new THREE.MeshStandardMaterial({ color: 0xf0c050, roughness: 0.7, emissive: 0x2a1e00 });

const treeLeafMat3 = new THREE.MeshStandardMaterial({ color: 0x274f27, roughness: 1 });

const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 2.6, 6);
const leafGeo = new THREE.SphereGeometry(1.4, 6, 5);
const rockGeo = new THREE.DodecahedronGeometry(0.7, 0);

const roadChunks = new Map();

function buildRoadChunk(index) {
  const group = new THREE.Group();
  const zStart = index * CHUNK_LEN;
  const zMid = zStart + CHUNK_LEN / 2;

  // === Pista (grade triangulada em coordenadas mundiais) ===
  const NX = 3, NZ = 6;
  const geo = new THREE.BufferGeometry();
  const verts = [], uvs = [], indices = [];
  for (let iz=0; iz<=NZ; iz++){
    const tz = iz/NZ;
    const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    for (let ix=0; ix<=NX; ix++){
      const tx = ix/NX;
      const x = cx + (tx - 0.5) * ROAD_W;
      verts.push(x, 0, worldZ);
      uvs.push(tx * 3, tz * 6);
    }
  }
  for (let iz=0; iz<NZ; iz++){
    for (let ix=0; ix<NX; ix++){
      const a = iz*(NX+1)+ix;
      const b = a+1;
      const c = a+(NX+1);
      const d = c+1;
      indices.push(a,b,c, b,d,c);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const roadMesh = new THREE.Mesh(geo, roadMatBase);
  roadMesh.receiveShadow = true;
  group.add(roadMesh);

  // === Linhas centrais tracejadas ===
  const numDashes = Math.floor(CHUNK_LEN / 6);
  for (let i=0; i<numDashes; i++){
    const tz = (i + 0.5) / numDashes;
    const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    const ang = roadTangent(worldZ);
    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 2.6), lineMatYellow);
    dash.position.set(cx, 0.02, worldZ);
    dash.rotation.y = ang;
    dash.receiveShadow = true;
    group.add(dash);
  }

  // === Linhas laterais (bordas) ===
  for (let side = -1; side <= 1; side += 2){
    const ev = [], ei = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      const x1 = cx + side * (ROAD_W/2 - 0.6);
      const x2 = cx + side * (ROAD_W/2 - 0.3);
      ev.push(x1, 0.025, worldZ);
      ev.push(x2, 0.025, worldZ);
    }
    for (let iz=0; iz<NZ; iz++){
      const a = iz*2, b = iz*2+1, c = (iz+1)*2, d = (iz+1)*2+1;
      ei.push(a,b,c, b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(ev, 3));
    g.setIndex(ei);
    g.computeVertexNormals();
    group.add(new THREE.Mesh(g, lineMatWhite));
  }

  // === Acostamento (faixa cinza lateral) ===
  for (let side = -1; side <= 1; side += 2){
    const ev = [], ei = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      ev.push(cx + side * (ROAD_W/2), 0.005, worldZ);
      ev.push(cx + side * (ROAD_W/2 + 1.4), 0.005, worldZ);
    }
    for (let iz=0; iz<NZ; iz++){
      const a = iz*2, b = iz*2+1, c = (iz+1)*2, d = (iz+1)*2+1;
      ei.push(a,b,c, b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(ev, 3));
    g.setIndex(ei);
    g.computeVertexNormals();
    group.add(new THREE.Mesh(g, shoulderMat));
  }

  // === Props: árvores, pedras, placas ===
  const seedRandom = (s) => {
    const x = Math.sin(s * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  };
  for (let i=0; i<8; i++){
    const r1 = seedRandom(index*17 + i*7.31);
    const r2 = seedRandom(index*29 + i*3.11);
    const r3 = seedRandom(index*41 + i*11.71);
    const localZ = -CHUNK_LEN/2 + r1 * CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    const side = r2 > 0.5 ? 1 : -1;
    const dist = 4 + r3 * 30;
    const px = cx + side * (ROAD_W/2 + dist);

    if (r3 > 0.25){
      // Árvore
      const scale = 0.7 + r1 * 1.0;
      const trunk = new THREE.Mesh(trunkGeo, treeTrunkMat);
      trunk.scale.setScalar(scale);
      trunk.position.set(px, 1.3*scale, worldZ);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      const leafMat = r3 > 0.75 ? treeLeafMat3 : (r3 > 0.5 ? treeLeafMat2 : treeLeafMat);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.scale.setScalar(scale * (0.85 + r2*0.35));
      leaf.position.set(px, 2.7*scale + 0.5, worldZ);
      leaf.castShadow = true;
      group.add(leaf);

      // segunda camada de folhas
      if (r1 > 0.4){
        const leaf2 = new THREE.Mesh(leafGeo, leafMat);
        leaf2.scale.setScalar(scale * 0.7);
        leaf2.position.set(px + 0.6*scale, 3.6*scale, worldZ + 0.4);
        leaf2.castShadow = true;
        group.add(leaf2);
      }
    } else if (r3 > 0.15){
      // Pedra
      const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({
        color: 0x666a70, roughness: 1, flatShading: true
      }));
      rock.scale.setScalar(0.4 + r1 * 1.2);
      rock.position.set(px, 0.3, worldZ);
      rock.rotation.set(r1*3, r2*3, r3*3);
      rock.castShadow = true;
      rock.receiveShadow = true;
      group.add(rock);
    } else if (r3 < 0.07){
      // Sinal
      const sign = new THREE.Group();
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.0, 6), signPostMat);
      post.position.y = 1.0;
      post.castShadow = true;
      sign.add(post);
      const face = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.05), signFaceMat);
      face.position.y = 1.9;
      face.castShadow = true;
      sign.add(face);
      sign.position.set(px, 0, worldZ);
      sign.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
      group.add(sign);
    }
  }

  group.userData.index = index;
  return group;
}

function ensureChunks(playerZ) {
  const startIdx = Math.floor((playerZ - VIEW_BEHIND) / CHUNK_LEN);
  const endIdx = Math.floor((playerZ + VIEW_AHEAD) / CHUNK_LEN);
  for (let i = startIdx; i <= endIdx; i++){
    if (!roadChunks.has(i)){
      const chunk = buildRoadChunk(i);
      world.add(chunk);
      roadChunks.set(i, chunk);
    }
  }
  for (const [idx, chunk] of roadChunks){
    if (idx < startIdx - 2 || idx > endIdx + 2){
      world.remove(chunk);
      chunk.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      roadChunks.delete(idx);
    }
  }
}

const wheelWrap = document.getElementById('wheelWrap');
const wheelSvg = document.getElementById('wheelSvg');

let dragging = false;
let dragStartAngle = 0;
let dragStartSteer = 0;
const MAX_WHEEL_ANGLE = Math.PI * 0.8;

function pointerAngle(e) {
  const r = wheelWrap.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
  return Math.atan2(y, x);
}

function wheelDown(e){
  e.preventDefault();
  dragging = true;
  dragStartAngle = pointerAngle(e);
  dragStartSteer = bus.steerTarget;
  wheelWrap.style.cursor = 'grabbing';
}
function wheelMove(e){
  if (!dragging) return;
  e.preventDefault();
  const a = pointerAngle(e);
  let delta = a - dragStartAngle;
  while (delta > Math.PI) delta -= Math.PI*2;
  while (delta < -Math.PI) delta += Math.PI*2;
  let steer = dragStartSteer + (delta / MAX_WHEEL_ANGLE) * 1.0;
  bus.steerTarget = Math.max(-1, Math.min(1, steer));
}
function wheelUp(){
  dragging = false;
  wheelWrap.style.cursor = 'grab';
}
wheelWrap.addEventListener('mousedown', wheelDown);
addEventListener('mousemove', wheelMove);
addEventListener('mouseup', wheelUp);
wheelWrap.addEventListener('touchstart', wheelDown, { passive: false });
addEventListener('touchmove', wheelMove, { passive: false });
addEventListener('touchend', wheelUp);
addEventListener('touchcancel', wheelUp);

let last = performance.now();

function updateBusPhysics(dt) {
  // === INPUTS ===
  const accelInput = (keys['w'] || keys['arrowup'] || touchAccel) ? 1 : 0;
  const brakeInput = (keys['s'] || keys['arrowdown'] || touchBrake) ? 1 : 0;

  // === DIREÇÃO ===
  if (dragging) {
    // steerTarget já definido pelo arrasto
  } else {
    if (keys['a'] || keys['arrowleft']) bus.steerTarget -= 1.8 * dt;
    if (keys['d'] || keys['arrowright']) bus.steerTarget += 1.8 * dt;
    if (!keys['a'] && !keys['arrowleft'] && !keys['d'] && !keys['arrowright']) {
      bus.steerTarget *= Math.pow(0.04, dt);
      if (Math.abs(bus.steerTarget) < 0.002) bus.steerTarget = 0;
    }
  }
  bus.steerTarget = Math.max(-1, Math.min(1, bus.steerTarget));
  const steerDiff = bus.steerTarget - bus.steer;
  bus.steer += steerDiff * Math.min(1, 9 * dt);

  // === TRANSMISSÃO AUTOMÁTICA ===
  // Se velocidade muito baixa e acelerador, coloca em 1ª
  if (bus.gear === 0 && accelInput > 0.1 && bus.speed >= 0) {
    bus.gear = 1;
  }
  if (bus.speed < -0.3 && !brakeInput && accelInput < 0.1) {
    // ainda ré
  }
  // Trocar para ré quando o carro está parado e o freio é segurado por tempo
  // (simplificado: se brakeInput e velocidade ~ 0 por 0.5s, engata ré)
  
  // === TROCA DE MARCHAS AUTOMÁTICA (D) ===
  if (bus.gear > 0 && bus.gear <= 6) {
    const wheelRPM = (Math.abs(bus.speed) / (2 * Math.PI * bus.wheelRadius)) * 60;
    const engineRPM = wheelRPM * bus.gearRatios[bus.gear] * bus.finalDrive;
    bus.rpm = Math.max(bus.rpmIdle, Math.min(bus.rpmMax, engineRPM));
    
    // Up-shift
    if (bus.rpm > 4200 && bus.gear < 6 && bus.shiftTimer <= 0) {
      bus.gear++;
      bus.shiftTimer = 0.35;
      bus.rpm *= 0.65;
    }
    // Down-shift
    else if (bus.rpm < 1500 && bus.gear > 1 && bus.shiftTimer <= 0 && bus.speed > 1) {
      bus.gear--;
      bus.shiftTimer = 0.3;
    }
  } else if (bus.gear === -1) {
    // Ré
    const wheelRPM = (Math.abs(bus.speed) / (2 * Math.PI * bus.wheelRadius)) * 60;
    bus.rpm = Math.max(bus.rpmIdle, Math.min(bus.rpmMax, wheelRPM * 3.8 * bus.finalDrive));
  } else {
    // N / P
    if (accelInput > 0.1) {
      bus.rpm += (2200 - bus.rpm) * Math.min(1, 4*dt);
    } else {
      bus.rpm += (bus.rpmIdle - bus.rpm) * Math.min(1, 3*dt);
    }
  }

  // === FÍSICA ===
  const wheelForce = (() => {
    if (bus.gear === 0 && !brakeInput && Math.abs(bus.speed) < 0.5) return 0;
    // Roda: força = torque * ratio * final / raio
    const ratio = bus.gear > 0 ? bus.gearRatios[bus.gear] :
                  bus.gear === -1 ? -3.8 : 0;
    const rpmRatio = Math.min(1, bus.rpm / bus.rpmMax);
    const torque = bus.engineTorque * rpmRatio * (0.6 + 0.4 * (1 - rpmRatio));
    return (torque * ratio * bus.finalDrive / bus.wheelRadius) *
           (accelInput > 0 || bus.speed > 0 ? 1 : -1);
  })();

  // Forças resistivas
  const drag = -0.5 * bus.dragCoef * bus.speed * Math.abs(bus.speed) * 1.2;
  const roll = -bus.rollingResistance * bus.mass * 9.81 * Math.sign(bus.speed) * (Math.abs(bus.speed) > 0.1 ? 1 : 0);

  // Freio
  let brakeForce = 0;
  if (brakeInput > 0.05) {
    if (bus.speed > 0.2) {
      brakeForce = -brakeInput * 18000;
      // ABS simulado: reduz força perto de 0
      if (Math.abs(bus.speed) < 1.5) brakeForce *= 0.5;
    } else if (bus.speed <= 0.2) {
      // ré
      bus.gear = -1;
      brakeForce = -brakeInput * 6000;
      bus.gear = -1;
    }
  }

  // Freio de mão
  if (bus.handbrake) {
    brakeForce -= Math.sign(bus.speed) * 25000;
    // trava de mão só atua abaixo de 30 m/s
    if (Math.abs(bus.speed) < 0.1) bus.speed = 0;
  }

  // Acelerador aplica força
  const totalForce = wheelForce * accelInput + drag + roll + brakeForce;

  // Aceleração
  const accel = totalForce / bus.mass;
  bus.speed += accel * dt;

  // Limites
  const maxFwd = 32; // ~115 km/h
  const maxRev = -9;
  if (bus.speed > maxFwd) bus.speed = maxFwd;
  if (bus.speed < maxRev) bus.speed = maxRev;
  if (Math.abs(bus.speed) < 0.02 && (accelInput < 0.05 && brakeInput < 0.05)) bus.speed = 0;

  // Atualiza rótulo da marcha
  let label = 'N';
  if (bus.gear === -1) label = 'R';
  else if (bus.gear >= 1 && bus.gear <= 6) label = String(bus.gear);
  bus.gearLabel = label;

  // Reduz timer de troca
  bus.shiftTimer = Math.max(0, bus.shiftTimer - dt);

  // === MOVIMENTO ===
  // Rotações apenas se estiver andando (física realista)
  const speedFactor = Math.min(1, Math.abs(bus.speed) / 8);
  const turnRate = bus.steer * 1.9 * speedFactor * Math.sign(bus.speed || 1);
  bus.yaw += turnRate * dt * Math.min(1, Math.abs(bus.speed) * 0.35);

  // Move
  const forward = new THREE.Vector3(-Math.sin(bus.yaw), 0, -Math.cos(bus.yaw));
  bus.pos.addScaledVector(forward, bus.speed * dt);
  bus.distance += Math.abs(bus.speed) * dt;

  // === ALERTA DE EMERGÊNCIA ===
  if (brakeInput > 0.9 && bus.speed > 10 && !bus.handbrake) {
    alertTimer = 0.6;
  }
  alertTimer = Math.max(0, alertTimer - dt);
  alertMsg.style.opacity = alertTimer > 0 ? (alertTimer / 0.6) : 0;
}

function updateBusVisual(dt) {
  // === CÂMERA ===
  const speedAbs = Math.abs(bus.speed);
  const baseY = 3.05;
  const vibAmp = Math.min(0.045, speedAbs * 0.0018);
  const t = performance.now() * 0.001;
  const vx = Math.sin(t * 32) * vibAmp;
  const vy = Math.sin(t * 47 + 1.2) * vibAmp * 1.2;
  const vz = Math.sin(t * 38 + 2.4) * vibAmp * 0.5;

  camera.position.set(bus.pos.x + vx, bus.pos.y + baseY + vy, bus.pos.z + vz);

  // Direção da câmera
  const forward = new THREE.Vector3(-Math.sin(bus.yaw), 0, -Math.cos(bus.yaw));
  const lookTarget = new THREE.Vector3(
    bus.pos.x + forward.x * 12,
    bus.pos.y + baseY - 0.1,
    bus.pos.z + forward.z * 12
  );
  camera.lookAt(lookTarget);

  // Roll dinâmico (curva) + pitch (aceleração/frenagem)
  const targetRoll = -bus.steer * 0.075 * Math.min(1, speedAbs / 12);
  bus.cameraRoll += (targetRoll - bus.cameraRoll) * Math.min(1, 5*dt);
  camera.rotateZ(bus.cameraRoll);

  // === VOLANTE VISUAL ===
  bus.wheelVisual += (bus.steer - bus.wheelVisual) * Math.min(1, 15*dt);
  const wheelDeg = bus.wheelVisual * MAX_WHEEL_ANGLE * (180/Math.PI);
  wheelSvg.style.transform = `rotate(${wheelDeg}deg)`;

  // Volante 3D
  wheelGroup.rotation.z = -bus.wheelVisual * 1.6;

  // === HUD ===
  const kmh = Math.round(speedAbs * 3.6);
  speedDisplay.textContent = kmh;

  // RPM
  const rpmPercent = (bus.rpm - bus.rpmIdle) / (bus.rpmMax - bus.rpmIdle);
  rpmFill.style.width = Math.max(0, Math.min(1, rpmPercent)) * 100 + '%';
  rpmLabel.textContent = Math.round(bus.rpm) + ' RPM';

  // Marcha
  gearItems.forEach(el => {
    const active = el.dataset.g === bus.gearLabel;
    el.classList.toggle('active', active);
  });

  // === MUNDO ===
  ground.position.x = bus.pos.x;
  ground.position.z = bus.pos.z;
  mountains.position.x = bus.pos.x;
  mountains.position.z = bus.pos.z;

  ensureChunks(bus.pos.z);
}

function updateDayNight(dt) {
  timeOfDay = (timeOfDay + (24 / DAY_DURATION) * dt) % 24;
  const sunAngle = ((timeOfDay - 6) / 24) * Math.PI * 2;
  const sunHeight = Math.sin(sunAngle);
  const sunDist = 300;

  sun.position.set(
    bus.pos.x + Math.cos(sunAngle) * sunDist,
    Math.max(10, sunHeight * sunDist),
    bus.pos.z + 80
  );
  sun.target.position.set(bus.pos.x, 0, bus.pos.z);
  sun.target.updateMatrixWorld();

  const dayFactor = Math.max(0, sunHeight);
  sun.intensity = 0.08 + dayFactor * 2.0;
  hemi.intensity = 0.2 + dayFactor * 0.9;
  ambient.intensity = 0.12 + dayFactor * 0.45;

  // Cor do céu
  const skyColor = new THREE.Color();
  if (sunHeight > 0.3) {
    skyColor.setHSL(0.58, 0.5, 0.5 + dayFactor * 0.22);
  } else if (sunHeight > -0.1) {
    const k = (sunHeight + 0.1) / 0.4;
    skyColor.lerpColors(new THREE.Color(0x1a1a2e), new THREE.Color(0x9fc0d8), k);
  } else {
    skyColor.setHex(0x06060f);
  }

  scene.background = skyColor;
  scene.fog.color.copy(skyColor);
  scene.fog.near = 60 + dayFactor * 40;
  scene.fog.far = 220 + dayFactor * 380;

  // Estrelas
  const nightFactor = Math.max(0, -sunHeight * 1.5);
  starsMat.opacity = Math.min(1, nightFactor * 2.5);
  stars.position.x = bus.pos.x;
  stars.position.z = bus.pos.z;

  // HUD Tempo
  const hh = Math.floor(timeOfDay).toString().padStart(2,'0');
  const mm = Math.floor((timeOfDay%1)*60).toString().padStart(2,'0');
  const icon = sunHeight > 0.15 ? '☀' : (sunHeight > -0.1 ? '🌅' : '🌙');
  timeChip.textContent = `${icon} ${hh}:${mm}`;
  distChip.textContent = (bus.distance/1000).toFixed(3) + ' km';
}

function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  // FPS
  fpsSmooth += (1/Math.max(dt, 0.0001) - fpsSmooth) * 0.05;
  fpsChip.textContent = Math.round(fpsSmooth) + ' FPS';

  updateBusPhysics(dt);
  updateBusVisual(dt);
  updateDayNight(dt);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* =========================================================
   INICIALIZAÇÃO
========================================================= */
ensureChunks(0);
wheelSvg.style.transform = 'rotate(0deg)';
camera.position.set(0, 3.05, 0);
camera.lookAt(0, 3.05, -10);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
</body>
