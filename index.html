<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batalha Ninja - Cartas Naruto</title>
<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: radial-gradient(circle at 50% 0%, #2a1a0a 0%, #0d0d0d 70%);
    color: #fff; min-height: 100vh; overflow-x: hidden;
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 15px; }

  /* ===== TELAS ===== */
  .tela { display: none; }
  .tela.ativa { display: block; }

  /* ===== MENU ===== */
  #menu { text-align: center; padding-top: 60px; }
  #menu h1 {
    font-size: 3.5em; color: #ff8c00;
    text-shadow: 0 0 20px #ff4500, 0 0 40px #ff4500;
    margin-bottom: 10px; letter-spacing: 3px;
  }
  #menu p.sub { color: #bbb; margin-bottom: 40px; font-size: 1.1em; }
  .btn {
    background: linear-gradient(135deg, #ff8c00, #ff4500);
    color: #fff; border: none; padding: 15px 35px; font-size: 1.1em;
    border-radius: 10px; cursor: pointer; margin: 10px; font-weight: bold;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 15px rgba(255,69,0,.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,69,0,.7); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sec { background: linear-gradient(135deg, #444, #222); box-shadow: none; }
  #inputCodigo {
    padding: 15px; font-size: 1.1em; border-radius: 10px; border: 2px solid #ff8c00;
    background: #1a1a1a; color: #fff; width: 260px; text-align: center;
    letter-spacing: 3px; text-transform: uppercase; margin-top: 15px;
  }
  #status { margin-top: 20px; color: #ff8c00; font-size: 1.1em; min-height: 25px; }
  #codigoSala {
    display: inline-block; background: #1a1a1a; padding: 15px 30px;
    border-radius: 10px; border: 2px dashed #ff8c00; margin-top: 15px;
    font-size: 1.6em; letter-spacing: 5px; color: #ff8c00; font-weight: bold;
  }

  /* ===== JOGO ===== */
  #jogo { display: none; }
  #jogo.ativa { display: flex; flex-direction: column; gap: 10px; }

  .infoBar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,140,0,.1); border: 1px solid rgba(255,140,0,.3);
    padding: 10px 20px; border-radius: 10px;
  }
  .hpBar {
    flex: 1; max-width: 300px; height: 22px; background: #222;
    border-radius: 11px; overflow: hidden; border: 1px solid #555;
    position: relative; margin: 0 10px;
  }
  .hpFill {
    height: 100%; background: linear-gradient(90deg, #ff0000, #ff8c00);
    transition: width .5s ease; border-radius: 11px;
  }
  .hpTexto {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .8em; font-weight: bold; text-shadow: 1px 1px 2px #000;
  }
  .nomeJogador { font-weight: bold; color: #ff8c00; min-width: 90px; }

  .turnoBox {
    text-align: center; font-size: 1.1em; padding: 8px;
    background: rgba(0,0,0,.4); border-radius: 8px;
    border: 1px solid #333; color: #ff8c00; font-weight: bold;
  }
  .turnoBox.meu { border-color: #00ff88; color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,.3); }

  .areaMao {
    display: flex; justify-content: center; gap: 8px; min-height: 200px;
    padding: 15px; background: rgba(0,0,0,.3); border-radius: 12px;
    border: 1px solid rgba(255,140,0,.15); flex-wrap: wrap; align-items: center;
  }
  .areaMao.inimigo { min-height: 130px; }
  .areaMao.inimigo .carta { transform: scale(.75); opacity: .85; }

  .carta {
    width: 120px; height: 170px; border-radius: 10px;
    background: linear-gradient(160deg, #1a1a1a, #2a2a2a);
    border: 2px solid #ff8c00; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px; transition: transform .2s, box-shadow .2s;
    position: relative; user-select: none;
  }
  .carta:hover {
    transform: translateY(-12px) scale(1.05);
    box-shadow: 0 8px 25px rgba(255,140,0,.6);
  }
  .carta.fogo { border-color: #ff4500; }
  .carta.agua { border-color: #1e90ff; }
  .carta.vento { border-color: #00ff88; }
  .carta.terra { border-color: #8b4513; }
  .carta.raio { border-color: #ffd700; }
  .carta .avatar {
    width: 60px; height: 60px; border-radius: 50%;
    background: #333; display: flex; align-items: center; justify-content: center;
    font-size: 2em; margin-bottom: 5px; border: 2px solid #555;
  }
  .carta .nomeCarta {
    font-size: .78em; font-weight: bold; text-align: center;
    margin-bottom: 5px; height: 28px; display: flex; align-items: center;
  }
  .carta .stats {
    display: flex; gap: 6px; font-size: .8em; font-weight: bold;
    margin-top: auto; width: 100%; justify-content: center;
  }
  .carta .atk { color: #ff4500; }
  .carta .def { color: #1e90ff; }
  .carta .chakra {
    position: absolute; top: -8px; right: -8px;
    background: #00bfff; color: #000; border-radius: 50%;
    width: 26px; height: 26px; display: flex; align-items: center;
    justify-content: center; font-size: .8em; font-weight: bold;
    border: 2px solid #fff;
  }
  .carta.desabilitada { opacity: .4; cursor: not-allowed; filter: grayscale(.7); }
  .carta.desabilitada:hover { transform: none; box-shadow: none; }

  .chakraBox {
    text-align: center; font-weight: bold; color: #00bfff;
    padding: 8px; font-size: 1em;
  }
  .chakraBox span { color: #fff; }

  /* ===== FIM ===== */
  #fim { text-align: center; padding-top: 100px; display: none; }
  #fim.ativa { display: block; }
  #fim h1 { font-size: 4em; margin-bottom: 20px; }
  #fim h1.vitoria { color: #00ff88; text-shadow: 0 0 30px #00ff88; }
  #fim h1.derrota { color: #ff3333; text-shadow: 0 0 30px #ff3333; }

  /* Animação de ataque */
  @keyframes atacar {
    0% { transform: translateX(0); }
    50% { transform: translateX(30px) scale(1.1); }
    100% { transform: translateX(0); }
  }
  .carta.atacando { animation: atacar .4s ease; }
  @keyframes dano {
    0%,100% { background: rgba(255,140,0,.1); }
    50% { background: rgba(255,0,0,.5); }
  }
  .dano { animation: dano .4s ease; }

  .log {
    text-align: center; color: #ff8c00; font-size: .95em;
    min-height: 24px; padding: 5px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== MENU ===== -->
  <div id="menu" class="tela ativa">
    <h1>🍥 BATALHA NINJA</h1>
    <p class="sub">Duelo de cartas multiplayer</p>
    <button class="btn" id="btnCriar">Criar Sala</button>
    <button class="btn sec" id="btnEntrarTela">Entrar em Sala</button>

    <div id="areaEntrar" style="display:none; margin-top:20px;">
      <input id="inputCodigo" placeholder="CÓDIGO" maxlength="6">
      <br>
      <button class="btn" id="btnEntrar">Conectar</button>
    </div>

    <div id="status"></div>
    <div id="codigoSala" style="display:none;"></div>
  </div>

  <!-- ===== JOGO ===== -->
  <div id="jogo">
    <div class="infoBar">
      <div class="nomeJogador">🥷 Inimigo</div>
      <div class="hpBar"><div class="hpFill" id="hpInimigoFill" style="width:100%"></div><div class="hpTexto" id="hpInimigoTexto">100 / 100</div></div>
    </div>

    <div class="areaMao inimigo" id="maoInimigo"></div>

    <div class="turnoBox" id="turnoBox">Aguardando...</div>
    <div class="chakraBox">⚡ Chakra: <span id="chakraTexto">0</span> / 10</div>

    <div class="areaMao" id="minhaMao"></div>

    <div class="infoBar">
      <div class="nomeJogador">🥷 Você</div>
      <div class="hpBar"><div class="hpFill" id="hpMeuFill" style="width:100%"></div><div class="hpTexto" id="hpMeuTexto">100 / 100</div></div>
    </div>

    <div class="log" id="log"></div>
  </div>

  <!-- ===== FIM ===== -->
  <div id="fim">
    <h1 id="fimTitulo"></h1>
    <button class="btn" onclick="location.reload()">Jogar Novamente</button>
  </div>

</div>

<script>
// ============ CARTAS ============
const TODAS_CARTAS = [
  { id: 1, nome: 'Naruto',  atk: 8,  def: 5,  chakra: 3, elemento: 'vento', emoji: '🍥' },
  { id: 2, nome: 'Sasuke',  atk: 7,  def: 6,  chakra: 3, elemento: 'raio',  emoji: '⚡' },
  { id: 3, nome: 'Sakura',  atk: 5,  def: 9,  chakra: 2, elemento: 'terra', emoji: '🌸' },
  { id: 4, nome: 'Kakashi', atk: 9,  def: 7,  chakra: 5, elemento: 'raio',  emoji: '📖' },
  { id: 5, nome: 'Gaara',   atk: 6,  def: 10, chakra: 4, elemento: 'terra', emoji: '🏜️' },
  { id: 6, nome: 'Itachi',  atk: 10, def: 6,  chakra: 6, elemento: 'fogo',  emoji: '🔥' },
  { id: 7, nome: 'Rock Lee',atk: 7,  def: 4,  chakra: 2, elemento: 'vento', emoji: '🥋' },
  { id: 8, nome: 'Hinata',  atk: 5,  def: 7,  chakra: 2, elemento: 'agua',  emoji: '👁️' },
  { id: 9, nome: 'Shikamaru',atk: 4, def: 8,  chakra: 3, elemento: 'terra', emoji: '🧠' },
  { id: 10,nome: 'Neji',    atk: 7,  def: 7,  chakra: 4, elemento: 'vento', emoji: '🌀' },
  { id: 11,nome: 'Kisame',  atk: 8,  def: 6,  chakra: 5, elemento: 'agua',  emoji: '🦈' },
  { id: 12,nome: 'Pain',    atk: 9,  def: 8,  chakra: 7, elemento: 'raio',  emoji: '☔' },
];

// Vantagem elemental (atacante -> defensor)
const VANTAGEM = {
  fogo: 'vento',   // fogo vence vento
  vento: 'raio',
  raio: 'terra',
  terra: 'agua',
  agua: 'fogo'
};

// ============ ESTADO ============
let peer = null;
let conn = null;
let souHost = false;
let minhaMao = [];
let maoInimigo = [];
let meuHP = 100, hpInimigo = 100;
let meuChakra = 0, chakraInimigo = 0;
let meuTurno = false;
let jogoAtivo = false;

// ============ MENU ============
const $ = id => document.getElementById(id);
const menu = $('menu'), jogo = $('jogo'), fim = $('fim');
const statusEl = $('status'), codigoSalaEl = $('codigoSala');

$('btnCriar').onclick = () => {
  statusEl.textContent = 'Criando sala...';
  $('btnCriar').disabled = true;
  $('btnEntrarTela').disabled = true;
  iniciarPeer(null);
};

$('btnEntrarTela').onclick = () => {
  $('areaEntrar').style.display = 'block';
  $('btnEntrarTela').disabled = true;
};

$('btnEntrar').onclick = () => {
  const codigo = $('inputCodigo').value.trim().toUpperCase();
  if (codigo.length < 4) { statusEl.textContent = 'Código inválido!'; return; }
  statusEl.textContent = 'Conectando...';
  iniciarPeer(codigo);
};

// ============ PEER ============
function iniciarPeer(entrarComId) {
  souHost = !entrarComId;
  peer = entrarComId ? new Peer() : new Peer(gerarCodigo());

  peer.on('open', (id) => {
    if (souHost) {
      codigoSalaEl.style.display = 'inline-block';
      codigoSalaEl.textContent = id;
      statusEl.textContent = 'Compartilhe o código acima! Aguardando oponente...';
    } else {
      statusEl.textContent = 'Conectando ao host...';
      conn = peer.connect(entrarComId, { reliable: true });
      configurarConexao();
    }
  });

  peer.on('connection', (c) => {
    if (!souHost) return;
    conn = c;
    configurarConexao();
  });

  peer.on('error', (e) => {
    console.error(e);
    statusEl.textContent = 'Erro: ' + e.type + '. Tente novamente.';
    $('btnCriar').disabled = false;
    $('btnEntrarTela').disabled = false;
  });
}

function gerarCodigo() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function configurarConexao() {
  conn.on('open', () => {
    statusEl.textContent = 'Conectado! Iniciando partida...';
    setTimeout(() => {
      menu.classList.remove('ativa');
      menu.style.display = 'none';
      jogo.style.display = 'flex';
      jogo.classList.add('ativa');
      jogoAtivo = true;
      iniciarPartida();
    }, 800);
  });

  conn.on('data', (data) => receberMensagem(data));

  conn.on('close', () => {
    if (jogoAtivo) {
      $('log').textContent = 'Oponente desconectou.';
      finalizarJogo(true);
    }
  });
}

// ============ PARTIDA ============
function iniciarPartida() {
  // Embaralha e distribui 5 cartas cada
  const baralho = [...TODAS_CARTAS].sort(() => Math.random() - 0.5);
  minhaMao = baralho.slice(0, 5);
  maoInimigo = baralho.slice(5, 10);

  if (souHost) {
    meuTurno = true;
    enviar({ tipo: 'inicio', maoInimigo: minhaMao.map(c => c.id) });
    atualizarUI();
    setLog('Sua vez! Escolha uma carta para atacar.');
  } else {
    meuTurno = false;
    atualizarUI();
    setLog('Aguardando o oponente...');
  }
}

function receberMensagem(msg) {
  if (msg.tipo === 'inicio') {
    // Recebi as cartas do host (que são a mão "inimiga" da minha perspectiva)
    maoInimigo = msg.maoInimigo.map(id => TODAS_CARTAS.find(c => c.id === id));
    atualizarUI();
    setLog('Aguardando o oponente jogar...');
  }
  else if (msg.tipo === 'jogada') {
    // Oponente jogou uma carta
    const cartaIdx = maoInimigo.findIndex(c => c.id === msg.cartaId);
    if (cartaIdx === -1) return;
    const cartaInimiga = maoInimigo.splice(cartaIdx, 1)[0];

    // Escolhe uma carta minha aleatória para defender (ou a mais forte)
    if (minhaMao.length === 0) { finalizarJogo(false); return; }
    const defIdx = Math.floor(Math.random() * minhaMao.length);
    const minhaDefesa = minhaMao.splice(defIdx, 1)[0];

    // Calcula dano
    const resultado = calcularDano(cartaInimiga, minhaDefesa);
    meuHP = Math.max(0, meuHP - resultado.dano);
    meuChakra = Math.min(10, meuChakra + 1);

    // Anima
    animarDano('hpMeuFill');
    atualizarUI();
    setLog(`⚔️ ${cartaInimiga.nome} atacou ${minhaDefesa.nome}! ${resultado.msg} (-${resultado.dano} HP)`);

    if (meuHP <= 0) { finalizarJogo(false); return; }

    // Agora é minha vez
    meuTurno = true;
    atualizarUI();
    setTimeout(() => setLog('Sua vez! Escolha uma carta.'), 1200);
  }
  else if (msg.tipo === 'resultado') {
    // Confirmação do oponente sobre meu ataque
    if (msg.derrotaOponente) {
      finalizarJogo(true);
    }
  }
  else if (msg.tipo === 'fim') {
    finalizarJogo(!msg.oponenteVenceu);
  }
}

function calcularDano(atacante, defensor) {
  let dano = Math.max(1, atacante.atk - Math.floor(defensor.def / 2));
  let msg = '';

  // Vantagem elemental
  if (VANTAGEM[atacante.elemento] === defensor.elemento) {
    dano = Math.floor(dano * 1.5);
    msg = '🔥 Vantagem elemental!';
  } else if (VANTAGEM[defensor.elemento] === atacante.elemento) {
    dano = Math.max(1, Math.floor(dano * 0.5));
    msg = '🛡️ Desvantagem elemental!';
  } else {
    msg = 'Ataque normal.';
  }

  return { dano, msg };
}

// ============ JOGAR CARTA ============
function jogarCarta(idx) {
  if (!meuTurno || !jogoAtivo) return;
  const carta = minhaMao[idx];
  if (!carta) return;
  if (carta.chakra > meuChakra) {
    setLog(`⚡ Chakra insuficiente! Precisa de ${carta.chakra}.`);
    return;
  }

  // Remove da mão e gasta chakra
  minhaMao.splice(idx, 1);
  meuChakra -= carta.chakra;
  meuTurno = false;

  // Anima
  animarAtaque('minhaMao', idx);

  // Envia jogada
  enviar({ tipo: 'jogada', cartaId: carta.id });

  atualizarUI();
  setLog(`Você jogou ${carta.nome}! Aguardando oponente...`);

  // Espera resposta do oponente (ele vai calcular e responder via 'jogada' de volta)
  // Simulamos a defesa do oponente após pequeno delay
  setTimeout(() => {
    if (!jogoAtivo) return;
    if (maoInimigo.length === 0) { finalizarJogo(true); return; }

    const defIdx = Math.floor(Math.random() * maoInimigo.length);
    const defesaInimiga = maoInimigo.splice(defIdx, 1)[0];

    const resultado = calcularDano(carta, defesaInimiga);
    hpInimigo = Math.max(0, hpInimigo - resultado.dano);
    chakraInimigo = Math.min(10, chakraInimigo + 1);

    animarDano('hpInimigoFill');
    atualizarUI();
    setLog(`⚔️ ${carta.nome} atacou ${defesaInimiga.nome}! ${resultado.msg} (-${resultado.dano} HP)`);

    if (hpInimigo <= 0) {
      enviar({ tipo: 'fim', oponenteVenceu: false });
      finalizarJogo(true);
      return;
    }

    // Devolve o turno pra mim (na versão simples, o oponente joga de volta)
    setTimeout(() => {
      if (!jogoAtivo) return;
      // Oponente ataca de volta
      if (maoInimigo.length === 0) { finalizarJogo(true); return; }
      const atkIdx = Math.floor(Math.random() * maoInimigo.length);
      const cartaInimiga = maoInimigo[atkIdx];
      if (cartaInimiga.chakra > chakraInimigo) {
        // Oponente pula a vez
        meuTurno = true;
        meuChakra = Math.min(10, meuChakra + 1);
        atualizarUI();
        setLog('Oponente pulou a vez (sem chakra). Sua vez!');
        return;
      }
      maoInimigo.splice(atkIdx, 1);
      chakraInimigo -= cartaInimiga.chakra;
      enviar({ tipo: 'jogada', cartaId: cartaInimiga.id });
    }, 1500);
  }, 800);
}

// ============ UI ============
function atualizarUI() {
  // HP
  $('hpMeuFill').style.width = meuHP + '%';
  $('hpMeuTexto').textContent = meuHP + ' / 100';
  $('hpInimigoFill').style.width = hpInimigo + '%';
  $('hpInimigoTexto').textContent = hpInimigo + ' / 100';

  // Chakra
  $('chakraTexto').textContent = meuChakra;

  // Turno
  const tb = $('turnoBox');
  if (meuTurno) {
    tb.textContent = '⚔️ SUA VEZ';
    tb.classList.add('meu');
  } else {
    tb.textContent = '⏳ Vez do oponente';
    tb.classList.remove('meu');
  }

  // Minha mão
  const mEl = $('minhaMao');
  mEl.innerHTML = '';
  minhaMao.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = `carta ${c.elemento}`;
    if (!meuTurno || c.chakra > meuChakra) div.classList.add('desabilitada');
    div.innerHTML = `
      <div class="chakra">${c.chakra}</div>
      <div class="avatar">${c.emoji}</div>
      <div class="nomeCarta">${c.nome}</div>
      <div class="stats"><span class="atk">⚔${c.atk}</span><span class="def">🛡${c.def}</span></div>
    `;
    div.onclick = () => jogarCarta(i);
    mEl.appendChild(div);
  });

  // Mão do inimigo (virada)
  const iEl = $('maoInimigo');
  iEl.innerHTML = '';
  maoInimigo.forEach(() => {
    const div = document.createElement('div');
    div.className = 'carta';
    div.style.background = 'linear-gradient(160deg, #1a0a0a, #3a1010)';
    div.innerHTML = `<div class="avatar" style="font-size:2.5em;">🍥</div>`;
    iEl.appendChild(div);
  });
}

function animarAtaque(containerId, idx) {
  const el = $(containerId).children[idx];
  if (el) {
    el.classList.add('atacando');
    setTimeout(() => el.classList.remove('atacando'), 400);
  }
}

function animarDano(id) {
  const el = $(id).parentElement;
  el.classList.add('dano');
  setTimeout(() => el.classList.remove('dano'), 400);
}

function setLog(txt) { $('log').textContent = txt; }

// ============ FIM ============
function finalizarJogo(vitoria) {
  jogoAtivo = false;
  jogo.style.display = 'none';
  jogo.classList.remove('ativa');
  fim.classList.add('ativa');
  const t = $('fimTitulo');
  if (vitoria) { t.textContent = '🏆 VITÓRIA!'; t.className = 'vitoria'; }
  else { t.textContent = '💀 DERROTA'; t.className = 'derrota'; }
}

// ============ ENVIAR ============
function enviar(obj) {
  if (conn && conn.open) conn.send(obj);
}
</script>
</body>
</html>
