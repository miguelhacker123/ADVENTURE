<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADVENTURES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 675px;
            background: #111;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            border-radius: 8px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI OVERLAYS --- */
        .hud-element {
            position: absolute;
            z-index: 10;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        #lang-selector {
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #52be80;
            color: #fff;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #27ae60;
            color: #fff;
            border-color: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        /* HUD MOEDAS E MAÇÃS (EMBAIXO DA MOEDA) */
        #hud-counters {
            top: 55px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            width: fit-content;
        }

        .coin-badge { border: 2px solid #ffd700; color: #ffd700; }
        .apple-badge { border: 2px solid #ff4757; color: #ff4757; }

        .icon-hud {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
        }

        .icon-coin { background: #ffd700; border: 2px solid #ffaa00; box-shadow: 0 0 6px #ffd700; }
        .icon-apple { background: #ff4757; border: 2px solid #ff6b81; box-shadow: 0 0 6px #ff4757; }

        #level-hud {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #2ecc71;
            font-size: 22px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.7);
            padding: 6px 20px;
            border-radius: 12px;
            border: 2px solid #27ae60;
        }

        #btn-pause {
            top: 15px;
            right: 15px;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 12;
            transition: 0.2s;
        }
        #btn-pause:hover { background: #e74c3c; transform: scale(1.05); }

        /* --- MENUS --- */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #3e2723 0%, #1a0e0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 20px;
        }

        .title {
            font-size: 62px;
            color: #2ecc71;
            text-shadow: 4px 4px 0px #1b5e20, 0 0 20px rgba(46, 204, 113, 0.5);
            letter-spacing: 6px;
            margin-bottom: 10px;
            text-align: center;
        }

        .btn-moss {
            position: relative;
            width: 260px;
            padding: 16px 0;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(180deg, #5d4037 0%, #3e2723 100%);
            border: 3px solid #2e7d32;
            border-top: 8px solid #4caf50;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 0 #1b100c, 0 10px 20px rgba(0,0,0,0.7);
            transition: all 0.15s ease-in-out;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .btn-moss:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-moss:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1b100c, 0 6px 10px rgba(0,0,0,0.6);
        }

        #levels-menu { display: none; }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            max-width: 80%;
            max-height: 60%;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 2px solid #4caf50;
        }

        .level-btn {
            width: 65px;
            height: 65px;
            background: #3e2723;
            border: 2px solid #2e7d32;
            border-top: 5px solid #4caf50;
            color: #888;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: not-allowed;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            text-shadow: 1px 1px 2px #000;
        }

        .level-btn.unlocked {
            background: linear-gradient(180deg, #6d4c41 0%, #4e342e 100%);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 0 #1b100c;
        }
        .level-btn.unlocked:hover { transform: scale(1.08); }

        .btn-back {
            margin-top: 10px;
            width: 170px;
            padding: 12px;
            font-size: 18px;
        }

        #pause-menu { display: none; }

        /* --- CONTROLES TOUCH --- */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 90px;
            z-index: 15;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .touch-group-left, .touch-group-right {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .basket-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .square-jump-btn {
            width: 75px;
            height: 75px;
            background: rgba(46, 204, 113, 0.4);
            border: 3px solid rgba(46, 204, 113, 0.8);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- SELEÇÃO DE IDIOMAS -->
    <div id="lang-selector" class="hud-element">
        <button class="lang-btn active" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <!-- HUD DE MOEDAS E MAÇÃS (EMBAIXO DA MOEDA) -->
    <div id="hud-counters" class="hud-element">
        <div class="hud-badge coin-badge">
            <span class="icon-hud icon-coin"></span>
            <span id="coin-count">0</span>
        </div>
        <div class="hud-badge apple-badge">
            <span class="icon-hud icon-apple"></span>
            <span id="apple-count">0</span>
        </div>
    </div>

    <!-- HUD FASE ATUAL -->
    <div id="level-hud" class="hud-element">
        <span id="level-text">FASE 1</span>
    </div>

    <!-- BOTÃO PAUSE -->
    <button id="btn-pause" class="hud-element" onclick="togglePause()">|| PAUSE</button>

    <!-- MENU INICIAL -->
    <div id="main-menu" class="menu-screen">
        <h1 class="title">ADVENTURES</h1>
        <button id="btn-play" class="btn-moss" onclick="startGame()">PLAY</button>
        <button id="btn-fases" class="btn-moss" onclick="showLevels()">FASES</button>
    </div>

    <!-- MENU SELEÇÃO DE FASES -->
    <div id="levels-menu" class="menu-screen">
        <h1 class="title" id="select-level-title">FASES</h1>
        <div class="levels-grid" id="levels-grid"></div>
        <button id="btn-back" class="btn-moss btn-back" onclick="hideLevels()">VOLTAR</button>
    </div>

    <!-- MENU PAUSE -->
    <div id="pause-menu" class="menu-screen">
        <h1 class="title" id="pause-title">PAUSADO</h1>
        <button id="btn-resume" class="btn-moss" onclick="togglePause()">CONTINUAR</button>
        <button id="btn-reset" class="btn-moss" onclick="resetCurrentMatch()">REINICIAR</button>
        <button id="btn-quit" class="btn-moss" onclick="quitToMenu()">MENU</button>
    </div>

    <!-- CONTROLES TOUCH -->
    <div id="touch-controls">
        <div class="touch-group-left">
            <div class="basket-btn" id="btn-left">&lt;</div>
            <div class="basket-btn" id="btn-right">&gt;</div>
        </div>
        <div class="touch-group-right">
            <div class="square-jump-btn" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
/* --- TEXTOS E IDIOMAS --- */
const i18n = {
    pt: {
        play: "PLAY",
        fases: "FASES",
        selectLevel: "SELECIONE A FASE",
        back: "VOLTAR",
        level: "FASE",
        jump: "PULAR",
        win: "FASE CONCLUÍDA!",
        gameover: "VOCÊ MORREU!",
        paused: "PAUSADO",
        resume: "CONTINUAR",
        reset: "REINICIAR",
        quit: "MENU"
    },
    en: {
        play: "PLAY",
        fases: "LEVELS",
        selectLevel: "SELECT LEVEL",
        back: "BACK",
        level: "LEVEL",
        jump: "JUMP",
        win: "LEVEL COMPLETE!",
        gameover: "YOU DIED!",
        paused: "PAUSED",
        resume: "RESUME",
        reset: "RESTART",
        quit: "MENU"
    }
};

let currentLang = 'pt';

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if(lang === 'pt') document.querySelectorAll('.lang-btn')[0].classList.add('active');
    else document.querySelectorAll('.lang-btn')[1].classList.add('active');

    document.getElementById('btn-play').innerText = i18n[lang].play;
    document.getElementById('btn-fases').innerText = i18n[lang].fases;
    document.getElementById('select-level-title').innerText = i18n[lang].selectLevel;
    document.getElementById('btn-back').innerText = i18n[lang].back;
    document.getElementById('btn-jump').innerText = i18n[lang].jump;
    document.getElementById('pause-title').innerText = i18n[lang].paused;
    document.getElementById('btn-resume').innerText = i18n[lang].resume;
    document.getElementById('btn-reset').innerText = i18n[lang].reset;
    document.getElementById('btn-quit').innerText = i18n[lang].quit;
    updateLevelHUD();
}

/* --- MOEDAS, MAÇÃS E PROGRESSO SALVO --- */
let totalCoins = parseInt(localStorage.getItem('adventures_coins')) || 0;
let totalApples = parseInt(localStorage.getItem('adventures_apples')) || 0;
let unlockedLevel = parseInt(localStorage.getItem('adventures_level')) || 1;
let currentLevel = 1;

function updateHUDCounters() {
    document.getElementById('coin-count').innerText = totalCoins;
    document.getElementById('apple-count').innerText = totalApples;
    localStorage.setItem('adventures_coins', totalCoins);
    localStorage.setItem('adventures_apples', totalApples);
}

function saveProgress() {
    localStorage.setItem('adventures_coins', totalCoins);
    localStorage.setItem('adventures_apples', totalApples);
    if (currentLevel >= unlockedLevel && unlockedLevel < 20) {
        unlockedLevel = currentLevel + 1;
        localStorage.setItem('adventures_level', unlockedLevel);
    }
}

/* --- CANVAS & ENGINE --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 675;

let isPlaying = false;
let isPaused = false;
let keys = { left: false, right: false, up: false };

// JOGADOR
const player = {
    x: 80,
    y: 300,
    width: 38,
    height: 56,
    vx: 0,
    vy: 0,
    speed: 5.5,
    jumpForce: -13.5,
    gravity: 0.6,
    grounded: false,
    facing: 'right',
    animFrame: 0,
    invincibleTimer: 0 // Tempo de imortalidade por maçã
};

let platforms = [];
let obstacles = [];
let coins = [];
let enemies = [];
let apples = []; 
let particles = [];
let mountains = [];
let flag = null;
let globalTime = 0;

/* --- GERADOR DE FASES --- */
function generateLevel(lvl) {
    platforms = [];
    obstacles = [];
    coins = [];
    enemies = [];
    apples = [];
    particles = [];
    mountains = [];

    platforms.push({ x: 0, y: 500, w: 260, h: 175, type: 'grass' });

    let currentX = 260;
    const levelLength = 25 + lvl * 5;

    let mountainX = -300;
    for (let m = 0; m < levelLength / 2; m++) {
        let mW = 500 + Math.random() * 400;
        let mH = 250 + Math.random() * 150;
        mountains.push({
            x: mountainX,
            y: 580 - mH,
            w: mW,
            h: mH,
            color: m % 2 === 0 ? '#2c3e50' : '#1f2d3d'
        });
        mountainX += mW - 120;
    }

    const slugColors = ['#8e44ad', '#e74c3c', '#2980b9'];

    for (let i = 0; i < levelLength; i++) {
        let gap = 80 + Math.random() * 70 + (lvl * 2);
        currentX += gap;

        let platWidth = Math.max(160, 280 - lvl * 4 + Math.random() * 60);
        let platY = 380 + Math.random() * 130;

        platforms.push({ x: currentX, y: platY, w: platWidth, h: 675 - platY, type: 'grass' });

        // MAÇÃS NO MAPA
        if (i > 0 && Math.random() < 0.35) {
            apples.push({
                x: currentX + platWidth / 2 - 12,
                baseY: platY - 45,
                y: platY - 45,
                w: 24,
                h: 24,
                eaten: false,
                floatOffset: Math.random() * Math.PI * 2
            });
        }

        // OBSTÁCULOS
        if (Math.random() > 0.45) {
            let obsType = Math.random() > 0.5 ? 'stone' : 'trunk';
            let obsW = obsType === 'stone' ? 36 : 50;
            let obsH = obsType === 'stone' ? 32 : 28;
            
            obstacles.push({
                x: currentX + platWidth / 2 - obsW / 2,
                y: platY - obsH,
                w: obsW,
                h: obsH,
                type: obsType
            });
        }

        // LESMAS
        if (i > 0 && Math.random() > 0.3) {
            let randomColor = slugColors[Math.floor(Math.random() * slugColors.length)];
            enemies.push({
                x: currentX + 20,
                y: platY - 24,
                w: 38,
                h: 24,
                vx: 1.3,
                hp: 2,
                platMin: currentX,
                platMax: currentX + platWidth,
                animTimer: 0,
                color: randomColor
            });
        }

        // TRONCO FLUTUANTE
        if (gap > 110 && Math.random() > 0.3) {
            let logX = currentX - gap / 2 - 30;
            let logY = 500;
            platforms.push({ x: logX, y: logY, w: 65, h: 22, type: 'floating_wood' });
        }

        // MOEDAS
        let coinsInPlat = 1 + Math.floor(Math.random() * 3);
        for (let c = 0; c < coinsInPlat; c++) {
            coins.push({
                x: currentX + 25 + (c * 35),
                y: platY - 50 - (Math.random() * 30),
                w: 28,
                h: 28,
                collected: false
            });
        }

        currentX += platWidth;
    }

    currentX += 100;
    platforms.push({ x: currentX, y: 480, w: 280, h: 200, type: 'grass' });
    flag = { x: currentX + 180, y: 380, w: 20, h: 100 };

    player.x = 80;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
    player.invincibleTimer = 0;
}

function spawnSmoke(x, y, color = '#bdc3c7') {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x + Math.random() * 20 - 10,
            y: y + Math.random() * 10,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 2 - 1,
            size: 6 + Math.random() * 8,
            alpha: 1,
            color: color
        });
    }
}

let cameraX = 0;

function update() {
    if (!isPlaying || isPaused) return;

    globalTime += 0.05;

    // Reduz Imortalidade
    if (player.invincibleTimer > 0) {
        player.invincibleTimer -= 1 / 60;
        if (Math.random() < 0.4) {
            particles.push({
                x: player.x + Math.random() * player.width,
                y: player.y + Math.random() * player.height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -Math.random() * 2,
                size: 4 + Math.random() * 4,
                alpha: 1,
                color: '#ffd700'
            });
        }
    }

    // Movimento do Jogador
    if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.animFrame += 0.25;
    } else if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.animFrame += 0.25;
    } else {
        player.vx = 0;
        player.animFrame = 0;
    }

    if (keys.up && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
    }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Colisão com Plataformas
    player.grounded = false;
    for (let p of platforms) {
        if (
            player.x < p.x + p.w &&
            player.x + player.width > p.x &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.h + player.vy + 4 &&
            player.vy >= 0
        ) {
            player.grounded = true;
            player.vy = 0;
            player.y = p.y - player.height;
        }
    }

    // COLETA DE MAÇÃ -> DOURADO & IMORTAL POR 7 SEGUNDOS
    for (let apple of apples) {
        if (!apple.eaten) {
            apple.y = apple.baseY + Math.sin(globalTime * 2.5 + apple.floatOffset) * 8;

            if (
                player.x < apple.x + apple.w &&
                player.x + player.width > apple.x &&
                player.y < apple.y + apple.h &&
                player.y + player.height > apple.y
            ) {
                apple.eaten = true;
                totalApples += 1;
                player.invincibleTimer = 7; // 7 segundos de imortalidade
                updateHUDCounters();
                spawnSmoke(apple.x + 12, apple.y + 12, '#ffd700');
            }
        }
    }

    // Obstáculos
    for (let obs of obstacles) {
        if (
            player.x < obs.x + obs.w &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.h &&
            player.y + player.height > obs.y
        ) {
            if (player.vx > 0 && player.x + player.width - player.vx <= obs.x) {
                player.x = obs.x - player.width;
            } else if (player.vx < 0 && player.x - player.vx >= obs.x + obs.w) {
                player.x = obs.x + obs.w;
            } else if (player.vy > 0 && player.y + player.height - player.vy <= obs.y) {
                player.grounded = true;
                player.vy = 0;
                player.y = obs.y - player.height;
            }
        }
    }

    // LESMAS
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x += e.vx;
        e.animTimer += 0.15;

        if (e.x <= e.platMin || e.x + e.w >= e.platMax) {
            e.vx *= -1;
        }

        if (
            player.x < e.x + e.w &&
            player.x + player.width > e.x &&
            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ) {
            // Se pular na cabeça OU estiver IMORTAL
            if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
                player.vy = -9;
                e.hp -= 1;

                if (e.hp === 1) {
                    e.h = 16;
                    e.y += 8;
                } else if (e.hp <= 0) {
                    spawnSmoke(e.x + e.w / 2, e.y + e.h / 2);
                    coins.push({ x: e.x + 5, y: e.y - 10, w: 28, h: 28, collected: false });
                    enemies.splice(i, 1);
                    continue;
                }
            } else if (player.invincibleTimer > 0) {
                // Se tocar na lesma estando imortal, mata a lesma direto
                spawnSmoke(e.x + e.w / 2, e.y + e.h / 2, '#ffd700');
                coins.push({ x: e.x + 5, y: e.y - 10, w: 28, h: 28, collected: false });
                enemies.splice(i, 1);
            } else {
                alert(i18n[currentLang].gameover);
                generateLevel(currentLevel);
                return;
            }
        }
    }

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.size += 0.1;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    // Coleta Moedas
    for (let coin of coins) {
        if (!coin.collected &&
            player.x < coin.x + coin.w &&
            player.x + player.width > coin.x &&
            player.y < coin.y + coin.h &&
            player.y + player.height > coin.y) {
            coin.collected = true;
            totalCoins += 10;
            updateHUDCounters();
        }
    }

    // Câmera
    cameraX = player.x - 200;
    if (cameraX < 0) cameraX = 0;

    // Queda
    if (player.y > canvas.height) {
        alert(i18n[currentLang].gameover);
        generateLevel(currentLevel);
    }

    // Vitória
    if (flag && player.x > flag.x) {
        saveProgress();
        alert(i18n[currentLang].win);
        if (currentLevel < 20) {
            currentLevel++;
            updateLevelHUD();
            generateLevel(currentLevel);
        } else {
            showMainMenu();
        }
    }
}

/* --- RENDERIZAÇÃO GRÁFICA --- */
function render() {
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#2c3e50');
    skyGradient.addColorStop(1, '#516b8b');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // MONTANHAS
    for (let m of mountains) {
        let mParallaxX = m.x - (cameraX * 0.25);
        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.moveTo(mParallaxX, m.y + m.h);
        ctx.lineTo(mParallaxX + m.w / 2, m.y);
        ctx.lineTo(mParallaxX + m.w, m.y + m.h);
        ctx.fill();

        ctx.fillStyle = '#ecf0f1';
        ctx.beginPath();
        ctx.moveTo(mParallaxX + m.w / 2 - 35, m.y + 45);
        ctx.lineTo(mParallaxX + m.w / 2, m.y);
        ctx.lineTo(mParallaxX + m.w / 2 + 35, m.y + 45);
        ctx.fill();
    }

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Rio
    ctx.fillStyle = '#1e73be';
    ctx.fillRect(cameraX, 580, canvas.width, 100);

    // PLATAFORMAS (TEXTURA IGUAL A ANTES)
    const BLOCK_SIZE = 20;
    for (let p of platforms) {
        if (p.type === 'grass') {
            for (let bx = p.x; bx < p.x + p.w; bx += BLOCK_SIZE) {
                let bw = Math.min(BLOCK_SIZE, p.x + p.w - bx);
                for (let by = p.y + 16; by < p.y + p.h; by += BLOCK_SIZE) {
                    let bh = Math.min(BLOCK_SIZE, p.y + p.h - by);
                    let isDark = ((Math.floor(bx/BLOCK_SIZE) + Math.floor(by/BLOCK_SIZE)) % 2 === 0);
                    ctx.fillStyle = isDark ? '#73462c' : '#5c3520';
                    ctx.fillRect(bx, by, bw, bh);
                }
            }

            ctx.fillStyle = '#47a025';
            ctx.fillRect(p.x, p.y, p.w, 16);
            ctx.fillStyle = '#5bc22e';
            ctx.fillRect(p.x, p.y, p.w, 5);
        } else if (p.type === 'floating_wood') {
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(p.x, p.y, 4, p.h);
            ctx.fillRect(p.x + p.w - 4, p.y, 4, p.h);
        }
    }

    // MAÇÃ VERMELHA
    for (let apple of apples) {
        if (!apple.eaten) {
            let ax = apple.x;
            let ay = apple.y;

            ctx.fillStyle = '#ff4757';
            ctx.fillRect(ax + 4, ay + 4, 16, 16);
            ctx.fillRect(ax + 6, ay + 2, 12, 20);
            ctx.fillRect(ax + 2, ay + 6, 20, 12);

            ctx.fillStyle = '#ff6b81';
            ctx.fillRect(ax + 6, ay + 6, 4, 4);

            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(ax + 11, ay - 2, 3, 4);
            ctx.fillRect(ax + 14, ay - 2, 4, 3);
        }
    }

    // OBSTÁCULOS
    for (let obs of obstacles) {
        if (obs.type === 'stone') {
            ctx.fillStyle = '#636e72';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#b2bec3';
            ctx.fillRect(obs.x, obs.y, obs.w, 5);
        } else {
            ctx.fillStyle = '#6e473b';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#d7ccc8';
            ctx.fillRect(obs.x + 2, obs.y + 2, 6, obs.h - 4);
        }
    }

    // LESMAS
    for (let e of enemies) {
        let bounce = Math.sin(e.animTimer * 5) * 2;
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y + bounce, e.w, e.h - bounce);

        ctx.fillStyle = '#fff';
        let eyeX = e.vx > 0 ? e.x + e.w - 10 : e.x + 4;
        ctx.fillRect(eyeX, e.y + 4 + bounce, 6, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(eyeX + (e.vx > 0 ? 3 : 0), e.y + 6 + bounce, 3, 3);
    }

    // MOEDAS
    for (let coin of coins) {
        if (!coin.collected) {
            let cx = coin.x;
            let cy = coin.y;
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(cx + 4, cy + 4, 20, 20);
            ctx.fillStyle = '#fff';
            ctx.fillRect(cx + 6, cy + 6, 4, 4);
        }
    }

    // PARTÍCULAS
    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
    }

    // BANDEIRA
    if (flag) {
        ctx.fillStyle = '#bdc3c7';
        ctx.fillRect(flag.x, flag.y, 6, flag.h);
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.moveTo(flag.x + 6, flag.y);
        ctx.lineTo(flag.x + 48, flag.y + 20);
        ctx.lineTo(flag.x + 6, flag.y + 40);
        ctx.fill();
    }

    // DESENHAR PERSONAGEM
    let px = player.x;
    let py = player.y;
    let legAnim = Math.sin(player.animFrame * 2) * 6;
    let isGolden = player.invincibleTimer > 0;

    // AURÉOLA/BRILHO DOURADO QUANDO IMORTAL
    if (isGolden) {
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.strokeRect(px - 4, py - 4, player.width + 8, player.height + 8);
    }

    // Cabelo Marrom
    ctx.fillStyle = isGolden ? '#ffee55' : '#5d4037';
    ctx.fillRect(px + 4, py, 30, 16);

    // Rosto
    ctx.fillStyle = isGolden ? '#ffea00' : '#ffdbac';
    ctx.fillRect(px + 6, py + 12, 26, 12);

    // Olhos
    ctx.fillStyle = '#000';
    let eyeX = player.facing === 'right' ? px + 22 : px + 8;
    ctx.fillRect(eyeX, py + 16, 4, 4);

    // Tronco (Camisa)
    ctx.fillStyle = isGolden ? '#ffaa00' : '#e74c3c';
    ctx.fillRect(px + 4, py + 24, 30, 20);

    // Braços
    ctx.fillStyle = isGolden ? '#ffea00' : '#ffdbac';
    if (player.facing === 'right') {
        ctx.fillRect(px, py + 26 - legAnim, 5, 14);
        ctx.fillRect(px + 33, py + 26 + legAnim, 5, 14);
    } else {
        ctx.fillRect(px, py + 26 + legAnim, 5, 14);
        ctx.fillRect(px + 33, py + 26 - legAnim, 5, 14);
    }

    // Calça
    ctx.fillStyle = isGolden ? '#ff8800' : '#2980b9';
    ctx.fillRect(px + 6 - legAnim / 2, py + 44, 10, 10);
    ctx.fillRect(px + 22 + legAnim / 2, py + 44, 10, 10);

    // Sapatos
    ctx.fillStyle = '#34495e';
    ctx.fillRect(px + 4 - legAnim / 2, py + 53, 12, 3);
    ctx.fillRect(px + 22 + legAnim / 2, py + 53, 12, 3);

    ctx.restore();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

/* --- PAUSE E MENUS --- */
function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
}

function resetCurrentMatch() {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
    generateLevel(currentLevel);
}

function quitToMenu() {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
    showMainMenu();
}

function updateLevelHUD() {
    document.getElementById('level-text').innerText = `${i18n[currentLang].level} ${currentLevel}`;
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    isPlaying = true;
    isPaused = false;
    generateLevel(currentLevel);
}

function showLevels() {
    document.getElementById('main-menu').style.display = 'none';
    const grid = document.getElementById('levels-grid');
    grid.innerHTML = '';

    for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${i <= unlockedLevel ? 'unlocked' : ''}`;
        btn.innerText = i;
        if (i <= unlockedLevel) {
            btn.onclick = () => {
                currentLevel = i;
                updateLevelHUD();
                document.getElementById('levels-menu').style.display = 'none';
                startGame();
            };
        }
        grid.appendChild(btn);
    }

    document.getElementById('levels-menu').style.display = 'flex';
}

function hideLevels() {
    document.getElementById('levels-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function showMainMenu() {
    isPlaying = false;
    isPaused = false;
    document.getElementById('main-menu').style.display = 'flex';
}

/* --- EVENTOS DE CONTROLE --- */
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = false;
});

function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    el.addEventListener('mousedown', () => { keys[keyProp] = true; });
    el.addEventListener('mouseup', () => { keys[keyProp] = false; });
}

bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'up');

updateHUDCounters();
setLanguage('pt');
requestAnimationFrame(gameLoop);

</script>
