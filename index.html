<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Porsche Drift - Roblox Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; touch-action: none; }
  #canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: fixed; top: 10px; left: 10px; color: #fff; font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px;
    pointer-events: none; z-index: 10; line-height: 1.5;
  }
  #hud b { color: #4fc3f7; }

  /* Controles mobile */
  .controls { position: fixed; z-index: 20; user-select: none; }
  .btn {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold;
    backdrop-filter: blur(4px);
    transition: background 0.1s;
  }
  .btn:active, .btn.active { background: rgba(79,195,247,0.6); }

  /* Direcionais (esquerda) */
  #dpad { bottom: 20px; left: 20px; width: 180px; height: 180px; position: fixed; }
  #dpad .btn { position: absolute; width: 60px; height: 60px; }
  #up    { top: 0; left: 60px; }
  #down  { bottom: 0; left: 60px; }
  #left  { top: 60px; left: 0; }
  #right { top: 60px; right: 0; }

  /* Ações (direita) */
  #actions { bottom: 20px; right: 20px; width: 200px; height: 200px; position: fixed; }
  #actions .btn { position: absolute; }
  #gas    { bottom: 0; right: 0; width: 80px; height: 80px; font-size: 16px; background: rgba(76,175,80,0.3); }
  #brake  { bottom: 90px; right: 0; width: 80px; height: 80px; font-size: 16px; background: rgba(244,67,54,0.3); }
  #hand   { bottom: 40px; right: 90px; width: 80px; height: 80px; font-size: 14px; background: rgba(255,152,0,0.3); }
  #cam    { top: 0; right: 0; width: 60px; height: 60px; font-size: 12px; background: rgba(156,39,176,0.3); }

  /* Botão reset */
  #reset {
    position: fixed; top: 10px; right: 10px; z-index: 20;
    width: 50px; height: 50px; font-size: 20px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  /* Desktop: esconde controles touch */
  @media (min-width: 900px) and (hover: hover) {
    #dpad, #actions { opacity: 0.35; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <div><b>WASD</b> / Setas — Dirigir</div>
  <div><b>Espaço</b> — Freio de mão (drift)</div>
  <div><b>C</b> — Trocar câmera</div>
  <div><b>R</b> — Resetar</div>
  <div id="speedInfo">Vel: 0 km/h</div>
</div>

<button id="reset" onclick="resetCar()">⟳</button>

<!-- D-Pad -->
<div id="dpad" class="controls">
  <div class="btn" id="up"    data-key="w">▲</div>
  <div class="btn" id="left"  data-key="a">◀</div>
  <div class="btn" id="down"  data-key="s">▼</div>
  <div class="btn" id="right" data-key="d">▶</div>
</div>

<!-- Ações -->
<div id="actions" class="controls">
  <div class="btn" id="cam"   data-key="c">📷</div>
  <div class="btn" id="hand"  data-key=" ">DRIFT</div>
  <div class="btn" id="brake" data-key="s">FREIO</div>
  <div class="btn" id="gas"   data-key="w">GÁS</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   SETUP BÁSICO
============================================================ */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 250);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);

/* ============================================================
   ILUMINAÇÃO
============================================================ */
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
sun.shadow.camera.far = 300;
scene.add(sun);

/* ============================================================
   BASE PLATE (estilo Roblox)
============================================================ */
const PLATE_SIZE = 200;
const plateGeo = new THREE.BoxGeometry(PLATE_SIZE, 2, PLATE_SIZE);
const plateMat = new THREE.MeshLambertMaterial({ color: 0x5a9e3f });
const plate = new THREE.Mesh(plateGeo, plateMat);
plate.position.y = -1;
plate.receiveShadow = true;
scene.add(plate);

// Grade (linhas de studs estilo Roblox)
const gridHelper = new THREE.GridHelper(PLATE_SIZE, PLATE_SIZE/2, 0x3d7a2a, 0x3d7a2a);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// Céu ao redor (paredes invisíveis não, mas blocos decorativos)
for (let i = 0; i < 25; i++) {
  const size = 4 + Math.random() * 8;
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(size, size, size),
    new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.6, 0.6) })
  );
  const edge = PLATE_SIZE/2 - 5;
  box.position.set(
    (Math.random() - 0.5) * PLATE_SIZE * 0.9,
    size/2,
    (Math.random() - 0.5) * PLATE_SIZE * 0.9
  );
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
}

/* ============================================================
   PORSCHE (modelo low-poly construído com primitivas)
============================================================ */
const car = new THREE.Group();
scene.add(car);

const bodyColor = 0xd50000; // vermelho Porsche

// Corpo principal
const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.6, roughness: 0.3 });
const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.55, 4.4), bodyMat);
body.position.y = 0.7;
body.castShadow = true;
car.add(body);

// Capô dianteiro mais baixo
const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.25, 1.4), bodyMat);
hood.position.set(0, 0.62, -1.6);
hood.castShadow = true;
car.add(hood);

// Teto / cabine
const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.7, 0.55, 2.0),
  new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.7, roughness: 0.2 })
);
cabin.position.set(0, 1.2, 0.15);
cabin.castShadow = true;
car.add(cabin);

// Para-brisa inclinado
const windshield = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 0.05, 0.9),
  new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.85 })
);
windshield.position.set(0, 1.1, -0.9);
windshield.rotation.x = -0.5;
car.add(windshield);

// Traseira (motor)
const rear = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.4, 1.0), bodyMat);
rear.position.set(0, 0.75, 1.9);
rear.castShadow = true;
car.add(rear);

// Spoiler
const spoiler = new THREE.Mesh(
  new THREE.BoxGeometry(1.9, 0.08, 0.35),
  new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.5, roughness: 0.5 })
);
spoiler.position.set(0, 1.15, 2.1);
car.add(spoiler);
const spoilerL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.1), spoiler.material);
spoilerL.position.set(-0.8, 0.98, 2.1);
car.add(spoilerL);
const spoilerR = spoilerL.clone();
spoilerR.position.x = 0.8;
car.add(spoilerR);

// Faróis
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffff88, emissiveIntensity: 0.8 });
[-0.65, 0.65].forEach(x => {
  const hl = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.2, 0.1), headMat);
  hl.position.set(x, 0.72, -2.15);
  car.add(hl);
});

// Lanternas traseiras
const tailMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.6 });
[-0.7, 0.7].forEach(x => {
  const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.08), tailMat);
  tl.position.set(x, 0.8, 2.42);
  car.add(tl);
});

// Rodas
const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 20);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.2 });

const wheels = [];
const wheelPositions = [
  [-0.95, 0.42, -1.5],  // frente esquerda
  [ 0.95, 0.42, -1.5],  // frente direita
  [-0.95, 0.42,  1.5],  // trás esquerda
  [ 0.95, 0.42,  1.5],  // trás direita
];

wheelPositions.forEach(([x, y, z], i) => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI / 2;
  w.position.set(x, y, z);
  w.castShadow = true;
  car.add(w);

  // Aro
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.34, 12), rimMat);
  rim.rotation.z = Math.PI / 2;
  rim.position.set(x, y, z);
  car.add(rim);

  wheels.push({ mesh: w, rim, isFront: i < 2, side: i % 2 === 0 ? 1 : -1 });
});

car.position.set(0, 0, 0);

/* ============================================================
   FÍSICA DO CARRO (simples arcade)
============================================================ */
const carState = {
  pos: new THREE.Vector3(0, 0, 0),
  velocity: new THREE.Vector3(0, 0, 0),
  angle: 0,           // rotação Y (radianos)
  angularVel: 0,
  speed: 0,
  steer: 0,           // -1 a 1
  handbrake: false,
  drifting: false,
  driftFactor: 0,
};

const MAX_SPEED = 45;
const ACCEL = 28;
const BRAKE = 40;
const FRICTION = 1.8;
const TURN_SPEED = 2.2;
const HANDBRAKE_FRICTION = 0.6;

/* ============================================================
   INPUT
============================================================ */
const keys = {};
const mobileKeys = {};

function setKey(k, v) { keys[k.toLowerCase()] = v; }

window.addEventListener('keydown', e => {
  setKey(e.key, true);
  if (e.key === ' ') e.preventDefault();
  if (e.key.toLowerCase() === 'c') toggleCamera();
  if (e.key.toLowerCase() === 'r') resetCar();
});
window.addEventListener('keyup', e => setKey(e.key, false));

// Controles touch
document.querySelectorAll('[data-key]').forEach(btn => {
  const key = btn.dataset.key;
  const press = (e) => { e.preventDefault(); mobileKeys[key] = true; btn.classList.add('active'); if (key === 'c') toggleCamera(); };
  const release = (e) => { e.preventDefault(); mobileKeys[key] = false; btn.classList.remove('active'); };

  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

function isPressed(...ks) {
  return ks.some(k => keys[k] || mobileKeys[k]);
}

/* ============================================================
   CÂMERA
============================================================ */
let cameraMode = 0; // 0 = terceira pessoa, 1 = primeira pessoa
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3(0, 5, 10);

function toggleCamera() {
  cameraMode = (cameraMode + 1) % 2;
}

function updateCamera(dt) {
  const carPos = carState.pos;
  const forward = new THREE.Vector3(Math.sin(carState.angle), 0, Math.cos(carState.angle));

  if (cameraMode === 1) {
    // Primeira pessoa
    const offset = forward.clone().multiplyScalar(0.4);
    const targetPos = carPos.clone().add(offset).add(new THREE.Vector3(0, 1.35, 0));
    camPos.lerp(targetPos, 0.5);
    camera.position.copy(camPos);
    const lookAt = carPos.clone().add(forward.clone().multiplyScalar(20)).add(new THREE.Vector3(0, 1.2, 0));
    camera.lookAt(lookAt);
    camera.fov = 75;
  } else {
    // Terceira pessoa
    const back = forward.clone().multiplyScalar(-9);
    const targetPos = carPos.clone().add(back).add(new THREE.Vector3(0, 4.5, 0));
    camPos.lerp(targetPos, 0.12);
    camera.position.copy(camPos);
    camTarget.lerp(carPos.clone().add(new THREE.Vector3(0, 1, 0)), 0.2);
    camera.lookAt(camTarget);
    camera.fov = 65;
  }
  camera.updateProjectionMatrix();
}

/* ============================================================
   FÍSICA
============================================================ */
function updatePhysics(dt) {
  const throttle = isPressed('w', 'arrowup') ? 1 : 0;
  const brake = isPressed('s', 'arrowdown') ? 1 : 0;
  const left = isPressed('a', 'arrowleft') ? 1 : 0;
  const right = isPressed('d', 'arrowright') ? 1 : 0;
  const handbrake = isPressed(' ', 'spacebar') || mobileKeys[' '];

  carState.handbrake = handbrake;

  // Direção
  let steerInput = (right - left);
  carState.steer += (steerInput - carState.steer) * 0.15;

  // Aceleração
  const forward = new THREE.Vector3(Math.sin(carState.angle), 0, Math.cos(carState.angle));
  const speed = carState.velocity.length();

  if (throttle) {
    carState.velocity.add(forward.clone().multiplyScalar(ACCEL * dt));
  }
  if (brake) {
    const backDir = forward.clone().negate();
    // Se estiver indo pra frente, freia; senão, dá ré
    if (carState.velocity.dot(forward) > 0.5) {
      carState.velocity.add(forward.clone().multiplyScalar(-BRAKE * dt));
    } else {
      carState.velocity.add(backDir.multiplyScalar(ACCEL * 0.5 * dt));
    }
  }

  // Atrito
  let friction = FRICTION;
  if (handbrake) friction = HANDBRAKE_FRICTION;
  if (!throttle && !brake) {
    carState.velocity.multiplyScalar(Math.max(0, 1 - friction * dt));
  } else {
    carState.velocity.multiplyScalar(Math.max(0, 1 - 0.3 * dt));
  }

  // Limite de velocidade
  const currentSpeed = carState.velocity.length();
  if (currentSpeed > MAX_SPEED) {
    carState.velocity.multiplyScalar(MAX_SPEED / currentSpeed);
  }

  // Rotação (depende da velocidade pra ser mais realista)
  const speedFactor = Math.min(1, currentSpeed / 15);
  const turnRate = TURN_SPEED * speedFactor * carState.steer;
  
  // Se estiver com freio de mão, gira mais rápido (drift)
  const driftMultiplier = handbrake ? 1.8 : 1.0;
  
  // Direção invertida quando dá ré
  const direction = carState.velocity.dot(forward) < -0.5 ? -1 : 1;
  carState.angularVel = turnRate * direction * driftMultiplier;

  carState.angle += carState.angularVel * dt;

  // Aplicar movimento
  carState.pos.add(carState.velocity.clone().multiplyScalar(dt));

  // Limites da base plate
  const limit = PLATE_SIZE / 2 - 3;
  if (Math.abs(carState.pos.x) > limit) {
    carState.pos.x = Math.sign(carState.pos.x) * limit;
    carState.velocity.x *= -0.3;
  }
  if (Math.abs(carState.pos.z) > limit) {
    carState.pos.z = Math.sign(carState.pos.z) * limit;
    carState.velocity.z *= -0.3;
  }

  // Detecção de drift
  carState.drifting = handbrake && currentSpeed > 8;
  if (carState.drifting) {
    carState.driftFactor = Math.min(1, carState.driftFactor + dt * 2);
  } else {
    carState.driftFactor = Math.max(0, carState.driftFactor - dt * 2);
  }

  // Atualizar mesh
  car.position.copy(carState.pos);
  car.rotation.y = carState.angle;

  // Rotação das rodas
  const wheelRot = currentSpeed * dt * 2;
  wheels.forEach(w => {
    w.mesh.rotation.x += wheelRot * (carState.velocity.dot(forward) >= 0 ? 1 : -1);
    w.rim.rotation.x = w.mesh.rotation.x;
    
    // Direção das rodas dianteiras
    if (w.isFront) {
      w.mesh.rotation.y = carState.steer * 0.5;
      w.rim.rotation.y = carState.steer * 0.5;
    }
  });

  // Efeito de inclinação ao virar
  const roll = -carState.steer * speedFactor * 0.08;
  car.rotation.z = roll;

  carState.speed = currentSpeed;
}

/* ============================================================
   RESET
============================================================ */
function resetCar() {
  carState.pos.set(0, 0, 0);
  carState.velocity.set(0, 0, 0);
  carState.angle = 0;
  carState.angularVel = 0;
  carState.steer = 0;
}

/* ============================================================
   LOOP
============================================================ */
let lastTime = performance.now();
const speedInfo = document.getElementById('speedInfo');

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updatePhysics(dt);
  updateCamera(dt);
  renderer.render(scene, camera);

  speedInfo.textContent = `Vel: ${Math.round(carState.speed * 3.6)} km/h${carState.drifting ? ' 🔥 DRIFT' : ''}`;

  requestAnimationFrame(animate);
}

/* ============================================================
   RESIZE
============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Inicia
resetCar();
requestAnimationFrame(animate);
</script>
</body>
</html>
