<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Quebrar Árvore</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 60%, #5d9d4f 60%, #3e6b34 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* HUD Topo */
    .hud {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      z-index: 10;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Área de Jogo */
    .game-area {
      position: relative;
      width: 100%;
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      cursor: pointer;
    }

    /* Árvore */
    .tree-container {
      position: relative;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom center;
      transition: transform 0.05s ease-out;
    }

    .foliage {
      width: 220px;
      height: 220px;
      background: #2e7d32;
      border-radius: 50%;
      box-shadow: inset -20px -20px 0 rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.3);
      position: relative;
      z-index: 2;
      margin-bottom: -50px;
    }

    .foliage::before {
      content: '';
      position: absolute;
      top: -30px;
      left: 30px;
      width: 160px;
      height: 160px;
      background: #388e3c;
      border-radius: 50%;
    }

    .trunk {
      width: 90px;
      height: 280px;
      background: linear-gradient(to right, #5d4037, #8d6e63 40%, #4e342e);
      border-radius: 10px;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.3), 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* Marcas de dano no tronco */
    .crack {
      position: absolute;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      display: none;
    }

    /* Barra de Vida da Árvore */
    .hp-bar-container {
      position: absolute;
      top: -30px;
      width: 140px;
      height: 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid #fff;
    }

    .hp-bar {
      width: 100%;
      height: 100%;
      background: #4caf50;
      border-radius: 6px;
      transition: width 0.1s linear, background-color 0.2s;
    }

    /* Mão do Jogador */
    .fist {
      position: absolute;
      bottom: 80px;
      right: 35%;
      width: 120px;
      height: 120px;
      background: #ffcc80;
      border-radius: 30px;
      border: 4px solid #e65100;
      box-shadow: -10px 10px 0 rgba(0,0,0,0.2);
      z-index: 5;
      transform: rotate(-20deg) scale(1);
      transition: transform 0.08s ease-in-out;
      pointer-events: none;
    }

    .fist.punch {
      transform: translate(-140px, -60px) rotate(-45deg) scale(1.15);
    }

    /* Partículas de Madeira */
    .wood-chip {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #8d6e63;
      border: 1px solid #3e2723;
      border-radius: 2px;
      pointer-events: none;
      z-index: 4;
      animation: fly 0.6s ease-out forwards;
    }

    @keyframes fly {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tw-x), var(--tw-y)) rotate(360deg);
      }
    }

    /* Efeito de Texto Flutuante (+1) */
    .floating-text {
      position: absolute;
      color: #ffd54f;
      font-size: 1.8rem;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      z-index: 6;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
    }

    .instructions {
      margin-bottom: 20px;
      color: #fff;
      font-size: 1.1rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-box">Madeira: <span id="wood-count">0</span> 🪵</div>
    <div class="hud-box">Árvores Destruídas: <span id="trees-destroyed">0</span> 🪓</div>
  </div>

  <div class="game-area" id="game-area">
    <div class="tree-container" id="tree">
      <div class="hp-bar-container">
        <div class="hp-bar" id="hp-bar"></div>
      </div>
      <div class="foliage"></div>
      <div class="trunk" id="trunk">
        <div class="crack" style="top: 30%; left: 20%; width: 50px; height: 8px;"></div>
        <div class="crack" style="top: 50%; left: 10%; width: 60px; height: 12px;"></div>
        <div class="crack" style="top: 70%; left: 30%; width: 40px; height: 10px;"></div>
      </div>
    </div>

    <div class="fist" id="fist"></div>
  </div>

  <div class="instructions">
    Clique ou toque rapidamente na árvore para dar socos!
  </div>

  <script>
    const gameArea = document.getElementById('game-area');
    const tree = document.getElementById('tree');
    const trunk = document.getElementById('trunk');
    const fist = document.getElementById('fist');
    const hpBar = document.getElementById('hp-bar');
    const woodCountEl = document.getElementById('wood-count');
    const treesDestroyedEl = document.getElementById('trees-destroyed');
    const cracks = document.querySelectorAll('.crack');

    let maxHp = 10;
    let currentHp = maxHp;
    let woodCount = 0;
    let treesDestroyed = 0;

    gameArea.addEventListener('click', (e) => {
      punch(e);
    });

    function punch(e) {
      // Animação do soco
      fist.classList.add('punch');
      setTimeout(() => fist.classList.remove('punch'), 80);

      // Agitar a árvore (Efeito de Impacto)
      const shakeX = (Math.random() - 0.5) * 15;
      tree.style.transform = `scale(0.98) translate(${shakeX}px, 5px)`;
      setTimeout(() => {
        tree.style.transform = 'scale(1) translate(0, 0)';
      }, 50);

      // Reduzir Vida
      currentHp--;
      woodCount++;
      woodCountEl.textContent = woodCount;

      // Atualizar Barra de Vida
      const hpPercent = (currentHp / maxHp) * 100;
      hpBar.style.width = `${hpPercent}%`;

      if (hpPercent < 60) hpBar.style.backgroundColor = '#ff9800';
      if (hpPercent < 30) hpBar.style.backgroundColor = '#f44336';

      // Mostrar rachaduras conforme toma dano
      if (currentHp <= 7) cracks[0].style.display = 'block';
      if (currentHp <= 4) cracks[1].style.display = 'block';
      if (currentHp <= 2) cracks[2].style.display = 'block';

      // Criar Efeitos Visuais (Partículas e Texto)
      createWoodChips(e);
      createFloatingText(e);

      // Verificar se a árvore caiu
      if (currentHp <= 0) {
        destroyTree();
      }
    }

    function createWoodChips(e) {
      const rect = trunk.getBoundingClientRect();
      const clickX = e.clientX || (rect.left + rect.width / 2);
      const clickY = e.clientY || (rect.top + rect.height / 2);

      for (let i = 0; i < 6; i++) {
        const chip = document.createElement('div');
        chip.className = 'wood-chip';
        chip.style.left = `${clickX}px`;
        chip.style.top = `${clickY}px`;

        const throwX = (Math.random() - 0.5) * 200 + 'px';
        const throwY = (Math.random() - 0.8) * 150 + 'px';

        chip.style.setProperty('--tw-x', throwX);
        chip.style.setProperty('--tw-y', throwY);

        document.body.appendChild(chip);
        setTimeout(() => chip.remove(), 600);
      }
    }

    function createFloatingText(e) {
      const rect = trunk.getBoundingClientRect();
      const x = e.clientX || (rect.left + rect.width / 2);
      const y = e.clientY || (rect.top + rect.height / 2);

      const text = document.createElement('div');
      text.className = 'floating-text';
      text.textContent = '+1 Madeira';
      text.style.left = `${x - 40}px`;
      text.style.top = `${y - 20}px`;

      document.body.appendChild(text);
      setTimeout(() => text.remove(), 700);
    }

    function destroyTree() {
      treesDestroyed++;
      treesDestroyedEl.textContent = treesDestroyed;

      // Animação de queda
      tree.style.transition = 'transform 0.4s ease-in, opacity 0.4s';
      tree.style.transform = 'rotate(80deg) translateY(100px)';
      tree.style.opacity = '0';

      setTimeout(() => {
        // Resetar árvore
        maxHp = Math.floor(maxHp * 1.1); // Fica levemente mais forte a cada nível
        currentHp = maxHp;
        hpBar.style.width = '100%';
        hpBar.style.backgroundColor = '#4caf50';

        cracks.forEach(c => c.style.display = 'none');

        tree.style.transition = 'none';
        tree.style.transform = 'rotate(0deg) translateY(0px)';
        
        // Efeito de reaparecer
        setTimeout(() => {
          tree.style.transition = 'opacity 0.3s';
          tree.style.opacity = '1';
        }, 50);
      }, 450);
    }
  </script>
</body>
</html>
