<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Desenho</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #e5e7eb;
            --paper-bg: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --text-color: #374151;
            --text-muted: #6b7280;
            --accent: #4b5563;
            --accent-light: #f3f4f6;
            --border-color: rgba(209, 213, 219, 0.8);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Bar Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 10;
            pointer-events: none;
        }

        header > * {
            pointer-events: auto;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* Buttons */
        .btn {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.08);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px 140px 20px;
            position: relative;
        }

        .paper-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            background: var(--paper-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
        }

        /* Paper Pattern Styles */
        .paper-container.grid {
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .paper-container.lines {
            background-image: linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 100% 28px;
        }

        canvas {
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        /* Bottom Floating Tool Dock */
        .dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
            z-index: 20;
            max-width: 95vw;
        }

        .dock-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider {
            width: 1px;
            height: 32px;
            background: var(--border-color);
        }

        /* Tool Items (Pens) */
        .pen-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .pen-tool .pen-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .pen-tool:hover .pen-icon {
            background: rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        .pen-tool.active .pen-icon {
            background: #1f2937;
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .pen-tool .label {
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 2px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .pen-tool.active .label {
            color: #1f2937;
            font-weight: 700;
        }

        /* Swatches Palette */
        .palette {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .swatch:hover {
            transform: scale(1.15);
        }

        .swatch.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 2px #1f2937, 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Custom Color Picker Button */
        .color-picker-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-picker-wrapper:hover {
            transform: scale(1.15);
        }

        .color-picker-wrapper input[type="color"] {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 34px;
            height: 34px;
            opacity: 0;
            cursor: pointer;
        }

        /* Size Control Slider */
        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .size-preview {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .size-dot {
            background-color: #1f2937;
            border-radius: 50%;
            transition: width 0.1s, height 0.1s;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 2px;
            background: #cbd5e1;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1f2937;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Eraser Cursor Indicator */
        .eraser-cursor {
            position: fixed;
            pointer-events: none;
            border: 2px solid #374151;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 100;
        }

        /* Responsive Layout Adjustments */
        @media (max-width: 850px) {
            .dock {
                padding: 8px 12px;
                gap: 10px;
                overflow-x: auto;
                max-width: 98vw;
                justify-content: flex-start;
            }

            .pen-tool .label {
                display: none;
            }

            .size-control {
                display: none;
            }

            .palette {
                gap: 4px;
            }

            .swatch {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Top Bar -->
    <header>
        <div class="logo">
            <i data-lucide="pen-tool" style="width: 18px; height: 18px;"></i>
            <span>Estúdio de Desenho</span>
        </div>

        <div class="header-actions">
            <button class="btn btn-icon" id="btn-undo" title="Desfazer (Ctrl+Z)" disabled>
                <i data-lucide="undo-2" style="width: 16px; height: 16px;"></i>
            </button>
            <button class="btn btn-icon" id="btn-redo" title="Refazer (Ctrl+Y)" disabled>
                <i data-lucide="redo-2" style="width: 16px; height: 16px;"></i>
            </button>
            <button class="btn" id="btn-paper" title="Mudar Fundo">
                <i data-lucide="grid" style="width: 16px; height: 16px;"></i>
                <span id="paper-label">Papel: Liso</span>
            </button>
            <button class="btn" id="btn-clear" title="Limpar Folha">
                <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                <span>Limpar</span>
            </button>
            <button class="btn" id="btn-download" title="Baixar Desenho" style="background: #1f2937; color: #fff;">
                <i data-lucide="download" style="width: 16px; height: 16px;"></i>
                <span>Salvar</span>
            </button>
        </div>
    </header>

    <!-- Canvas Sheet Area -->
    <main>
        <div class="paper-container" id="paper">
            <canvas id="canvas"></canvas>
        </div>
    </main>

    <!-- Bottom Dock Floating Menu -->
    <div class="dock">
        <!-- Tools Section -->
        <div class="dock-section tools">
            <button class="pen-tool active" data-tool="pen" title="Caneta Fina">
                <div class="pen-icon"><i data-lucide="pencil" style="width: 18px; height: 18px;"></i></div>
                <span class="label">Caneta</span>
            </button>
            
            <button class="pen-tool" data-tool="brush" title="Pincel Aquarela">
                <div class="pen-icon"><i data-lucide="brush" style="width: 18px; height: 18px;"></i></div>
                <span class="label">Aquarela</span>
            </button>

            <button class="pen-tool" data-tool="highlighter" title="Marca-Texto">
                <div class="pen-icon"><i data-lucide="highlighter" style="width: 18px; height: 18px;"></i></div>
                <span class="label">Marca-Texto</span>
            </button>

            <button class="pen-tool" data-tool="glow" title="Caneta Suave Iluminada">
                <div class="pen-icon"><i data-lucide="sparkles" style="width: 18px; height: 18px;"></i></div>
                <span class="label">Brilho</span>
            </button>

            <button class="pen-tool" data-tool="rainbow" title="Caneta Arco-Íris Soft">
                <div class="pen-icon"><i data-lucide="palette" style="width: 18px; height: 18px;"></i></div>
                <span class="label">Multicor</span>
            </button>

            <button class="pen-tool" data-tool="eraser" title="Borracha">
                <div class="pen-icon"><i data-lucide="eraser" style="width: 18px; height: 18px;"></i></div>
                <span class="label">Borracha</span>
            </button>
        </div>

        <div class="divider"></div>

        <!-- Color Palette (Soft Natural Tones) -->
        <div class="dock-section">
            <div class="palette" id="palette">
                <div class="swatch active" data-color="#2d3748" style="background: #2d3748;" title="Grafite"></div>
                <div class="swatch" data-color="#1e3a8a" style="background: #1e3a8a;" title="Azul Marinho"></div>
                <div class="swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Azul Pastel"></div>
                <div class="swatch" data-color="#14532d" style="background: #14532d;" title="Verde Floresta"></div>
                <div class="swatch" data-color="#84cc16" style="background: #84cc16;" title="Verde Sálvia"></div>
                <div class="swatch" data-color="#eab308" style="background: #eab308;" title="Amarelo Mostarda"></div>
                <div class="swatch" data-color="#c2410c" style="background: #c2410c;" title="Terracota"></div>
                <div class="swatch" data-color="#8c52ff" style="background: #8c52ff;" title="Roxo Ameixa"></div>
                <div class="color-picker-wrapper" title="Escolher Outra Cor">
                    <input type="color" id="custom-color" value="#2d3748">
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Thickness Slider -->
        <div class="dock-section size-control">
            <div class="size-preview">
                <div class="size-dot" id="size-dot"></div>
            </div>
            <input type="range" id="size-slider" min="1" max="50" value="5">
        </div>
    </div>

    <!-- Custom Cursor for Eraser -->
    <div class="eraser-cursor" id="eraser-cursor"></div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Elements
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const paper = document.getElementById('paper');
        const sizeSlider = document.getElementById('size-slider');
        const sizeDot = document.getElementById('size-dot');
        const customColorInput = document.getElementById('custom-color');
        const eraserCursor = document.getElementById('eraser-cursor');
        
        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const btnClear = document.getElementById('btn-clear');
        const btnPaper = document.getElementById('btn-paper');
        const btnDownload = document.getElementById('btn-download');
        const paperLabel = document.getElementById('paper-label');

        // Drawing State
        let isDrawing = false;
        let currentTool = 'pen';
        let currentColor = '#2d3748';
        let currentSize = 5;
        let points = [];
        let rainbowHue = 0;

        // Undo/Redo History Stack
        let history = [];
        let historyStep = -1;
        const MAX_HISTORY = 30;

        // Paper styles configuration
        const paperStyles = ['plain', 'grid', 'lines'];
        let paperStyleIndex = 0;

        // Setup Canvas Size
        function resizeCanvas() {
            const rect = paper.getBoundingClientRect();
            
            // Create temporary canvas to preserve content on resize
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            if (canvas.width > 0) {
                tempCtx.drawImage(canvas, 0, 0);
            }

            canvas.width = rect.width;
            canvas.height = rect.height;

            // Restore content
            if (tempCanvas.width > 0) {
                ctx.drawImage(tempCanvas, 0, 0);
            } else {
                saveState();
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // History Management
        function saveState() {
            if (historyStep < history.length - 1) {
                history = history.slice(0, historyStep + 1);
            }
            history.push(canvas.toDataURL());
            if (history.length > MAX_HISTORY) {
                history.shift();
            } else {
                historyStep++;
            }
            updateHistoryButtons();
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState(history[historyStep]);
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                restoreState(history[historyStep]);
            }
        }

        function restoreState(dataUrl) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                updateHistoryButtons();
            };
        }

        function updateHistoryButtons() {
            btnUndo.disabled = historyStep <= 0;
            btnRedo.disabled = historyStep >= history.length - 1;
        }

        // Get Event Coordinates
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        // Mouse & Touch Handling
        function startDrawing(e) {
            isDrawing = true;
            const coords = getCoords(e);
            points = [coords];
            
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
            
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const coords = getCoords(e);
            points.push(coords);

            // Update Eraser Cursor Position
            if (currentTool === 'eraser') {
                eraserCursor.style.left = `${e.clientX || e.touches[0].clientX}px`;
                eraserCursor.style.top = `${e.clientY || e.touches[0].clientY}px`;
            }

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Configure Tools Style
            switch (currentTool) {
                case 'pen':
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    ctx.shadowBlur = 0;
                    break;

                case 'brush':
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = currentColor;
                    ctx.globalAlpha = 0.25;
                    ctx.lineWidth = currentSize * 2.5;
                    ctx.shadowBlur = 0;
                    break;

                case 'highlighter':
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.strokeStyle = currentColor;
                    ctx.globalAlpha = 0.4;
                    ctx.lineWidth = currentSize * 3;
                    ctx.lineCap = 'square';
                    break;

                case 'glow':
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    ctx.shadowColor = currentColor;
                    ctx.shadowBlur = currentSize * 1.5;
                    break;

                case 'rainbow':
                    ctx.globalCompositeOperation = 'source-over';
                    rainbowHue = (rainbowHue + 2) % 360;
                    ctx.strokeStyle = `hsl(${rainbowHue}, 65%, 55%)`;
                    ctx.lineWidth = currentSize;
                    ctx.shadowBlur = 0;
                    break;

                case 'eraser':
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = currentSize * 3;
                    break;
            }

            // Smooth Curve Rendering with Midpoints
            if (points.length > 2) {
                const lastTwoPoints = points.slice(-3);
                const xc = (lastTwoPoints[1].x + lastTwoPoints[2].x) / 2;
                const yc = (lastTwoPoints[1].y + lastTwoPoints[2].y) / 2;
                
                ctx.beginPath();
                ctx.moveTo(lastTwoPoints[0].x, lastTwoPoints[0].y);
                ctx.quadraticCurveTo(lastTwoPoints[1].x, lastTwoPoints[1].y, xc, yc);
                ctx.stroke();
            } else if (points.length === 1) {
                ctx.beginPath();
                ctx.arc(coords.x, coords.y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                points = [];
                saveState();
            }
        }

        // Event Listeners for Canvas
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        // Tool Selection Handling
        document.querySelectorAll('.pen-tool').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.pen-tool').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                currentTool = button.dataset.tool;

                // Eraser Indicator Visiblity
                if (currentTool === 'eraser') {
                    canvas.style.cursor = 'none';
                } else {
                    canvas.style.cursor = 'crosshair';
                    eraserCursor.style.display = 'none';
                }
            });
        });

        // Show/Hide Eraser Cursor on Hover
        canvas.addEventListener('mouseenter', () => {
            if (currentTool === 'eraser') eraserCursor.style.display = 'block';
        });
        canvas.addEventListener('mouseleave', () => {
            eraserCursor.style.display = 'none';
        });

        // Color Selection Handling
        document.querySelectorAll('.swatch').forEach(swatch => {
            swatch.addEventListener('click', () => {
                document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                currentColor = swatch.dataset.color;
                updateSizeDot();
            });
        });

        // Custom Color Input
        customColorInput.addEventListener('input', (e) => {
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            currentColor = e.target.value;
            updateSizeDot();
        });

        // Size Slider Control
        sizeSlider.addEventListener('input', (e) => {
            currentSize = e.target.value;
            updateSizeDot();
        });

        function updateSizeDot() {
            sizeDot.style.width = `${Math.max(4, currentSize)}px`;
            sizeDot.style.height = `${Math.max(4, currentSize)}px`;
            sizeDot.style.backgroundColor = currentColor;

            // Update custom eraser cursor size
            eraserCursor.style.width = `${currentSize * 3}px`;
            eraserCursor.style.height = `${currentSize * 3}px`;
        }

        // Paper Pattern Cycle
        btnPaper.addEventListener('click', () => {
            paper.classList.remove(paperStyles[paperStyleIndex]);
            paperStyleIndex = (paperStyleIndex + 1) % paperStyles.length;
            const newStyle = paperStyles[paperStyleIndex];
            
            if (newStyle !== 'plain') {
                paper.classList.add(newStyle);
            }

            const names = { plain: 'Liso', grid: 'Quadriculado', lines: 'Pautado' };
            paperLabel.textContent = `Papel: ${names[newStyle]}`;
        });

        // Action Buttons
        btnUndo.addEventListener('click', undo);
        btnRedo.addEventListener('click', redo);

        btnClear.addEventListener('click', () => {
            if (confirm('Deseja realmente limpar a folha inteira?')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        });

        btnDownload.addEventListener('click', () => {
            // Create off-screen canvas to merge background color with drawing
            const exportCanvas = document.createElement('canvas');
            const exportCtx = exportCanvas.getContext('2d');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;

            // White Background Paper
            exportCtx.fillStyle = '#ffffff';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // Draw content
            exportCtx.drawImage(canvas, 0, 0);

            // Download Trigger
            const link = document.createElement('a');
            link.download = `meu-desenho-${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        // Keyboard Shortcuts (Ctrl+Z, Ctrl+Y)
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                if (e.shiftKey) redo();
                else undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                redo();
            }
        });

        // Initialize setup
        resizeCanvas();
        updateSizeDot();
    </script>
</body>
</html>
