<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TOKYO DRIFT - Dodge Charger 1970</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', Arial, sans-serif; touch-action: none; }
  #canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 10px; left: 10px; color: #fff; font-size: 12px;
    background: rgba(0,0,0,0.65); padding: 10px 14px; border-radius: 10px;
    pointer-events: none; z-index: 10; line-height: 1.5;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,100,0,0.3);
    text-shadow: 0 0 8px rgba(255,100,0,0.5);
  }
  #hud b { color: #ff6b00; font-weight: 900; letter-spacing: 0.5px; }
  #speedInfo { margin-top: 6px; color: #ffcc00; font-weight: 900; font-size: 14px; text-shadow: 0 0 10px rgba(255,204,0,0.8); }

  /* Drift score — grande, no topo centro */
  #driftScore {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 42px; font-weight: 900;
    text-shadow: 0 0 20px #ff6b00, 0 0 40px #ff0000, 3px 3px 0 #000;
    pointer-events: none; z-index: 15;
    font-family: 'Impact', 'Arial Black', sans-serif;
    letter-spacing: 2px; opacity: 0;
    transition: opacity 0.3s;
    font-style: italic;
    -webkit-text-stroke: 1px #000;
  }
  #driftScore.active { opacity: 1; animation: pulse 0.3s ease-out; }
  #driftScore.combo { color: #ffcc00; text-shadow: 0 0 25px #ff0000, 0 0 50px #ff6600, 3px 3px 0 #000; }

  @keyframes pulse {
    0% { transform: translateX(-50%) scale(1.3); }
    100% { transform: translateX(-50%) scale(1); }
  }

  #comboText {
    position: fixed; top: 120px; left: 50%; transform: translateX(-50%);
    color: #ffcc00; font-size: 22px; font-weight: 900;
    text-shadow: 0 0 15px #ff0000, 2px 2px 0 #000;
    pointer-events: none; z-index: 15;
    font-style: italic; opacity: 0;
    transition: opacity 0.3s;
  }
  #comboText.active { opacity: 1; }

  .controls { position: fixed; z-index: 20; user-select: none; }
  .btn {
    background: linear-gradient(180deg, rgba(30,30,30,0.85) 0%, rgba(10,10,10,0.9) 100%);
    border: 2px solid rgba(255,107,0,0.6);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900;
    backdrop-filter: blur(8px);
    transition: all 0.08s;
    text-shadow: 0 0 8px rgba(255,107,0,0.7);
    box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 -3px 10px rgba(0,0,0,0.5), 0 0 12px rgba(255,107,0,0.2);
    border-radius: 10px;
  }
  .btn:active, .btn.active {
    background: linear-gradient(180deg, rgba(255,107,0,0.9) 0%, rgba(200,50,0,0.95) 100%);
    transform: scale(0.93);
    box-shadow: 0 2px 6px rgba(255,107,0,0.9), inset 0 0 15px rgba(255,255,255,0.3), 0 0 25px rgba(255,107,0,0.9);
  }

  #dpad { bottom: 20px; left: 20px; width: 200px; height: 200px; position: fixed; }
  #dpad .btn { position: absolute; width: 62px; height: 62px; }
  #up    { top: 0; left: 69px; }
  #down  { bottom: 0; left: 69px; }
  #left  { top: 69px; left: 0; }
  #right { top: 69px; right: 0; }

  #gearbox {
    position: fixed; left: 20px; bottom: 240px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px;
    user-select: none;
  }
  #gearbox .btn {
    position: static;
    width: 62px; height: 62px;
    font-size: 26px;
    border-radius: 10px;
  }
  #gearUp   { color: #4fc3f7; border-color: rgba(79,195,247,0.6); text-shadow: 0 0 8px rgba(79,195,247,0.7); }
  #gearDown { color: #ff8a65; border-color: rgba(255,138,101,0.6); text-shadow: 0 0 8px rgba(255,138,101,0.7); }
  #gearLabel {
    text-align: center; color: #ffcc00; font-weight: 900; font-size: 18px;
    background: rgba(0,0,0,0.85); padding: 4px 0; border-radius: 10px;
    font-family: monospace; letter-spacing: 1px;
    border: 1px solid rgba(255,107,0,0.5);
    width: 62px; height: 36px; line-height: 30px;
    text-shadow: 0 0 10px rgba(255,204,0,0.8);
  }

  #actions { bottom: 20px; right: 20px; width: 220px; height: 220px; position: fixed; }
  #actions .btn { position: absolute; }
  #gas    { bottom: 0; right: 0; width: 88px; height: 88px; font-size: 15px; background: linear-gradient(180deg, rgba(30,140,40,0.85) 0%, rgba(10,60,15,0.95) 100%); border-color: rgba(120,255,120,0.7); border-radius: 14px; }
  #brake  { bottom: 98px; right: 0; width: 84px; height: 84px; font-size: 14px; background: linear-gradient(180deg, rgba(180,20,20,0.85) 0%, rgba(80,0,0,0.95) 100%); border-color: rgba(255,80,80,0.7); border-radius: 14px; }
  #hand   { bottom: 44px; right: 98px; width: 84px; height: 84px; font-size: 12px; background: linear-gradient(180deg, rgba(230,81,0,0.85) 0%, rgba(120,30,0,0.95) 100%); border-color: rgba(255,183,77,0.9); letter-spacing: 1px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 20px rgba(255,107,0,0.5); }
  #cam    { top: 0; right: 0; width: 58px; height: 58px; font-size: 20px; background: linear-gradient(180deg, rgba(106,27,154,0.85) 0%, rgba(50,10,80,0.95) 100%); border-color: rgba(186,104,200,0.7); border-radius: 12px; }

  #reset {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    width: 48px; height: 48px; font-size: 20px;
    background: rgba(20,20,20,0.7);
    border: 2px solid rgba(255,107,0,0.6);
    border-radius: 12px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  #reset:active { transform: scale(0.92); }

  #gearBig {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #ffcc00; font-weight: 900; font-size: 22px;
    background: rgba(0,0,0,0.75); padding: 6px 18px; border-radius: 8px;
    border: 1px solid rgba(255,107,0,0.5); z-index: 10;
    letter-spacing: 2px; font-family: monospace;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(255,204,0,0.9);
  }
  #rpm {
    position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 10px; background: rgba(0,0,0,0.75);
    border-radius: 5px; z-index: 10; overflow: hidden;
    border: 1px solid rgba(255,107,0,0.4);
    pointer-events: none;
    box-shadow: 0 0 15px rgba(255,107,0,0.3);
  }
  #rpmFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00ff88 0%, #ffcc00 60%, #ff2200 90%);
    transition: width 0.05s;
    box-shadow: 0 0 10px currentColor;
  }

  /* Vinheta de velocidade (efeito de velocidade) */
  #speedVignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5) 100%);
    opacity: 0;
    transition: opacity 0.2s;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="speedVignette"></div>

<div id="hud">
  <div><b>WASD</b> — Dirigir | <b>Q/E</b> — Marcha</div>
  <div><b>Espaço</b> — Freio de mão (drift)</div>
  <div><b>C</b> — Câmera | <b>R</b> — Reset</div>
  <div id="speedInfo">0 km/h</div>
</div>

<div id="driftScore">0</div>
<div id="comboText">COMBO x1</div>

<button id="reset" onclick="resetCar()">⟳</button>
<div id="gearBig">1</div>
<div id="rpm"><div id="rpmFill"></div></div>

<div id="dpad" class="controls">
  <div class="btn" id="up"    data-key="w">▲</div>
  <div class="btn" id="left"  data-key="a">◀</div>
  <div class="btn" id="down"  data-key="s">▼</div>
  <div class="btn" id="right" data-key="d">▶</div>
</div>

<div id="gearbox">
  <div class="btn" id="gearUp">+</div>
  <div id="gearLabel">1</div>
  <div class="btn" id="gearDown">−</div>
</div>

<div id="actions" class="controls">
  <div class="btn" id="cam"   data-key="c">📷</div>
  <div class="btn" id="hand"  data-key=" ">DRIFT</div>
  <div class="btn" id="brake" data-key="s">FREIO</div>
  <div class="btn" id="gas"   data-key="w">GÁS</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   SETUP
============================================================ */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
// Céu noturno urbano — laranja/roxo de Tóquio
scene.background = new THREE.Color(0x1a0a2a);
scene.fog = new THREE.Fog(0x2a1a3a, 120, 500);

const camera = new THREE.PerspectiveCamera(64, window.innerWidth/window.innerHeight, 0.1, 2000);

/* ============================================================
   LUZES
============================================================ */
scene.add(new THREE.HemisphereLight(0xff7744, 0x1a1020, 0.9));

const sunset = new THREE.DirectionalLight(0xff9955, 1.2);
sunset.position.set(-120, 80, -100);
sunset.castShadow = true;
sunset.shadow.mapSize.set(1024, 1024);
sunset.shadow.camera.left = -150;
sunset.shadow.camera.right = 150;
sunset.shadow.camera.top = 150;
sunset.shadow.camera.bottom = -150;
sunset.shadow.camera.far = 600;
sunset.shadow.bias = -0.0008;
scene.add(sunset, sunset.target);

const fill = new THREE.DirectionalLight(0x7733cc, 0.5);
fill.position.set(60, 40, 80);
scene.add(fill);

/* ============================================================
   MONTANHA DK
============================================================ */
const roadPath = [
  new THREE.Vector3(0,   0,   80),
  new THREE.Vector3(-30, 8,   30),
  new THREE.Vector3(-10, 18, -10),
  new THREE.Vector3(30,  30, -40),
  new THREE.Vector3(10,  42, -80),
  new THREE.Vector3(-40, 50, -110),
  new THREE.Vector3(-20, 60, -150),
  new THREE.Vector3(30,  55, -180),
  new THREE.Vector3(60,  45, -220),
  new THREE.Vector3(20,  30, -260),
  new THREE.Vector3(-40, 18, -290),
  new THREE.Vector3(-70, 8,  -330),
  new THREE.Vector3(-30, 0,  -370),
];

const curve = new THREE.CatmullRomCurve3(roadPath, false, 'catmullrom', 0.3);
const SAMPLES = 400;
const roadPoints = curve.getPoints(SAMPLES);
const roadTangents = [];
for (let i = 0; i <= SAMPLES; i++) {
  roadTangents.push(curve.getTangent(i / SAMPLES).normalize());
}

const ROAD_WIDTH = 13;

/* --- MONTANHA --- */
const mountainMat = new THREE.MeshStandardMaterial({ color: 0x2a4a2a, roughness: 0.95 });
const rockMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 1 });

for (let i = 0; i <= SAMPLES; i += 4) {
  const p = roadPoints[i];
  const t = roadTangents[i];
  const depth = 40 + Math.random() * 20;
  const width = ROAD_WIDTH + 20 + Math.random() * 30;
  const mountain = new THREE.Mesh(new THREE.BoxGeometry(width, depth, 8), mountainMat);
  mountain.position.set(p.x + (Math.random() - 0.5) * 10, p.y - depth / 2 - 0.5, p.z);
  mountain.rotation.y = Math.atan2(t.x, t.z);
  mountain.receiveShadow = true;
  scene.add(mountain);

  if (Math.random() > 0.75) {
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(1.5 + Math.random() * 2),
      rockMat
    );
    rock.position.set(
      p.x + (Math.random() - 0.5) * 40,
      p.y + (Math.random() * 3),
      p.z + (Math.random() - 0.5) * 20
    );
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }
}

/* --- ESTRADA --- */
function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a1a20';
  ctx.fillRect(0, 0, 256, 1024);
  for (let i = 0; i < 8000; i++) {
    const g = Math.random() * 40 + 15;
    ctx.fillStyle = `rgba(${g},${g},${g+3},0.6)`;
    ctx.fillRect(Math.random()*256, Math.random()*1024, 1, 1);
  }
  // Faixa amarela central
  ctx.fillStyle = '#ffcc22';
  for (let y = 0; y < 1024; y += 50) {
    ctx.fillRect(124, y, 8, 25);
  }
  // Bordas brancas
  ctx.fillStyle = '#dddddd';
  ctx.fillRect(12, 0, 5, 1024);
  ctx.fillRect(239, 0, 5, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const roadGeometry = new THREE.BufferGeometry();
const roadVerts = [], roadUVs = [], roadIndices = [], roadNormals = [];

for (let i = 0; i <= SAMPLES; i++) {
  const p = roadPoints[i];
  const t = roadTangents[i];
  const right = new THREE.Vector3(t.z, 0, -t.x).normalize();
  const leftV  = new THREE.Vector3().copy(p).addScaledVector(right, -ROAD_WIDTH/2);
  const rightV = new THREE.Vector3().copy(p).addScaledVector(right,  ROAD_WIDTH/2);
  leftV.y  += 0.05;
  rightV.y += 0.05;

  roadVerts.push(leftV.x, leftV.y, leftV.z);
  roadVerts.push(rightV.x, rightV.y, rightV.z);

  const v = i * 0.5;
  roadUVs.push(0, v);
  roadUVs.push(1, v);
  roadNormals.push(0, 1, 0, 0, 1, 0);

  if (i < SAMPLES) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    roadIndices.push(a, c, b);
    roadIndices.push(b, c, d);
  }
}
roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(roadVerts, 3));
roadGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(roadUVs, 2));
roadGeometry.setAttribute('normal', new THREE.Float32BufferAttribute(roadNormals, 3));
roadGeometry.setIndex(roadIndices);

const roadMat = new THREE.MeshStandardMaterial({
  map: makeRoadTexture(), roughness: 0.85, metalness: 0.15, side: THREE.DoubleSide,
});
const road = new THREE.Mesh(roadGeometry, roadMat);
road.receiveShadow = true;
scene.add(road);

/* --- GUARD-RAILS COM REFLETORES --- */
const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 });
const postMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5, roughness: 0.5 });
const reflectorMat = new THREE.MeshStandardMaterial({
  color: 0xff6600, emissive: 0xff6600, emissiveIntensity: 3
});

for (let i = 0; i <= SAMPLES; i += 6) {
  const p = roadPoints[i];
  const t = roadTangents[i];
  const right = new THREE.Vector3(t.z, 0, -t.x).normalize();
  const angle = Math.atan2(t.x, t.z);

  [-1, 1].forEach(side => {
    const railX = p.x + right.x * (ROAD_WIDTH/2 + 0.5) * side;
    const railZ = p.z + right.z * (ROAD_WIDTH/2 + 0.5) * side;

    const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.1), postMat);
    post.position.set(railX, p.y + 0.45, railZ);
    post.castShadow = true;
    scene.add(post);

    const rail = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.15, 0.08), railMat);
    rail.position.set(railX, p.y + 0.85, railZ);
    rail.rotation.y = angle;
    rail.castShadow = true;
    scene.add(rail);

    // Refletor laranja a cada post
    if (i % 12 === 0) {
      const refl = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), reflectorMat);
      refl.position.set(railX, p.y + 0.7, railZ);
      refl.rotation.y = angle;
      scene.add(refl);
    }
  });
}

/* --- POSTES DE LUZ NA ESTRADA --- */
const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.4 });
const lampMat = new THREE.MeshStandardMaterial({
  color: 0xffee88, emissive: 0xffcc44, emissiveIntensity: 4
});

function makeStreetLamp(x, y, z, rotY) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 8, 6), poleMat);
  pole.position.y = 4;
  pole.castShadow = true;
  g.add(pole);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 0.12), poleMat);
  arm.position.set(0.75, 8, 0);
  g.add(arm);

  const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.4), lampMat);
  lamp.position.set(1.5, 7.85, 0);
  g.add(lamp);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.35 })
  );
  halo.position.set(1.5, 7.85, 0);
  g.add(halo);

  g.position.set(x, y, z);
  g.rotation.y = rotY;
  scene.add(g);
}

for (let i = 20; i < SAMPLES - 20; i += 20) {
  const p = roadPoints[i];
  const t = roadTangents[i];
  const right = new THREE.Vector3(t.z, 0, -t.x).normalize();
  const angle = Math.atan2(t.x, t.z);

  const side = (i % 40 === 0) ? 1 : -1;
  const x = p.x + right.x * (ROAD_WIDTH/2 + 3) * side;
  const z = p.z + right.z * (ROAD_WIDTH/2 + 3) * side;
  makeStreetLamp(x, p.y, z, angle + (side > 0 ? Math.PI/2 : -Math.PI/2));
}

/* --- PINHEIROS --- */
function makePineTree(x, y, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.35, 1.8, 6),
    new THREE.MeshStandardMaterial({ color: 0x4a2a15, roughness: 0.95 })
  );
  trunk.position.y = 0.9;
  trunk.castShadow = true;
  g.add(trunk);

  const leafMat = new THREE.MeshStandardMaterial({ color: 0x1a3d1a, roughness: 0.9 });
  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.8 - i * 0.4, 2.2, 7), leafMat);
    cone.position.y = 2 + i * 1.1;
    cone.castShadow = true;
    g.add(cone);
  }

  g.position.set(x, y, z);
  g.scale.setScalar(0.8 + Math.random() * 0.7);
  scene.add(g);
}

for (let i = 4; i < SAMPLES - 4; i += 3) {
  const p = roadPoints[i];
  const t = roadTangents[i];
  const right = new THREE.Vector3(t.z, 0, -t.x).normalize();
  [-1, 1].forEach(side => {
    if (Math.random() > 0.35) {
      const dist = ROAD_WIDTH/2 + 5 + Math.random() * 15;
      const tx = p.x + right.x * dist * side;
      const tz = p.z + right.z * dist * side;
      makePineTree(tx, p.y - 0.3, tz);
    }
  });
}

/* --- PLACA DK + LETREIROS NEON --- */
const dkPosition = roadPoints[Math.floor(SAMPLES * 0.55)];
const dkAngle = Math.atan2(roadTangents[Math.floor(SAMPLES * 0.55)].x,
                            roadTangents[Math.floor(SAMPLES * 0.55)].z);

function makeDKSignTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#6b4a2a');
  grad.addColorStop(1, '#3a2512');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 20; i++) {
    ctx.strokeStyle = `rgba(0,0,0,${0.1 + Math.random() * 0.15})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath();
    ctx.moveTo(0, Math.random() * 256);
    ctx.bezierCurveTo(128, Math.random()*256, 384, Math.random()*256, 512, Math.random()*256);
    ctx.stroke();
  }
  ctx.strokeStyle = '#2a1a0a';
  ctx.lineWidth = 14;
  ctx.strokeRect(7, 7, 498, 242);
  ctx.font = 'bold 160px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillText('DK', 262, 134);
  ctx.fillStyle = '#f0f0f0';
  ctx.fillText('DK', 256, 128);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 6;
  ctx.strokeText('DK', 256, 128);
  ctx.font = 'bold 30px Arial';
  ctx.fillStyle = '#ff2222';
  ctx.fillText('TOKYO', 256, 220);
  return new THREE.CanvasTexture(c);
}

const dkSign = new THREE.Mesh(
  new THREE.PlaneGeometry(9, 4.5),
  new THREE.MeshStandardMaterial({ map: makeDKSignTexture(), side: THREE.DoubleSide })
);
dkSign.position.set(dkPosition.x, dkPosition.y + 6, dkPosition.z);
dkSign.rotation.y = dkAngle + Math.PI;
dkSign.castShadow = true;
scene.add(dkSign);

const woodMat = new THREE.MeshStandardMaterial({ color: 0x3a2512, roughness: 0.95 });
[-3.5, 3.5].forEach(off => {
  const support = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 6, 8), woodMat);

/* --- LETREIROS NEON NAS LATERAIS (Tóquio drift vibes) --- */
function makeNeonSign(x, y, z, color, text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, 512, 128);
  ctx.font = 'bold 90px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 30;
  ctx.fillStyle = color;
  ctx.fillText(text, 256, 64);
  ctx.shadowBlur = 15;
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 2),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
  );
  sign.position.set(x, y, z);
  scene.add(sign);
  return sign;
}

const neonTexts = ['DRIFT', 'TOKYO', 'NEON', 'GAS!', 'RACE', 'NOS', 'FUEL', 'SPEED'];
const neonColors = ['#ff0066', '#00ffff', '#ff00ff', '#ffcc00', '#ff3300', '#00ff88'];
const neonSigns = [];
for (let i = 30; i < SAMPLES - 30; i += 35) {
  const p = roadPoints[i];
  const t = roadTangents[i];
  const right = new THREE.Vector3(t.z, 0, -t.x).normalize();
  const side = Math.random() > 0.5 ? 1 : -1;
  const dist = ROAD_WIDTH/2 + 8 + Math.random() * 10;
  const x = p.x + right.x * dist * side;
  const z = p.z + right.z * dist * side;
  const y = p.y + 6 + Math.random() * 4;
  const sign = makeNeonSign(
    x, y, z,
    neonColors[Math.floor(Math.random()*neonColors.length)],
    neonTexts[Math.floor(Math.random()*neonTexts.length)]
  );
  sign.lookAt(p.x, y, p.z);
  neonSigns.push({ sign, baseY: y, phase: Math.random() * Math.PI * 2 });
}

function dropSkidMark(x, y, z, angle) {
  const rearOffset = -1.6;
  const halfTrack = 1.05;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);

  for (let s = -1; s <= 1; s += 2) {
    const lx = s * halfTrack;
    const lz = rearOffset;
    const wx = x + lx * cos + lz * sin;
    const wz = z - lx * sin + lz * cos;

    const m = skidPool[skidIndex];
    skidIndex = (skidIndex + 1) % SKID_MAX;
    m.position.set(wx, y + 0.06, wz);
    m.rotation.z = -angle;
    m.visible = true;
    m.material.opacity = 0.6 + Math.random() * 0.3;
  }
}

/* ============================================================
   ALTURA DO TERRENO
============================================================ */
function getTerrainHeightAt(x, z) {
  let bestDist = Infinity;
  let bestY = 0;
  for (let i = 0; i <= SAMPLES; i += 2) {
    const p = roadPoints[i];
    const dx = p.x - x, dz = p.z - z;
    const d = dx * dx + dz * dz;
    if (d < bestDist) { bestDist = d; bestY = p.y; }
  }
  return bestY;
}

  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key.toLowerCase() === 'c') toggleCamera();
  if (e.key.toLowerCase() === 'r') resetCar();
  if (e.key.toLowerCase() === 'q') shiftDown();
  if (e.key.toLowerCase() === 'e') shiftUp();
});

document.querySelectorAll('[data-key]').forEach(btn => {
  const key = btn.dataset.key;
  const press = (e) => {
    e.preventDefault();
    mobileKeys[key] = true;
    btn.classList.add('active');
    if (key === 'c') toggleCamera();
  };
  const release = (e) => {
    e.preventDefault();
    mobileKeys[key] = false;
    btn.classList.remove('active');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

function isPressed(...ks) { return ks.some(k => keys[k] || mobileKeys[k]); }

============================================================ */
let cameraMode = 0;
const camPos = new THREE.Vector3(0, 5, 90);
const camTarget = new THREE.Vector3();

function toggleCamera() { cameraMode = (cameraMode + 1) % 3; }

function updateCamera(dt) {
  const carPos = carState.pos;
  const forward = new THREE.Vector3(Math.sin(carState.angle), 0, Math.cos(carState.angle));

  // Camera mode 1 = primeira pessoa
  if (cameraMode === 1) {
    const targetPos = carPos.clone().add(new THREE.Vector3(0, 1.5, 0)).add(forward.clone().multiplyScalar(0.15));
    camPos.lerp(targetPos, 0.5);
    camera.position.copy(camPos);
    const lookAt = carPos.clone().add(forward.clone().multiplyScalar(20)).add(new THREE.Vector3(0, 1.3, 0));
    camera.lookAt(lookAt);
    camera.fov = 82;
  }
  // Camera mode 2 = cinema (mais alto, mais longe)
  else if (cameraMode === 2) {
    const back = forward.clone().multiplyScalar(-12);
    const targetPos = carPos.clone().add(back).add(new THREE.Vector3(0, 7, 0));
    camPos.lerp(targetPos, 0.08);
    camera.position.copy(camPos);
    camTarget.lerp(carPos.clone().add(new THREE.Vector3(0, 1.0, 0)), 0.15);
    camera.lookAt(camTarget);
    camera.fov = 55;
  }
  // Camera mode 0 = normal (drift cam)
  else {
    const back = forward.clone().multiplyScalar(-8.5);
    // Camera vira levemente na direção do drift (olha pra frente do carro)
    const targetPos = carPos.clone().add(back).add(new THREE.Vector3(0, 3.8, 0));
    camPos.lerp(targetPos, 0.15);
    camera.position.copy(camPos);
    camTarget.lerp(carPos.clone().add(new THREE.Vector3(0, 1.0, 0)), 0.25);
    camera.lookAt(camTarget);
    camera.fov = 68 + Math.min(15, carState.speed * 0.5);  // FOV dinâmico com velocidade
  }
  camera.updateProjectionMatrix();

  sunset.position.set(carPos.x - 120, carPos.y + 80, carPos.z - 100);
  sunset.target.position.copy(carPos);
  sunset.target.updateMatrixWorld();
}

/* ============================================================
   FÍSICA
============================================================ */
const driftScoreEl = document.getElementById('driftScore');
const comboTextEl = document.getElementById('comboText');
const speedVignette = document.getElementById('speedVignette');

function updatePhysics(dt) {
  const throttle = isPressed('w', 'arrowup') ? 1 : 0;
  const brake = isPressed('s', 'arrowdown') ? 1 : 0;
  const left = isPressed('a', 'arrowleft') ? 1 : 0;
  const right = isPressed('d', 'arrowright') ? 1 : 0;
  const handbrake = isPressed(' ') || mobileKeys[' '];

  carState.handbrake = handbrake;

  let steerInput = (left - right);
  carState.steer += (steerInput - carState.steer) * 0.18;

  // Direções do carro (frente e lado do carro)
  const forward = new THREE.Vector3(Math.sin(carState.angle), 0, Math.cos(carState.angle));
  const side = new THREE.Vector3(forward.z, 0, -forward.x);

  // Velocidade atual
  let speed = carState.velocity.length();
  const speedKmh = speed * 3.6;

  // Decompor velocidade em componentes frontais e laterais
  const vForward = carState.velocity.dot(forward);
  const vSide = carState.velocity.dot(side);

  const movingForward = vForward > 0.5;
  const movingBackward = vForward < -0.5;

  const gearInfo = GEAR_RATIOS[gearState.gear - 1];

  // === ACELERAÇÃO ===
  if (throttle) {
    if (speedKmh < gearInfo.max + 3) {
      carState.velocity.add(forward.clone().multiplyScalar(38 * gearInfo.accel * dt));
    }
  }
  // === FREIO ===
  if (brake) {
    if (movingForward) {
      carState.velocity.add(forward.clone().multiplyScalar(-55 * dt));
    } else {
      carState.velocity.add(forward.clone().multiplyScalar(-22 * dt));
    }
  }

  // === FÍSICA DE GRIP/DRIFT ===
  // A mágica: separar velocidade em lateral e frontal
  // Grip normal: realinha rapidamente (carro "gruda")
  // Grip baixo (handbrake): mantém velocidade lateral, gera drift

  // Recalcula velocidade lateral/frontal após aceleração
  let vF = carState.velocity.dot(forward);
  let vS = carState.velocity.dot(side);

  // Aplica grip lateral (quanto maior, mais "seca" a derrapagem)
  const gripFactor = handbrake ? DRIFT_GRIP : GRIP;
  vS *= Math.exp(-gripFactor * dt);

  // Aplica atrito frontal
  const fricF = (!throttle && !brake) ? 1.8 : 0.35;
  vF *= Math.exp(-fricF * dt);

  // Reconstitui velocidade
  carState.velocity.copy(forward.clone().multiplyScalar(vF).add(side.clone().multiplyScalar(vS)));

  const currentSpeed = carState.velocity.length();
  if (currentSpeed > MAX_SPEED) carState.velocity.multiplyScalar(MAX_SPEED / currentSpeed);

  // === ROTAÇÃO (direção) ===
  // Velocidade afeta a taxa de virada
  const speedFactor = Math.min(1, currentSpeed / 10);

  // Contra-esterço: se o carro está derrapando (drift alto), a direção vira mais forte
  const driftAngle = Math.abs(vS) / Math.max(1, Math.abs(vF));
  carState.driftAngle = driftAngle;

  const turnBase = TURN_SPEED * speedFactor * carState.steer;
  // Bônus de rotação quando drifting (contra-esterço natural)
  const driftBoost = 1 + Math.min(1, driftAngle * 1.5) * 0.7;
  const direction = movingBackward ? -1 : 1;

  carState.angle += turnBase * direction * driftBoost * dt;

  // === MOVIMENTO NO MUNDO ===
  carState.pos.x += carState.velocity.x * dt;
  carState.pos.z += carState.velocity.z * dt;

  // Altura
  const groundY = getTerrainHeightAt(carState.pos.x, carState.pos.z);
  carState.pos.y = groundY;

  // Pitch baseado na inclinação
  const ahead = new THREE.Vector3(carState.pos.x + forward.x * 2, 0, carState.pos.z + forward.z * 2);
  const hAhead = getTerrainHeightAt(ahead.x, ahead.z);
  const slope = (hAhead - groundY) / 2;
  carState.slopePitch = Math.atan2(slope, 1);

  // === DETECÇÃO DE DRIFT ===
  // Drift = ângulo entre direção do movimento e direção do carro > limite
  const velocityDir = carState.velocity.clone().normalize();
  const carDir = forward.clone();
  const dot = velocityDir.dot(carDir);
  const slipAngle = Math.acos(Math.max(-1, Math.min(1, dot)));

  carState.drifting = (slipAngle > 0.25 && currentSpeed > 8) || (handbrake && currentSpeed > 5);

  // === DRIFT SCORE ===
  const now = performance.now() / 1000;
  if (carState.drifting && currentSpeed > 10) {
    // Pontuação baseada na velocidade + ângulo de drift
    const points = currentSpeed * slipAngle * 4 * dt;
    carState.driftScore += points;
    carState.driftTimer += dt;
    carState.lastDriftTime = now;

    // Combo aumenta com tempo de drift contínuo
    carState.driftCombo = 1 + Math.floor(carState.driftTimer / 1.5);

    driftScoreEl.classList.add('active');
    driftScoreEl.textContent = Math.floor(carState.driftScore);
    if (carState.driftCombo > 1) {
      driftScoreEl.classList.add('combo');
      comboTextEl.classList.add('active');
      comboTextEl.textContent = `COMBO x${carState.driftCombo}`;
    } else {
      driftScoreEl.classList.remove('combo');
      comboTextEl.classList.remove('active');
    }

    // Fumaça e faíscas
    if (Math.random() < 0.5) {
      const angle = carState.angle;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      [-1.05, 1.05].forEach(off => {
        const lx = off;
        const lz = -1.6;
        const wx = carState.pos.x + lx * cos + lz * sin;
        const wz = carState.pos.z - lx * sin + lz * cos;
        spawnSmoke(wx, carState.pos.y, wz, handbrake);
        if (slipAngle > 0.5 && Math.random() < 0.2) {
          spawnSpark(wx, carState.pos.y + 0.1, wz);
        }
      });
    }
  } else {
    // Perdeu o drift — reset
    if (now - carState.lastDriftTime > 1.5 && carState.driftScore > 0) {
      carState.driftScore = 0;
      carState.driftCombo = 1;
      carState.driftTimer = 0;
      driftScoreEl.classList.remove('active');
      comboTextEl.classList.remove('active');
    }
  }

  // === RPM ===
  const gearMin = gearState.gear > 1 ? GEAR_RATIOS[gearState.gear - 2].max : 0;
  let rpmNorm = (speedKmh - gearMin) / (gearInfo.max - gearMin);
  rpmNorm = Math.max(0.15, Math.min(1.1, rpmNorm));
  if (throttle && speedKmh > gearInfo.max * 0.9) {
    rpmNorm = Math.min(1.2, rpmNorm + Math.sin(performance.now() * 0.02) * 0.05);
  }
  gearState.rpm += (rpmNorm - gearState.rpm) * 0.15;
  rpmFillEl.style.width = Math.min(100, gearState.rpm * 100) + '%';

  // === APLICAR AO CARRO ===
  car.position.copy(carState.pos);
  car.rotation.set(0, carState.angle, 0);
  car.rotateX(-carState.slopePitch * 0.7);
  // Inclinação lateral (roll) mais forte durante drift
  const rollAmount = -carState.steer * speedFactor * 0.1 + (vS / 20) * 0.15;
  car.rotateZ(rollAmount);

  // Rodas giram
  const wheelRot = currentSpeed * dt * 2.5;
  wheels.forEach(w => {
    w.tire.rotation.x += wheelRot * (movingForward || throttle ? 1 : -1);
    w.rim.rotation.x = w.tire.rotation.x;
    if (w.isFront) w.group.rotation.y = carState.steer * 0.5;
  });

  carState.speed = currentSpeed;
  brakeLight.intensity = brake ? 1.8 : 0.5;

  // === MARCAS ===
  const shouldMark = (handbrake && currentSpeed > 2.5) ||
                     (slipAngle > 0.35 && currentSpeed > 15) ||
                     (brake && speedKmh > 40 && Math.abs(carState.steer) > 0.3);

  if (shouldMark) {
    skidAccum += currentSpeed * dt;
    if (skidAccum >= SKID_STEP) {
      skidAccum = 0;
      dropSkidMark(carState.pos.x, carState.pos.y, carState.pos.z, carState.angle);
    }
  } else {
    skidAccum = 0;
  }

  // === BACKFIRE (chamas nos escapes) ===
  const backfire = (throttle && speedKmh > 40 && Math.random() < 0.03) ||
                   (throttle === 0 && brake === 0 && speedKmh > 60 && Math.random() < 0.01) ||
                   (brake && speedKmh > 50 && Math.random() < 0.05);
  if (backfire) {
    flames.forEach(f => {
      f.visible = true;
      f.userData.life = 0.15;
      f.scale.setScalar(1 + Math.random() * 0.5);
    });
    // Luz breve
    brakeLight.color.setHex(0xff8800);
    brakeLight.intensity = 3;
  }

  // Atualiza chamas
  flames.forEach(f => {
    if (f.visible) {
      f.userData.life = (f.userData.life || 0) - dt;
      const scale = Math.max(0, f.userData.life / 0.15);
      f.scale.setScalar(scale);
      if (f.userData.life <= 0) f.visible = false;
    }
  });

  // === ATUALIZAR FUMAÇA E FAÍSCAS ===
  smokePool.forEach(s => {
    if (s.mesh.visible) {
      s.life += dt;
      s.mesh.position.add(s.vel.clone().multiplyScalar(dt));
      s.vel.y -= 0.8 * dt;
      const t = s.life / s.maxLife;
      s.mesh.material.opacity = Math.max(0, 0.7 * (1 - t));
      s.mesh.scale.setScalar(0.3 + t * 1.5);
      if (s.life >= s.maxLife) s.mesh.visible = false;
    }
  });

  sparkPool.forEach(s => {
    if (s.mesh.visible) {
      s.life += dt;
      s.mesh.position.add(s.vel.clone().multiplyScalar(dt));
      s.vel.y -= 10 * dt;
      const t = s.life / s.maxLife;
      s.mesh.material.opacity = Math.max(0, 1 - t);
      if (s.life >= s.maxLife) s.mesh.visible = false;
    }
  });

  // === VINHETA DE VELOCIDADE ===
  const vignetteIntensity = Math.min(1, Math.max(0, (speedKmh - 60) / 120));
  speedVignette.style.opacity = vignetteIntensity * 0.6;

  // === NEON SIGNS PISCANDO ===
  neonSigns.forEach(n => {
    n.phase += dt * 3;
    const flicker = 0.8 + Math.sin(n.phase) * 0.2 + (Math.random() < 0.02 ? -0.3 : 0);
    n.sign.material.opacity = Math.max(0.4, flicker);
  });
}

/* ============================================================
   RESET
============================================================ */
function resetCar() {
  carState.pos.set(0, 0, 80);
  carState.velocity.set(0, 0, 0);
  carState.angle = Math.PI;
  carState.steer = 0;
  carState.slopePitch = 0;
  carState.driftScore = 0;
  carState.driftCombo = 1;
  carState.driftTimer = 0;
  gearState.gear = 1;
  updateGearUI();
  driftScoreEl.classList.remove('active');
  comboTextEl.classList.remove('active');
}

/* ============================================================
   LOOP
============================================================ */
let lastTime = performance.now();
const speedInfo = document.getElementById('speedInfo');

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updatePhysics(dt);
  updateCamera(dt);
  renderer.render(scene, camera);

  speedInfo.textContent = `${Math.round(carState.speed * 3.6)} km/h${carState.drifting ? ' 🔥 DRIFT' : ''}`;
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateGearUI();
resetCar();
requestAnimationFrame(animate);
</script>
