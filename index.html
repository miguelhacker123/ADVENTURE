<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADVENTURE</title>
    <style>
        /* Importando uma fonte estilo pixel/arcade */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a5e 50%, #0a0a2a 100%);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== TELA DE CARREGAMENTO ===== */
        #loading-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a5e 50%, #0a0a2a 100%);
            transition: opacity 1s ease;
        }

        /* Estrelas de fundo */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* Logo ADVENTURE */
        .logo-container {
            position: relative;
            animation: floatLogo 3s ease-in-out infinite;
            margin-bottom: 60px;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .logo {
            font-size: 60px;
            color: #aaff00;
            text-shadow: 
                4px 4px 0 #000,
                8px 8px 0 #003300,
                0 0 20px #aaff00,
                0 0 40px #66ff00;
            letter-spacing: 5px;
            position: relative;
            z-index: 2;
        }

        .logo-sub {
            display: block;
            text-align: center;
            font-size: 18px;
            color: #ffcc00;
            text-shadow: 
                3px 3px 0 #000,
                0 0 15px #ffcc00;
            margin-top: 10px;
            letter-spacing: 8px;
        }

        /* Barra de Carregamento */
        .loading-bar-container {
            width: 400px;
            height: 30px;
            background: #000;
            border: 4px solid #aaff00;
            box-shadow: 0 0 20px #aaff00, inset 0 0 10px #000;
            position: relative;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #66ff00, #aaff00, #ccff66);
            box-shadow: 0 0 15px #aaff00;
            transition: width 0.1s linear;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.3) 10px,
                rgba(255,255,255,0.3) 20px
            );
            animation: moveStripes 0.5s linear infinite;
        }

        @keyframes moveStripes {
            from { transform: translateX(0); }
            to { transform: translateX(28px); }
        }

        .loading-text {
            color: #ffffff;
            font-size: 12px;
            margin-top: 20px;
            text-shadow: 2px 2px 0 #000;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .percentage {
            color: #aaff00;
            font-size: 14px;
            margin-top: 10px;
            text-shadow: 0 0 10px #aaff00;
        }

        /* ===== JOGO ===== */
        #game-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            overflow: hidden;
        }

        /* Chão */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 80px;
            background: repeating-linear-gradient(
                90deg,
                #1a1a1a 0px,
                #1a1a1a 40px,
                #2a2a2a 40px,
                #2a2a2a 80px
            );
            border-top: 4px solid #aaff00;
            box-shadow: 0 0 20px #aaff00;
            animation: moveGround 1s linear infinite;
        }

        @keyframes moveGround {
            from { transform: translateX(0); }
            to { transform: translateX(-80px); }
        }

        /* Jogador */
        .player {
            position: absolute;
            bottom: 80px;
            left: 150px;
            width: 50px;
            height: 50px;
            background: #aaff00;
            border: 3px solid #000;
            box-shadow: 0 0 20px #aaff00, inset 0 0 10px #66ff00;
            z-index: 10;
            transition: transform 0.05s;
        }

        .player::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 10px;
            height: 10px;
            background: #000;
            box-shadow: 22px 0 0 #000;
        }

        /* Obstáculos */
        .obstacle {
            position: absolute;
            bottom: 80px;
            width: 40px;
            height: 40px;
            background: #ff0044;
            border: 3px solid #000;
            box-shadow: 0 0 20px #ff0044;
            z-index: 5;
        }

        /* Instruções */
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            text-shadow: 2px 2px 0 #000;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border: 2px solid #aaff00;
            z-index: 20;
        }

        .score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #aaff00;
            font-size: 16px;
            text-shadow: 2px 2px 0 #000, 0 0 10px #aaff00;
            z-index: 20;
        }

        /* Game Over */
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0044;
            font-size: 40px;
            text-shadow: 4px 4px 0 #000, 0 0 30px #ff0044;
            display: none;
            z-index: 50;
            text-align: center;
        }

        .game-over small {
            display: block;
            color: #fff;
            font-size: 14px;
            margin-top: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        /* Nuvens */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            filter: blur(20px);
        }
    </style>
</head>
<body>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loading-screen">
        <div class="stars" id="stars"></div>
        
        <div class="logo-container">
            <div class="logo">ADVENTURE</div>
            <div class="logo-sub">LITE</div>
        </div>

        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
        </div>

        <div class="loading-text">CARREGANDO OS DESAFIOS...</div>
        <div class="percentage" id="percentage">0%</div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-screen">
        <div class="instructions">CLIQUE OU ESPAÇO PARA PULAR</div>
        <div class="score">PONTOS: <span id="score">0</span></div>
        <div class="ground"></div>
        <div class="player" id="player"></div>
        <div class="game-over" id="gameOver">
            GAME OVER
            <small>CLIQUE PARA TENTAR DE NOVO</small>
        </div>
    </div>

    <script>
        // ===== GERADOR DE ESTRELAS =====
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // ===== TELA DE CARREGAMENTO =====
        let progress = 0;
        const loadingBar = document.getElementById('loadingBar');
        const percentage = document.getElementById('percentage');
        const loadingScreen = document.getElementById('loading-screen');
        const gameScreen = document.getElementById('game-screen');

        const loadInterval = setInterval(() => {
            progress += Math.random() * 8 + 2;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        gameScreen.style.display = 'block';
                        startGame();
                    }, 1000);
                }, 500);
            }
            loadingBar.style.width = progress + '%';
            percentage.textContent = Math.floor(progress) + '%';
        }, 150);

        // ===== JOGO =====
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOver');
        
        let playerBottom = 80;
        let velocity = 0;
        let gravity = 0.9;
        let jumpForce = -15;
        let isJumping = false;
        let gameRunning = false;
        let score = 0;
        let obstacles = [];
        let gameSpeed = 6;
        let spawnTimer = 0;
        let animationId;

        function startGame() {
            gameRunning = true;
            score = 0;
            scoreElement.textContent = score;
            playerBottom = 80;
            velocity = 0;
            isJumping = false;
            player.style.bottom = playerBottom + 'px';
            player.style.transform = 'rotate(0deg)';
            gameOverScreen.style.display = 'none';
            
            // Limpa obstáculos antigos
            obstacles.forEach(obs => obs.remove());
            obstacles = [];
            
            gameLoop();
        }

        function jump() {
            if (!gameRunning) {
                if (gameOverScreen.style.display === 'block') {
                    startGame();
                }
                return;
            }
            if (!isJumping) {
                velocity = jumpForce;
                isJumping = true;
            }
        }

        // Controles
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });

        document.addEventListener('mousedown', jump);
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        function createObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            const randomHeight = Math.random() > 0.5 ? 40 : 60;
            obstacle.style.height = randomHeight + 'px';
            obstacle.style.right = '-50px';
            obstacle.style.bottom = '80px';
            gameScreen.appendChild(obstacle);
            obstacles.push({
                element: obstacle,
                x: window.innerWidth + 50,
                width: 40,
                height: randomHeight
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Física do jogador
            velocity += gravity;
            playerBottom -= velocity;

            // Colisão com o chão
            if (playerBottom <= 80) {
                playerBottom = 80;
                velocity = 0;
                isJumping = false;
                player.style.transform = 'rotate(0deg)';
            } else {
                // Rotação enquanto pula
                const rotation = (velocity * 3) % 360;
                player.style.transform = `rotate(${rotation}deg)`;
            }

            player.style.bottom = playerBottom + 'px';

            // Atualiza obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= gameSpeed;
                obs.element.style.right = (window.innerWidth - obs.x) + 'px';

                // Colisão
                const playerRect = {
                    left: 150,
                    right: 150 + 50,
                    top: window.innerHeight - playerBottom - 50,
                    bottom: window.innerHeight - playerBottom
                };

                const obsRect = {
                    left: obs.x,
                    right: obs.x + obs.width,
                    top: window.innerHeight - 80 - obs.height,
                    bottom: window.innerHeight - 80
                };

                // Ajuste para colisão mais justa (margem de 5px)
                if (playerRect.right - 10 > obsRect.left &&
                    playerRect.left + 10 < obsRect.right &&
                    playerRect.bottom - 5 > obsRect.top &&
                    playerRect.top + 5 < obsRect.bottom) {
                    gameOver();
                    return;
                }

                // Remove obstáculos que saíram da tela
                if (obs.x < -100) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreElement.textContent = score;
                    // Aumenta a velocidade gradualmente
                    if (score % 50 === 0) {
                        gameSpeed += 0.5;
                    }
                }
            }

            // Spawna novos obstáculos
            spawnTimer++;
            const spawnRate = Math.max(60, 100 - Math.floor(score / 20));
            if (spawnTimer > spawnRate) {
                createObstacle();
                spawnTimer = 0;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            gameOverScreen.style.display = 'block';
        }
    </script>
</body>
</html>
