<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ADVENTURE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Press Start 2P', cursive;
    color: #fff;
    touch-action: manipulation;
}

/* ========== FUNDO ANIMADO ========== */
.bg-anim {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at top, #1a1a5e 0%, #0a0a2a 50%, #000 100%);
    z-index: 0;
    overflow: hidden;
}
.star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s infinite alternate;
    box-shadow: 0 0 6px #fff;
}
@keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
}

/* Nuvens de energia no fundo */
.energy-cloud {
    position: absolute; border-radius: 50%;
    filter: blur(60px);
    animation: drift 20s infinite linear;
}
@keyframes drift {
    from { transform: translateX(-200px) translateY(0); }
    to { transform: translateX(calc(100vw + 200px)) translateY(-50px); }
}

/* ========== TELAS ========== */
.screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    z-index: 10; padding: 20px;
}
.screen.active { display: flex; }

/* ========== TELA DE CARREGAMENTO ========== */
.logo-container {
    animation: floatLogo 3s ease-in-out infinite;
    text-align: center; margin-bottom: 60px;
    position: relative;
}
@keyframes floatLogo {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.logo {
    font-size: clamp(36px, 7vw, 80px);
    color: #aaff00;
    text-shadow: 
        4px 4px 0 #000,
        8px 8px 0 #003300,
        0 0 30px #aaff00,
        0 0 60px #66ff00,
        0 0 100px #66ff00;
    letter-spacing: 6px;
    position: relative;
}
.logo::after {
    content: 'ADVENTURE';
    position: absolute; top: 0; left: 0;
    color: transparent;
    -webkit-text-stroke: 2px #fff;
    filter: blur(3px);
    opacity: 0.4;
    z-index: -1;
}
.logo-sub {
    font-size: clamp(14px, 2vw, 22px);
    color: #ffcc00;
    text-shadow: 3px 3px 0 #000, 0 0 20px #ffcc00, 0 0 40px #ff8800;
    margin-top: 15px; letter-spacing: 15px;
    animation: subPulse 2s infinite;
}
@keyframes subPulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
}

.loading-bar-container {
    width: min(500px, 85vw); height: 32px;
    background: #000;
    border: 3px solid #aaff00;
    border-radius: 6px;
    box-shadow: 0 0 30px #aaff00, inset 0 0 20px rgba(170,255,0,0.3);
    position: relative; overflow: hidden;
}
.loading-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #66ff00, #aaff00, #ccff66, #aaff00);
    background-size: 200% 100%;
    box-shadow: 0 0 20px #aaff00;
    transition: width 0.1s linear;
    position: relative;
    animation: gradientShift 2s linear infinite;
}
@keyframes gradientShift {
    from { background-position: 0% 0; }
    to { background-position: 200% 0; }
}
.loading-bar::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px,
        rgba(255,255,255,0.35) 10px, rgba(255,255,255,0.35) 20px);
    animation: moveStripes 0.5s linear infinite;
}
@keyframes moveStripes { from { transform: translateX(0); } to { transform: translateX(28px); } }

.loading-text {
    color: #fff; font-size: 11px; margin-top: 25px;
    text-shadow: 2px 2px 0 #000, 0 0 10px #aaff00;
    animation: blink 1.2s infinite; letter-spacing: 2px;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.percentage {
    color: #aaff00; font-size: 14px; margin-top: 12px;
    text-shadow: 0 0 15px #aaff00, 2px 2px 0 #000;
}

/* ========== MENU PRINCIPAL ========== */
#menu .menu-logo {
    font-size: clamp(40px, 8vw, 90px);
    color: #aaff00;
    text-shadow: 
        5px 5px 0 #000, 10px 10px 0 #003300,
        0 0 40px #aaff00, 0 0 80px #66ff00;
    letter-spacing: 8px;
    margin-bottom: 10px;
    animation: pulse 2.5s infinite;
}
@keyframes pulse {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.05); filter: brightness(1.3); }
}

.menu-sub {
    font-size: clamp(14px, 2vw, 22px);
    color: #ffcc00; text-shadow: 3px 3px 0 #000, 0 0 15px #ffcc00;
    margin-bottom: 55px; letter-spacing: 15px;
}

.menu-buttons { display: flex; flex-direction: column; gap: 16px; width: min(420px, 85vw); }

.btn {
    padding: 18px;
    background: linear-gradient(180deg, #1a1a5e, #0a0a2a);
    color: #fff;
    border: 3px solid #aaff00;
    border-radius: 8px;
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(11px, 1.2vw, 14px);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 5px 0 #003300, 0 0 15px rgba(170, 255, 0, 0.4), inset 0 0 15px rgba(170, 255, 0, 0.15);
    text-shadow: 2px 2px 0 #000;
    position: relative;
    overflow: hidden;
}
.btn::before {
    content: '';
    position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: left 0.5s;
}
.btn:hover::before { left: 100%; }
.btn:hover {
    background: linear-gradient(180deg, #aaff00, #66cc00);
    color: #000;
    text-shadow: none;
    transform: translateY(-3px);
    box-shadow: 0 8px 0 #336600, 0 0 40px #aaff00;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #003300; }

.btn.gold { border-color: #ffcc00; box-shadow: 0 5px 0 #664400, 0 0 15px rgba(255, 204, 0, 0.5); }
.btn.gold:hover { background: linear-gradient(180deg, #ffcc00, #cc9900); box-shadow: 0 8px 0 #664400, 0 0 40px #ffcc00; }

.btn.danger { border-color: #ff0044; box-shadow: 0 5px 0 #660022, 0 0 15px rgba(255, 0, 68, 0.5); }
.btn.danger:hover { background: linear-gradient(180deg, #ff0044, #aa0033); color: #fff; box-shadow: 0 8px 0 #660022, 0 0 40px #ff0044; }

.btn.blue { border-color: #00aaff; box-shadow: 0 5px 0 #003366, 0 0 15px rgba(0, 170, 255, 0.5); }
.btn.blue:hover { background: linear-gradient(180deg, #00aaff, #0066cc); box-shadow: 0 8px 0 #003366, 0 0 40px #00aaff; }

/* ========== LOJA DE CUBOS ========== */
#shop .shop-title {
    font-size: clamp(22px, 4vw, 38px);
    color: #aaff00;
    text-shadow: 4px 4px 0 #000, 0 0 30px #aaff00;
    margin-bottom: 25px;
    letter-spacing: 4px;
}

.cubes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 18px;
    width: min(900px, 92vw);
    max-height: 65vh;
    overflow-y: auto;
    padding: 15px;
}

.cube-card {
    background: linear-gradient(180deg, rgba(20,20,50,0.9), rgba(0,0,0,0.9));
    border: 3px solid #333;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    position: relative;
    overflow: hidden;
}
.cube-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, currentColor, transparent);
    opacity: 0;
    transition: opacity 0.3s;
}
.cube-card:hover::before { opacity: 1; }
.cube-card:hover {
    border-color: #aaff00;
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 10px 30px rgba(170,255,0,0.4);
}
.cube-card.owned { border-color: #66cc00; background: linear-gradient(180deg, rgba(20,50,20,0.9), rgba(0,0,0,0.9)); }
.cube-card.equipped {
    border-color: #ffcc00;
    box-shadow: 0 0 30px #ffcc00, inset 0 0 20px rgba(255,204,0,0.2);
    background: linear-gradient(180deg, rgba(50,40,0,0.9), rgba(0,0,0,0.9));
}

.cube-preview {
    width: 65px; height: 65px;
    border: 3px solid #000;
    border-radius: 6px;
    position: relative;
    box-shadow: 0 0 20px currentColor, inset 0 0 15px rgba(255,255,255,0.3);
    animation: cubeFloat 2s ease-in-out infinite;
}
@keyframes cubeFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(5deg); }
}
.cube-preview::before, .cube-preview::after {
    content: ''; position: absolute; width: 11px; height: 11px;
    background: #000; border-radius: 2px;
}
.cube-preview::before { top: 12px; left: 12px; }
.cube-preview::after { top: 12px; right: 12px; }

.cube-name { font-size: 10px; color: #fff; text-align: center; text-shadow: 2px 2px 0 #000; }
.cube-status { font-size: 9px; text-align: center; text-shadow: 2px 2px 0 #000; }

/* ========== JOGO ========== */
#game { padding: 0; justify-content: flex-start; }

.game-hud {
    position: absolute; top: 0; left: 0; width: 100%;
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 30;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    pointer-events: none;
}
.attempts-text {
    color: #fff; font-size: 12px;
    text-shadow: 2px 2px 0 #000, 0 0 10px #aaff00;
    background: rgba(0,0,0,0.6);
    padding: 8px 15px;
    border: 2px solid #aaff00;
    border-radius: 5px;
}

/* Barra de progresso */
.progress-container {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    width: min(500px, 55vw); height: 26px;
    background: rgba(0,0,0,0.85);
    border: 3px solid #aaff00;
    border-radius: 13px;
    box-shadow: 0 0 25px rgba(170,255,0,0.6), inset 0 0 15px rgba(0,0,0,0.8);
    z-index: 30;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #66ff00, #aaff00, #ccff66);
    background-size: 200% 100%;
    box-shadow: 0 0 20px #aaff00;
    width: 0%;
    transition: width 0.1s linear;
    animation: gradientShift 2s linear infinite;
    border-radius: 10px;
}
.progress-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-size: 10px;
    text-shadow: 2px 2px 0 #000, 0 0 8px #000;
    z-index: 31;
    letter-spacing: 2px;
}

/* Chão estilizado */
.ground {
    position: absolute; bottom: 0; left: 0;
    width: 200%; height: 80px;
    background: 
        linear-gradient(180deg, rgba(170,255,0,0.3) 0%, transparent 15%),
        repeating-linear-gradient(90deg,
            #151530 0px, #151530 40px,
            #1e1e45 40px, #1e1e45 80px);
    border-top: 4px solid var(--theme-color, #aaff00);
    box-shadow: 0 0 30px var(--theme-color, #aaff00), inset 0 0 30px rgba(170,255,0,0.2);
}

/* Jogador - AJUSTADO */
.player {
    position: absolute; bottom: 80px; left: 150px;
    width: 50px; height: 50px;
    border: 3px solid #000;
    border-radius: 6px;
    z-index: 10;
    transition: box-shadow 0.1s;
}
.player::before {
    content: ''; position: absolute; top: 10px; left: 10px;
    width: 9px; height: 9px; background: #000;
    border-radius: 2px;
    box-shadow: 22px 0 0 #000;
}

/* Rastro */
.trail {
    position: absolute; width: 40px; height: 40px;
    border-radius: 50%; pointer-events: none;
    animation: trailFade 0.6s ease-out forwards;
    z-index: 5;
    filter: blur(3px);
}
@keyframes trailFade {
    from { opacity: 0.7; transform: scale(1); }
    to { opacity: 0; transform: scale(0.2); }
}

/* Partículas */
.particle {
    position: absolute; width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none; z-index: 8;
    animation: particleBurst 0.7s ease-out forwards;
}
@keyframes particleBurst {
    from { opacity: 1; transform: translate(0, 0) rotate(0deg); }
    to { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(720deg); }
}

/* Obstáculos - MAIS VISÍVEIS E JUSTOS */
.obstacle {
    position: absolute; bottom: 80px;
    z-index: 5;
}
.obstacle.spike {
    width: 36px; height: 36px;
    background: linear-gradient(180deg, #ff3366, #aa0033);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    filter: drop-shadow(0 0 15px #ff0044);
}
.obstacle.spike::after {
    content: '';
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 60%;
    background: rgba(255,255,255,0.6);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}
.obstacle.block {
    width: 46px; height: 46px;
    background: linear-gradient(180deg, #6644ff, #2211aa);
    border: 3px solid #000;
    border-radius: 6px;
    box-shadow: 0 0 20px #6644ff, inset 0 0 15px rgba(255,255,255,0.3);
}
.obstacle.block::after {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 2px dashed rgba(255,255,255,0.4);
    border-radius: 3px;
}
.obstacle.tall {
    width: 42px; height: 75px;
    background: linear-gradient(180deg, #ffaa00, #cc5500);
    border: 3px solid #000;
    border-radius: 6px;
    box-shadow: 0 0 20px #ff8800, inset 0 0 15px rgba(255,255,255,0.3);
}
.obstacle.tall::after {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    height: 8px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    box-shadow: 0 15px 0 rgba(255,255,255,0.3), 0 30px 0 rgba(255,255,255,0.2);
}

/* Screen shake */
.shake { animation: shake 0.35s; }
@keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-8px, 6px); }
    40% { transform: translate(8px, -6px); }
    60% { transform: translate(-6px, -4px); }
    80% { transform: translate(6px, 4px); }
}

/* Explosão */
.explosion {
    position: absolute; width: 120px; height: 120px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0%, #ffcc00 30%, #ff0044 60%, transparent 100%);
    animation: explode 0.6s ease-out forwards;
    z-index: 20;
    transform: translate(-50%, -50%);
}
@keyframes explode {
    from { opacity: 1; transform: translate(-50%, -50%) scale(0); }
    to { opacity: 0; transform: translate(-50%, -50%) scale(3); }
}

/* Game Over Panel */
.game-over-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(180deg, rgba(20,0,0,0.95), rgba(0,0,0,0.95));
    border: 4px solid #ff0044;
    border-radius: 15px;
    box-shadow: 0 0 50px #ff0044, inset 0 0 30px rgba(255,0,68,0.2);
    padding: 35px 45px;
    text-align: center;
    z-index: 50;
    display: none;
    min-width: 340px;
}
.game-over-panel.show { display: block; animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
@keyframes popIn {
    from { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    to { transform: translate(-50%,-50%) scale(1); opacity: 1; }
}

.game-over-title {
    color: #ff0044; font-size: 32px;
    text-shadow: 4px 4px 0 #000, 0 0 30px #ff0044;
    margin-bottom: 25px;
    letter-spacing: 3px;
    animation: titleGlow 1.5s infinite alternate;
}
@keyframes titleGlow {
    from { text-shadow: 4px 4px 0 #000, 0 0 20px #ff0044; }
    to { text-shadow: 4px 4px 0 #000, 0 0 40px #ff0044, 0 0 60px #ff0044; }
}

.game-over-info {
    color: #fff; font-size: 12px; margin: 12px 0;
    text-shadow: 2px 2px 0 #000; line-height: 1.6;
    letter-spacing: 1px;
}
.game-over-info span { color: #aaff00; text-shadow: 0 0 10px #aaff00; }

.game-over-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }

/* Pause */
.pause-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(180deg, rgba(0,20,0,0.95), rgba(0,0,0,0.95));
    border: 4px solid #aaff00;
    border-radius: 15px;
    box-shadow: 0 0 50px #aaff00, inset 0 0 30px rgba(170,255,0,0.2);
    padding: 35px 45px;
    text-align: center;
    z-index: 50;
    display: none;
    min-width: 320px;
}
.pause-panel.show { display: block; animation: popIn 0.3s; }
.pause-title {
    color: #aaff00; font-size: 28px;
    text-shadow: 3px 3px 0 #000, 0 0 20px #aaff00;
    margin-bottom: 25px; letter-spacing: 4px;
}

/* Botão pausa */
.btn-pause {
    position: absolute; top: 15px; left: 20px;
    z-index: 40;
    padding: 10px 16px;
    background: rgba(0,0,0,0.7);
    color: #aaff00;
    border: 3px solid #aaff00;
    border-radius: 8px;
    font-family: 'Press Start 2P', cursive;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 15px rgba(170,255,0,0.5);
}
.btn-pause:hover {
    background: #aaff00;
    color: #000;
    box-shadow: 0 0 25px #aaff00;
}

/* Botão voltar */
.btn-back {
    position: absolute; top: 20px; left: 20px;
    z-index: 30; padding: 12px 20px;
}

/* Recordes */
.records-panel {
    background: linear-gradient(180deg, rgba(30,20,0,0.95), rgba(0,0,0,0.95));
    border: 4px solid #ffcc00;
    border-radius: 15px;
    box-shadow: 0 0 40px #ffcc00;
    padding: 35px 50px;
    text-align: center;
    min-width: 400px;
}
.records-panel .game-over-info { font-size: 13px; margin: 18px 0; }

.hint {
    color: #888; font-size: 10px;
    margin-top: 20px;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 1px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #000; border-radius: 4px; }
::-webkit-scrollbar-thumb { background: #aaff00; border-radius: 4px; }

/* Responsivo */
@media (max-width: 600px) {
    .game-over-panel, .pause-panel, .records-panel { padding: 25px 20px; min-width: 0; width: 90vw; }
    .game-over-title { font-size: 24px; }
    .progress-container { width: 55vw; }
}
</style>
</head>
<body>

<!-- FUNDO -->
<div class="bg-anim" id="bgAnim"></div>

<!-- ========== TELA DE CARREGAMENTO ========== -->
<div class="screen active" id="loading">
    <div class="logo-container">
        <div class="logo">ADVENTURE</div>
        <div class="logo-sub">LITE</div>
    </div>
    <div class="loading-bar-container">
        <div class="loading-bar" id="loadingBar"></div>
    </div>
    <div class="loading-text">CARREGANDO OS DESAFIOS...</div>
    <div class="percentage" id="percentage">0%</div>
</div>

<!-- ========== MENU PRINCIPAL ========== -->
<div class="screen" id="menu">
    <div class="menu-logo">ADVENTURE</div>
    <div class="menu-sub">LITE</div>
    <div class="menu-buttons">
        <button class="btn gold" id="btnPlay">▶ JOGAR</button>
        <button class="btn blue" id="btnShop">🛒 LOJA DE CUBOS</button>
        <button class="btn" id="btnRecords">🏆 RECORDES</button>
        <button class="btn danger" id="btnReset">🗑 RESETAR PROGRESSO</button>
    </div>
    <div class="hint">Melhor distância: <span id="bestDistance">0</span>m</div>
</div>

<!-- ========== LOJA ========== -->
<div class="screen" id="shop">
    <button class="btn btn-back" id="btnBackShop">← VOLTAR</button>
    <div class="shop-title">🛒 LOJA DE CUBOS</div>
    <div class="cubes-grid" id="cubesGrid"></div>
</div>

<!-- ========== RECORDES ========== -->
<div class="screen" id="records">
    <button class="btn btn-back" id="btnBackRecords">← VOLTAR</button>
    <div class="shop-title">🏆 RECORDES</div>
    <div class="records-panel">
        <div class="game-over-info">🥇 Melhor Distância: <span id="recBest">0</span>m</div>
        <div class="game-over-info">⭐ Maior Pontuação: <span id="recScore">0</span></div>
        <div class="game-over-info">🎯 Total de Tentativas: <span id="recAttempts">0</span></div>
        <div class="game-over-info">🎨 Cubos Desbloqueados: <span id="recCubes">1/8</span></div>
    </div>
</div>

<!-- ========== JOGO ========== -->
<div class="screen" id="game">
    <div class="game-hud">
        <div class="attempts-text">TENTATIVA: <span id="attempts">1</span></div>
    </div>
    
    <div class="progress-container">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <button class="btn-pause" id="btnPause">⏸</button>

    <div class="ground" id="ground"></div>
    <div class="player" id="player"></div>

    <div class="game-over-panel" id="gameOverPanel">
        <div class="game-over-title">GAME OVER</div>
        <div class="game-over-info">Distância: <span id="finalDistance">0</span>m</div>
        <div class="game-over-info">Pontos: <span id="finalScore">0</span></div>
        <div class="game-over-buttons">
            <button class="btn" id="btnRetry">🔄 TENTAR NOVAMENTE</button>
            <button class="btn danger" id="btnMenu">🏠 MENU PRINCIPAL</button>
        </div>
    </div>

    <div class="pause-panel" id="pausePanel">
        <div class="pause-title">⏸ PAUSADO</div>
        <div class="game-over-buttons">
            <button class="btn" id="btnResume">▶ CONTINUAR</button>
            <button class="btn danger" id="btnQuit">🏠 SAIR PARA O MENU</button>
        </div>
    </div>
</div>

<script>
/* =====================================================
   SISTEMA DE DADOS
===================================================== */
const STORAGE_KEY = 'adventure_lite_v2';

const defaultSave = {
    bestDistance: 0,
    bestScore: 0,
    totalAttempts: 0,
    equippedCube: 0,
    ownedCubes: [0]
};

let save = loadSave();

function loadSave() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) return { ...defaultSave, ...JSON.parse(data) };
    } catch(e) {}
    return { ...defaultSave };
}

function writeSave() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
}

/* =====================================================
   CUBOS
===================================================== */
const CUBES = [
    { id: 0, name: 'Verde',    color: '#aaff00', glow: '#aaff00', price: 0 },
    { id: 1, name: 'Azul',     color: '#00aaff', glow: '#00aaff', price: 0 },
    { id: 2, name: 'Rosa',     color: '#ff00aa', glow: '#ff00aa', price: 0 },
    { id: 3, name: 'Dourado',  color: '#ffcc00', glow: '#ffcc00', price: 0 },
    { id: 4, name: 'Vermelho', color: '#ff2200', glow: '#ff2200', price: 0 },
    { id: 5, name: 'Roxo',     color: '#aa00ff', glow: '#aa00ff', price: 0 },
    { id: 6, name: 'Ciano',    color: '#00ffff', glow: '#00ffff', price: 0 },
    { id: 7, name: 'Arco-Íris',color: 'rainbow', glow: '#ffffff', price: 0 }
];

/* =====================================================
   FUNDO DE ESTRELAS
===================================================== */
function createBackground() {
    const bg = document.getElementById('bgAnim');
    
    for (let i = 0; i < 150; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 2 + 2) + 's';
        bg.appendChild(star);
    }
    
    for (let i = 0; i < 4; i++) {
        const cloud = document.createElement('div');
        cloud.classList.add('energy-cloud');
        const size = Math.random() * 300 + 200;
        cloud.style.width = size + 'px';
        cloud.style.height = size + 'px';
        cloud.style.background = ['#aaff00', '#00aaff', '#ff00aa', '#aa00ff'][i];
        cloud.style.opacity = '0.08';
        cloud.style.top = Math.random() * 60 + '%';
        cloud.style.animationDelay = Math.random() * 10 + 's';
        cloud.style.animationDuration = (Math.random() * 10 + 15) + 's';
        bg.appendChild(cloud);
    }
}
createBackground();

/* =====================================================
   NAVEGAÇÃO
===================================================== */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* =====================================================
   CARREGAMENTO
===================================================== */
let progress = 0;
const loadingBar = document.getElementById('loadingBar');
const percentage = document.getElementById('percentage');

const loadInterval = setInterval(() => {
    progress += Math.random() * 8 + 3;
    if (progress >= 100) {
        progress = 100;
        clearInterval(loadInterval);
        setTimeout(() => {
            document.getElementById('loading').style.transition = 'opacity 1s';
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                showScreen('menu');
                updateMenuInfo();
            }, 800);
        }, 500);
    }
    loadingBar.style.width = progress + '%';
    percentage.textContent = Math.floor(progress) + '%';
}, 120);

/* =====================================================
   MENU
===================================================== */
function updateMenuInfo() {
    document.getElementById('bestDistance').textContent = save.bestDistance;
}

document.getElementById('btnPlay').onclick = () => {
    showScreen('game');
    startGame();
};

document.getElementById('btnShop').onclick = () => {
    renderShop();
    showScreen('shop');
};

document.getElementById('btnRecords').onclick = () => {
    document.getElementById('recBest').textContent = save.bestDistance;
    document.getElementById('recScore').textContent = save.bestScore;
    document.getElementById('recAttempts').textContent = save.totalAttempts;
    document.getElementById('recCubes').textContent = save.ownedCubes.length + '/' + CUBES.length;
    showScreen('records');
};

document.getElementById('btnReset').onclick = () => {
    if (confirm('Tem certeza que deseja resetar TODO o progresso?')) {
        save = { ...defaultSave, ownedCubes: [0] };
        writeSave();
        updateMenuInfo();
        alert('Progresso resetado!');
    }
};

document.getElementById('btnBackShop').onclick = () => { showScreen('menu'); updateMenuInfo(); };
document.getElementById('btnBackRecords').onclick = () => showScreen('menu');

/* =====================================================
   LOJA
===================================================== */
function renderShop() {
    const grid = document.getElementById('cubesGrid');
    grid.innerHTML = '';
    
    CUBES.forEach(cube => {
        const equipped = save.equippedCube === cube.id;
        
        const card = document.createElement('div');
        card.className = 'cube-card' + (equipped ? ' equipped' : '');
        card.style.color = cube.color === 'rainbow' ? '#fff' : cube.color;
        
        const preview = document.createElement('div');
        preview.className = 'cube-preview';
        preview.style.color = cube.color === 'rainbow' ? '#fff' : cube.color;
        if (cube.color === 'rainbow') {
            preview.style.background = 'linear-gradient(45deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0088ff, #aa00ff)';
            preview.style.backgroundSize = '300% 300%';
            preview.style.animation = 'rainbowMove 3s linear infinite, cubeFloat 2s ease-in-out infinite';
        } else {
            preview.style.background = `linear-gradient(180deg, ${cube.color}, ${cube.color}aa)`;
        }
        
        const name = document.createElement('div');
        name.className = 'cube-name';
        name.textContent = cube.name;
        
        const status = document.createElement('div');
        status.className = 'cube-status';
        if (equipped) {
            status.textContent = '✓ EQUIPADO';
            status.style.color = '#ffcc00';
        } else {
            status.textContent = 'CLIQUE P/ EQUIPAR';
            status.style.color = '#aaff00';
        }
        
        card.appendChild(preview);
        card.appendChild(name);
        card.appendChild(status);
        
        card.onclick = () => {
            if (equipped) return;
            save.equippedCube = cube.id;
            writeSave();
            renderShop();
        };
        
        grid.appendChild(card);
    });
}

const styleSheet = document.createElement('style');
styleSheet.textContent = `
    @keyframes rainbowMove {
        0% { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }
`;
document.head.appendChild(styleSheet);

/* =====================================================
   JOGO
===================================================== */
const player = document.getElementById('player');
const ground = document.getElementById('ground');
const gameScreen = document.getElementById('game');
const gameOverPanel = document.getElementById('gameOverPanel');
const pausePanel = document.getElementById('pausePanel');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

const PLAYER_SIZE = 50;
const PLAYER_LEFT = 150;

let gameState = {
    running: false,
    paused: false,
    score: 0,
    distance: 0,
    attempts: 1,
    playerBottom: 80,
    velocity: 0,
    gravity: 0.9,
    jumpForce: -15,
    isJumping: false,
    obstacles: [],
    gameSpeed: 6,
    spawnTimer: 0,
    animationId: null,
    totalFrames: 0,
    levelLength: 3000,
    lastTrailFrame: 0
};

function getEquippedCube() {
    return CUBES.find(c => c.id === save.equippedCube) || CUBES[0];
}

function applyCubeStyle() {
    const cube = getEquippedCube();
    if (cube.color === 'rainbow') {
        player.style.background = 'linear-gradient(45deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0088ff, #aa00ff)';
        player.style.backgroundSize = '300% 300%';
        player.style.animation = 'rainbowMove 3s linear infinite';
    } else {
        player.style.background = `linear-gradient(180deg, ${cube.color}, ${cube.color}aa)`;
        player.style.animation = '';
    }
    player.style.boxShadow = `0 0 25px ${cube.glow}, inset 0 0 15px rgba(255,255,255,0.3)`;
    ground.style.setProperty('--theme-color', cube.glow);
}

function startGame() {
    applyCubeStyle();
    
    gameState.running = true;
    gameState.paused = false;
    gameState.score = 0;
    gameState.distance = 0;
    gameState.playerBottom = 80;
    gameState.velocity = 0;
    gameState.isJumping = false;
    gameState.gameSpeed = 6;
    gameState.spawnTimer = 0;
    gameState.totalFrames = 0;
    gameState.lastTrailFrame = 0;
    
    save.totalAttempts++;
    writeSave();
    
    gameState.obstacles.forEach(o => o.element.remove());
    gameState.obstacles = [];
    
    player.style.bottom = '80px';
    player.style.transform = 'rotate(0deg)';
    player.style.left = PLAYER_LEFT + 'px';
    
    gameOverPanel.classList.remove('show');
    pausePanel.classList.remove('show');
    
    document.getElementById('attempts').textContent = gameState.attempts;
    progressFill.style.width = '0%';
    progressText.textContent = '0%';
    
    cancelAnimationFrame(gameState.animationId);
    gameLoop();
}

function jump() {
    if (!gameState.running || gameState.paused) return;
    if (!gameState.isJumping) {
        gameState.velocity = gameState.jumpForce;
        gameState.isJumping = true;
        spawnJumpParticles();
    }
}

function spawnJumpParticles() {
    const cube = getEquippedCube();
    for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (PLAYER_LEFT + 20) + 'px';
        p.style.bottom = (gameState.playerBottom + 20) + 'px';
        const color = cube.color === 'rainbow' 
            ? ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#00ffff', '#0088ff', '#aa00ff'][i % 7]
            : cube.color;
        p.style.background = color;
        p.style.boxShadow = `0 0 10px ${color}`;
        const angle = (Math.PI * 2 * i) / 10;
        const dist = 40 + Math.random() * 50;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        gameScreen.appendChild(p);
        setTimeout(() => p.remove(), 800);
    }
}

function spawnTrail() {
    const cube = getEquippedCube();
    const t = document.createElement('div');
    t.className = 'trail';
    t.style.left = (PLAYER_LEFT + 10) + 'px';
    t.style.bottom = (gameState.playerBottom + 10) + 'px';
    const color = cube.color === 'rainbow' ? '#fff' : cube.color;
    t.style.background = color;
    t.style.boxShadow = `0 0 20px ${cube.glow}`;
    gameScreen.appendChild(t);
    setTimeout(() => t.remove(), 700);
}

function createObstacle() {
    const types = ['spike', 'spike', 'block', 'tall'];
    const type = types[Math.floor(Math.random() * types.length)];
    
    const obs = document.createElement('div');
    obs.className = 'obstacle ' + type;
    obs.style.right = '-100px';
    
    let w, h;
    if (type === 'spike') { w = 36; h = 36; }
    else if (type === 'block') { w = 46; h = 46; }
    else { w = 42; h = 75; }
    
    gameScreen.appendChild(obs);
    
    gameState.obstacles.push({
        element: obs,
        x: window.innerWidth + 100,
        width: w,
        height: h,
        type
    });
}

function gameLoop() {
    if (!gameState.running || gameState.paused) return;
    
    gameState.totalFrames++;
    
    // Física
    gameState.velocity += gameState.gravity;
    gameState.playerBottom -= gameState.velocity;
    
    if (gameState.playerBottom <= 80) {
        gameState.playerBottom = 80;
        gameState.velocity = 0;
        gameState.isJumping = false;
        player.style.transform = 'rotate(0deg)';
    } else {
        const rotation = (gameState.velocity * 4) % 360;
        player.style.transform = `rotate(${rotation}deg)`;
    }
    
    player.style.bottom = gameState.playerBottom + 'px';
    
    // Rastro
    if (gameState.totalFrames - gameState.lastTrailFrame > 4) {
        spawnTrail();
        gameState.lastTrailFrame = gameState.totalFrames;
    }
    
    // ===== HITBOX AJUSTADA =====
    // O jogador tem 50x50, mas usamos uma hitbox interna menor (mais justa)
    // Margem de 10px em cada lado (hitbox real = 30x30 centralizada)
    const HITBOX_MARGIN = 10;
    const pLeft = PLAYER_LEFT + HITBOX_MARGIN;
    const pRight = PLAYER_LEFT + PLAYER_SIZE - HITBOX_MARGIN;
    const pBottom = gameState.playerBottom + HITBOX_MARGIN;
    const pTop = gameState.playerBottom + PLAYER_SIZE - HITBOX_MARGIN;
    
    // Atualiza obstáculos
    for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
        const obs = gameState.obstacles[i];
        obs.x -= gameState.gameSpeed;
        obs.element.style.right = (window.innerWidth - obs.x) + 'px';
        
        // Hitbox do obstáculo (menor que visual)
        let obsMarginX = 6, obsMarginY = 6;
        if (obs.type === 'spike') { obsMarginX = 10; obsMarginY = 10; }
        
        const oLeft = obs.x + obsMarginX;
        const oRight = obs.x + obs.width - obsMarginX;
        const oBottom = 80 + obsMarginY;
        const oTop = 80 + obs.height - obsMarginY;
        
        // Colisão AABB
        if (pRight > oLeft && pLeft < oRight && pTop > oBottom && pBottom < oTop) {
            gameOver();
            return;
        }
        
        if (obs.x < -100) {
            obs.element.remove();
            gameState.obstacles.splice(i, 1);
            gameState.score += 10;
            gameState.distance += 5;
        }
    }
    
    // Spawn
    gameState.spawnTimer++;
    const spawnRate = Math.max(50, 100 - Math.floor(gameState.score / 60));
    if (gameState.spawnTimer > spawnRate) {
        createObstacle();
        gameState.spawnTimer = 0;
    }
    
    // Progresso
    const progressPct = Math.min(100, (gameState.distance / gameState.levelLength) * 100);
    progressFill.style.width = progressPct + '%';
    progressText.textContent = Math.floor(progressPct) + '%';
    
    // Aumenta velocidade
    if (gameState.distance > 100) {
        gameState.gameSpeed = Math.min(14, 6 + gameState.distance / 200);
    }
    
    if (progressPct >= 100) {
        victory();
        return;
    }
    
    gameState.animationId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameState.running = false;
    cancelAnimationFrame(gameState.animationId);
    
    const explosion = document.createElement('div');
    explosion.className = 'explosion';
    explosion.style.left = (PLAYER_LEFT + 25) + 'px';
    explosion.style.bottom = (gameState.playerBottom + 25) + 'px';
    gameScreen.appendChild(explosion);
    setTimeout(() => explosion.remove(), 700);
    
    gameScreen.classList.add('shake');
    setTimeout(() => gameScreen.classList.remove('shake'), 400);
    
    if (gameState.distance > save.bestDistance) save.bestDistance = gameState.distance;
    if (gameState.score > save.bestScore) save.bestScore = gameState.score;
    writeSave();
    
    document.getElementById('finalDistance').textContent = gameState.distance;
    document.getElementById('finalScore').textContent = gameState.score;
    
    setTimeout(() => {
        gameOverPanel.classList.add('show');
    }, 500);
}

function victory() {
    gameState.running = false;
    cancelAnimationFrame(gameState.animationId);
    
    if (gameState.distance > save.bestDistance) save.bestDistance = gameState.distance;
    if (gameState.score > save.bestScore) save.bestScore = gameState.score;
    writeSave();
    
    document.getElementById('finalDistance').textContent = gameState.distance;
    document.getElementById('finalScore').textContent = gameState.score;
    document.querySelector('.game-over-title').textContent = '🎉 VOCÊ VENCEU!';
    gameOverPanel.classList.add('show');
}

/* =====================================================
   CONTROLES
===================================================== */
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (document.getElementById('game').classList.contains('active')) {
            if (gameOverPanel.classList.contains('show')) {
                gameState.attempts++;
                startGame();
            } else if (!gameState.paused) {
                jump();
            }
        }
    }
    if (e.code === 'Escape') {
        if (document.getElementById('game').classList.contains('active') && gameState.running) {
            togglePause();
        }
    }
});

document.addEventListener('mousedown', (e) => {
    if (document.getElementById('game').classList.contains('active') && !gameState.paused) {
        if (e.target.closest('button')) return;
        if (gameOverPanel.classList.contains('show')) return;
        jump();
    }
});

document.addEventListener('touchstart', (e) => {
    if (document.getElementById('game').classList.contains('active') && !gameState.paused) {
        if (e.target.closest('button')) return;
        if (gameOverPanel.classList.contains('show')) return;
        e.preventDefault();
        jump();
    }
}, { passive: false });

/* =====================================================
   PAUSE E BOTÕES
===================================================== */
function togglePause() {
    if (!gameState.running) return;
    gameState.paused = !gameState.paused;
    if (gameState.paused) {
        pausePanel.classList.add('show');
    } else {
        pausePanel.classList.remove('show');
        gameLoop();
    }
}

document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnQuit').onclick = () => {
    gameState.running = false;
    gameState.paused = false;
    cancelAnimationFrame(gameState.animationId);
    gameState.obstacles.forEach(o => o.element.remove());
    gameState.obstacles = [];
    pausePanel.classList.remove('show');
    showScreen('menu');
    updateMenuInfo();
};

document.getElementById('btnRetry').onclick = () => {
    gameState.attempts++;
    document.querySelector('.game-over-title').textContent = 'GAME OVER';
    startGame();
};

document.getElementById('btnMenu').onclick = () => {
    gameState.obstacles.forEach(o => o.element.remove());
    gameState.obstacles = [];
    gameOverPanel.classList.remove('show');
    document.querySelector('.game-over-title').textContent = 'GAME OVER';
    showScreen('menu');
    updateMenuInfo();
};
</script>
</body>
</html>
