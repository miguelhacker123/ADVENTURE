<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasuke Susano</title>
    <style>
        /* Remove as margens padrão do navegador */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Remove as barras de rolagem */
            background-color: #000; /* Fundo preto caso a imagem demore a carregar */
        }

        /* Estiliza a imagem para ocupar a tela inteira */
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Faz a imagem cobrir toda a tela sem distorcer */
            display: block;
        }
    </style>
</head>

    <!-- Aqui está a imagem do Sasuke -->
