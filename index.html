<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squish Squish - Aperte o Bichinho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitulo {
            color: #ffb6c1;
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .contador {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: rgba(255, 105, 180, 0.3);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
        }

        .contador span {
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.8rem;
        }

        .squish-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .squish-container:active {
            transform: scale(0.95);
        }

        .squish {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 35% 30%, #ff9ec7, #ff69b4 40%, #e91e8c 100%);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: 
                0 20px 40px rgba(255, 105, 180, 0.6),
                inset -20px -20px 40px rgba(0, 0, 0, 0.2),
                inset 15px 15px 30px rgba(255, 255, 255, 0.4);
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: flutuar 3s ease-in-out infinite;
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        .squish.apertado {
            transform: scale(1.3, 0.7) rotate(0deg) !important;
            box-shadow: 
                0 30px 60px rgba(255, 105, 180, 0.9),
                inset -30px -10px 40px rgba(0, 0, 0, 0.3),
                inset 20px 10px 30px rgba(255, 255, 255, 0.6);
            animation: none;
        }

        /* Olhos */
        .olho {
            position: absolute;
            width: 45px;
            height: 55px;
            background: #fff;
            border-radius: 50%;
            top: 70px;
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.15s ease;
        }

        .olho.esquerdo { left: 45px; }
        .olho.direito { right: 45px; }

        .pupila {
            position: absolute;
            width: 25px;
            height: 30px;
            background: #1a1a2e;
            border-radius: 50%;
            top: 12px;
            left: 10px;
            transition: all 0.3s ease;
        }

        .pupila::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
        }

        /* Bochechas */
        .bochecha {
            position: absolute;
            width: 35px;
            height: 20px;
            background: rgba(255, 50, 100, 0.5);
            border-radius: 50%;
            top: 130px;
            transition: all 0.3s ease;
        }

        .bochecha.esquerda { left: 30px; }
        .bochecha.direita { right: 30px; }

        /* Boca */
        .boca {
            position: absolute;
            width: 50px;
            height: 25px;
            border: 4px solid #8b0044;
            border-top: none;
            border-radius: 0 0 50px 50px;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.15s ease;
        }

        .boca.aberta {
            width: 60px;
            height: 45px;
            background: #8b0044;
            border-radius: 50%;
            border: 4px solid #8b0044;
        }

        /* Braços */
        .braco {
            position: absolute;
            width: 50px;
            height: 25px;
            background: radial-gradient(circle, #ff9ec7, #ff69b4);
            border-radius: 50px;
            top: 110px;
            transition: all 0.15s ease;
        }

        .braco.esquerdo {
            left: -25px;
            transform-origin: right center;
            transform: rotate(20deg);
        }

        .braco.direito {
            right: -25px;
            transform-origin: left center;
            transform: rotate(-20deg);
        }

        /* Pernas */
        .perna {
            position: absolute;
            width: 40px;
            height: 30px;
            background: radial-gradient(circle, #ff9ec7, #ff69b4);
            border-radius: 50px;
            bottom: -10px;
            transition: all 0.15s ease;
        }

        .perna.esquerda { left: 50px; }
        .perna.direita { right: 50px; }

        /* Partículas */
        .particula {
            position: absolute;
            pointer-events: none;
            font-size: 1.5rem;
            animation: subirParticula 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes subirParticula {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 3px solid #ff69b4;
            pointer-events: none;
            animation: expandir 0.6s ease-out forwards;
        }

        @keyframes expandir {
            0% {
                width: 50px;
                height: 50px;
                opacity: 1;
                transform: translate(-50%, -50%);
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
                transform: translate(-50%, -50%);
            }
        }

        .instrucao {
            color: #aaa;
            margin-top: 40px;
            font-size: 0.95rem;
            animation: piscar 1.5s infinite;
        }

        @keyframes piscar {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Estrelas de fundo */
        .estrela {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>🩷 Squish Squish 🩷</h1>
    <p class="subtitulo">Aperte o bichinho fofo!</p>

    <div class="contador">Apertos: <span id="contador">0</span></div>

    <div class="squish-container" id="container">
        <div class="squish" id="squish">
            <div class="olho esquerdo"><div class="pupila"></div></div>
            <div class="olho direito"><div class="pupila"></div></div>
            <div class="bochecha esquerda"></div>
            <div class="bochecha direita"></div>
            <div class="boca" id="boca"></div>
            <div class="braco esquerdo"></div>
            <div class="braco direito"></div>
            <div class="perna esquerda"></div>
            <div class="perna direita"></div>
        </div>
    </div>

    <p class="instrucao">Clique no bichinho para apertar!</p>

    <script>
        const squish = document.getElementById('squish');
        const boca = document.getElementById('boca');
        const contadorEl = document.getElementById('contador');
        const container = document.getElementById('container');

        let contador = 0;
        let audioCtx = null;

        // Emojis de partículas
        const emojis = ['💕', '✨', '💖', '⭐', '🌸', '💗', '🎀', '💫'];

        // Inicializa áudio
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Toca som de squish
        function tocarSom() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            const freq = 300 + Math.random() * 200;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // Cria partícula
        function criarParticula(x, y) {
            const particula = document.createElement('div');
            particula.className = 'particula';
            particula.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            particula.style.left = x + 'px';
            particula.style.top = y + 'px';
            particula.style.position = 'fixed';
            document.body.appendChild(particula);
            setTimeout(() => particula.remove(), 800);
        }

        // Cria ripple
        function criarRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.position = 'fixed';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // Função de apertar
        function apertar(e) {
            e.preventDefault();
            
            contador++;
            contadorEl.textContent = contador;
            contadorEl.style.transform = 'scale(1.3)';
            setTimeout(() => contadorEl.style.transform = 'scale(1)', 150);

            // Animação de apertar
            squish.classList.add('apertado');
            boca.classList.add('aberta');

            // Som
            tocarSom();

            // Partículas
            const rect = squish.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 150;
                    const offsetY = (Math.random() - 0.5) * 100;
                    criarParticula(centerX + offsetX, centerY + offsetY);
                }, i * 50);
            }

            // Ripple
            criarRipple(centerX, centerY);

            // Vibração em mobile
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }

            // Reset
            setTimeout(() => {
                squish.classList.remove('apertado');
                boca.classList.remove('aberta');
            }, 150);
        }

        // Eventos
        squish.addEventListener('mousedown', apertar);
        squish.addEventListener('touchstart', apertar, { passive: false });

        // Movimento dos olhos seguindo o mouse
        document.addEventListener('mousemove', (e) => {
            const pupilas = document.querySelectorAll('.pupila');
            const rect = squish.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
            const dist = Math.min(8, Math.hypot(e.clientX - centerX, e.clientY - centerY) / 20);
            
            pupilas.forEach(pupila => {
                pupila.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
            });
        });

        // Cria estrelas de fundo
        for (let i = 0; i < 50; i++) {
            const estrela = document.createElement('div');
            estrela.className = 'estrela';
            estrela.style.left = Math.random() * 100 + '%';
            estrela.style.top = Math.random() * 100 + '%';
            estrela.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(estrela);
        }

        // Efeito de digitar no teclado (espaço também aperta)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                const rect = squish.getBoundingClientRect();
                const fakeEvent = {
                    preventDefault: () => {},
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2
                };
                apertar(fakeEvent);
            }
        });
    </script>
</body>
</html>
