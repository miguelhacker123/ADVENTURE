<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADVENTURES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 675px;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            border-radius: 12px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI OVERLAYS --- */
        .hud-element {
            position: absolute;
            z-index: 10;
            font-weight: bold;
        }

        #lang-selector {
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: 700;
            border-radius: 8px;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border-color: #34d399;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        /* HUD NO CANTO DIREITO (BAIXO DO PAUSE) */
        #hud-counters-right {
            top: 60px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .hud-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 17px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .coin-badge { color: #facc15; border-color: rgba(250, 204, 21, 0.4); }
        .apple-badge { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }

        .canvas-icon-hud {
            width: 24px;
            height: 24px;
        }

        #level-hud {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #f8fafc;
            font-size: 20px;
            letter-spacing: 3px;
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        #btn-pause {
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: 1px solid #fca5a5;
            color: #fff;
            padding: 7px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            z-index: 12;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        #btn-pause:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* --- MENUS ELEGANTES & MODERNOS --- */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 18px;
        }

        .title {
            font-size: 58px;
            font-weight: 900;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(34, 197, 94, 0.3));
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-align: center;
        }

        .btn-moss {
            width: 250px;
            padding: 16px 0;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            border: 1px solid #4ade80;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-moss:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }

        .btn-moss:active {
            transform: translateY(1px);
        }

        #levels-menu { display: none; }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 80%;
            max-height: 60%;
            overflow-y: auto;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .level-btn {
            width: 60px;
            height: 60px;
            background: #334155;
            border: 1px solid #475569;
            color: #94a3b8;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: not-allowed;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .level-btn.unlocked {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-color: #22c55e;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .level-btn.unlocked:hover { transform: scale(1.08); border-color: #4ade80; }

        .btn-back {
            margin-top: 10px;
            width: 160px;
            padding: 12px;
            font-size: 15px;
        }

        #pause-menu { display: none; }

        /* --- CONTROLES TOUCH --- */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 90px;
            z-index: 15;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .touch-group-left, .touch-group-right {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .basket-btn {
            width: 70px;
            height: 70px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            backdrop-filter: blur(8px);
            touch-action: manipulation;
        }

        .square-jump-btn {
            width: 75px;
            height: 75px;
            background: rgba(34, 197, 94, 0.4);
            border: 1px solid rgba(74, 222, 128, 0.6);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(8px);
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- SELEÇÃO DE IDIOMAS -->
    <div id="lang-selector" class="hud-element">
        <button class="lang-btn active" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <!-- HUD DE MOEDAS E MAÇÃS (CANTO DIREITO ABAIXO DO PAUSE) -->
    <div id="hud-counters-right" class="hud-element">
        <div class="hud-badge coin-badge">
            <canvas id="coin-icon-hud" class="canvas-icon-hud" width="24" height="24"></canvas>
            <span id="coin-count">0</span>
        </div>
        <div class="hud-badge apple-badge">
            <canvas id="apple-icon-hud" class="canvas-icon-hud" width="24" height="24"></canvas>
            <span id="apple-count">0</span>
        </div>
    </div>

    <!-- HUD FASE ATUAL -->
    <div id="level-hud" class="hud-element">
        <span id="level-text">FASE 1</span>
    </div>

    <!-- BOTÃO PAUSE -->
    <button id="btn-pause" class="hud-element" onclick="togglePause()">|| PAUSE</button>

    <!-- MENU INICIAL -->
    <div id="main-menu" class="menu-screen">
        <h1 class="title">ADVENTURES</h1>
        <button id="btn-play" class="btn-moss" onclick="startGame()">PLAY</button>
        <button id="btn-fases" class="btn-moss" onclick="showLevels()">FASES</button>
    </div>

    <!-- MENU SELEÇÃO DE FASES -->
    <div id="levels-menu" class="menu-screen">
        <h1 class="title" id="select-level-title">FASES</h1>
        <div class="levels-grid" id="levels-grid"></div>
        <button id="btn-back" class="btn-moss btn-back" onclick="hideLevels()">VOLTAR</button>
    </div>

    <!-- MENU PAUSE -->
    <div id="pause-menu" class="menu-screen">
        <h1 class="title" id="pause-title">PAUSADO</h1>
        <button id="btn-resume" class="btn-moss" onclick="togglePause()">CONTINUAR</button>
        <button id="btn-reset" class="btn-moss" onclick="resetCurrentMatch()">REINICIAR</button>
        <button id="btn-quit" class="btn-moss" onclick="quitToMenu()">MENU</button>
    </div>

    <!-- CONTROLES TOUCH -->
    <div id="touch-controls">
        <div class="touch-group-left">
            <div class="basket-btn" id="btn-left">&lt;</div>
            <div class="basket-btn" id="btn-right">&gt;</div>
        </div>
        <div class="touch-group-right">
            <div class="square-jump-btn" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
/* --- TEXTOS E IDIOMAS --- */
const i18n = {
    pt: {
        play: "PLAY",
        fases: "FASES",
        selectLevel: "SELECIONE A FASE",
        back: "VOLTAR",
        level: "FASE",
        jump: "PULAR",
        win: "FASE CONCLUÍDA!",
        gameover: "VOCÊ MORREU!",
        paused: "PAUSADO",
        resume: "CONTINUAR",
        reset: "REINICIAR",
        quit: "MENU"
    },
    en: {
        play: "PLAY",
        fases: "LEVELS",
        selectLevel: "SELECT LEVEL",
        back: "BACK",
        level: "LEVEL",
        jump: "JUMP",
        win: "LEVEL COMPLETE!",
        gameover: "YOU DIED!",
        paused: "PAUSED",
        resume: "RESUME",
        reset: "RESTART",
        quit: "MENU"
    }
};

let currentLang = 'pt';

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if(lang === 'pt') document.querySelectorAll('.lang-btn')[0].classList.add('active');
    else document.querySelectorAll('.lang-btn')[1].classList.add('active');

    document.getElementById('btn-play').innerText = i18n[lang].play;
    document.getElementById('btn-fases').innerText = i18n[lang].fases;
    document.getElementById('select-level-title').innerText = i18n[lang].selectLevel;
    document.getElementById('btn-back').innerText = i18n[lang].back;
    document.getElementById('btn-jump').innerText = i18n[lang].jump;
    document.getElementById('pause-title').innerText = i18n[lang].paused;
    document.getElementById('btn-resume').innerText = i18n[lang].resume;
    document.getElementById('btn-reset').innerText = i18n[lang].reset;
    document.getElementById('btn-quit').innerText = i18n[lang].quit;
    updateLevelHUD();
}

/* --- MOEDAS E MAÇÃS (SALVAMENTO) --- */
let totalCoins = parseInt(localStorage.getItem('adventures_coins')) || 0;
let totalApples = parseInt(localStorage.getItem('adventures_apples')) || 0;
let unlockedLevel = parseInt(localStorage.getItem('adventures_level')) || 1;
let currentLevel = 1;

function updateHUDCounters() {
    document.getElementById('coin-count').innerText = totalCoins;
    document.getElementById('apple-count').innerText = totalApples;
    localStorage.setItem('adventures_coins', totalCoins);
    localStorage.setItem('adventures_apples', totalApples);
}

function saveProgress() {
    localStorage.setItem('adventures_coins', totalCoins);
    localStorage.setItem('adventures_apples', totalApples);
    if (currentLevel >= unlockedLevel && unlockedLevel < 20) {
        unlockedLevel = currentLevel + 1;
        localStorage.setItem('adventures_level', unlockedLevel);
    }
}

/* --- CANVAS & ENGINE --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 675;

let isPlaying = false;
let isPaused = false;
let keys = { left: false, right: false, up: false };

// JOGADOR
const player = {
    x: 80,
    y: 300,
    width: 38,
    height: 56,
    vx: 0,
    vy: 0,
    speed: 5.5,
    jumpForce: -13.5,
    gravity: 0.6,
    grounded: false,
    facing: 'right',
    animFrame: 0
};

let platforms = [];
let obstacles = [];
let coins = [];
let enemies = [];
let apples = []; 
let particles = [];
let mountains = [];
let flag = null;
let globalTime = 0;

/* --- GERADOR DE FASES --- */
function generateLevel(lvl) {
    platforms = [];
    obstacles = [];
    coins = [];
    enemies = [];
    apples = [];
    particles = [];
    mountains = [];

    platforms.push({ x: 0, y: 500, w: 280, h: 175, type: 'grass' });

    let currentX = 280;
    const levelLength = 25 + lvl * 5;

    let mountainX = -300;
    for (let m = 0; m < levelLength / 2; m++) {
        let mW = 600 + Math.random() * 400;
        let mH = 280 + Math.random() * 160;
        mountains.push({
            x: mountainX,
            y: 580 - mH,
            w: mW,
            h: mH,
            color: m % 2 === 0 ? '#1e293b' : '#0f172a'
        });
        mountainX += mW - 150;
    }

    const slugColors = ['#9333ea', '#dc2626', '#2563eb'];

    for (let i = 0; i < levelLength; i++) {
        let gap = 80 + Math.random() * 70 + (lvl * 2);
        currentX += gap;

        let platWidth = Math.max(160, 280 - lvl * 4 + Math.random() * 60);
        let platY = 380 + Math.random() * 130;

        platforms.push({ x: currentX, y: platY, w: platWidth, h: 675 - platY, type: 'grass' });

        // MAÇÃS NO MAPA
        if (i > 0 && Math.random() < 0.4) {
            apples.push({
                x: currentX + platWidth / 2 - 12,
                baseY: platY - 45,
                y: platY - 45,
                w: 24,
                h: 24,
                eaten: false,
                floatOffset: Math.random() * Math.PI * 2
            });
        }

        // OBSTÁCULOS REALISTAS
        if (Math.random() > 0.45) {
            let obsType = Math.random() > 0.5 ? 'stone' : 'trunk';
            let obsW = obsType === 'stone' ? 38 : 52;
            let obsH = obsType === 'stone' ? 32 : 30;
            
            obstacles.push({
                x: currentX + platWidth / 2 - obsW / 2,
                y: platY - obsH,
                w: obsW,
                h: obsH,
                type: obsType
            });
        }

        // LESMAS
        if (i > 0 && Math.random() > 0.3) {
            let randomColor = slugColors[Math.floor(Math.random() * slugColors.length)];
            enemies.push({
                x: currentX + 20,
                y: platY - 24,
                w: 38,
                h: 24,
                vx: 1.3,
                hp: 2,
                platMin: currentX,
                platMax: currentX + platWidth,
                animTimer: 0,
                color: randomColor
            });
        }

        // TRONCO FLUTUANTE
        if (gap > 110 && Math.random() > 0.3) {
            let logX = currentX - gap / 2 - 30;
            let logY = 500;
            platforms.push({ x: logX, y: logY, w: 70, h: 22, type: 'floating_wood' });
        }

        // MOEDAS REALISTAS
        let coinsInPlat = 1 + Math.floor(Math.random() * 3);
        for (let c = 0; c < coinsInPlat; c++) {
            coins.push({
                x: currentX + 25 + (c * 35),
                y: platY - 50 - (Math.random() * 30),
                w: 24,
                h: 24,
                collected: false
            });
        }

        currentX += platWidth;
    }

    currentX += 100;
    platforms.push({ x: currentX, y: 480, w: 280, h: 200, type: 'grass' });
    flag = { x: currentX + 180, y: 380, w: 20, h: 100 };

    player.x = 80;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
}

function spawnSmoke(x, y, color = '#cbd5e1') {
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x + Math.random() * 20 - 10,
            y: y + Math.random() * 10,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 2 - 1,
            size: 5 + Math.random() * 6,
            alpha: 1,
            color: color
        });
    }
}

let cameraX = 0;

function update() {
    if (!isPlaying || isPaused) return;

    globalTime += 0.05;

    // Movimento do Jogador
    if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.animFrame += 0.25;
    } else if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.animFrame += 0.25;
    } else {
        player.vx = 0;
        player.animFrame = 0;
    }

    if (keys.up && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
    }

    player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Colisão com Plataformas
    player.grounded = false;
    for (let p of platforms) {
        if (
            player.x < p.x + p.w &&
            player.x + player.width > p.x &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.h + player.vy + 4 &&
            player.vy >= 0
        ) {
            player.grounded = true;
            player.vy = 0;
            player.y = p.y - player.height;
        }
    }

    // MAÇÃS (COLETA NORMAL, APENAS PONTOS E CONTAGEM)
    for (let apple of apples) {
        if (!apple.eaten) {
            apple.y = apple.baseY + Math.sin(globalTime * 2.5 + apple.floatOffset) * 6;

            if (
                player.x < apple.x + apple.w &&
                player.x + player.width > apple.x &&
                player.y < apple.y + apple.h &&
                player.y + player.height > apple.y
            ) {
                apple.eaten = true;
                totalApples += 1;
                updateHUDCounters();
                spawnSmoke(apple.x + 12, apple.y + 12, '#f87171');
            }
        }
    }

    // Obstáculos
    for (let obs of obstacles) {
        if (
            player.x < obs.x + obs.w &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.h &&
            player.y + player.height > obs.y
        ) {
            if (player.vx > 0 && player.x + player.width - player.vx <= obs.x) {
                player.x = obs.x - player.width;
            } else if (player.vx < 0 && player.x - player.vx >= obs.x + obs.w) {
                player.x = obs.x + obs.w;
            } else if (player.vy > 0 && player.y + player.height - player.vy <= obs.y) {
                player.grounded = true;
                player.vy = 0;
                player.y = obs.y - player.height;
            }
        }
    }

    // LESMAS
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.x += e.vx;
        e.animTimer += 0.15;

        if (e.x <= e.platMin || e.x + e.w >= e.platMax) {
            e.vx *= -1;
        }

        if (
            player.x < e.x + e.w &&
            player.x + player.width > e.x &&
            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ) {
            if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
                player.vy = -9;
                e.hp -= 1;

                if (e.hp === 1) {
                    e.h = 16;
                    e.y += 8;
                } else if (e.hp <= 0) {
                    spawnSmoke(e.x + e.w / 2, e.y + e.h / 2);
                    coins.push({ x: e.x + 5, y: e.y - 10, w: 24, h: 24, collected: false });
                    enemies.splice(i, 1);
                    continue;
                }
            } else {
                alert(i18n[currentLang].gameover);
                generateLevel(currentLevel);
                return;
            }
        }
    }

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.size += 0.1;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    // Coleta Moedas
    for (let coin of coins) {
        if (!coin.collected &&
            player.x < coin.x + coin.w &&
            player.x + player.width > coin.x &&
            player.y < coin.y + coin.h &&
            player.y + player.height > coin.y) {
            coin.collected = true;
            totalCoins += 10;
            updateHUDCounters();
        }
    }

    // Câmera
    cameraX = player.x - 200;
    if (cameraX < 0) cameraX = 0;

    // Queda
    if (player.y > canvas.height) {
        alert(i18n[currentLang].gameover);
        generateLevel(currentLevel);
    }

    // Vitória
    if (flag && player.x > flag.x) {
        saveProgress();
        alert(i18n[currentLang].win);
        if (currentLevel < 20) {
            currentLevel++;
            updateLevelHUD();
            generateLevel(currentLevel);
        } else {
            showMainMenu();
        }
    }
}

/* --- RENDERIZADORES DE ITENS REALISTAS --- */
function drawRealisticCoin(targetCtx, x, y, size) {
    let radius = size / 2;
    let cx = x + radius;
    let cy = y + radius;

    // Sombra
    targetCtx.fillStyle = 'rgba(0,0,0,0.3)';
    targetCtx.beginPath();
    targetCtx.ellipse(cx, cy + radius * 0.8, radius, radius * 0.3, 0, 0, Math.PI * 2);
    targetCtx.fill();

    // Borda Externa de Ouro Secundário
    let gradOuter = targetCtx.createLinearGradient(x, y, x + size, y + size);
    gradOuter.addColorStop(0, '#fef08a');
    gradOuter.addColorStop(0.5, '#eab308');
    gradOuter.addColorStop(1, '#854d0e');

    targetCtx.fillStyle = gradOuter;
    targetCtx.beginPath();
    targetCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    targetCtx.fill();

    // Centro do Relevo
    let gradInner = targetCtx.createLinearGradient(x, y, x + size, y + size);
    gradInner.addColorStop(0, '#facc15');
    gradInner.addColorStop(1, '#ca8a04');

    targetCtx.fillStyle = gradInner;
    targetCtx.beginPath();
    targetCtx.arc(cx, cy, radius * 0.75, 0, Math.PI * 2);
    targetCtx.fill();

    // Símbolo do Cifrão
    targetCtx.fillStyle = '#fef08a';
    targetCtx.font = `bold ${Math.floor(size * 0.65)}px sans-serif`;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    targetCtx.fillText('$', cx, cy);

    // Reflexo de Luz Curvo Realista
    targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    targetCtx.lineWidth = Math.max(1.5, size * 0.08);
    targetCtx.beginPath();
    targetCtx.arc(cx, cy, radius * 0.82, Math.PI * 1.1, Math.PI * 1.6);
    targetCtx.stroke();
}

function drawRealisticApple(targetCtx, x, y, size) {
    let radius = size / 2;
    let cx = x + radius;
    let cy = y + radius;

    // Corpo Redondo 3D
    let grad = targetCtx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
    grad.addColorStop(0, '#fca5a5');
    grad.addColorStop(0.4, '#ef4444');
    grad.addColorStop(1, '#991b1b');

    targetCtx.fillStyle = grad;
    targetCtx.beginPath();
    targetCtx.arc(cx - radius*0.22, cy, radius * 0.78, 0, Math.PI * 2);
    targetCtx.arc(cx + radius*0.22, cy, radius * 0.78, 0, Math.PI * 2);
    targetCtx.fill();

    // Cabinho
    targetCtx.strokeStyle = '#78350f';
    targetCtx.lineWidth = Math.max(2, size * 0.08);
    targetCtx.beginPath();
    targetCtx.moveTo(cx, cy - radius * 0.5);
    targetCtx.quadraticCurveTo(cx + 4, cy - radius * 1.1, cx + 2, cy - radius * 1.2);
    targetCtx.stroke();

    // Folha
    targetCtx.fillStyle = '#22c55e';
    targetCtx.beginPath();
    targetCtx.ellipse(cx + 5, cy - radius * 0.9, radius * 0.35, radius * 0.18, Math.PI / 4, 0, Math.PI * 2);
    targetCtx.fill();

    // Reflexo de Luz
    targetCtx.fillStyle = 'rgba(255,255,255,0.45)';
    targetCtx.beginPath();
    targetCtx.ellipse(cx - radius*0.4, cy - radius*0.3, radius*0.2, radius*0.1, -Math.PI / 4, 0, Math.PI * 2);
    targetCtx.fill();
}

/* --- RENDERIZAÇÃO DO JOGO --- */
function render() {
    // Céu Realista Gradiente
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, '#0f172a');
    skyGradient.addColorStop(0.5, '#1e293b');
    skyGradient.addColorStop(1, '#334155');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // MONTANHAS REALISTAS COM SOMBRAS DE PROFUNDIDADE
    for (let m of mountains) {
        let mParallaxX = m.x - (cameraX * 0.25);
        let gradM = ctx.createLinearGradient(mParallaxX, m.y, mParallaxX, m.y + m.h);
        gradM.addColorStop(0, '#334155');
        gradM.addColorStop(1, '#0f172a');

        ctx.fillStyle = gradM;
        ctx.beginPath();
        ctx.moveTo(mParallaxX, m.y + m.h);
        ctx.lineTo(mParallaxX + m.w / 2, m.y);
        ctx.lineTo(mParallaxX + m.w, m.y + m.h);
        ctx.fill();

        // Neve no topo realista
        let snowGrad = ctx.createLinearGradient(mParallaxX, m.y, mParallaxX, m.y + 60);
        snowGrad.addColorStop(0, '#f8fafc');
        snowGrad.addColorStop(1, 'rgba(248, 250, 252, 0)');
        ctx.fillStyle = snowGrad;
        ctx.beginPath();
        ctx.moveTo(mParallaxX + m.w / 2 - 40, m.y + 50);
        ctx.lineTo(mParallaxX + m.w / 2, m.y);
        ctx.lineTo(mParallaxX + m.w / 2 + 40, m.y + 50);
        ctx.fill();
    }

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Rio Realista
    let waterGrad = ctx.createLinearGradient(0, 580, 0, 675);
    waterGrad.addColorStop(0, '#0284c7');
    waterGrad.addColorStop(1, '#0369a1');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(cameraX, 580, canvas.width, 100);

    // PLATAFORMAS REALISTAS (TERRA PROFUNDA + GRAMA ULTRA DETALHADA)
    for (let p of platforms) {
        if (p.type === 'grass') {
            // Bloco de Terra Realista
            let dirtGrad = ctx.createLinearGradient(p.x, p.y + 18, p.x, p.y + p.h);
            dirtGrad.addColorStop(0, '#78350f');
            dirtGrad.addColorStop(0.3, '#451a03');
            dirtGrad.addColorStop(1, '#1c100b');
            ctx.fillStyle = dirtGrad;
            ctx.fillRect(p.x, p.y + 18, p.w, p.h - 18);

            // Detalhes de Pedras na Terra
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            for (let rx = p.x + 10; rx < p.x + p.w - 10; rx += 35) {
                ctx.fillRect(rx, p.y + 35 + (rx % 20), 12, 8);
            }

            // Topo da Grama Realista (Suave + Raízes penduradas)
            let grassGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + 20);
            grassGrad.addColorStop(0, '#4ade80');
            grassGrad.addColorStop(0.6, '#16a34a');
            grassGrad.addColorStop(1, '#15803d');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(p.x, p.y, p.w, 18);

            // Folhas de Grama em Relevo
            ctx.fillStyle = '#86efac';
            for (let gx = p.x; gx < p.x + p.w; gx += 6) {
                let bladeH = 4 + (gx % 5);
                ctx.fillRect(gx, p.y - bladeH, 3, bladeH);
            }
        } else if (p.type === 'floating_wood') {
            // Tronco de Madeira Realista
            let woodGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
            woodGrad.addColorStop(0, '#a16207');
            woodGrad.addColorStop(1, '#451a03');
            ctx.fillStyle = woodGrad;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(p.x, p.y, p.w, 3);
        }
    }

    // MAÇÃS REALISTAS
    for (let apple of apples) {
        if (!apple.eaten) {
            drawRealisticApple(ctx, apple.x, apple.y, apple.w);
        }
    }

    // OBSTÁCULOS REALISTAS
    for (let obs of obstacles) {
        if (obs.type === 'stone') {
            let stoneGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h);
            stoneGrad.addColorStop(0, '#94a3b8');
            stoneGrad.addColorStop(1, '#334155');
            ctx.fillStyle = stoneGrad;
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 6);
            ctx.fill();
        } else {
            let logGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.h);
            logGrad.addColorStop(0, '#b45309');
            logGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = logGrad;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#fde68a';
            ctx.beginPath();
            ctx.ellipse(obs.x + 4, obs.y + obs.h/2, 3, obs.h/2 - 2, 0, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // LESMAS
    for (let e of enemies) {
        let bounce = Math.sin(e.animTimer * 5) * 2;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.roundRect(e.x, e.y + bounce, e.w, e.h - bounce, [10, 10, 0, 0]);
        ctx.fill();

        ctx.fillStyle = '#fff';
        let eyeX = e.vx > 0 ? e.x + e.w - 10 : e.x + 4;
        ctx.fillRect(eyeX, e.y + 4 + bounce, 6, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(eyeX + (e.vx > 0 ? 3 : 0), e.y + 6 + bounce, 3, 3);
    }

    // MOEDAS REALISTAS NO MAPA
    for (let coin of coins) {
        if (!coin.collected) {
            drawRealisticCoin(ctx, coin.x, coin.y, coin.w);
        }
    }

    // PARTÍCULAS
    for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
    }

    // BANDEIRA DE CHEGADA REALISTA
    if (flag) {
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(flag.x, flag.y, 6, flag.h);
        
        let flagGrad = ctx.createLinearGradient(flag.x + 6, flag.y, flag.x + 50, flag.y);
        flagGrad.addColorStop(0, '#22c55e');
        flagGrad.addColorStop(1, '#16a34a');
        ctx.fillStyle = flagGrad;
        ctx.beginPath();
        ctx.moveTo(flag.x + 6, flag.y);
        ctx.lineTo(flag.x + 50, flag.y + 20);
        ctx.lineTo(flag.x + 6, flag.y + 40);
        ctx.fill();
    }

    // DESENHAR PERSONAGEM (CABELO MARROM NATURAL)
    let px = player.x;
    let py = player.y;
    let legAnim = Math.sin(player.animFrame * 2) * 6;

    // Cabelo Marrom Castanho
    ctx.fillStyle = '#512b11';
    ctx.fillRect(px + 4, py, 30, 16);

    // Rosto
    ctx.fillStyle = '#ffdbac';
    ctx.fillRect(px + 6, py + 12, 26, 12);

    // Olhos
    ctx.fillStyle = '#0f172a';
    let eyeX = player.facing === 'right' ? px + 22 : px + 8;
    ctx.fillRect(eyeX, py + 16, 4, 4);

    // Tronco (Camisa Vermelha)
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(px + 4, py + 24, 30, 20);

    // Braços
    ctx.fillStyle = '#ffdbac';
    if (player.facing === 'right') {
        ctx.fillRect(px, py + 26 - legAnim, 5, 14);
        ctx.fillRect(px + 33, py + 26 + legAnim, 5, 14);
    } else {
        ctx.fillRect(px, py + 26 + legAnim, 5, 14);
        ctx.fillRect(px + 33, py + 26 - legAnim, 5, 14);
    }

    // Calça
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(px + 6 - legAnim / 2, py + 44, 10, 10);
    ctx.fillRect(px + 22 + legAnim / 2, py + 44, 10, 10);

    // Sapatos
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px + 4 - legAnim / 2, py + 53, 12, 3);
    ctx.fillRect(px + 22 + legAnim / 2, py + 53, 12, 3);

    ctx.restore();
}

/* --- RENDERIZAR ÍCONES REALISTAS NO HUD --- */
function renderHUDIcons() {
    const coinCanvas = document.getElementById('coin-icon-hud');
    const coinCtx = coinCanvas.getContext('2d');
    coinCtx.clearRect(0, 0, 24, 24);
    drawRealisticCoin(coinCtx, 0, 0, 24);

    const appleCanvas = document.getElementById('apple-icon-hud');
    const appleCtx = appleCanvas.getContext('2d');
    appleCtx.clearRect(0, 0, 24, 24);
    drawRealisticApple(appleCtx, 0, 0, 24);
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

/* --- PAUSE E MENUS --- */
function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
}

function resetCurrentMatch() {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
    generateLevel(currentLevel);
}

function quitToMenu() {
    isPaused = false;
    document.getElementById('pause-menu').style.display = 'none';
    showMainMenu();
}

function updateLevelHUD() {
    document.getElementById('level-text').innerText = `${i18n[currentLang].level} ${currentLevel}`;
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    isPlaying = true;
    isPaused = false;
    generateLevel(currentLevel);
}

function showLevels() {
    document.getElementById('main-menu').style.display = 'none';
    const grid = document.getElementById('levels-grid');
    grid.innerHTML = '';

    for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${i <= unlockedLevel ? 'unlocked' : ''}`;
        btn.innerText = i;
        if (i <= unlockedLevel) {
            btn.onclick = () => {
                currentLevel = i;
                updateLevelHUD();
                document.getElementById('levels-menu').style.display = 'none';
                startGame();
            };
        }
        grid.appendChild(btn);
    }

    document.getElementById('levels-menu').style.display = 'flex';
}

function hideLevels() {
    document.getElementById('levels-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function showMainMenu() {
    isPlaying = false;
    isPaused = false;
    document.getElementById('main-menu').style.display = 'flex';
}

/* --- EVENTOS DE CONTROLE --- */
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = false;
});

function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    el.addEventListener('mousedown', () => { keys[keyProp] = true; });
    el.addEventListener('mouseup', () => { keys[keyProp] = false; });
}

bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'up');

renderHUDIcons();
updateHUDCounters();
setLanguage('pt');
requestAnimationFrame(gameLoop);

</script>
