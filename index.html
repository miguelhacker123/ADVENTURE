<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bus Simulator Pro — Manual Transmission</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow: hidden; background: #000;
    font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    user-select: none; touch-action: none;
    width: 100%; height: 100%; color: #fff;
  }
  canvas { display: block; }

  /* ============ TOP HUD ============ */
  #topHud {
    position: fixed; top: 18px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center;
    z-index: 30; pointer-events: none;
  }
  .chip {
    background: rgba(8,12,18,0.62);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    padding: 8px 18px;
    color: #e6f0ff; font-weight: 600; font-size: 12px;
    letter-spacing: 1.4px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.45);
    display: flex; align-items: center; gap: 8px;
  }

  /* ============ RIGHT HUD ============ */
  #rightHud {
    position: fixed; right: 22px; bottom: 22px;
    display: flex; flex-direction: column; gap: 10px;
    align-items: flex-end; z-index: 25;
  }

  .dashboard {
    background: linear-gradient(145deg, rgba(8,12,18,0.78), rgba(4,6,10,0.78));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 22px;
    box-shadow: 0 14px 50px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .speedo {
    display: flex; flex-direction: column; align-items: center;
    min-width: 92px;
  }
  .speedo .val {
    font-size: 42px; font-weight: 900; line-height: 0.9;
    color: #d4f6ff; letter-spacing: -1px;
    text-shadow: 0 0 22px rgba(90,200,255,0.9), 0 0 8px rgba(255,255,255,0.4);
    font-variant-numeric: tabular-nums;
  }
  .speedo .unit {
    font-size: 9px; color: #7fa8c4; letter-spacing: 3px;
    margin-top: 4px; font-weight: 700;
  }

  .rpm-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 80px;
  }
  .rpm-bar {
    width: 74px; height: 7px; border-radius: 6px;
    background: rgba(0,0,0,0.65);
    overflow: hidden;
    box-shadow: inset 0 1px 3px #000;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .rpm-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3aa0ff 0%, #58d68d 45%, #f4d03f 75%, #e74c3c 100%);
    border-radius: 6px;
    transition: width 0.06s linear;
    box-shadow: 0 0 10px rgba(255,120,80,0.7);
  }
  .rpm-label {
    font-size: 9px; color: #7fa8c4; letter-spacing: 1.5px; font-weight: 700;
  }

  /* ====== CAIXA DE MARCHA ====== */
  .gear-section {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .gear-display {
    width: 64px; height: 58px;
    border-radius: 12px;
    background: linear-gradient(145deg, #0a0d12, #04060a);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), 0 0 20px rgba(255,180,60,0.15);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  .gear-num {
    font-size: 30px; font-weight: 900; line-height: 1;
    color: #ffbe4a;
    text-shadow: 0 0 18px rgba(255,180,60,0.95), 0 0 6px rgba(255,200,120,1);
    font-variant-numeric: tabular-nums;
  }
  .gear-num.rev { color: #ff6b5a; text-shadow: 0 0 18px rgba(255,90,70,0.95); }
  .gear-num.neutral { color: #7fa8c4; text-shadow: 0 0 12px rgba(120,170,200,0.6); }
  .gear-num.auto { color: #5ddc7a; text-shadow: 0 0 18px rgba(90,220,120,0.9); }
  .gear-sub {
    font-size: 8px; color: #6f8ea8; letter-spacing: 2px; font-weight: 700;
    margin-top: 2px;
  }

  .gear-buttons {
    display: flex; gap: 6px;
  }
  .gear-btn {
    width: 34px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(160deg, #1a2028, #0a0e14);
    border: 1px solid rgba(255,255,255,0.12);
    color: #cfd8e3; font-weight: 900; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
    box-shadow: 0 3px 0 #05080c, 0 6px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all 0.06s;
    user-select: none;
  }
  .gear-btn:active, .gear-btn.active {
    transform: translateY(3px);
    box-shadow: 0 0px 0 #05080c, 0 2px 6px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.2);
    background: linear-gradient(160deg, #2a3a4a, #14202c);
  }
  .gear-btn.up { color: #5ddc7a; }
  .gear-btn.down { color: #ff9a6a; }

  /* ====== PEDAIS ====== */
  .pedals {
    display: flex; gap: 14px; padding: 14px 18px;
    background: linear-gradient(145deg, rgba(8,12,18,0.78), rgba(4,6,10,0.78));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    box-shadow: 0 14px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .pedal {
    width: 74px; height: 74px; border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 800; font-size: 10px; color: #dfe9f2;
    letter-spacing: 1.2px;
    background: radial-gradient(circle at 50% 25%, #2a3240, #0f131a 70%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 0 #05080c, 0 14px 30px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.08);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
    cursor: pointer; touch-action: none;
    position: relative; overflow: hidden;
  }
  .pedal::before {
    content: ''; position: absolute; inset: 6px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 60%);
    pointer-events: none;
  }
  .pedal .ico { font-size: 18px; line-height: 1; margin-bottom: 2px; }
  .pedal.active {
    transform: translateY(8px);
    box-shadow: 0 0px 0 #05080c, 0 4px 14px rgba(0,0,0,0.7), inset 0 0 25px rgba(255,255,255,0.2);
  }
  #pedalBrake { background: radial-gradient(circle at 50% 25%, #6b1f1f, #2a0808 70%); }
  #pedalBrake.active { background: radial-gradient(circle at 50% 25%, #d63a2a, #6b1f1f 70%); }
  #pedalAccel { background: radial-gradient(circle at 50% 25%, #1f5c34, #08210f 70%); }
  #pedalAccel.active { background: radial-gradient(circle at 50% 25%, #35c46a, #1f5c34 70%); }

  .handbrake {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(145deg, rgba(8,12,18,0.8), rgba(4,6,10,0.8));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 40px; padding: 12px 22px;
    color: #cfd8e3; font-weight: 700; font-size: 12px;
    letter-spacing: 1.4px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all 0.2s; touch-action: none;
  }
  .hb-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #333; box-shadow: inset 0 1px 3px #000;
    transition: all 0.25s;
  }
  .handbrake.on {
    background: linear-gradient(145deg, rgba(180,30,30,0.85), rgba(80,10,10,0.85));
    border-color: rgba(255,90,80,0.7);
    color: #fff;
    box-shadow: 0 0 35px rgba(255,70,50,0.6), 0 10px 30px rgba(0,0,0,0.55);
  }
  .handbrake.on .hb-dot {
    background: #ff5a3a;
    box-shadow: 0 0 18px #ff5a3a, inset 0 1px 3px rgba(255,255,255,0.4);
  }

  /* ============ VOLANTE ============ */
  #wheelWrap {
    position: fixed; left: 24px; bottom: 24px;
    width: 250px; height: 250px;
    z-index: 26; touch-action: none;
    cursor: grab;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,0.7));
  }
  #wheelWrap:active { cursor: grabbing; }
  #wheelSvg {
    width: 100%; height: 100%;
    transform-origin: center center;
    will-change: transform;
    transition: transform 0.016s linear;
  }

  #alertMsg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #ff6a4a; font-size: 22px; font-weight: 800;
    letter-spacing: 3px; opacity: 0;
    pointer-events: none; z-index: 100;
    text-shadow: 0 0 20px rgba(255,80,50,0.9);
    transition: opacity 0.3s;
  }

  /* Indicador de marcha recomendada */
  #shiftHint {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, 60px);
    color: #ffdd44; font-size: 16px; font-weight: 800;
    letter-spacing: 2px; opacity: 0;
    pointer-events: none; z-index: 100;
    text-shadow: 0 0 12px rgba(255,200,60,0.9);
    transition: opacity 0.2s;
  }

  @media (max-width: 820px) {
    #wheelWrap { width: 170px; height: 170px; left: 12px; bottom: 12px; }
    #rightHud { right: 10px; bottom: 10px; gap: 8px; }
    .pedal { width: 58px; height: 58px; font-size: 9px; }
    .pedal .ico { font-size: 15px; }
    .pedals { padding: 10px 12px; gap: 8px; border-radius: 22px; }
    .dashboard { padding: 10px 14px; gap: 14px; border-radius: 18px; }
    .speedo .val { font-size: 30px; }
    .speedo { min-width: 66px; }
    .rpm-wrap { min-width: 52px; }
    .rpm-bar { width: 46px; height: 6px; }
    .gear-display { width: 50px; height: 46px; }
    .gear-num { font-size: 22px; }
    .gear-btn { width: 28px; height: 24px; font-size: 15px; }
    .handbrake { padding: 9px 14px; font-size: 10px; letter-spacing: 1px; gap: 7px; }
    .chip { padding: 6px 12px; font-size: 10px; letter-spacing: 1px; }
  }
  @media (max-width: 520px) {
    #wheelWrap { width: 130px; height: 130px; }
    .pedal { width: 48px; height: 48px; font-size: 8px; }
    .pedal .ico { font-size: 12px; }
    .speedo .val { font-size: 22px; }
    .gear-display { width: 42px; height: 38px; }
    .gear-num { font-size: 18px; }
    .gear-btn { width: 24px; height: 20px; font-size: 13px; }
    .rpm-wrap { display: none; }
  }
</style>
</head>
<body>

<div id="alertMsg">⚠ FRENAGEM DE EMERGÊNCIA</div>
<div id="shiftHint"></div>

<div id="topHud">
  <div class="chip" id="timeChip">☀ 08:30</div>
  <div class="chip" id="distChip">0.00 km</div>
  <div class="chip" id="fpsChip">60 FPS</div>
</div>

<div id="rightHud">
  <div class="dashboard">
    <div class="speedo">
      <div class="val" id="speedDisplay">0</div>
      <div class="unit">KM/H</div>
    </div>
    <div class="rpm-wrap">
      <div class="rpm-bar"><div class="rpm-fill" id="rpmFill"></div></div>
      <div class="rpm-label" id="rpmLabel">800 RPM</div>
    </div>
    <div class="gear-section">
      <div class="gear-display">
        <div class="gear-num" id="gearNum">N</div>
        <div class="gear-sub">MARCHA</div>
      </div>
      <div class="gear-buttons">
        <div class="gear-btn down" id="gearDown">▼</div>
        <div class="gear-btn up" id="gearUp">▲</div>
      </div>
    </div>
  </div>

  <div class="pedals">
    <div class="pedal" id="pedalBrake">
      <span class="ico">🛑</span>RÉ
    </div>
    <div class="pedal" id="pedalAccel">
      <span class="ico">⚡</span>ACEL
    </div>
  </div>

  <div class="handbrake" id="handbrakeBtn">
    <div class="hb-dot"></div> FREIO DE MÃO
  </div>
</div>

<div id="wheelWrap">
  <svg id="wheelSvg" viewBox="0 0 240 240">
    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="30%">
        <stop offset="0%" stop-color="#3a4250"/>
        <stop offset="100%" stop-color="#0a0d12"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#2a323d"/>
        <stop offset="100%" stop-color="#080b10"/>
      </radialGradient>
    </defs>
    <circle cx="120" cy="120" r="112" fill="none" stroke="#05080c" stroke-width="5"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="url(#rimGrad)" stroke-width="24"/>
    <circle cx="120" cy="120" r="108" fill="none" stroke="#4d5666" stroke-width="1.5" opacity="0.6"/>
    <circle cx="120" cy="120" r="90" fill="none" stroke="#1a1f27" stroke-width="3"/>
    <g stroke="#1a1f27" stroke-width="18" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="72"/>
      <line x1="120" y1="168" x2="120" y2="210"/>
      <line x1="30" y1="120" x2="72" y2="120"/>
      <line x1="168" y1="120" x2="210" y2="120"/>
    </g>
    <circle cx="120" cy="120" r="38" fill="url(#centerGrad)" stroke="#3a4250" stroke-width="3"/>
    <circle cx="120" cy="120" r="24" fill="none" stroke="#2a323d" stroke-width="2"/>
    <path d="M120 106 L128 120 L120 134 L112 120 Z" fill="#c9a24a" opacity="0.95"/>
    <rect x="116" y="20" width="8" height="16" rx="4" fill="#ffb84a" opacity="0.85"/>
  </svg>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   RENDERER
========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

/* =========================================================
   CENA + CÂMERA
========================================================= */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaac4dd, 60, 380);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1200);
camera.rotation.order = 'YXZ';

/* =========================================================
   RETROVISORES FUNCIONAIS (Render Targets)
   Cada espelho tem uma câmera própria que renderiza a cena
   de trás. Depois projetamos no vidro do espelho.
========================================================= */
const mirrorRenderTargetL = new THREE.WebGLRenderTarget(320, 160, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
});
const mirrorRenderTargetR = new THREE.WebGLRenderTarget(320, 160, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
});
const mirrorRenderTargetInt = new THREE.WebGLRenderTarget(320, 90, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
});

const mirrorCamL = new THREE.PerspectiveCamera(55, 2.0, 0.5, 500);
const mirrorCamR = new THREE.PerspectiveCamera(55, 2.0, 0.5, 500);
const mirrorCamInt = new THREE.PerspectiveCamera(50, 3.55, 0.5, 300);

scene.add(mirrorCamL);
scene.add(mirrorCamR);
scene.add(mirrorCamInt);

/* =========================================================
   ILUMINAÇÃO
========================================================= */
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x2a3a2a, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d8, 1.8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 500;
sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

const ambient = new THREE.AmbientLight(0x404a5a, 0.4);
scene.add(ambient);

/* =========================================================
   COCKPIT
========================================================= */
const cockpit = new THREE.Group();
camera.add(cockpit);
scene.add(camera);

const matBlack  = new THREE.MeshStandardMaterial({ color: 0x08090c, roughness: 0.95, metalness: 0.1 });
const matDash   = new THREE.MeshStandardMaterial({ color: 0x14181e, roughness: 0.75, metalness: 0.15 });
const matPlastic= new THREE.MeshStandardMaterial({ color: 0x1e242c, roughness: 0.6,  metalness: 0.25 });
const matChrome = new THREE.MeshStandardMaterial({ color: 0x8a92a0, roughness: 0.25, metalness: 0.9 });
const matRubber = new THREE.MeshStandardMaterial({ color: 0x0d1015, roughness: 0.95, metalness: 0.02 });
const matLed    = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x33dd66, emissiveIntensity: 1.2 });
const matLedRed = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xff3322, emissiveIntensity: 1.2 });

// Visor / parasol
const visor = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.16, 0.7), matBlack);
visor.position.set(0, 0.82, -1.45);
cockpit.add(visor);

const visorLip = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.06, 0.05), matRubber);
visorLip.position.set(0, 0.72, -1.12);
cockpit.add(visorLip);

// Teto
const roof = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.12, 2.0), matDash);
roof.position.set(0, 0.92, -0.5);
cockpit.add(roof);

// Pilares A
const pillarGeo = new THREE.BoxGeometry(0.12, 1.2, 0.14);
const pilL = new THREE.Mesh(pillarGeo, matBlack);
pilL.position.set(-1.42, 0.25, -1.55);
cockpit.add(pilL);
const pilR = new THREE.Mesh(pillarGeo, matBlack);
pilR.position.set(1.42, 0.25, -1.55);
cockpit.add(pilR);

// Travessa superior
const trav = new THREE.Mesh(new THREE.BoxGeometry(2.95, 0.14, 0.16), matBlack);
trav.position.set(0, 0.82, -1.55);
cockpit.add(trav);

// Painel
const dashMain = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.5, 1.2), matDash);
dashMain.position.set(0, -0.55, -1.25);
cockpit.add(dashMain);

// Console central
const consoleC = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.35, 1.0), matBlack);
consoleC.position.set(0, -0.42, -0.9);
cockpit.add(consoleC);

const consoleTop = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.05, 1.0), matChrome);
consoleTop.position.set(0, -0.25, -0.9);
cockpit.add(consoleTop);

// Painel digital
const screenMat = new THREE.MeshStandardMaterial({ color: 0x050810, emissive: 0x001122, emissiveIntensity: 0.7 });
const screen = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.28, 0.04), screenMat);
screen.position.set(0, -0.45, -0.68);
screen.rotation.x = 0.15;
cockpit.add(screen);

const ledG = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.01), matLed);
ledG.position.set(-0.28, -0.38, -0.66);
cockpit.add(ledG);

const ledR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.01), matLedRed);
ledR.position.set(-0.20, -0.38, -0.66);
cockpit.add(ledR);

for (let i=0; i<4; i++) {
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.02, 12), matPlastic);
  btn.rotation.x = Math.PI/2;
  btn.position.set(0.15 + i * 0.11, -0.42, -0.66);
  cockpit.add(btn);
}

// === VOLANTE 3D ===
const wheelGroup = new THREE.Group();
wheelGroup.position.set(0, -0.32, -0.82);
wheelGroup.rotation.x = -0.4;
cockpit.add(wheelGroup);

const wRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.21, 0.028, 14, 44),
  new THREE.MeshStandardMaterial({ color: 0x10141a, roughness: 0.45, metalness: 0.3 })
);
wheelGroup.add(wRim);

const wRim2 = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.008, 8, 44), matChrome);
wRim2.position.z = 0.015;
wheelGroup.add(wRim2);

for (let i=0; i<3; i++){
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.36, 0.025), matPlastic);
  sp.rotation.z = (i * Math.PI * 2) / 3 + Math.PI/2;
  wheelGroup.add(sp);
}

const wHub = new THREE.Mesh(
  new THREE.CylinderGeometry(0.055, 0.055, 0.04, 20),
  new THREE.MeshStandardMaterial({ color: 0x0a0d12, roughness: 0.4, metalness: 0.6 })
);
wHub.rotation.x = Math.PI/2;
wheelGroup.add(wHub);

const wLogo = new THREE.Mesh(new THREE.CircleGeometry(0.025, 20), matChrome);
wLogo.position.z = 0.021;
wheelGroup.add(wLogo);

/* =========================================================
   ESPELHOS RETROVISORES FUNCIONAIS
   Cada espelho renderiza o que está atrás. Igual Slow Roads.
========================================================= */
function makeRealMirror(side) {
  const g = new THREE.Group();
  const sgn = side === 'left' ? -1 : 1;

  // Braço de suporte

function makeAsphaltTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2a2d33'; ctx.fillRect(0,0,512,512);
  for (let i=0; i<12000; i++){
    const v = 25 + Math.random()*55;
    ctx.fillStyle = `rgba(${v},${v},${v+4},${Math.random()*0.6})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 1.5, 1.5);
  }
  ctx.strokeStyle = 'rgba(20,20,22,0.5)';
  ctx.lineWidth = 1;
  for (let i=0; i<10; i++){
    ctx.beginPath();
    let x = Math.random()*512, y = Math.random()*512;
    ctx.moveTo(x,y);
    for (let j=0; j<8; j++){
      x += (Math.random()-0.5)*40; y += (Math.random()-0.5)*40;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0,0,512,512);
  grd.addColorStop(0, '#3a6b3a');
  grd.addColorStop(0.5, '#4d7a3a');
  grd.addColorStop(1, '#3a6b3a');
  ctx.fillStyle = grd; ctx.fillRect(0,0,512,512);
  for (let i=0; i<8000; i++){
    const g = 60 + Math.random()*90;
    ctx.fillStyle = `rgba(${g*0.45},${g},${g*0.35},${Math.random()*0.7})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

function roadOffsetX(z) {
  return (
    Math.sin(z * 0.0045) * 55 +
    Math.sin(z * 0.0018 + 1.7) * 90 +
    Math.sin(z * 0.0009 + 0.3) * 140 +
    Math.sin(z * 0.00045 - 2.1) * 200
  );
}
function roadOffsetXPrime(z) {
  return (
    Math.cos(z * 0.0045) * 55 * 0.0045 +
    Math.cos(z * 0.0018 + 1.7) * 90 * 0.0018 +
    Math.cos(z * 0.0009 + 0.3) * 140 * 0.0009 +
    Math.cos(z * 0.00045 - 2.1) * 200 * 0.00045
  );
}
function roadTangent(z) { return Math.atan(roadOffsetXPrime(z)); }

const ROAD_W = 15;

const roadChunks = new Map();

function buildRoadChunk(index) {
  const group = new THREE.Group();
  const zStart = index * CHUNK_LEN;
  const zMid = zStart + CHUNK_LEN / 2;

  const NX = 3, NZ = 6;
  const geo = new THREE.BufferGeometry();
  const verts = [], uvs = [], indices = [];
  for (let iz=0; iz<=NZ; iz++){
    const tz = iz/NZ;
    const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    for (let ix=0; ix<=NX; ix++){
      const tx = ix/NX;
      const x = cx + (tx - 0.5) * ROAD_W;
      verts.push(x, 0, worldZ);
      uvs.push(tx * 3, tz * 6);
    }
  }
  for (let iz=0; iz<NZ; iz++){
    for (let ix=0; ix<NX; ix++){
      const a = iz*(NX+1)+ix, b = a+1, c = a+(NX+1), d = c+1;
      indices.push(a,b,c, b,d,c);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const roadMesh = new THREE.Mesh(geo, roadMatBase);
  roadMesh.receiveShadow = true;
  group.add(roadMesh);

  // Linhas centrais
  const numDashes = Math.floor(CHUNK_LEN / 6);
  for (let i=0; i<numDashes; i++){
    const tz = (i + 0.5) / numDashes;
    const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    const ang = roadTangent(worldZ);
    const dash = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 2.6), lineMatYellow);
    dash.position.set(cx, 0.02, worldZ);
    dash.rotation.y = ang;
    dash.receiveShadow = true;
    group.add(dash);
  }

  // Linhas laterais
  for (let side = -1; side <= 1; side += 2){
    const ev = [], ei = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      const x1 = cx + side * (ROAD_W/2 - 0.6);
      const x2 = cx + side * (ROAD_W/2 - 0.3);
      ev.push(x1, 0.025, worldZ);
      ev.push(x2, 0.025, worldZ);
    }
    for (let iz=0; iz<NZ; iz++){
      const a = iz*2, b = iz*2+1, c = (iz+1)*2, d = (iz+1)*2+1;
      ei.push(a,b,c, b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(ev, 3));
    g.setIndex(ei);
    g.computeVertexNormals();
    group.add(new THREE.Mesh(g, lineMatWhite));
  }

  // Acostamento
  for (let side = -1; side <= 1; side += 2){
    const ev = [], ei = [];
    for (let iz=0; iz<=NZ; iz++){
      const tz = iz/NZ;
      const localZ = -CHUNK_LEN/2 + tz*CHUNK_LEN;
      const worldZ = zMid + localZ;
      const cx = roadOffsetX(worldZ);
      ev.push(cx + side * (ROAD_W/2), 0.005, worldZ);
      ev.push(cx + side * (ROAD_W/2 + 1.4), 0.005, worldZ);
    }
    for (let iz=0; iz<NZ; iz++){
      const a = iz*2, b = iz*2+1, c = (iz+1)*2, d = (iz+1)*2+1;
      ei.push(a,b,c, b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(ev, 3));
    g.setIndex(ei);
    g.computeVertexNormals();
    group.add(new THREE.Mesh(g, shoulderMat));
  }

  // Props
  const seedRandom = (s) => {
    const x = Math.sin(s * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  };
  for (let i=0; i<8; i++){
    const r1 = seedRandom(index*17 + i*7.31);
    const r2 = seedRandom(index*29 + i*3.11);
    const r3 = seedRandom(index*41 + i*11.71);
    const localZ = -CHUNK_LEN/2 + r1 * CHUNK_LEN;
    const worldZ = zMid + localZ;
    const cx = roadOffsetX(worldZ);
    const side = r2 > 0.5 ? 1 : -1;
    const dist = 4 + r3 * 30;
    const px = cx + side * (ROAD_W/2 + dist);

    if (r3 > 0.25){
      const scale = 0.7 + r1 * 1.0;
      const trunk = new THREE.Mesh(trunkGeo, treeTrunkMat);
      trunk.scale.setScalar(scale);
      trunk.position.set(px, 1.3*scale, worldZ);
      trunk.castShadow = true; trunk.receiveShadow = true;
      group.add(trunk);
      const leafMat = r3 > 0.75 ? treeLeafMat3 : (r3 > 0.5 ? treeLeafMat2 : treeLeafMat);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.scale.setScalar(scale * (0.85 + r2*0.35));
      leaf.position.set(px, 2.7*scale + 0.5, worldZ);
      leaf.castShadow = true;
      group.add(leaf);
      if (r1 > 0.4){
        const leaf2 = new THREE.Mesh(leafGeo, leafMat);
        leaf2.scale.setScalar(scale * 0.7);
        leaf2.position.set(px + 0.6*scale, 3.6*scale, worldZ + 0.4);
        leaf2.castShadow = true;
        group.add(leaf2);
      }
    } else if (r3 > 0.15){
      const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({
        color: 0x666a70, roughness: 1, flatShading: true
      }));
      rock.scale.setScalar(0.4 + r1 * 1.2);
      rock.position.set(px, 0.3, worldZ);
      rock.rotation.set(r1*3, r2*3, r3*3);
      rock.castShadow = true; rock.receiveShadow = true;
      group.add(rock);
    } else if (r3 < 0.07){
      const sign = new THREE.Group();
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.0, 6), signPostMat);
      post.position.y = 1.0; post.castShadow = true;
      sign.add(post);
      const face = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.05), signFaceMat);
      face.position.y = 1.9; face.castShadow = true;
      sign.add(face);
      sign.position.set(px, 0, worldZ);
      sign.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
      group.add(sign);
    }
  }

  group.userData.index = index;
  return group;
}

function ensureChunks(playerZ) {
  const startIdx = Math.floor((playerZ - VIEW_BEHIND) / CHUNK_LEN);
  const endIdx = Math.floor((playerZ + VIEW_AHEAD) / CHUNK_LEN);
  for (let i = startIdx; i <= endIdx; i++){
    if (!roadChunks.has(i)){
      const chunk = buildRoadChunk(i);
      world.add(chunk);
      roadChunks.set(i, chunk);
    }
  }
  for (const [idx, chunk] of roadChunks){
    if (idx < startIdx - 2 || idx > endIdx + 2){
      world.remove(chunk);
      chunk.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      roadChunks.delete(idx);
    }
  }
}

const wheelWrap = document.getElementById('wheelWrap');
const wheelSvg = document.getElementById('wheelSvg');

let dragging = false;
let dragStartAngle = 0;
let dragStartSteer = 0;
const MAX_WHEEL_ANGLE = Math.PI * 0.8;

function pointerAngle(e) {
  const r = wheelWrap.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
  return Math.atan2(y, x);
}
function wheelDown(e){
  e.preventDefault();
  dragging = true;
  dragStartAngle = pointerAngle(e);
  dragStartSteer = bus.steerTarget;
  wheelWrap.style.cursor = 'grabbing';
}
function wheelMove(e){
  if (!dragging) return;
  e.preventDefault();
  const a = pointerAngle(e);
  let delta = a - dragStartAngle;
  while (delta > Math.PI) delta -= Math.PI*2;
  while (delta < -Math.PI) delta += Math.PI*2;
  let steer = dragStartSteer + (delta / MAX_WHEEL_ANGLE) * 1.0;
  bus.steerTarget = Math.max(-1, Math.min(1, steer));
}
function wheelUp(){
  dragging = false;
  wheelWrap.style.cursor = 'grab';
}
wheelWrap.addEventListener('mousedown', wheelDown);
addEventListener('mousemove', wheelMove);
addEventListener('mouseup', wheelUp);
wheelWrap.addEventListener('touchstart', wheelDown, { passive: false });

  bus.brakeInput = brakeInput;

  // === DIREÇÃO ===
  if (!dragging) {
    if (keys['a'] || keys['arrowleft']) bus.steerTarget -= 1.8 * dt;
    if (keys['d'] || keys['arrowright']) bus.steerTarget += 1.8 * dt;
    if (!keys['a'] && !keys['arrowleft'] && !keys['d'] && !keys['arrowright']) {
      bus.steerTarget *= Math.pow(0.04, dt);
      if (Math.abs(bus.steerTarget) < 0.002) bus.steerTarget = 0;
    }
  }
  bus.steerTarget = Math.max(-1, Math.min(1, bus.steerTarget));
  bus.steer += (bus.steerTarget - bus.steer) * Math.min(1, 9 * dt);

  // === TRANSMISSÃO MANUAL: RPM baseado na velocidade e marcha ===
  const wheelRPM = (Math.abs(bus.speed) / (2 * Math.PI * bus.wheelRadius)) * 60;

  if (bus.gear === 0) {
    // Neutro: motor livre
    const targetRPM = bus.rpmIdle + accelInput * 4500;
    bus.rpm += (targetRPM - bus.rpm) * Math.min(1, 4 * dt);
    // no neutro o carro não é movido pelo motor
  } else if (bus.gear === -1) {
    // Ré: ratio fixo 3.8
    const targetRPM = Math.max(bus.rpmIdle, wheelRPM * 3.8 * bus.finalDrive);
    bus.rpm += (targetRPM - bus.rpm) * Math.min(1, 6 * dt);
  } else {
    // Marcha 1..6
    const ratio = bus.gearRatios[bus.gear];
    const targetRPM = Math.max(bus.rpmIdle, wheelRPM * ratio * bus.finalDrive);
    // Reduzir um pouco quando solta o acelerador (engine brake)
    const drop = accelInput < 0.1 ? 500 : 0;
    bus.rpm += ((targetRPM - drop) - bus.rpm) * Math.min(1, 6 * dt);
  }
  bus.rpm = Math.max(bus.rpmIdle, Math.min(bus.rpmMax, bus.rpm));

  // === FORÇA MOTRIZ ===
  let engineForce = 0;
  if (bus.gear !== 0) {
    const ratio = bus.gear > 0 ? bus.gearRatios[bus.gear] : -3.8;
    const rpmRatio = Math.min(1, bus.rpm / bus.rpmMax);
    // Torque máximo no meio da faixa de RPM
    const torqueCurve = 0.5 + 0.7 * Math.sin(rpmRatio * Math.PI * 0.85);
    let torque = bus.engineTorque * rpmRatio * torqueCurve;
    // Não gera força se estiver acima do redline
    if (bus.rpm > bus.rpmMax * 0.95) torque *= 0.2;
    // Perde força em marchas altas em baixa RPM (evita arrancar em 6ª)
    if (bus.gear >= 3 && bus.rpm < bus.rpmIdle * 1.5 && bus.speed < 2) torque *= 0.15;
    if (bus.gear >= 5 && bus.speed < 5) torque *= 0.3;

    engineForce = (torque * ratio * bus.finalDrive / bus.wheelRadius) * bus.throttle;
    // Sentido do movimento baseado na marcha
    if (bus.gear === -1) engineForce = -Math.abs(engineForce);
  }

  // === FREIO MOTOR ===
  let engineBraking = 0;
  if (bus.gear !== 0 && bus.throttle < 0.05 && Math.abs(bus.speed) > 0.5) {
    const ratio = bus.gear > 0 ? bus.gearRatios[bus.gear] : 3.8;
    engineBraking = -Math.sign(bus.speed) * 180 * ratio;
  }

  // === RESISTÊNCIAS ===
  const drag = -0.5 * bus.dragCoef * bus.speed * Math.abs(bus.speed) * 1.2;
  const roll = -bus.rollingResistance * bus.mass * 9.81 * Math.sign(bus.speed) * (Math.abs(bus.speed) > 0.1 ? 1 : 0);

  // === FREIO ===
  let brakeForce = 0;
  if (brakeInput > 0.05) {
    if (bus.speed > 0.2) {
      brakeForce = -brakeInput * 20000;
      if (Math.abs(bus.speed) < 1.5) brakeForce *= 0.5;
    } else if (bus.speed > -0.5) {
      // Parado: freio só segura
      brakeForce = -Math.sign(bus.speed) * brakeInput * 8000;
    } else {
      // Ré
      brakeForce = -brakeInput * 8000;
    }
  }

  // === FREIO DE MÃO ===
  if (bus.handbrake) {
    brakeForce -= Math.sign(bus.speed) * 28000;
    if (Math.abs(bus.speed) < 0.15) bus.speed = 0;
  }

  // === TOTAL ===
  const totalForce = engineForce + engineBraking + drag + roll + brakeForce;
  const accel = totalForce / bus.mass;
  bus.speed += accel * dt;

  // Limites
  if (bus.speed > 34) bus.speed = 34;
  if (bus.speed < -9) bus.speed = -9;
  if (Math.abs(bus.speed) < 0.03 && (bus.throttle < 0.05 && brakeInput < 0.05)) bus.speed = 0;

  // === STALL do motor: RPM abaixo do idle em marcha engatada e sem acelerar ===
  // (simplificado — não deixa morrer, só avisa)

  // === SHIFT KICK (tranco ao trocar marcha) ===
  bus.shiftKick = Math.max(0, bus.shiftKick - dt * 3);

  // === RÓTULO DE MARCHA ===
  let label = 'N';
  if (bus.gear === -1) label = 'R';
  else if (bus.gear >= 1 && bus.gear <= 6) label = String(bus.gear);
  bus.gearLabel = label;

  // === MOVIMENTO / ROTAÇÃO ===
  const speedFactor = Math.min(1, Math.abs(bus.speed) / 8);
  const turnRate = bus.steer * 1.9 * speedFactor * Math.sign(bus.speed || 1);
  bus.yaw += turnRate * dt * Math.min(1, Math.abs(bus.speed) * 0.35);

  const forward = new THREE.Vector3(-Math.sin(bus.yaw), 0, -Math.cos(bus.yaw));
  bus.pos.addScaledVector(forward, bus.speed * dt);
  bus.distance += Math.abs(bus.speed) * dt;

  // === ALERTAS ===
  if (brakeInput > 0.9 && bus.speed > 10 && !bus.handbrake) {
    alertMsg.style.opacity = 1;
  } else {
    alertMsg.style.opacity = 0;
  }

  // === HINT DE MARCHA ===
  // Sugere subir quando RPM muito alta, descer quando muito baixa
  let hint = '';
  if (bus.gear > 0 && bus.gear < 6 && bus.rpm > 5000 && bus.throttle > 0.3) hint = '▲ SUBIR MARCHA';
  else if (bus.gear > 1 && bus.rpm < 1400 && bus.speed > 1) hint = '▼ DESCER MARCHA';
  shiftHint.textContent = hint;
  shiftHint.style.opacity = hint ? 1 : 0;
}

/* =========================================================
   VISUAL
========================================================= */
function updateBusVisual(dt) {
  const speedAbs = Math.abs(bus.speed);
  const baseY = 3.05;

  // === VIBRAÇÃO ===
  const vibAmp = Math.min(0.045, speedAbs * 0.0018) + bus.shiftKick * 0.12;
  const t = performance.now() * 0.001;
  const vx = Math.sin(t * 32) * vibAmp;
  const vy = Math.sin(t * 47 + 1.2) * vibAmp * 1.2;
  const vz = Math.sin(t * 38 + 2.4) * vibAmp * 0.5;

  camera.position.set(bus.pos.x + vx, bus.pos.y + baseY + vy, bus.pos.z + vz);

  const forward = new THREE.Vector3(-Math.sin(bus.yaw), 0, -Math.cos(bus.yaw));
  const lookTarget = new THREE.Vector3(
    bus.pos.x + forward.x * 12,
    bus.pos.y + baseY - 0.1,
    bus.pos.z + forward.z * 12
  );
  camera.lookAt(lookTarget);

  const targetRoll = -bus.steer * 0.075 * Math.min(1, speedAbs / 12);
  bus.cameraRoll += (targetRoll - bus.cameraRoll) * Math.min(1, 5*dt);
  camera.rotateZ(bus.cameraRoll);

  // === VOLANTE ===
  bus.wheelVisual += (bus.steer - bus.wheelVisual) * Math.min(1, 15*dt);
  const wheelDeg = bus.wheelVisual * MAX_WHEEL_ANGLE * (180/Math.PI);
  wheelSvg.style.transform = `rotate(${wheelDeg}deg)`;
  wheelGroup.rotation.z = -bus.wheelVisual * 1.6;

  // === HUD ===
  speedDisplay.textContent = Math.round(speedAbs * 3.6);
  const rpmPercent = (bus.rpm - bus.rpmIdle) / (bus.rpmMax - bus.rpmIdle);
  rpmFill.style.width = Math.max(0, Math.min(1, rpmPercent)) * 100 + '%';
  rpmLabel.textContent = Math.round(bus.rpm) + ' RPM';

  // Número da marcha
  gearNum.textContent = bus.gearLabel;
  gearNum.classList.remove('rev', 'neutral', 'auto');
  if (bus.gear === -1) gearNum.classList.add('rev');
  else if (bus.gear === 0) gearNum.classList.add('neutral');

  // === MUNDO ===
  ground.position.x = bus.pos.x;
  ground.position.z = bus.pos.z;
  mountains.position.x = bus.pos.x;
  mountains.position.z = bus.pos.z;
  ensureChunks(bus.pos.z);

  // === RETROVISORES: posicionar as câmeras ===
  // Câmera esquerda: olha para trás-esquerda
  const backDir = new THREE.Vector3(Math.sin(bus.yaw), 0, Math.cos(bus.yaw));
  const rightDir = new THREE.Vector3(Math.cos(bus.yaw), 0, -Math.sin(bus.yaw));

  // Espelho esquerdo (fica à esquerda do motorista, olhando para trás-esquerda)
  const mLPos = new THREE.Vector3(
    bus.pos.x - rightDir.x * 1.5 + forward.x * 0.5,
    bus.pos.y + 3.3,
    bus.pos.z - rightDir.z * 1.5 + forward.z * 0.5
  );
  mirrorCamL.position.copy(mLPos);
  const mLTarget = new THREE.Vector3(
    bus.pos.x + backDir.x * 15 - rightDir.x * 3,
    bus.pos.y + 3.0,
    bus.pos.z + backDir.z * 15 - rightDir.z * 3
  );
  mirrorCamL.lookAt(mLTarget);

  // Espelho direito
  const mRPos = new THREE.Vector3(
    bus.pos.x + rightDir.x * 1.5 + forward.x * 0.5,
    bus.pos.y + 3.3,
    bus.pos.z + rightDir.z * 1.5 + forward.z * 0.5
  );
  mirrorCamR.position.copy(mRPos);
  const mRTarget = new THREE.Vector3(
    bus.pos.x + backDir.x * 15 + rightDir.x * 3,
    bus.pos.y + 3.0,
    bus.pos.z + backDir.z * 15 + rightDir.z * 3
  );
  mirrorCamR.lookAt(mRTarget);

  // Espelho interno: centro, olha para trás
  const mIPos = new THREE.Vector3(
    bus.pos.x + forward.x * -2.5,
    bus.pos.y + 3.5,
    bus.pos.z + forward.z * -2.5
  );
  mirrorCamInt.position.copy(mIPos);
  const mITarget = new THREE.Vector3(
    bus.pos.x + backDir.x * 30,
    bus.pos.y + 3.2,
    bus.pos.z + backDir.z * 30
  );
  mirrorCamInt.lookAt(mITarget);
}

/* =========================================================
   DIA/NOITE
========================================================= */
function updateDayNight(dt) {
  timeOfDay = (timeOfDay + (24 / DAY_DURATION) * dt) % 24;
  const sunAngle = ((timeOfDay - 6) / 24) * Math.PI * 2;
  const sunHeight = Math.sin(sunAngle);
  const sunDist = 300;

  sun.position.set(
    bus.pos.x + Math.cos(sunAngle) * sunDist,
    Math.max(10, sunHeight * sunDist),
    bus.pos.z + 80
  );
  sun.target.position.set(bus.pos.x, 0, bus.pos.z);
  sun.target.updateMatrixWorld();

  const dayFactor = Math.max(0, sunHeight);
  sun.intensity = 0.08 + dayFactor * 2.0;
  hemi.intensity = 0.2 + dayFactor * 0.9;
  ambient.intensity = 0.12 + dayFactor * 0.45;

  const skyColor = new THREE.Color();
  if (sunHeight > 0.3) {
    skyColor.setHSL(0.58, 0.5, 0.5 + dayFactor * 0.22);
  } else if (sunHeight > -0.1) {
    const k = (sunHeight + 0.1) / 0.4;
    skyColor.lerpColors(new THREE.Color(0x1a1a2e), new THREE.Color(0x9fc0d8), k);
  } else {
    skyColor.setHex(0x06060f);
  }
  scene.background = skyColor;
  scene.fog.color.copy(skyColor);
  scene.fog.near = 60 + dayFactor * 40;
  scene.fog.far = 220 + dayFactor * 380;

  const nightFactor = Math.max(0, -sunHeight * 1.5);
  starsMat.opacity = Math.min(1, nightFactor * 2.5);
  stars.position.x = bus.pos.x;
  stars.position.z = bus.pos.z;

  const hh = Math.floor(timeOfDay).toString().padStart(2,'0');
  const mm = Math.floor((timeOfDay%1)*60).toString().padStart(2,'0');
  const icon = sunHeight > 0.15 ? '☀' : (sunHeight > -0.1 ? '🌅' : '🌙');
  timeChip.textContent = `${icon} ${hh}:${mm}`;
  distChip.textContent = (bus.distance/1000).toFixed(3) + ' km';
}

/* =========================================================
   RENDER FINAL + ESPELHOS
========================================================= */
function renderMirrors() {
  // Salva estado
  const oldBg = scene.background;
  const oldFog = scene.fog;

  // Esconde o cockpit dos espelhos (ele não deve aparecer refletido)
  cockpit.visible = false;

  // Esquerdo
  renderer.setRenderTarget(mirrorRenderTargetL);
  renderer.clear();
  renderer.render(scene, mirrorCamL);

  // Direito
  renderer.setRenderTarget(mirrorRenderTargetR);
  renderer.clear();
  renderer.render(scene, mirrorCamR);

  // Interno
  renderer.setRenderTarget(mirrorRenderTargetInt);
  renderer.clear();
  renderer.render(scene, mirrorCamInt);

  // Volta ao normal
  renderer.setRenderTarget(null);
  cockpit.visible = true;

  scene.background = oldBg;
  scene.fog = oldFog;
}

/* =========================================================
   LOOP
========================================================= */
let last = performance.now();
let fpsSmooth = 60;

function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  fpsSmooth += (1/Math.max(dt, 0.0001) - fpsSmooth) * 0.05;
  fpsChip.textContent = Math.round(fpsSmooth) + ' FPS';

  updateBusPhysics(dt);
  updateBusVisual(dt);
  updateDayNight(dt);

  // Renderiza espelhos (custa um pouco mas vale a pena pelo realismo)
  renderMirrors();

  // Render principal
  renderer.render(scene, camera);

  requestAnimationFrame(loop);
}

/* =========================================================
   INICIALIZAÇÃO
========================================================= */
ensureChunks(0);
wheelSvg.style.transform = 'rotate(0deg)';
camera.position.set(0, 3.05, 0);
camera.lookAt(0, 3.05, -10);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
