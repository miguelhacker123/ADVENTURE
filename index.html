<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #0a0a2e 0%, #000 100%);
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  h1 { font-size: 22px; margin-bottom: 8px; color: #0ff; text-shadow: 0 0 10px #0ff; letter-spacing: 3px; }
  #hud {
    width: 420px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
    color: #0ff;
  }
  #hud span { text-shadow: 0 0 6px #0ff; }
  canvas {
    background: #000;
    border: 2px solid #0ff;
    border-radius: 8px;
    box-shadow: 0 0 20px #0ff, inset 0 0 30px rgba(0,255,255,0.1);
    touch-action: none;
    cursor: crosshair;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { color: #0ff; font-size: 28px; margin-bottom: 12px; text-shadow: 0 0 15px #0ff; letter-spacing: 2px; }
  #overlay p { margin-bottom: 20px; color: #aaa; font-size: 14px; text-align: center; }
  #overlay button {
    padding: 12px 30px;
    background: transparent;
    color: #0ff;
    border: 2px solid #0ff;
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #0ff;
    transition: all 0.2s;
  }
  #overlay button:hover {
    background: #0ff;
    color: #000;
    box-shadow: 0 0 20px #0ff;
  }
  .dica { margin-top: 10px; font-size: 11px; color: #666; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>🚀 SPACE SHOOTER</h1>
  <div id="hud">
    <span>PONTOS: <span id="score">0</span></span>
    <span>VIDAS: <span id="lives">❤❤❤</span></span>
    <span>NÍVEL: <span id="level">1</span></span>
  </div>
  <canvas id="game" width="420" height="560"></canvas>
  <div class="dica">← → mover | ESPAÇO atirar | Toque para mover e atirar</div>

  <div id="overlay">
    <h2 id="ovTitle">🚀 SPACE SHOOTER</h2>
    <p id="ovMsg">
      Mova com ← → ou A/D<br>
      Atire com ESPAÇO<br>
      No celular: toque e arraste para mover (atira sozinho)
    </p>
    <button id="ovBtn">INICIAR</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg = document.getElementById('ovMsg');
const ovBtn = document.getElementById('ovBtn');

const W = canvas.width, H = canvas.height;

// Áudio simples via Web Audio API
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type = 'square', volume = 0.05) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// Estado do jogo
let player, bullets, enemies, enemyBullets, particles, stars;
let score, lives, level, running, keys, spawnTimer, shootCooldown, frameCount;
let touchTarget = null;
let best = parseInt(localStorage.getItem('spaceShooterBest') || '0');

function reset() {
  player = { x: W/2 - 18, y: H - 60, w: 36, h: 36, speed: 5 };
  bullets = [];
  enemies = [];
  enemyBullets = [];
  particles = [];
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 1.5 + 0.3
    });
  }
  score = 0;
  lives = 3;
  level = 1;
  spawnTimer = 0;
  shootCooldown = 0;
  frameCount = 0;
  keys = { left: false, right: false, space: false };
  touchTarget = null;
  running = true;
  updateHUD();
  overlay.classList.add('hidden');
}

function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = '❤'.repeat(Math.max(0, lives)) + '·'.repeat(Math.max(0, 3 - lives));
  levelEl.textContent = level;
}

function spawnEnemy() {
  const size = 28 + Math.random() * 12;
  const x = Math.random() * (W - size);
  const type = Math.random() < 0.15 ? 'shooter' : 'basic';
  enemies.push({
    x, y: -size, w: size, h: size,
    vy: 1 + Math.random() * 0.8 + level * 0.15,
    vx: (Math.random() - 0.5) * 1.5,
    hp: type === 'shooter' ? 2 : 1,
    type,
    shootTimer: Math.floor(Math.random() * 90)
  });
}

function shoot() {
  if (shootCooldown > 0) return;
  bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 12, vy: -10 });
  shootCooldown = 10;
  playSound(880, 0.08, 'square', 0.04);
}

function createParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30,
      maxLife: 30,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function damagePlayer() {
  lives--;
  updateHUD();
  createParticles(player.x + player.w/2, player.y + player.h/2, '#ff0044', 30);
  playSound(120, 0.3, 'sawtooth', 0.08);
  // Piscar jogador e resetar posição
  player.x = W/2 - player.w/2;
  if (lives <= 0) gameOver();
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('spaceShooterBest', best);
    ovTitle.textContent = '🏆 NOVO RECORDE!';
  } else {
    ovTitle.textContent = '💥 GAME OVER';
  }
  ovMsg.innerHTML = `Pontuação: <strong style="color:#0ff">${score}</strong><br>Recorde: <strong style="color:#0ff">${best}</strong>`;
  ovBtn.textContent = 'JOGAR NOVAMENTE';
  overlay.classList.remove('hidden');
}

function update() {
  if (!running) return;
  frameCount++;

  // Estrelas de fundo
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  // Movimento do jogador
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;
  if (touchTarget !== null) {
    const diff = touchTarget - (player.x + player.w/2);
    player.x += Math.max(-player.speed, Math.min(player.speed, diff * 0.3));
  }
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // Tiro automático no mobile
  if (touchTarget !== null || keys.space) shoot();
  if (shootCooldown > 0) shootCooldown--;

  // Atualizar balas
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy;
    if (b.y < -20) bullets.splice(i, 1);
  }

  // Spawnar inimigos
  spawnTimer++;
  const intervalo = Math.max(25, 70 - level * 5);
  if (spawnTimer > intervalo) {
    spawnEnemy();
    spawnTimer = 0;
  }

  // Atualizar inimigos
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.vy;
    e.x += e.vx;
    if (e.x < 0 || e.x + e.w > W) e.vx *= -1;
    e.x = Math.max(0, Math.min(W - e.w, e.x));

    // Inimigo atira
    if (e.type === 'shooter') {
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.y > 0 && e.y < H - 100) {
        enemyBullets.push({ x: e.x + e.w/2 - 3, y: e.y + e.h, w: 6, h: 12, vy: 5 });
        e.shootTimer = 90 + Math.floor(Math.random() * 60);
        playSound(300, 0.08, 'sawtooth', 0.03);
      }
    }

    // Saiu da tela
    if (e.y > H + 30) {
      enemies.splice(i, 1);
      continue;
    }

    // Colisão com balas
    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x &&
          b.y < e.y + e.h && b.y + b.h > e.y) {
        bullets.splice(j, 1);
        e.hp--;
        if (e.hp <= 0) {
          destroyed = true;
          const pontos = e.type === 'shooter' ? 25 : 10;
          score += pontos;
          createParticles(e.x + e.w/2, e.y + e.h/2, '#ff8800', 18);
          playSound(440, 0.12, 'square', 0.06);
          enemies.splice(i, 1);
          updateHUD();
          // Subir de nível
          const novoLevel = 1 + Math.floor(score / 150);
          if (novoLevel > level) {
            level = novoLevel;
            updateHUD();
          }
        } else {
          createParticles(e.x + e.w/2, e.y + e.h/2, '#ffff00', 5);
        }
        break;
      }
    }
    if (destroyed) continue;

    // Colisão com jogador
    if (e.x < player.x + player.w && e.x + e.w > player.x &&
        e.y < player.y + player.h && e.y + e.h > player.y) {
      enemies.splice(i, 1);
      createParticles(e.x + e.w/2, e.y + e.h/2, '#ff4400', 20);
      damagePlayer();
    }
  }

  // Atualizar balas inimigas
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.y += b.vy;
    if (b.y > H + 20) { enemyBullets.splice(i, 1); continue; }
    if (b.x < player.x + player.w && b.x + b.w > player.x &&
        b.y < player.y + player.h && b.y + b.h > player.y) {
      enemyBullets.splice(i, 1);
      damagePlayer();
    }
  }

  // Atualizar partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawShip(x, y, w, h) {
  // Nave do jogador (triângulo ciano)
  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(x + w/2, y);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x + w/2, y + h * 0.7);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();
  // Cockpit
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(x + w/2, y + h * 0.55, w * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawEnemy(e) {
  const cx = e.x + e.w/2, cy = e.y + e.h/2;
  if (e.type === 'shooter') {
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 15;
    // Nave inimiga "tanque"
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x + e.w, e.y);
    ctx.lineTo(cx, e.y + e.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, e.w * 0.15, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 12;
    // Nave inimiga "básica"
    ctx.beginPath();
    ctx.moveTo(cx, e.y + e.h);
    ctx.lineTo(e.x + e.w, e.y);
    ctx.lineTo(e.x, e.y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff8';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(cx, e.y + e.h * 0.35, e.w * 0.12, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function draw() {
  // Fundo com fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(0, 0, W, H);

  // Estrelas
  for (const s of stars) {
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + s.size * 0.3})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // Partículas
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Balas do jogador
  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 10;
  for (const b of bullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }

  // Balas inimigas
  ctx.fillStyle = '#f0f';
  ctx.shadowColor = '#f0f';
  for (const b of enemyBullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  ctx.shadowBlur = 0;

  // Inimigos
  for (const e of enemies) drawEnemy(e);

  // Jogador (pisca se acabou de tomar dano)
  if (running || lives > 0) {
    if (frameCount % 20 < 15 || lives > 0) drawShip(player.x, player.y, player.w, player.h);
  }

  // Efeito de leve rastro do jogador (motor)
  ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 15;
  ctx.fillRect(player.x + player.w/2 - 3, player.y + player.h, 6, 10 + Math.random() * 8);
  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ===== Controles =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' ') {
    e.preventDefault();
    keys.space = true;
    initAudio();
  }
  if (!running && (e.key === 'Enter' || e.key === ' ')) {
    initAudio();
    reset();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === ' ') keys.space = false;
});

// Toque / mouse para mobile e desktop
function getPointerX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  touchTarget = getPointerX(e.clientX);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (touchTarget !== null) touchTarget = getPointerX(e.clientX);
});
canvas.addEventListener('pointerup', () => { touchTarget = null; });
canvas.addEventListener('pointercancel', () => { touchTarget = null; });

ovBtn.addEventListener('click', () => {
  initAudio();
  reset();
});

// Iniciar loop (overlay já visível)
reset();
running = false;
overlay.classList.remove('hidden');
loop();
</script>
</body>
</html>
