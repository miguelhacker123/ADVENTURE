<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Desvie dos Blocos!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  h1 { font-size: 20px; margin-bottom: 10px; color: #4af; }
  #info { margin-bottom: 10px; font-size: 16px; }
  canvas {
    background: #222;
    border: 2px solid #4af;
    border-radius: 8px;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    background: rgba(0,0,0,0.85);
    padding: 30px 40px;
    border-radius: 12px;
    text-align: center;
    border: 2px solid #4af;
    display: none;
  }
  #overlay h2 { margin-bottom: 15px; color: #4af; }
  #overlay button {
    padding: 10px 24px;
    background: #4af;
    color: #111;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #overlay button:hover { background: #6cf; }
  .dica { margin-top: 10px; font-size: 12px; color: #888; }
</style>
</head>
<body>
  <h1>🎮 Desvie dos Blocos!</h1>
  <div id="info">Pontos: <span id="score">0</span> | Recorde: <span id="best">0</span></div>
  <canvas id="game" width="400" height="500"></canvas>
  <div class="dica">Use ← → ou A/D (ou toque e arraste no celular)</div>

  <div id="overlay">
    <h2 id="ovTitle">Fim de Jogo!</h2>
    <p id="ovMsg" style="margin-bottom:15px">Pontuação: 0</p>
    <button id="ovBtn">Jogar Novamente</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg = document.getElementById('ovMsg');
const ovBtn = document.getElementById('ovBtn');

const W = canvas.width, H = canvas.height;

let player, obstacles, score, speed, spawnTimer, running, keys, best;
best = parseInt(localStorage.getItem('melhorPontos') || '0');
bestEl.textContent = best;

function reset() {
  player = { x: W/2 - 20, y: H - 60, w: 40, h: 20, vx: 0 };
  obstacles = [];
  score = 0;
  speed = 2;
  spawnTimer = 0;
  running = true;
  keys = { left: false, right: false };
  scoreEl.textContent = 0;
  overlay.style.display = 'none';
}

function spawn() {
  const w = 40 + Math.random() * 60;
  const x = Math.random() * (W - w);
  obstacles.push({ x, y: -30, w, h: 25 });
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('melhorPontos', best);
    bestEl.textContent = best;
    ovTitle.textContent = '🏆 Novo Recorde!';
  } else {
    ovTitle.textContent = '💥 Fim de Jogo!';
  }
  ovMsg.textContent = 'Pontuação: ' + score;
  overlay.style.display = 'block';
}

function update() {
  if (!running) return;

  // Movimento do jogador
  const accel = 0.8, maxV = 7;
  if (keys.left) player.vx -= accel;
  if (keys.right) player.vx += accel;
  if (!keys.left && !keys.right) player.vx *= 0.85;
  player.vx = Math.max(-maxV, Math.min(maxV, player.vx));
  player.x += player.vx;
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > W) { player.x = W - player.w; player.vx = 0; }

  // Spawnar obstáculos
  spawnTimer++;
  const intervalo = Math.max(20, 50 - Math.floor(score / 5));
  if (spawnTimer > intervalo) {
    spawn();
    spawnTimer = 0;
  }

  // Mover obstáculos
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += speed;
    if (o.y > H) {
      obstacles.splice(i, 1);
      score++;
      scoreEl.textContent = score;
      speed = 2 + score * 0.08;
    }
    // Colisão
    if (o.x < player.x + player.w && o.x + o.w > player.x &&
        o.y < player.y + player.h && o.y + o.h > player.y) {
      gameOver();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, W, H);

  // Linhas decorativas
  ctx.strokeStyle = '#2a2a2a';
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Jogador
  ctx.fillStyle = '#4af';
  ctx.shadowColor = '#4af';
  ctx.shadowBlur = 15;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Obstáculos
  ctx.fillStyle = '#f44';
  ctx.shadowColor = '#f44';
  ctx.shadowBlur = 10;
  for (const o of obstacles) {
    ctx.fillRect(o.x, o.y, o.w, o.h);
  }
  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Controles teclado
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (!running && (e.key === 'Enter' || e.key === ' ')) reset();
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Controles touch (mobile)
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const touchX = e.touches[0].clientX - r.left;
  const centroPlayer = player.x + player.w / 2;
  if (touchX < centroPlayer) keys.left = true;
  else keys.right = true;
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const touchX = e.touches[0].clientX - r.left;
  const centroPlayer = player.x + player.w / 2;
  keys.left = touchX < centroPlayer;
  keys.right = touchX > centroPlayer;
}, { passive: false });
canvas.addEventListener('touchend', () => {
  keys.left = false;
  keys.right = false;
});

ovBtn.addEventListener('click', reset);

// Iniciar
reset();
loop();
</script>
</body>
</html>
