<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADVENTURES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 675px;
            background: #111;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI OVERLAYS --- */
        .hud-element {
            position: absolute;
            z-index: 10;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* Idiomas (Canto superior esquerdo) */
        #lang-selector {
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: #fff;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #ffcc00;
            color: #000;
            border-color: #ffcc00;
        }

        /* Moedas Topo Esquerdo e Topo Direito */
        #coin-hud-left {
            top: 55px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-size: 18px;
        }

        #coin-hud-right {
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-size: 18px;
        }

        .coin-icon {
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #ffaa00;
            box-shadow: 0 0 8px #ffd700;
            display: inline-block;
        }

        /* Indicador de Fase */
        #level-hud {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 22px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- MENUS --- */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 20px;
        }

        .title {
            font-size: 56px;
            color: #ffcc00;
            text-shadow: 4px 4px 0px #ff3300, 8px 8px 0px #000;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-main {
            width: 240px;
            padding: 16px 0;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s;
            text-align: center;
            text-transform: uppercase;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e8449, 0 5px 10px rgba(0,0,0,0.5);
        }

        .btn-fases {
            background: linear-gradient(180deg, #3498db, #2980b9);
            box-shadow: 0 6px 0 #1f618d, 0 10px 15px rgba(0,0,0,0.5);
        }

        /* Grade de Fases */
        #levels-menu {
            display: none;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 80%;
            max-height: 60%;
            overflow-y: auto;
            padding: 10px;
        }

        .level-btn {
            width: 60px;
            height: 60px;
            background: #34495e;
            border: 2px solid #fff;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .level-btn.unlocked {
            background: #e67e22;
            box-shadow: 0 4px 0 #d35400;
        }

        .btn-back {
            background: #e74c3c;
            box-shadow: 0 4px 0 #c0392b;
            margin-top: 10px;
            width: 150px;
            padding: 10px;
            font-size: 16px;
        }

        /* --- CONTROLES TOUCH REORGANIZADOS --- */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            height: 90px;
            z-index: 15;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .touch-group-left {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .touch-group-right {
            display: flex;
            pointer-events: auto;
        }

        /* Botões direcionais (Cestinhas / Setas) no lado esquerdo */
        .basket-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .basket-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        /* Quadrado meio transparente para pular no lado direito */
        .square-jump-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px; /* Formato Quadrado */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .square-jump-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD SUPORTE IDIOMAS -->
    <div id="lang-selector" class="hud-element">
        <button class="lang-btn active" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <!-- HUD MOEDAS -->
    <div id="coin-hud-left" class="hud-element">
        <span class="coin-icon"></span>
        <span id="coin-count-left">0</span>
    </div>

    <div id="coin-hud-right" class="hud-element">
        <span class="coin-icon"></span>
        <span id="coin-count-right">0</span>
    </div>

    <!-- HUD FASE ATUAL -->
    <div id="level-hud" class="hud-element">
        <span id="level-text">FASE 1</span>
    </div>

    <!-- MENU INICIAL -->
    <div id="main-menu" class="menu-screen">
        <h1 class="title">ADVENTURES</h1>
        <button id="btn-play" class="btn-main" onclick="startGame()">PLAY</button>
        <button id="btn-fases" class="btn-main btn-fases" onclick="showLevels()">FASES</button>
    </div>

    <!-- MENU SELEÇÃO DE FASES -->
    <div id="levels-menu" class="menu-screen">
        <h1 class="title" id="select-level-title">FASES</h1>
        <div class="levels-grid" id="levels-grid"></div>
        <button id="btn-back" class="btn-main btn-back" onclick="hideLevels()">VOLTAR</button>
    </div>

    <!-- CONTROLES TOUCH REORGANIZADOS -->
    <div id="touch-controls">
        <!-- LADO ESQUERDO: Duas cestinhas para andar -->
        <div class="touch-group-left">
            <div class="basket-btn" id="btn-left">&lt;</div>
            <div class="basket-btn" id="btn-right">&gt;</div>
        </div>
        <!-- LADO DIREITO: Quadrado meio transparente para pular -->
        <div class="touch-group-right">
            <div class="square-jump-btn" id="btn-jump">PULAR</div>
        </div>
    </div>
</div>

<script>
/* --- TEXTOS E IDIOMAS --- */
const i18n = {
    pt: {
        play: "PLAY",
        fases: "FASES",
        selectLevel: "SELECIONE A FASE",
        back: "VOLTAR",
        level: "FASE",
        jump: "PULAR",
        win: "FASE CONCLUÍDA!",
        gameover: "VOCÊ CAIU NO RIO!"
    },
    en: {
        play: "PLAY",
        fases: "LEVELS",
        selectLevel: "SELECT LEVEL",
        back: "BACK",
        level: "LEVEL",
        jump: "JUMP",
        win: "LEVEL COMPLETE!",
        gameover: "YOU FELL IN THE RIVER!"
    }
};

let currentLang = 'pt';

function setLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if(lang === 'pt') document.querySelectorAll('.lang-btn')[0].classList.add('active');
    else document.querySelectorAll('.lang-btn')[1].classList.add('active');

    document.getElementById('btn-play').innerText = i18n[lang].play;
    document.getElementById('btn-fases').innerText = i18n[lang].fases;
    document.getElementById('select-level-title').innerText = i18n[lang].selectLevel;
    document.getElementById('btn-back').innerText = i18n[lang].back;
    document.getElementById('btn-jump').innerText = i18n[lang].jump;
    updateLevelHUD();
}

/* --- MOEDAS E PROGRESSO --- */
let totalCoins = parseInt(localStorage.getItem('adventures_coins')) || 0;
let unlockedLevel = parseInt(localStorage.getItem('adventures_level')) || 1;
let currentLevel = 1;

function updateCoinHUD() {
    document.getElementById('coin-count-left').innerText = totalCoins;
    document.getElementById('coin-count-right').innerText = totalCoins;
    localStorage.setItem('adventures_coins', totalCoins);
}

function saveProgress() {
    localStorage.setItem('adventures_coins', totalCoins);
    if (currentLevel >= unlockedLevel && unlockedLevel < 20) {
        unlockedLevel = currentLevel + 1;
        localStorage.setItem('adventures_level', unlockedLevel);
    }
}

/* --- CANVAS & ENGINE --- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 675;

let isPlaying = false;
let keys = { left: false, right: false, up: false };

const player = {
    x: 80,
    y: 300,
    width: 36,
    height: 48,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpForce: -13,
    gravity: 0.6,
    grounded: false,
    color: '#e74c3c'
};

let platforms = [];
let obstacles = [];
let coins = [];
let flag = null;

function generateLevel(lvl) {
    platforms = [];
    obstacles = [];
    coins = [];

    platforms.push({ x: 0, y: 550, w: 200, h: 125, type: 'grass' });

    let currentX = 200;
    const levelLength = 15 + lvl * 3;

    for (let i = 0; i < levelLength; i++) {
        let gap = 80 + Math.random() * 60 + (lvl * 3);
        currentX += gap;

        let platWidth = Math.max(100, 220 - lvl * 5 + Math.random() * 50);
        let platY = 400 + Math.random() * 150;

        platforms.push({ x: currentX, y: platY, w: platWidth, h: 675 - platY, type: 'grass' });

        if (Math.random() > 0.4) {
            let obsType = Math.random() > 0.5 ? 'stone' : 'trunk';
            let obsW = obsType === 'stone' ? 35 : 50;
            let obsH = obsType === 'stone' ? 30 : 25;
            
            obstacles.push({
                x: currentX + platWidth / 2 - obsW / 2,
                y: platY - obsH,
                w: obsW,
                h: obsH,
                type: obsType
            });
        }

        if (gap > 110 && Math.random() > 0.3) {
            let logX = currentX - gap / 2 - 25;
            let logY = 520;
            platforms.push({ x: logX, y: logY, w: 55, h: 20, type: 'floating_wood' });
        }

        let coinsInPlat = 1 + Math.floor(Math.random() * 3);
        for (let c = 0; c < coinsInPlat; c++) {
            coins.push({
                x: currentX + 30 + (c * 30),
                y: platY - 40 - (Math.random() * 40),
                w: 16,
                h: 16,
                collected: false
            });
        }

        currentX += platWidth;
    }

    currentX += 100;
    platforms.push({ x: currentX, y: 480, w: 250, h: 200, type: 'grass' });
    flag = { x: currentX + 150, y: 380, w: 20, h: 100 };

    player.x = 80;
    player.y = 450;
    player.vx = 0;
    player.vy = 0;
}

let cameraX = 0;

function update() {
    if (!isPlaying) return;

    if (keys.right) player.vx = player.speed;
    else if (keys.left) player.vx = -player.speed;
    else player.vx = 0;

    if (keys.up && player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
    }

    player.vy += player.gravity;

    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;
    for (let p of platforms) {
        if (
            player.x < p.x + p.w &&
            player.x + player.width > p.x &&
            player.y + player.height > p.y &&
            player.y + player.height < p.y + p.h + player.vy + 4 &&
            player.vy >= 0
        ) {
            player.grounded = true;
            player.vy = 0;
            player.y = p.y - player.height;
        }
    }

    for (let obs of obstacles) {
        if (
            player.x < obs.x + obs.w &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.h &&
            player.y + player.height > obs.y
        ) {
            if (player.vx > 0 && player.x + player.width - player.vx <= obs.x) {
                player.x = obs.x - player.width;
            } else if (player.vx < 0 && player.x - player.vx >= obs.x + obs.w) {
                player.x = obs.x + obs.w;
            } 
            else if (player.vy > 0 && player.y + player.height - player.vy <= obs.y) {
                player.grounded = true;
                player.vy = 0;
                player.y = obs.y - player.height;
            }
        }
    }

    for (let coin of coins) {
        if (!coin.collected &&
            player.x < coin.x + coin.w &&
            player.x + player.width > coin.x &&
            player.y < coin.y + coin.h &&
            player.y + player.height > coin.y) {
            coin.collected = true;
            totalCoins += 10;
            updateCoinHUD();
        }
    }

    cameraX = player.x - 200;
    if (cameraX < 0) cameraX = 0;

    if (player.y > canvas.height) {
        alert(i18n[currentLang].gameover);
        generateLevel(currentLevel);
    }

    if (flag && player.x > flag.x) {
        saveProgress();
        alert(i18n[currentLang].win);
        if (currentLevel < 20) {
            currentLevel++;
            updateLevelHUD();
            generateLevel(currentLevel);
        } else {
            showMainMenu();
        }
    }
}

function render() {
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    ctx.fillStyle = '#1e90ff';
    ctx.fillRect(cameraX, 580, canvas.width, 100);

    for (let p of platforms) {
        if (p.type === 'grass') {
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(p.x, p.y, p.w, 15);
            ctx.fillStyle = '#795548';
            ctx.fillRect(p.x, p.y + 15, p.w, p.h - 15);
        } else if (p.type === 'floating_wood') {
            ctx.fillStyle = '#8d6e63';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = '#4e342e';
            ctx.strokeRect(p.x, p.y, p.w, p.h);
        }
    }

    for (let obs of obstacles) {
        if (obs.type === 'stone') {
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 6);
            ctx.fill();
        } else {
            ctx.fillStyle = '#a0522d';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        }
    }

    for (let coin of coins) {
        if (!coin.collected) {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(coin.x + 8, coin.y + 8, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffaa00';
            ctx.stroke();
        }
    }

    if (flag) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(flag.x, flag.y, 6, flag.h);
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(flag.x + 6, flag.y);
        ctx.lineTo(flag.x + 45, flag.y + 20);
        ctx.lineTo(flag.x + 6, flag.y + 40);
        ctx.fill();
    }

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x + (player.vx >= 0 ? 20 : 4), player.y + 8, 8, 8);
    ctx.fillStyle = '#2980b9';
    ctx.fillRect(player.x, player.y + 28, player.width, 20);

    ctx.restore();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

/* --- MENUS --- */
function updateLevelHUD() {
    document.getElementById('level-text').innerText = `${i18n[currentLang].level} ${currentLevel}`;
}

function startGame() {
    document.getElementById('main-menu').style.display = 'none';
    isPlaying = true;
    generateLevel(currentLevel);
}

function showLevels() {
    document.getElementById('main-menu').style.display = 'none';
    const grid = document.getElementById('levels-grid');
    grid.innerHTML = '';

    for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${i <= unlockedLevel ? 'unlocked' : ''}`;
        btn.innerText = i;
        if (i <= unlockedLevel) {
            btn.onclick = () => {
                currentLevel = i;
                updateLevelHUD();
                document.getElementById('levels-menu').style.display = 'none';
                startGame();
            };
        }
        grid.appendChild(btn);
    }

    document.getElementById('levels-menu').style.display = 'flex';
}

function hideLevels() {
    document.getElementById('levels-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
}

function showMainMenu() {
    isPlaying = false;
    document.getElementById('main-menu').style.display = 'flex';
}

/* --- EVENTOS DE CONTROLE --- */
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = true;
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.up = false;
});

function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    el.addEventListener('mousedown', () => { keys[keyProp] = true; });
    el.addEventListener('mouseup', () => { keys[keyProp] = false; });
}

bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'up');

updateCoinHUD();
setLanguage('pt');
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
