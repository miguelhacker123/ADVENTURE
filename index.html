<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADVENTURE - O Jogo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Press Start 2P', cursive;
    color: #fff;
}

/* ========== FUNDO ANIMADO ========== */
.bg-anim {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, #0a0a2a 0%, #1a1a5e 50%, #0a0a2a 100%);
    z-index: 0;
}
.star {
    position: absolute; background: white; border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

/* ========== TELAS ========== */
.screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    z-index: 10; padding: 20px;
}
.screen.active { display: flex; }

/* ========== TELA DE CARREGAMENTO ========== */
#loading .logo-container { animation: floatLogo 3s ease-in-out infinite; text-align: center; margin-bottom: 60px; }
@keyframes floatLogo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

.logo {
    font-size: clamp(30px, 6vw, 70px);
    color: #aaff00;
    text-shadow: 
        4px 4px 0 #000,
        8px 8px 0 #003300,
        0 0 20px #aaff00,
        0 0 40px #66ff00;
    letter-spacing: 5px;
}
.logo-sub {
    font-size: clamp(12px, 1.5vw, 20px);
    color: #ffcc00; text-shadow: 3px 3px 0 #000, 0 0 15px #ffcc00;
    margin-top: 10px; letter-spacing: 12px;
}

.loading-bar-container {
    width: min(500px, 85vw); height: 35px;
    background: #000; border: 4px solid #aaff00;
    box-shadow: 0 0 25px #aaff00, inset 0 0 15px #000;
    position: relative; overflow: hidden;
}
.loading-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #66ff00, #aaff00, #ccff66);
    box-shadow: 0 0 15px #aaff00; transition: width 0.1s linear;
    position: relative;
}
.loading-bar::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px,
        rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 20px);
    animation: moveStripes 0.5s linear infinite;
}
@keyframes moveStripes { from { transform: translateX(0); } to { transform: translateX(28px); } }

.loading-text { color: #fff; font-size: 12px; margin-top: 20px; text-shadow: 2px 2px 0 #000; animation: blink 1s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.percentage { color: #aaff00; font-size: 14px; margin-top: 10px; text-shadow: 0 0 10px #aaff00; }

/* ========== MENU PRINCIPAL ========== */
#menu .menu-logo {
    font-size: clamp(40px, 8vw, 90px);
    color: #aaff00;
    text-shadow: 
        5px 5px 0 #000, 10px 10px 0 #003300,
        0 0 30px #aaff00, 0 0 60px #66ff00;
    letter-spacing: 8px;
    margin-bottom: 10px;
    animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.menu-sub {
    font-size: clamp(14px, 2vw, 22px);
    color: #ffcc00; text-shadow: 3px 3px 0 #000;
    margin-bottom: 50px; letter-spacing: 15px;
}

.menu-buttons { display: flex; flex-direction: column; gap: 15px; width: min(400px, 80vw); }

.btn {
    padding: 18px;
    background: linear-gradient(180deg, #1a1a5e, #0a0a2a);
    color: #fff;
    border: 3px solid #aaff00;
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(10px, 1.2vw, 14px);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 15px rgba(170, 255, 0, 0.5), inset 0 0 10px rgba(170, 255, 0, 0.2);
    text-shadow: 2px 2px 0 #000;
}
.btn:hover {
    background: linear-gradient(180deg, #aaff00, #66cc00);
    color: #000;
    text-shadow: none;
    transform: scale(1.05);
    box-shadow: 0 0 30px #aaff00;
}
.btn.danger { border-color: #ff0044; box-shadow: 0 0 15px rgba(255, 0, 68, 0.5); }
.btn.danger:hover { background: linear-gradient(180deg, #ff0044, #aa0033); color: #fff; }
.btn.gold { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
.btn.gold:hover { background: linear-gradient(180deg, #ffcc00, #cc9900); color: #000; }

/* Moedas no canto */
.coins-display {
    position: absolute; top: 20px; right: 20px;
    background: rgba(0,0,0,0.7);
    border: 3px solid #ffcc00;
    padding: 10px 20px;
    color: #ffcc00;
    font-size: 14px;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
    z-index: 20;
}

/* ========== LOJA DE CUBOS ========== */
#shop .shop-title {
    font-size: clamp(24px, 4vw, 40px);
    color: #aaff00; text-shadow: 4px 4px 0 #000, 0 0 20px #aaff00;
    margin-bottom: 30px;
}

.cubes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 20px;
    width: min(900px, 95vw);
    margin-bottom: 30px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 10px;
}

.cube-card {
    background: rgba(0,0,0,0.6);
    border: 3px solid #333;
    padding: 15px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.cube-card:hover { border-color: #aaff00; transform: scale(1.05); box-shadow: 0 0 20px rgba(170,255,0,0.5); }
.cube-card.owned { border-color: #66cc00; }
.cube-card.equipped { border-color: #ffcc00; box-shadow: 0 0 25px #ffcc00; }

.cube-preview {
    width: 60px; height: 60px;
    border: 3px solid #000;
    position: relative;
    box-shadow: 0 0 15px currentColor;
}
.cube-preview::before, .cube-preview::after {
    content: ''; position: absolute; width: 10px; height: 10px; background: #000;
}
.cube-preview::before { top: 10px; left: 10px; }
.cube-preview::after { top: 10px; right: 10px; }

.cube-name { font-size: 10px; color: #fff; text-align: center; }
.cube-price { font-size: 10px; color: #ffcc00; }
.cube-status { font-size: 9px; color: #aaff00; }

/* ========== JOGO ========== */
#game { padding: 0; justify-content: flex-start; }

.game-hud {
    position: absolute; top: 0; left: 0; width: 100%;
    padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 30;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    pointer-events: none;
}
.attempts-text { color: #fff; font-size: 12px; text-shadow: 2px 2px 0 #000; }

/* Barra de progresso do nível */
.progress-container {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    width: min(600px, 60vw); height: 24px;
    background: rgba(0,0,0,0.8);
    border: 3px solid #aaff00;
    box-shadow: 0 0 20px rgba(170,255,0,0.5);
    z-index: 30;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #66ff00, #aaff00);
    box-shadow: 0 0 15px #aaff00;
    width: 0%;
    transition: width 0.1s linear;
}
.progress-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-size: 10px; text-shadow: 2px 2px 0 #000, 0 0 5px #000;
    z-index: 31;
}

/* Chão */
.ground {
    position: absolute; bottom: 0; left: 0;
    width: 200%; height: 80px;
    background: repeating-linear-gradient(90deg,
        #1a1a1a 0px, #1a1a1a 40px, #2a2a2a 40px, #2a2a2a 80px);
    border-top: 4px solid var(--theme-color, #aaff00);
    box-shadow: 0 0 20px var(--theme-color, #aaff00);
}
.ground::before {
    content: ''; position: absolute; top: -30px; left: 0;
    width: 100%; height: 30px;
    background: linear-gradient(180deg, transparent, var(--theme-color, #aaff00));
    opacity: 0.3;
}

/* Jogador */
.player {
    position: absolute; bottom: 80px; left: 150px;
    width: 50px; height: 50px;
    border: 3px solid #000;
    z-index: 10;
}
.player::before {
    content: ''; position: absolute; top: 8px; left: 8px;
    width: 10px; height: 10px; background: #000;
    box-shadow: 22px 0 0 #000;
}

/* Rastro do jogador */
.trail {
    position: absolute; width: 30px; height: 30px;
    border-radius: 50%; pointer-events: none;
    animation: trailFade 0.5s ease-out forwards;
    z-index: 5;
}
@keyframes trailFade {
    from { opacity: 0.8; transform: scale(1); }
    to { opacity: 0; transform: scale(0.3); }
}

/* Partículas de pulo */
.particle {
    position: absolute; width: 8px; height: 8px;
    pointer-events: none; z-index: 8;
    animation: particleBurst 0.6s ease-out forwards;
}
@keyframes particleBurst {
    from { opacity: 1; transform: translate(0, 0) rotate(0deg); }
    to { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(720deg); }
}

/* Obstáculos */
.obstacle {
    position: absolute; bottom: 80px;
    border: 3px solid #000;
    z-index: 5;
}
.obstacle.spike {
    width: 40px; height: 40px;
    background: #ff0044;
    box-shadow: 0 0 20px #ff0044;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}
.obstacle.block {
    width: 50px; height: 50px;
    background: #4400ff;
    box-shadow: 0 0 20px #4400ff;
}
.obstacle.tall {
    width: 45px; height: 80px;
    background: #ff8800;
    box-shadow: 0 0 20px #ff8800;
}

/* Screen shake */
.shake { animation: shake 0.3s; }
@keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-5px, 5px); }
    50% { transform: translate(5px, -5px); }
    75% { transform: translate(-5px, -5px); }
}

/* Efeito de explosão */
.explosion {
    position: absolute; width: 100px; height: 100px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff, #ffcc00, #ff0044, transparent);
    animation: explode 0.5s ease-out forwards;
    z-index: 20;
}
@keyframes explode {
    from { opacity: 1; transform: scale(0); }
    to { opacity: 0; transform: scale(3); }
}

/* Game Over */
.game-over-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 4px solid #ff0044;
    box-shadow: 0 0 40px #ff0044, inset 0 0 20px rgba(255,0,68,0.3);
    padding: 40px;
    text-align: center;
    z-index: 50;
    display: none;
    min-width: 320px;
}
.game-over-panel.show { display: block; animation: popIn 0.3s; }
@keyframes popIn { from { transform: translate(-50%,-50%) scale(0.5); opacity: 0; } }

.game-over-title {
    color: #ff0044; font-size: 32px;
    text-shadow: 4px 4px 0 #000, 0 0 20px #ff0044;
    margin-bottom: 20px;
}
.game-over-info { color: #fff; font-size: 12px; margin: 10px 0; text-shadow: 2px 2px 0 #000; line-height: 1.8; }
.game-over-info span { color: #aaff00; }
.game-over-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }

/* Pause */
.pause-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 4px solid #aaff00;
    box-shadow: 0 0 40px #aaff00;
    padding: 40px;
    text-align: center;
    z-index: 50;
    display: none;
    min-width: 300px;
}
.pause-panel.show { display: block; }
.pause-title { color: #aaff00; font-size: 28px; text-shadow: 3px 3px 0 #000; margin-bottom: 25px; }

/* Nuvens */
.cloud {
    position: absolute; background: rgba(255,255,255,0.08);
    border-radius: 50%; filter: blur(20px);
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #aaff00; }

/* Botão voltar */
.btn-back { position: absolute; top: 20px; left: 20px; z-index: 30; padding: 12px 20px; }

.hint { color: #888; font-size: 10px; margin-top: 15px; text-shadow: 2px 2px 0 #000; }
</style>
</head>
<body>

<!-- FUNDO -->
<div class="bg-anim" id="bgAnim"></div>

<!-- MOEDAS -->
<div class="coins-display" id="coinsDisplay" style="display:none;">💎 <span id="coinsCount">0</span></div>

<!-- ========== TELA DE CARREGAMENTO ========== -->
<div class="screen active" id="loading">
    <div class="logo-container">
        <div class="logo">ADVENTURE</div>
        <div class="logo-sub">LITE</div>
    </div>
    <div class="loading-bar-container">
        <div class="loading-bar" id="loadingBar"></div>
    </div>
    <div class="loading-text">CARREGANDO OS DESAFIOS...</div>
    <div class="percentage" id="percentage">0%</div>
</div>

<!-- ========== MENU PRINCIPAL ========== -->
<div class="screen" id="menu">
    <div class="menu-logo">ADVENTURE</div>
    <div class="menu-sub">LITE</div>
    <div class="menu-buttons">
        <button class="btn gold" id="btnPlay">▶ JOGAR</button>
        <button class="btn" id="btnShop">🛒 LOJA DE CUBOS</button>
        <button class="btn" id="btnRecords">🏆 RECORDES</button>
        <button class="btn danger" id="btnReset">🗑 RESETAR PROGRESSO</button>
    </div>
    <div class="hint">Melhor distância: <span id="bestDistance">0</span>m</div>
</div>

<!-- ========== LOJA ========== -->
<div class="screen" id="shop">
    <button class="btn btn-back" id="btnBackShop">← VOLTAR</button>
    <div class="shop-title">LOJA DE CUBOS</div>
    <div class="cubes-grid" id="cubesGrid"></div>
</div>

<!-- ========== RECORDES ========== -->
<div class="screen" id="records">
    <button class="btn btn-back" id="btnBackRecords">← VOLTAR</button>
    <div class="shop-title">🏆 RECORDES</div>
    <div style="background:rgba(0,0,0,0.7); border:3px solid #ffcc00; padding:30px; min-width:400px; text-align:center;">
        <div class="game-over-info">Melhor Distância: <span id="recBest">0</span>m</div>
        <div class="game-over-info">Maior Pontuação: <span id="recScore">0</span></div>
        <div class="game-over-info">Total de Tentativas: <span id="recAttempts">0</span></div>
        <div class="game-over-info">Cubos Desbloqueados: <span id="recCubes">1</span></div>
    </div>
    <button class="btn" id="btnBackRecords2" style="margin-top:30px;">← VOLTAR AO MENU</button>
</div>

<!-- ========== JOGO ========== -->
<div class="screen" id="game">
    <div class="game-hud">
        <div class="attempts-text">TENTATIVA: <span id="attempts">1</span></div>
        <div style="color:#ffcc00;font-size:12px;text-shadow:2px 2px 0 #000;">💎 <span id="gameCoins">0</span></div>
    </div>
    
    <div class="progress-container">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <button class="btn btn-back" id="btnPause" style="z-index:40;">⏸</button>

    <div class="ground" id="ground"></div>
    <div class="player" id="player"></div>

    <div class="game-over-panel" id="gameOverPanel">
        <div class="game-over-title">GAME OVER</div>
        <div class="game-over-info">Distância: <span id="finalDistance">0</span>m</div>
        <div class="game-over-info">Pontos: <span id="finalScore">0</span></div>
        <div class="game-over-info">Moedas Ganhas: <span id="finalCoins">0</span> 💎</div>
        <div class="game-over-buttons">
            <button class="btn" id="btnRetry">🔄 TENTAR NOVAMENTE</button>
            <button class="btn danger" id="btnMenu">🏠 MENU PRINCIPAL</button>
        </div>
    </div>

    <div class="pause-panel" id="pausePanel">
        <div class="pause-title">⏸ PAUSADO</div>
        <div class="game-over-buttons">
            <button class="btn" id="btnResume">▶ CONTINUAR</button>
            <button class="btn danger" id="btnQuit">🏠 SAIR PARA O MENU</button>
        </div>
    </div>
</div>

<script>
/* =====================================================
   SISTEMA DE DADOS (localStorage)
===================================================== */
const STORAGE_KEY = 'adventure_lite_save';

const defaultSave = {
    coins: 0,
    bestDistance: 0,
    bestScore: 0,
    totalAttempts: 0,
    equippedCube: 0,
    ownedCubes: [0]
};

let save = loadSave();

function loadSave() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) return { ...defaultSave, ...JSON.parse(data) };
    } catch(e) {}
    return { ...defaultSave };
}

function writeSave() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
}

/* =====================================================
   CUBOS DISPONÍVEIS
===================================================== */
const CUBES = [
    { id: 0, name: 'Verde',   color: '#aaff00', glow: '#aaff00', price: 0 },
    { id: 1, name: 'Azul',    color: '#00aaff', glow: '#00aaff', price: 50 },
    { id: 2, name: 'Rosa',    color: '#ff00aa', glow: '#ff00aa', price: 100 },
    { id: 3, name: 'Dourado', color: '#ffcc00', glow: '#ffcc00', price: 200 },
    { id: 4, name: 'Vermelho',color: '#ff2200', glow: '#ff2200', price: 300 },
    { id: 5, name: 'Roxo',    color: '#aa00ff', glow: '#aa00ff', price: 500 },
    { id: 6, name: 'Ciano',   color: '#00ffff', glow: '#00ffff', price: 750 },
    { id: 7, name: 'Arco-Íris', color: 'rainbow', glow: '#ffffff', price: 1500 }
];

/* =====================================================
   FUNDO DE ESTRELAS
===================================================== */
function createStars() {
    const bg = document.getElementById('bgAnim');
    for (let i = 0; i < 120; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 2 + 's';
        bg.appendChild(star);
    }
    // Nuvens
    for (let i = 0; i < 5; i++) {
        const cloud = document.createElement('div');
        cloud.classList.add('cloud');
        const size = Math.random() * 300 + 150;
        cloud.style.width = size + 'px';
        cloud.style.height = size + 'px';
        cloud.style.left = Math.random() * 100 + '%';
        cloud.style.top = Math.random() * 60 + '%';
        bg.appendChild(cloud);
    }
}
createStars();

/* =====================================================
   NAVEGAÇÃO DE TELAS
===================================================== */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('coinsDisplay').style.display = (id === 'menu' || id === 'shop') ? 'block' : 'none';
    updateCoinsDisplay();
}

function updateCoinsDisplay() {
    document.getElementById('coinsCount').textContent = save.coins;
    document.getElementById('gameCoins').textContent = save.coins;
}

/* =====================================================
   TELA DE CARREGAMENTO
===================================================== */
let progress = 0;
const loadingBar = document.getElementById('loadingBar');
const percentage = document.getElementById('percentage');

const loadInterval = setInterval(() => {
    progress += Math.random() * 8 + 3;
    if (progress >= 100) {
        progress = 100;
        clearInterval(loadInterval);
        setTimeout(() => {
            document.getElementById('loading').style.transition = 'opacity 1s';
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                showScreen('menu');
                updateMenuInfo();
            }, 800);
        }, 500);
    }
    loadingBar.style.width = progress + '%';
    percentage.textContent = Math.floor(progress) + '%';
}, 120);

/* =====================================================
   MENU
===================================================== */
function updateMenuInfo() {
    document.getElementById('bestDistance').textContent = save.bestDistance;
    updateCoinsDisplay();
}

document.getElementById('btnPlay').onclick = () => {
    showScreen('game');
    startGame();
};

document.getElementById('btnShop').onclick = () => {
    renderShop();
    showScreen('shop');
};

document.getElementById('btnRecords').onclick = () => {
    document.getElementById('recBest').textContent = save.bestDistance;
    document.getElementById('recScore').textContent = save.bestScore;
    document.getElementById('recAttempts').textContent = save.totalAttempts;
    document.getElementById('recCubes').textContent = save.ownedCubes.length + '/' + CUBES.length;
    showScreen('records');
};

document.getElementById('btnReset').onclick = () => {
    if (confirm('Tem certeza que deseja resetar TODO o progresso?')) {
        save = { ...defaultSave, ownedCubes: [0] };
        writeSave();
        updateMenuInfo();
        alert('Progresso resetado!');
    }
};

document.getElementById('btnBackShop').onclick = () => {
    showScreen('menu');
    updateMenuInfo();
};
document.getElementById('btnBackRecords').onclick = () => showScreen('menu');
document.getElementById('btnBackRecords2').onclick = () => showScreen('menu');

/* =====================================================
   LOJA
===================================================== */
function renderShop() {
    const grid = document.getElementById('cubesGrid');
    grid.innerHTML = '';
    
    CUBES.forEach(cube => {
        const owned = save.ownedCubes.includes(cube.id);
        const equipped = save.equippedCube === cube.id;
        
        const card = document.createElement('div');
        card.className = 'cube-card' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '');
        
        const preview = document.createElement('div');
        preview.className = 'cube-preview';
        preview.style.color = cube.color === 'rainbow' ? '#fff' : cube.color;
        if (cube.color === 'rainbow') {
            preview.style.background = 'linear-gradient(45deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0088ff, #aa00ff)';
            preview.style.backgroundSize = '200% 200%';
            preview.style.animation = 'rainbowMove 2s linear infinite';
        } else {
            preview.style.background = cube.color;
        }
        
        const name = document.createElement('div');
        name.className = 'cube-name';
        name.textContent = cube.name;
        
        const price = document.createElement('div');
        price.className = 'cube-price';
        
        const status = document.createElement('div');
        status.className = 'cube-status';
        
        if (equipped) {
            price.textContent = '';
            status.textContent = '✓ EQUIPADO';
            status.style.color = '#ffcc00';
        } else if (owned) {
            price.textContent = '';
            status.textContent = 'CLIQUE P/ EQUIPAR';
            status.style.color = '#aaff00';
        } else {
            price.textContent = '💎 ' + cube.price;
            status.textContent = 'COMPRAR';
            status.style.color = '#888';
        }
        
        card.appendChild(preview);
        card.appendChild(name);
        card.appendChild(price);
        card.appendChild(status);
        
        card.onclick = () => {
            if (equipped) return;
            if (owned) {
                save.equippedCube = cube.id;
                writeSave();
                renderShop();
                updateCoinsDisplay();
            } else {
                if (save.coins >= cube.price) {
                    save.coins -= cube.price;
                    save.ownedCubes.push(cube.id);
                    save.equippedCube = cube.id;
                    writeSave();
                    renderShop();
                    updateCoinsDisplay();
                } else {
                    alert('Moedas insuficientes! Você tem ' + save.coins + ' 💎');
                }
            }
        };
        
        grid.appendChild(card);
    });
}

// Animação do cubo arco-íris
const styleSheet = document.createElement('style');
styleSheet.textContent = `
    @keyframes rainbowMove {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }
`;
document.head.appendChild(styleSheet);

/* =====================================================
   JOGO
===================================================== */
const player = document.getElementById('player');
const ground = document.getElementById('ground');
const gameScreen = document.getElementById('game');
const gameOverPanel = document.getElementById('gameOverPanel');
const pausePanel = document.getElementById('pausePanel');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

let gameState = {
    running: false,
    paused: false,
    score: 0,
    distance: 0,
    coinsEarned: 0,
    attempts: 1,
    playerBottom: 80,
    velocity: 0,
    gravity: 0.9,
    jumpForce: -15,
    isJumping: false,
    obstacles: [],
    gameSpeed: 6,
    spawnTimer: 0,
    animationId: null,
    totalFrames: 0,
    levelLength: 3000,
    lastTrailFrame: 0,
    lastCoinSpawn: 0,
    coins: []
};

function getEquippedCube() {
    return CUBES.find(c => c.id === save.equippedCube) || CUBES[0];
}

function applyCubeStyle() {
    const cube = getEquippedCube();
    player.style.background = cube.color === 'rainbow' 
        ? 'linear-gradient(45deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0088ff, #aa00ff)'
        : cube.color;
    player.style.boxShadow = `0 0 20px ${cube.glow}, inset 0 0 10px ${cube.glow}`;
    if (cube.color === 'rainbow') {
        player.style.backgroundSize = '200% 200%';
        player.style.animation = 'rainbowMove 2s linear infinite';
    } else {
        player.style.animation = '';
    }
    
    // Aplica cor do tema ao chão
    ground.style.setProperty('--theme-color', cube.glow);
}

function startGame() {
    applyCubeStyle();
    
    gameState.running = true;
    gameState.paused = false;
    gameState.score = 0;
    gameState.distance = 0;
    gameState.coinsEarned = 0;
    gameState.playerBottom = 80;
    gameState.velocity = 0;
    gameState.isJumping = false;
    gameState.gameSpeed = 6;
    gameState.spawnTimer = 0;
    gameState.totalFrames = 0;
    gameState.lastTrailFrame = 0;
    gameState.lastCoinSpawn = 0;
    
    save.totalAttempts++;
    writeSave();
    
    // Remove elementos antigos
    gameState.obstacles.forEach(o => o.element.remove());
    gameState.obstacles = [];
    gameState.coins.forEach(c => c.element.remove());
    gameState.coins = [];
    
    player.style.bottom = '80px';
    player.style.transform = 'rotate(0deg)';
    player.style.left = '150px';
    
    gameOverPanel.classList.remove('show');
    pausePanel.classList.remove('show');
    
    document.getElementById('attempts').textContent = gameState.attempts;
    document.getElementById('gameCoins').textContent = save.coins;
    progressFill.style.width = '0%';
    progressText.textContent = '0%';
    
    cancelAnimationFrame(gameState.animationId);
    gameLoop();
}

function jump() {
    if (!gameState.running || gameState.paused) return;
    if (!gameState.isJumping) {
        gameState.velocity = gameState.jumpForce;
        gameState.isJumping = true;
        spawnJumpParticles();
    }
}

function spawnJumpParticles() {
    const cube = getEquippedCube();
    for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = '175px';
        p.style.bottom = gameState.playerBottom + 'px';
        p.style.background = cube.color === 'rainbow' ? '#fff' : cube.color;
        p.style.boxShadow = `0 0 10px ${cube.glow}`;
        const angle = (Math.PI * 2 * i) / 8;
        const dist = 40 + Math.random() * 40;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        gameScreen.appendChild(p);
        setTimeout(() => p.remove(), 700);
    }
}

function spawnTrail() {
    const cube = getEquippedCube();
    const t = document.createElement('div');
    t.className = 'trail';
    t.style.left = '160px';
    t.style.bottom = gameState.playerBottom + 10 + 'px';
    t.style.background = cube.color === 'rainbow' ? '#fff' : cube.color;
    t.style.boxShadow = `0 0 15px ${cube.glow}`;
    gameScreen.appendChild(t);
    setTimeout(() => t.remove(), 600);
}

function createObstacle() {
    const types = ['spike', 'block', 'tall'];
    const weights = [0.5, 0.3, 0.2];
    let r = Math.random(), type = 'spike';
    let acc = 0;
    for (let i = 0; i < types.length; i++) {
        acc += weights[i];
        if (r <= acc) { type = types[i]; break; }
    }
    
    const obs = document.createElement('div');
    obs.className = 'obstacle ' + type;
    obs.style.right = '-80px';
    
    let w, h;
    if (type === 'spike') { w = 40; h = 40; }
    else if (type === 'block') { w = 50; h = 50; }
    else { w = 45; h = 80; }
    
    gameScreen.appendChild(obs);
    
    gameState.obstacles.push({
        element: obs,
        x: window.innerWidth + 80,
        width: w,
        height: h,
        type
    });
}

function createCoin() {
    const coin = document.createElement('div');
    coin.style.position = 'absolute';
    coin.style.width = '30px';
    coin.style.height = '30px';
    coin.style.borderRadius = '50%';
    coin.style.background = 'radial-gradient(circle at 30% 30%, #ffff00, #ffcc00, #cc9900)';
    coin.style.boxShadow = '0 0 20px #ffcc00, inset 0 0 5px #fff';
    coin.style.bottom = (110 + Math.random() * 150) + 'px';
    coin.style.right = '-50px';
    coin.style.zIndex = '6';
    coin.style.border = '2px solid #000';
    
    // Estrelinha dentro
    const star = document.createElement('div');
    star.style.position = 'absolute';
    star.style.top = '50%';
    star.style.left = '50%';
    star.style.transform = 'translate(-50%, -50%)';
    star.style.color = '#fff';
    star.style.fontSize = '16px';
    star.textContent = '★';
    coin.appendChild(star);
    
    gameScreen.appendChild(coin);
    gameState.coins.push({
        element: coin,
        x: window.innerWidth + 50,
        width: 30,
        height: 30,
        collected: false
    });
}

function gameLoop() {
    if (!gameState.running || gameState.paused) return;
    
    gameState.totalFrames++;
    
    // Física do jogador
    gameState.velocity += gameState.gravity;
    gameState.playerBottom -= gameState.velocity;
    
    if (gameState.playerBottom <= 80) {
        gameState.playerBottom = 80;
        gameState.velocity = 0;
        gameState.isJumping = false;
        player.style.transform = 'rotate(0deg)';
    } else {
        const rotation = (gameState.velocity * 4) % 360;
        player.style.transform = `rotate(${rotation}deg)`;
    }
    
    player.style.bottom = gameState.playerBottom + 'px';
    
    // Rastro
    if (gameState.totalFrames - gameState.lastTrailFrame > 3) {
        spawnTrail();
        gameState.lastTrailFrame = gameState.totalFrames;
    }
    
    // Atualiza obstáculos
    for (let i = gameState.obstacles.length - 1; i >= 0; i--) {
        const obs = gameState.obstacles[i];
        obs.x -= gameState.gameSpeed;
        obs.element.style.right = (window.innerWidth - obs.x) + 'px';
        
        // Colisão
        const pLeft = 150 + 8;
        const pRight = 150 + 50 - 8;
        const pBottom = gameState.playerBottom + 5;
        const pTop = gameState.playerBottom + 50 - 5;
        
        const oLeft = obs.x + 5;
        const oRight = obs.x + obs.width - 5;
        const oBottom = 80;
        const oTop = 80 + obs.height;
        
        if (pRight > oLeft && pLeft < oRight && pTop > oBottom && pBottom < oTop) {
            gameOver();
            return;
        }
        
        if (obs.x < -100) {
            obs.element.remove();
            gameState.obstacles.splice(i, 1);
            gameState.score += 10;
            gameState.distance += 5;
        }
    }
    
    // Atualiza moedas
    for (let i = gameState.coins.length - 1; i >= 0; i--) {
        const c = gameState.coins[i];
        if (c.collected) continue;
        c.x -= gameState.gameSpeed;
        c.element.style.right = (window.innerWidth - c.x) + 'px';
        
        // Rotação da moeda
        c.element.style.transform = `rotateY(${gameState.totalFrames * 5}deg)`;
        
        // Coleta
        const pLeft = 150 + 8;
        const pRight = 150 + 50 - 8;
        const pBottom = gameState.playerBottom + 5;
        const pTop = gameState.playerBottom + 50 - 5;
        
        const coinBottom = parseFloat(c.element.style.bottom);
        const cBottom = coinBottom;
        const cTop = coinBottom + 30;
        
        if (pRight > c.x && pLeft < c.x + 30 && pTop > cBottom && pBottom < cTop) {
            c.collected = true;
            gameState.coinsEarned += 5;
            c.element.remove();
            gameState.coins.splice(i, 1);
        } else if (c.x < -100) {
            c.element.remove();
            gameState.coins.splice(i, 1);
        }
    }
    
    // Spawn obstáculos
    gameState.spawnTimer++;
    const spawnRate = Math.max(45, 90 - Math.floor(gameState.score / 50));
    if (gameState.spawnTimer > spawnRate) {
        createObstacle();
        gameState.spawnTimer = 0;
    }
    
    // Spawn moedas
    if (gameState.totalFrames - gameState.lastCoinSpawn > 120 && Math.random() < 0.3) {
        createCoin();
        gameState.lastCoinSpawn = gameState.totalFrames;
    }
    
    // Progresso
    const progressPct = Math.min(100, (gameState.distance / gameState.levelLength) * 100);
    progressFill.style.width = progressPct + '%';
    progressText.textContent = Math.floor(progressPct) + '%';
    
    // Aumenta velocidade
    if (gameState.distance > 100 && gameState.distance % 100 < 5) {
        gameState.gameSpeed = Math.min(15, 6 + gameState.distance / 150);
    }
    
    // Vitória!
    if (progressPct >= 100) {
        victory();
        return;
    }
    
    gameState.animationId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameState.running = false;
    cancelAnimationFrame(gameState.animationId);
    
    // Efeito de explosão
    const explosion = document.createElement('div');
    explosion.className = 'explosion';
    explosion.style.left = '150px';
    explosion.style.bottom = gameState.playerBottom + 'px';
    gameScreen.appendChild(explosion);
    setTimeout(() => explosion.remove(), 600);
    
    gameScreen.classList.add('shake');
    setTimeout(() => gameScreen.classList.remove('shake'), 300);
    
    // Atualiza recordes
    if (gameState.distance > save.bestDistance) save.bestDistance = gameState.distance;
    if (gameState.score > save.bestScore) save.bestScore = gameState.score;
    save.coins += gameState.coinsEarned;
    writeSave();
    
    document.getElementById('finalDistance').textContent = gameState.distance;
    document.getElementById('finalScore').textContent = gameState.score;
    document.getElementById('finalCoins').textContent = gameState.coinsEarned;
    
    setTimeout(() => {
        gameOverPanel.classList.add('show');
    }, 400);
    
    updateCoinsDisplay();
}

function victory() {
    gameState.running = false;
    cancelAnimationFrame(gameState.animationId);
    
    if (gameState.distance > save.bestDistance) save.bestDistance = gameState.distance;
    if (gameState.score > save.bestScore) save.bestScore = gameState.score;
    save.coins += gameState.coinsEarned + 100; // Bônus de vitória
    writeSave();
    
    alert('🎉 VOCÊ VENCEU! Bônus de +100 moedas!');
    document.getElementById('finalDistance').textContent = gameState.distance;
    document.getElementById('finalScore').textContent = gameState.score;
    document.getElementById('finalCoins').textContent = gameState.coinsEarned + 100;
    gameOverPanel.classList.add('show');
    updateCoinsDisplay();
}

/* =====================================================
   CONTROLES
===================================================== */
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (document.getElementById('game').classList.contains('active')) {
            if (gameOverPanel.classList.contains('show')) {
                startGame();
            } else if (!gameState.paused) {
                jump();
            }
        }
    }
    if (e.code === 'Escape') {
        if (document.getElementById('game').classList.contains('active') && gameState.running) {
            togglePause();
        }
    }
});

document.addEventListener('mousedown', (e) => {
    if (document.getElementById('game').classList.contains('active') && !gameState.paused) {
        if (gameOverPanel.classList.contains('show')) return;
        if (e.target.closest('button')) return;
        jump();
    }
});

document.addEventListener('touchstart', (e) => {
    if (document.getElementById('game').classList.contains('active') && !gameState.paused) {
        if (gameOverPanel.classList.contains('show')) return;
        if (e.target.closest('button')) return;
        e.preventDefault();
        jump();
    }
}, { passive: false });

/* =====================================================
   PAUSE / BOTÕES DO JOGO
===================================================== */
function togglePause() {
    if (!gameState.running) return;
    gameState.paused = !gameState.paused;
    if (gameState.paused) {
        pausePanel.classList.add('show');
    } else {
        pausePanel.classList.remove('show');
        gameLoop();
    }
}

document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnQuit').onclick = () => {
    gameState.running = false;
    gameState.paused = false;
    cancelAnimationFrame(gameState.animationId);
    gameState.obstacles.forEach(o => o.element.remove());
    gameState.obstacles = [];
    gameState.coins.forEach(c => c.element.remove());
    gameState.coins = [];
    pausePanel.classList.remove('show');
    showScreen('menu');
    updateMenuInfo();
};
document.getElementById('btnRetry').onclick = () => {
    gameState.attempts++;
    startGame();
};
document.getElementById('btnMenu').onclick = () => {
    gameState.obstacles.forEach(o => o.element.remove());
    gameState.obstacles = [];
    gameState.coins.forEach(c => c.element.remove());
    gameState.coins = [];
    gameOverPanel.classList.remove('show');
    showScreen('menu');
    updateMenuInfo();
};
