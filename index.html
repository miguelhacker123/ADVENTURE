<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bike 3D Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; font-family: system-ui, sans-serif; user-select: none; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 12px; left: 12px; color: #fff;
    font-size: 17px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,.8);
    pointer-events: none; line-height: 1.5;
  }
  #hud .best { font-size: 12px; opacity: .8; font-weight: 500; }
  #hud .spd { font-size: 12px; opacity: .9; color: #4ecdc4; font-weight: 600; }

  #combo {
    position: fixed; top: 12px; right: 12px; color: #ffd166;
    font-size: 20px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.8);
    pointer-events: none; opacity: 0; transition: opacity .2s; text-align: right;
  }
  #combo.on { opacity: 1; }

  .btn {
    position: fixed;
    width: 78px; height: 78px;
    border-radius: 16px;
    border: 3px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    touch-action: none; cursor: pointer;
    transition: transform .08s, background .12s, border-color .12s, box-shadow .12s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    padding: 0;
    z-index: 10;
  }
  .btn svg { width: 62%; height: 62%; display: block; }
  .btn:active, .btn.pressed {
    transform: scale(0.93);
    background: rgba(255,255,255,0.3);
    border-color: #fff;
  }

  #btnUp    { left: 105px; bottom: 108px; border-color: rgba(120,200,255,0.8); background: rgba(120,200,255,0.14); }
  #btnDown  { left: 105px; bottom: 22px;  border-color: rgba(120,200,255,0.8); background: rgba(120,200,255,0.14); }
  #btnLeft  { left: 22px;  bottom: 65px;  border-color: rgba(120,200,255,0.8); background: rgba(120,200,255,0.14); }
  #btnRight { left: 188px; bottom: 65px;  border-color: rgba(120,200,255,0.8); background: rgba(120,200,255,0.14); }
  #btnUp.pressed, #btnDown.pressed, #btnLeft.pressed, #btnRight.pressed {
    background: rgba(120,200,255,0.55); border-color: #78c8ff;
    box-shadow: 0 0 20px rgba(120,200,255,0.7);
  }

  #btnGrau { right: 22px; bottom: 22px; border-color: rgba(255,82,82,0.75); background: rgba(255,82,82,0.15); }
  #btnGrau.pressed { background: rgba(255,82,82,0.55); border-color: #ff5252; box-shadow: 0 0 20px rgba(255,82,82,0.6); }

  #btnJump { right: 110px; bottom: 22px; border-color: rgba(78,205,196,0.75); background: rgba(78,205,196,0.15); }
  #btnJump.pressed { background: rgba(78,205,196,0.55); border-color: #4ecdc4; box-shadow: 0 0 20px rgba(78,205,196,0.6); }

  #btnFlip { right: 66px; bottom: 110px; border-color: rgba(255,209,102,0.85); background: rgba(255,209,102,0.15); }
  #btnFlip.pressed { background: rgba(255,209,102,0.6); border-color: #ffd166; box-shadow: 0 0 22px rgba(255,209,102,0.8); }

  @media (max-height: 540px) {
    .btn { width: 64px; height: 64px; border-radius: 13px; }
    #btnUp    { left: 84px;  bottom: 88px; }
    #btnDown  { left: 84px;  bottom: 16px; }
    #btnLeft  { left: 16px;  bottom: 52px; }
    #btnRight { left: 152px; bottom: 52px; }
    #btnGrau  { right: 16px; bottom: 16px; }
    #btnJump  { right: 88px; bottom: 16px; }
    #btnFlip  { right: 52px; bottom: 88px; }
  }

  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.7); z-index: 20; color: #fff; text-align: center; padding: 20px;
  }
  #overlay.on { display: flex; }
  #overlay h1 { font-size: 44px; margin-bottom: 8px; color: #ff5252; text-shadow: 0 4px 20px rgba(255,82,82,0.5); }
  #overlay .pts { font-size: 26px; color: #f4a261; font-weight: 700; margin-bottom: 4px; }
  #overlay .best { font-size: 15px; color: #aaa; margin-bottom: 24px; }
  #overlay button {
    padding: 14px 32px; font-size: 17px; font-weight: 800;
    border-radius: 14px; border: 3px solid #4ecdc4;
    background: rgba(78,205,196,0.2); color: #fff; cursor: pointer;
    font-family: inherit; letter-spacing: 0.5px;
  }
  #overlay button:active { background: rgba(78,205,196,0.5); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>Pontos: <span id="score">0</span></div>
  <div class="best">Recorde: <span id="best">0</span></div>
  <div class="spd">Vel: <span id="spd">0</span> km/h</div>
</div>
<div id="combo"></div>

<button class="btn" id="btnUp" aria-label="Acelerar">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 12 L84 54 H66 V88 H34 V54 H16 Z" fill="#78c8ff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 26 L70 50 H60 V78 H40 V50 H30 Z" fill="rgba(255,255,255,0.35)"/>
  </svg>
</button>
<button class="btn" id="btnDown" aria-label="Frear">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 88 L16 46 H34 V12 H66 V46 H84 Z" fill="#78c8ff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 74 L30 50 H40 V22 H60 V50 H70 Z" fill="rgba(255,255,255,0.35)"/>
  </svg>
</button>
<button class="btn" id="btnLeft" aria-label="Esquerda">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 50 L54 16 V34 H88 V66 H54 V84 Z" fill="#78c8ff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M26 50 L50 30 V40 H78 V60 H50 V70 Z" fill="rgba(255,255,255,0.35)"/>
  </svg>
</button>
<button class="btn" id="btnRight" aria-label="Direita">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M88 50 L46 16 V34 H12 V66 H46 V84 Z" fill="#78c8ff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M74 50 L50 30 V40 H22 V60 H50 V70 Z" fill="rgba(255,255,255,0.35)"/>
  </svg>
</button>

<button class="btn" id="btnGrau" aria-label="Grau">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="6" y1="86" x2="94" y2="86" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="72" r="14" fill="none" stroke="#ff5252" stroke-width="5"/>
    <circle cx="26" cy="72" r="3" fill="#ff5252"/>
    <circle cx="72" cy="30" r="12" fill="none" stroke="#ff5252" stroke-width="5"/>
    <circle cx="72" cy="30" r="3" fill="#ff5252"/>
    <path d="M26 72 L44 58 L60 44 L72 30" stroke="#ff5252" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="40" y1="62" x2="50" y2="54" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="44" x2="68" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="52" cy="42" r="7" fill="#4ecdc4" stroke="#fff" stroke-width="3"/>
    <path d="M48 58 L54 48 L64 42" stroke="#4ecdc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<button class="btn" id="btnJump" aria-label="Pular">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 14 L82 52 H66 V86 H34 V52 H18 Z" fill="#4ecdc4" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 26 L70 50 H60 V78 H40 V50 H30 Z" fill="rgba(255,255,255,0.35)"/>
  </svg>
</button>
<button class="btn" id="btnFlip" aria-label="Mortal">
  <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M72 28 A30 30 0 1 1 28 28" stroke="#ffd166" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M28 28 L22 40 L36 38 Z" fill="#ffd166" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="50" cy="52" r="7" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="50" cy="52" r="1.8" fill="#fff"/>
    <line x1="50" y1="52" x2="60" y2="44" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="52" x2="42" y2="44" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </svg>
</button>

<div id="overlay">
  <h1>BATEU!</h1>
  <div class="pts">Pontos: <span id="finalScore">0</span></div>
  <div class="best">Recorde: <span id="finalBest">0</span></div>
  <button id="restartBtn">JOGAR DE NOVO</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const spdEl   = document.getElementById('spd');
  const comboEl = document.getElementById('combo');
  const overlay = document.getElementById('overlay');
  const finalScore = document.getElementById('finalScore');
  const finalBest  = document.getElementById('finalBest');
  const restartBtn = document.getElementById('restartBtn');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ============================================================
  // PROJEÇÃO 3D CORRIGIDA
  // Bike no centro. Câmera atrás e acima. z=0 = bike, z grande = longe.
  // horizonte = altura onde z -> infinito.
  // ============================================================
  const CAM = {
    height: 1.6,     // altura da câmera (em unidades mundo)
    back: 4.0,       // distância atrás da bike
    focal: 1.2,      // "focal" -> controla FOV
  };

  const ROAD_HALF = 3.0;      // meia-largura da estrada (unidades)
  const HORIZON_RATIO = 0.42; // onde o horizonte fica na tela (0..1)

  // unidade de mundo = quantos pixels na tela? Ajustado por foco
  // A projeção: dado (x, y, z) relativo ao bike
  //   z_rel = z (mais longe = maior)
  //   profundidade da câmera = z_rel + back
  //   scale = focal / (z_rel + back)
  //   sx = W/2 + (x - bikeX) * scale * W * k
  //   sy = horizonY + (CAM.height - y) * scale * H * k
  // onde k ajusta pra caber bem.
  let kUnit = 1; // calculado no resize

  function project(x, y, z) {
    const zRel = z;             // z em unidades do mundo
    const depth = zRel + CAM.back;
    if (depth < 0.1) return null;
    const scale = CAM.focal / depth;
    const sx = W / 2 + (x - state.bikeX) * scale * kUnit;
    const sy = horizonY + (CAM.height - (y + state.bikeY)) * scale * kUnit;
    return { x: sx, y: sy, scale: scale * kUnit };
  }

  function recalcK() {
    // kUnit regula a escala em pixels.
    // Queremos que a estrada (meia largura ROAD_HALF) ocupe ~ metade da tela
    // na altura da bike (z=0).
    const depthAtBike = CAM.back;
    const scaleAtBike = CAM.focal / depthAtBike;
    // queremos ROAD_HALF * scaleAtBike * kUnit ≈ W * 0.42
    kUnit = (W * 0.42) / (ROAD_HALF * scaleAtBike);
    // limita pra caber em telas largas/estreitas
    kUnit = Math.max(kUnit, H * 0.35 / (CAM.height * scaleAtBike));
  }

  // ============================================================
  // ESTADO
  // ============================================================
  const state = {
    bikeZ: 0,
    bikeX: 0,
    targetX: 0,
    bikeY: 0,
    vy: 0,
    onGround: true,
    pitch: 0,
    roll: 0,
    wheelie: 0,
    spin: 0,
    spinSpeed: 0,
    speed: 0,
    maxSpeed: 45,
    accel: 22,
    brake: 40,
    friction: 3,
    score: 0,
    airTime: 0,
    comboMult: 1,
    comboTimer: 0,
    flipPending: false,
  };

  let best = +(localStorage.getItem('bikeBest3D') || 0);
  bestEl.textContent = Math.floor(best);

  const input = { up:false, down:false, left:false, right:false, jump:false, grau:false, flip:false };
  let jumpWasPressed = false;

  const objects = [];
  const parts = [];
  const clouds = [];
  for (let i = 0; i < 12; i++) {
    clouds.push({ x: Math.random()*2-1, y: Math.random()*0.5+0.1, z: Math.random()*400, s: 0.4+Math.random()*0.7 });
  }
  const buildings = [];
  for (let i = 0; i < 60; i++) {
    buildings.push({ x: Math.random()*3-1.5, z: Math.random()*600, w: 0.4+Math.random()*0.9, h: 0.3+Math.random()*1.6, c: Math.random() });
  }

  let gameOver = false;
  let gameStarted = false;
  let worldZ = 0;
  let horizonY = 0;

  function reset() {
    state.bikeZ = 0;
    state.bikeX = 0;
    state.targetX = 0;
    state.bikeY = 0;
    state.vy = 0;
    state.onGround = true;
    state.pitch = 0;
    state.roll = 0;
    state.wheelie = 0;
    state.spin = 0;
    state.spinSpeed = 0;
    state.speed = 0;
    state.score = 0;
    state.airTime = 0;
    state.comboMult = 1;
    state.comboTimer = 0;
    state.flipPending = false;

    objects.length = 0;
    parts.length = 0;
    worldZ = 0;

    for (let z = 40; z < 400; z += 30) spawnStuff(z);

    gameOver = false;
    gameStarted = false;
    overlay.classList.remove('on');
    comboEl.classList.remove('on');
    updateHUD();
  }

  function spawnStuff(z) {
    const r = Math.random();
    if (r < 0.22) {
      const w = 2.4 + Math.random() * 1.4;
      objects.push({ type: 'ramp', x: (Math.random()*2-1) * (ROAD_HALF - w*0.6), z, w, h: 1.4 + Math.random() * 0.7, hit: false, launched: false });
    } else if (r < 0.72) {
      const w = 0.8 + Math.random() * 0.7;
      objects.push({ type: 'box', x: (Math.random()*2-1) * (ROAD_HALF - w*0.7), z, w, h: 0.8 + Math.random() * 0.6, hit: false });
    } else {
      const w = 0.5;
      objects.push({ type: 'cone', x: (Math.random()*2-1) * (ROAD_HALF - w*0.7), z, w, h: 0.7, hit: false });
    }
  }

  function updateHUD() {
    scoreEl.textContent = Math.floor(state.score);
    spdEl.textContent = Math.round(state.speed * 3.6);
  }

  // ============================================================
  // INPUT
  // ============================================================
  function bind(btn, key, onDown) {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('pressed'); input[key] = true; onDown && onDown(); });
    const up = e => { e && e.preventDefault(); btn.classList.remove('pressed'); input[key] = false; };
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  }

  bind(document.getElementById('btnUp'), 'up', () => { if (!gameOver) gameStarted = true; });
  bind(document.getElementById('btnDown'), 'down');
  bind(document.getElementById('btnLeft'), 'left');
  bind(document.getElementById('btnRight'), 'right');
  bind(document.getElementById('btnGrau'), 'grau');

  bind(document.getElementById('btnJump'), 'jump', () => {
    if (gameOver) { reset(); return; }
    gameStarted = true;
    jumpWasPressed = true;
  });

  bind(document.getElementById('btnFlip'), 'flip', () => {
    if (gameOver) { reset(); return; }
    gameStarted = true;
    if (state.onGround) { state.vy = 12; state.onGround = false; }
  });

  window.addEventListener('keydown', e => {
    if (gameOver) return;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { input.up = true; gameStarted = true; }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') input.down = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
    if (e.code === 'Space' && !e.repeat) { input.jump = true; jumpWasPressed = true; gameStarted = true; }
    if (e.code === 'KeyG') input.grau = true;
    if (e.code === 'KeyF' && !e.repeat) { input.flip = true; gameStarted = true; if (state.onGround) { state.vy = 12; state.onGround = false; } }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') input.up = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') input.down = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    if (e.code === 'Space') input.jump = false;
    if (e.code === 'KeyG') input.grau = false;
    if (e.code === 'KeyF') input.flip = false;
  });

  restartBtn.addEventListener('click', reset);

  // ============================================================
  // FÍSICA
  // ============================================================
  const GRAVITY = 22;
  const JUMP_VEL = 8.5;
  const STEER_SPEED = 4.5;

  function update(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.vy -= 14 * dt;
      p.life -= dt;
      p.size *= 0.985;
      if (p.life <= 0) parts.splice(i, 1);
    }

    if (gameOver) return;

    if (!gameStarted) {
      state.speed = Math.max(0, state.speed - 6 * dt);
    } else {
      if (input.up) state.speed = Math.min(state.maxSpeed, state.speed + state.accel * dt);
      else if (input.down) state.speed = Math.max(0, state.speed - state.brake * dt);
      else state.speed = Math.max(0, state.speed - state.friction * dt);
    }

    let tX = state.targetX;
    if (input.left) tX -= STEER_SPEED * dt * (0.6 + state.speed/state.maxSpeed*0.9);
    if (input.right) tX += STEER_SPEED * dt * (0.6 + state.speed/state.maxSpeed*0.9);
    tX = Math.max(-ROAD_HALF + 0.6, Math.min(ROAD_HALF - 0.6, tX));
    state.targetX = tX;
    state.bikeX += (tX - state.bikeX) * Math.min(1, dt * 9);

    const targetRoll = (tX - state.bikeX) * -1.4;
    state.roll += (targetRoll - state.roll) * Math.min(1, dt * 8);

    const dz = state.speed * dt;
    state.bikeZ += dz;
    worldZ += dz;

    if (jumpWasPressed) {
      jumpWasPressed = false;
      if (state.onGround) {
        state.vy = JUMP_VEL;
        state.onGround = false;
        spawnDust(10);
      }
    }

    if (input.flip && !state.onGround) state.spinSpeed = 9.5;
    else { state.spinSpeed *= 0.94; if (Math.abs(state.spinSpeed) < 0.1) state.spinSpeed = 0; }
    state.spin += state.spinSpeed * dt;

    if (input.grau && state.onGround && state.speed > 3) {
      state.wheelie = Math.min(1, state.wheelie + 3.0 * dt);
      if (state.wheelie > 0.5 && Math.random() < 0.55) spawnSparks();
    } else {
      state.wheelie = Math.max(0, state.wheelie - 4.0 * dt);
    }

    if (!state.onGround) {
      state.vy -= GRAVITY * dt;
      state.bikeY += state.vy * dt;
      state.airTime += dt;
      if (Math.abs(state.spin) >= Math.PI*2 - 0.25 && !state.flipPending) {
        state.flipPending = true;
        spawnSparks(30);
      }
    }

    // chão / rampas
    let groundLevel = 0;
    let rampPitch = 0;
    let rampObj = null;
    const REAR_X = state.bikeX;
    const REAR_Z = state.bikeZ;

    for (const o of objects) {
      const ozBack = o.z - o.w * 0.5;
      const ozFront = o.z + o.w * 0.5;
      const inX = Math.abs(REAR_X - o.x) < o.w * 0.55 + 0.5;
      const inZ = REAR_Z > ozBack && REAR_Z < ozFront;

      if (o.type === 'ramp' && inX && inZ) {
        const t = (REAR_Z - ozBack) / (ozFront - ozBack);
        const rampTop = Math.max(0, t) * o.h;
        if (rampTop > groundLevel) {
          groundLevel = rampTop;
          rampPitch = -Math.atan2(o.h, o.w) * 1.1;
          rampObj = o;
        }
      }
    }

    if (state.bikeY <= groundLevel) {
      if (!state.onGround) {
        state.score += state.airTime * 90;
        if (state.flipPending) {
          state.score += 800;
          flashCombo('MORTAL! +800');
          state.flipPending = false;
        } else if (state.airTime > 0.4) {
          flashCombo('AÉREO +' + Math.floor(state.airTime * 90));
        }
        spawnDust(20);
        state.airTime = 0;
      }
      state.bikeY = groundLevel;
      state.vy = 0;
      state.onGround = true;
      state.pitch += (rampPitch - state.pitch) * Math.min(1, dt * 8);

      if (rampObj && !rampObj.launched && state.speed > 12) {
        const tipZ = rampObj.z + rampObj.w * 0.5;
        if (state.bikeZ > tipZ - 0.3) {
          rampObj.launched = true;
          state.vy = 11 + state.speed * 0.25;
          state.onGround = false;
          state.pitch = -0.5;
          spawnDust(25);
        }
      }
    } else {
      state.onGround = false;
      state.pitch += (0 - state.pitch) * Math.min(1, dt * 3);
    }

    // colisão objetos
    for (const o of objects) {
      if (o.type === 'ramp') continue;
      if (o.hit) continue;
      const ozBack = o.z - o.w * 0.5;
      const ozFront = o.z + o.w * 0.5;
      if (state.bikeZ > ozBack - 0.6 && state.bikeZ < ozFront + 0.6) {
        if (Math.abs(state.bikeX - o.x) < (o.w * 0.55 + 0.5)) {
          if (state.bikeY > o.h + 0.15) {
            o.hit = true;
            state.score += 30;
          } else {
            o.hit = true;
            boom(o);
            endGame();
            return;
          }
        }
      }
    }

    // limpa e gera novos
    for (let i = objects.length - 1; i >= 0; i--) {
      if (objects[i].z < state.bikeZ - 15) objects.splice(i, 1);
    }
    while (objects.length === 0 || objects[objects.length-1].z < state.bikeZ + 250) {
      const last = objects.length ? objects[objects.length-1].z : state.bikeZ + 40;
      const gap = Math.max(10, 28 - state.speed * 0.3) + Math.random() * 14;
      spawnStuff(last + gap);
    }

    state.score += state.speed * dt * 1.8;

    if (state.onGround && state.wheelie > 0.35) {
      state.comboMult = 1 + Math.min(state.wheelie * 2.2, 2.2);
      state.comboTimer = 0.5;
      state.score += dt * 55 * state.wheelie * state.comboMult;
      if (!state.flipPending) {
        comboEl.textContent = 'GRAU x' + state.comboMult.toFixed(1);
        comboEl.classList.add('on');
      }
    } else {
      if (state.comboTimer > 0 && !state.flipPending) {
        state.comboTimer -= dt;
        if (state.comboTimer <= 0) { comboEl.classList.remove('on'); state.comboMult = 1; }
      }
    }

    updateHUD();
  }

  function flashCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.add('on');
    state.comboTimer = 1.2;
    state.comboMult = 1;
  }

  // ============================================================
  // PARTÍCULAS
  // ============================================================
  function spawnDust(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: state.bikeX + (Math.random()-0.5)*0.6,
        y: 0.1, z: state.bikeZ - 0.5 + Math.random()*0.5,
        vx: (Math.random()-0.5)*2, vy: Math.random()*3 + 1, vz: -1 - Math.random()*2,
        life: 0.6 + Math.random()*0.5, maxLife: 1.1,
        size: 0.2 + Math.random()*0.18,
        color: Math.random() < 0.5 ? '#d4b48a' : '#a08868',
      });
    }
  }
  function spawnSparks(n) {
    n = n || 3;
    for (let i = 0; i < n; i++) {
      parts.push({
        x: state.bikeX + (Math.random()-0.5)*0.7,
        y: 0.3 + Math.random()*0.4, z: state.bikeZ + (Math.random()-0.5)*0.4,
        vx: (Math.random()-0.5)*5, vy: Math.random()*5 + 1.5, vz: (Math.random()-0.5)*3,
        life: 0.4 + Math.random()*0.3, maxLife: 0.7,
        size: 0.12 + Math.random()*0.09,
        color: Math.random() < 0.5 ? '#ffd166' : '#ff8c42',
      });
    }
  }
  function boom(o) {
    for (let i = 0; i < 40; i++) {
      parts.push({
        x: o.x + (Math.random()-0.5)*o.w,
        y: Math.random()*o.h, z: o.z + (Math.random()-0.5)*o.w,
        vx: (Math.random()-0.5)*7, vy: Math.random()*6 + 2, vz: (Math.random()-0.5)*7,
        life: 0.8 + Math.random()*0.5, maxLife: 1.3,
        size: 0.16 + Math.random()*0.14,
        color: Math.random() < 0.5 ? '#ff5252' : '#ffd166',
      });
    }
  }

  function endGame() {
    gameOver = true;
    best = Math.max(best, state.score);
    localStorage.setItem('bikeBest3D', Math.floor(best));
    bestEl.textContent = Math.floor(best);
    finalScore.textContent = Math.floor(state.score);
    finalBest.textContent = Math.floor(best);
    setTimeout(() => overlay.classList.add('on'), 500);
  }

  // ============================================================
  // DESENHO
  // ============================================================
  function drawSky() {
    // gradiente do céu até o horizonte
    const g = ctx.createLinearGradient(0, 0, 0, horizonY);
    g.addColorStop(0, '#0d0d1f');
    g.addColorStop(0.45, '#2d2451');
    g.addColorStop(0.75, '#7a3d6e');
    g.addColorStop(1, '#f4a261');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizonY);

    // sol
    const sx = W * 0.72, sy = horizonY - H * 0.1;
    const sr = Math.min(W, H) * 0.075;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
    sg.addColorStop(0, 'rgba(255,225,160,0.98)');
    sg.addColorStop(0.25, 'rgba(255,180,110,0.55)');
    sg.addColorStop(1, 'rgba(255,180,110,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, sr * 4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffe8b8';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI*2);
    ctx.fill();

    // prédios (parallax no horizonte, sempre no chão = y=0)
    const sortedB = buildings.slice().sort((a,b) => b.z - a.z);
    for (const b of sortedB) {
      // posição no mundo, relativa à bike, em z (mas com muito parallax lento)
      const relZ = ((b.z - worldZ * 0.12) % 600 + 600) % 600;
      if (relZ > 580) continue;
      // projeta em y=0 no plano z = relZ + 40 (força ficar atrás do horizonte próximo)
      const p = project(b.x * 3, 0, relZ + 40);
      if (!p) continue;
      // altura do prédio na tela: usa projeção de um ponto no topo (y = b.h * 3)
      const pTop = project(b.x * 3, b.h * 3, relZ + 40);
      if (!pTop) continue;
      const w = Math.abs(p.scale) * 0.5 * (Math.abs(b.w) * 3);
      const hpx = p.y - pTop.y;
      if (hpx < 2 || w < 2) continue;

      const shade = 0.10 + b.c * 0.06;
      ctx.fillStyle = `rgba(15,10,30,${Math.min(0.95, shade + 0.25)})`;
      ctx.fillRect(p.x - w/2, pTop.y, w, hpx);

      // janelas
      ctx.fillStyle = `rgba(255,200,120,${0.35})`;
      const cols = Math.max(1, Math.floor(w / 5));
      const rows = Math.max(1, Math.floor(hpx / 7));
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          if ((Math.sin(i*13.7 + j*7.3 + b.z*0.5) * 0.5 + 0.5) > 0.55) {
            const wx = p.x - w/2 + (i + 0.3) * (w / cols);
            const wy = pTop.y + (j + 0.3) * (hpx / rows);
            ctx.fillRect(wx, wy, Math.max(1, w / cols * 0.35), Math.max(1, hpx / rows * 0.35));
          }
        }
      }
    }

    // nuvens
    for (const c of clouds) {
      const relZ = ((c.z - worldZ * 0.25) % 400 + 400) % 400;
      if (relZ > 380) continue;
      const p = project(c.x * 3, c.y * 4 + 3, relZ + 30);
      if (!p) continue;
      const cs = Math.abs(p.scale) * c.s * 0.8;
      if (cs < 3) continue;
      ctx.fillStyle = `rgba(255,220,220,${0.18})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, cs, 0, Math.PI*2);
      ctx.arc(p.x + cs*0.9, p.y + cs*0.15, cs*0.75, 0, Math.PI*2);
      ctx.arc(p.x - cs*0.9, p.y + cs*0.2, cs*0.65, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawGround() {
    // chão (tudo abaixo do horizonte)
    const g = ctx.createLinearGradient(0, horizonY, 0, H);
    g.addColorStop(0, '#1a1428');
    g.addColorStop(1, '#05030a');
    ctx.fillStyle = g;
    ctx.fillRect(0, horizonY, W, H - horizonY);
  }

  function drawRoad() {
    // asfalto (trapézio)
    const p1 = project(-ROAD_HALF, 0, 0);
    const p2 = project( ROAD_HALF, 0, 0);
    const p3 = project( ROAD_HALF, 0, 250);
    const p4 = project(-ROAD_HALF, 0, 250);
    if (!p1 || !p2 || !p3 || !p4) return;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.fillStyle = '#1e1e2e';
    ctx.fill();

    // bordas neon (fade pra longe)
    function drawEdge(side) {
      const segs = 30;
      for (let i = 0; i < segs; i++) {
        const z1 = (i / segs) * 250;
        const z2 = ((i + 1) / segs) * 250;
        const a = project(side * ROAD_HALF, 0, z1);
        const b = project(side * ROAD_HALF, 0, z2);
        if (!a || !b) continue;
        const alpha = Math.max(0, 1 - z1 / 220);
        ctx.strokeStyle = `rgba(78,205,196,${alpha})`;
        ctx.lineWidth = 4 * (1 - z1 / 300) + 1;
        ctx.shadowColor = 'rgba(78,205,196,' + (alpha*0.8) + ')';
        ctx.shadowBlur = 12 * alpha;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    drawEdge(-1);
    drawEdge(1);

    // linhas transversais (traços que se movem)
    const dashSpacing = 4;
    const phase = (worldZ % dashSpacing) / dashSpacing;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 30; i++) {
      const z = (i + phase) * dashSpacing;
      if (z > 200) break;
      const a = project(-ROAD_HALF, 0.01, z);
      const b = project( ROAD_HALF, 0.01, z);
      if (!a || !b) continue;
      const alpha = Math.max(0, 1 - z / 200) * 0.9;
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.35})`;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    // faixa central amarela tracejada
    for (let i = 0; i < 40; i++) {
      const z = (i + phase) * dashSpacing * 1.4;
      if (z > 200) break;
      const a = project(0, 0.02, z);
      const b = project(0, 0.02, z + dashSpacing * 0.8);
      if (!a || !b) continue;
      const alpha = Math.max(0, 1 - z / 200);
      ctx.strokeStyle = `rgba(255,209,102,${alpha * 0.8})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  function drawObject(o) {
    const relZ = o.z - state.bikeZ;
    if (relZ < -2 || relZ > 220) return;

    if (o.type === 'ramp') {
      const zBack = o.z - o.w * 0.5;
      const zFront = o.z + o.w * 0.5;
      const xL = o.x - o.w * 0.5;
      const xR = o.x + o.w * 0.5;

      const bl = project(xL, 0, zBack);
      const br = project(xR, 0, zBack);
      const tl = project(xL, o.h, zBack);
      const tr = project(xR, o.h, zBack);
      const fl = project(xL, 0, zFront);
      const fr = project(xR, 0, zFront);
      const tlf = project(xL, o.h, zFront);
      const trf = project(xR, o.h, zFront);
      if (!bl || !br || !tl || !tr || !fl || !fr || !tlf || !trf) return;

      // corpo da rampa (superfície inclinada)
      const g = ctx.createLinearGradient(0, tl.y, 0, bl.y);
      g.addColorStop(0, '#a8842e');
      g.addColorStop(1, '#4a3210');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bl.x, bl.y);
      ctx.lineTo(tl.x, tl.y);
      ctx.lineTo(tr.x, tr.y);
      ctx.lineTo(br.x, br.y);
      ctx.closePath();
      ctx.fill();

      // topo brilhante
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(tl.x, tl.y);
      ctx.lineTo(tr.x, tr.y);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // face lateral direita
      ctx.fillStyle = 'rgba(50,30,10,0.95)';
      ctx.beginPath();
      ctx.moveTo(tr.x, tr.y);
      ctx.lineTo(trf.x, trf.y);
      ctx.lineTo(fr.x, fr.y);
      ctx.lineTo(br.x, br.y);
      ctx.closePath();
      ctx.fill();

      // listras
      ctx.strokeStyle = 'rgba(255,209,102,0.5)';
      ctx.lineWidth = 2;
      for (let i = 1; i < 4; i++) {
        const t = i / 4;
        const pA = project(o.x - o.w*0.4, o.h*t, zBack + o.w*t);
        const pB = project(o.x + o.w*0.4, o.h*t, zBack + o.w*t);
        if (pA && pB) {
          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
        }
      }
    } else if (o.type === 'box') {
      const zBack = o.z - o.w * 0.5;
      const zFront = o.z + o.w * 0.5;
      const xL = o.x - o.w * 0.5;
      const xR = o.x + o.w * 0.5;

      const bl = project(xL, 0, zBack);
      const br = project(xR, 0, zBack);
      const tl = project(xL, o.h, zBack);
      const tr = project(xR, o.h, zBack);
      const fl = project(xL, 0, zFront);
      const fr = project(xR, 0, zFront);
      const tlf = project(xL, o.h, zFront);
      const trf = project(xR, o.h, zFront);
      if (!bl || !br || !tl || !tr || !fl || !fr || !tlf || !trf) return;

      // topo
      ctx.fillStyle = '#a88848';
      ctx.beginPath();
      ctx.moveTo(tl.x, tl.y);
      ctx.lineTo(tr.x, tr.y);
      ctx.lineTo(trf.x, trf.y);
      ctx.lineTo(tlf.x, tlf.y);
      ctx.closePath();
      ctx.fill();

      // frente
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath();
      ctx.moveTo(bl.x, bl.y);
      ctx.lineTo(tl.x, tl.y);
      ctx.lineTo(tr.x, tr.y);
      ctx.lineTo(br.x, br.y);
      ctx.closePath();
      ctx.fill();

      // lateral direita
      ctx.fillStyle = '#5a3f1a';
      ctx.beginPath();
      ctx.moveTo(br.x, br.y);
      ctx.lineTo(tr.x, tr.y);
      ctx.lineTo(trf.x, trf.y);
      ctx.lineTo(fr.x, fr.y);
      ctx.closePath();
      ctx.fill();

      // X na frente
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tl.x, tl.y);
      ctx.lineTo(br.x, br.y);
      ctx.moveTo(tr.x, tr.y);
      ctx.lineTo(bl.x, bl.y);
      ctx.stroke();
    } else if (o.type === 'cone') {
      const base = project(o.x, 0, o.z);
      const top = project(o.x, o.h, o.z);
      if (!base || !top) return;
      const w = Math.abs(base.scale) * 0.5;
      // base
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.ellipse(base.x, base.y, w * 0.6, w * 0.22, 0, 0, Math.PI*2);
      ctx.fill();
      // corpo
      const g = ctx.createLinearGradient(base.x, top.y, base.x, base.y);
      g.addColorStop(0, '#ffb066');
      g.addColorStop(1, '#c8501e');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(base.x - w * 0.45, base.y);
      ctx.lineTo(base.x + w * 0.45, base.y);
      ctx.closePath();
      ctx.fill();
      // listra branca
      const mid = project(o.x, o.h * 0.55, o.z);
      if (mid) {
        const mw = w * 0.32;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.moveTo(mid.x - mw, mid.y);
        ctx.lineTo(mid.x + mw, mid.y);
        ctx.lineTo(mid.x + mw * 1.15, mid.y + w * 0.1);
        ctx.lineTo(mid.x - mw * 1.15, mid.y + w * 0.1);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  function drawBike3D() {
    const bp = project(state.bikeX, state.bikeY + 0.9, -CAM.back * 0.55);
    // na verdade a bike fica perto da tela: usamos um offset fixo
    // pra que ela apareça sempre na parte de baixo, vista de trás.
    const baseX = W / 2 + (state.bikeX - state.bikeX) * 0; // sempre no centro
    // Porém deslocamos lateral conforme a posição pra dar sensação de movimento:
    const lateralShift = (state.bikeX - state.targetX) * 0; // deixamos a câmera seguir
    const px = W / 2 + state.bikeX * 0; // a câmera segue a bike, então centro
    const py = H * 0.78 - state.bikeY * (H * 0.06);

    // usa kUnit pra escala
    const s = kUnit * 0.0085;

    // sombra
    const shadowScale = Math.max(0.3, 1 - state.bikeY * 0.15);
    ctx.fillStyle = `rgba(0,0,0,${0.55 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(px, py + 46 * s, 60 * s * shadowScale, 14 * s * shadowScale, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(px, py);
    const totalTilt = state.pitch * 0.9 + state.spin;
    ctx.rotate(totalTilt);
    ctx.rotate(state.roll * 0.5);
    ctx.scale(s, s);

    // rastro do mortal
    if (Math.abs(state.spinSpeed) > 4) {
      ctx.strokeStyle = 'rgba(78,205,196,0.6)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, -50, 130, 0, Math.PI*2);
      ctx.stroke();
    }

    // roda traseira
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.ellipse(0, 30, 42, 30, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#4a4a4a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 30, 42, 30, 0, 0, Math.PI*2);
    ctx.stroke();
    // aro vermelho
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 30, 28, 20, 0, 0, Math.PI*2);
    ctx.stroke();

    // roda dianteira (mais alta e estreita)
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.ellipse(0, -70, 26, 40, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, -70, 26, 40, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -70, 17, 26, 0, 0, Math.PI*2);
    ctx.stroke();

    // garfo (conecta roda dianteira)
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-16, -32);
    ctx.lineTo(-16, -70);
    ctx.moveTo(16, -32);
    ctx.lineTo(16, -70);
    ctx.stroke();

    // quadro
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 12;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-22, -10);
    ctx.lineTo(0, -50);
    ctx.lineTo(22, -10);
    ctx.moveTo(0, -50);
    ctx.lineTo(0, -85);
    ctx.stroke();

    // banco
    ctx.fillStyle = '#0d0d0d';
    ctx.beginPath();
    ctx.ellipse(0, -18, 34, 14, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(0, -20, 28, 8, 0, 0, Math.PI*2);
    ctx.fill();

    // guidão
    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-46, -78);
    ctx.lineTo(-14, -86);
    ctx.moveTo(46, -78);
    ctx.lineTo(14, -86);
    ctx.stroke();
    // grips
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(-46, -78);
    ctx.lineTo(-56, -74);
    ctx.moveTo(46, -78);
    ctx.lineTo(56, -74);
    ctx.stroke();

    // escapamento (dois lados)
    ctx.strokeStyle = '#c8c8c8';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-30, 10);
    ctx.lineTo(-48, 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(30, 10);
    ctx.lineTo(48, 4);
    ctx.stroke();
    // pontas brilhando
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.arc(-48, 4, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(48, 4, 5, 0, Math.PI*2); ctx.fill();

    // lanterna traseira
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.ellipse(0, -12, 9, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // ---- piloto visto de trás ----
    // pernas
    ctx.fillStyle = '#2a3f66';
    ctx.beginPath();
    ctx.ellipse(-14, -8, 10, 18, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(14, -8, 10, 18, 0, 0, Math.PI*2);
    ctx.fill();

    // corpo (jaqueta)
    const gBody = ctx.createLinearGradient(0, -70, 0, -20);
    gBody.addColorStop(0, '#4ecdc4');
    gBody.addColorStop(1, '#2a8b85');
    ctx.fillStyle = gBody;
    ctx.beginPath();
    ctx.ellipse(0, -50, 24, 30, 0, 0, Math.PI*2);
    ctx.fill();

    // braços
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = 11;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-22, -55);
    ctx.lineTo(-44, -74);
    ctx.moveTo(22, -55);
    ctx.lineTo(44, -74);
    ctx.stroke();

    // capacete
    ctx.fillStyle = '#ff5252';
    ctx.beginPath();
    ctx.arc(0, -92, 20, 0, Math.PI*2);
    ctx.fill();
    // listras capacete
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-20, -95, 40, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, -88, 18, 6, 0, 0, Math.PI);
    ctx.fill();

    // raios girando nas rodas
    const rot = (worldZ * 4) % (Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 4; i++) {
      const a = rot + i * Math.PI / 2;
      // roda traseira
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 6, 30 + Math.sin(a) * 5);
      ctx.lineTo(Math.cos(a) * 36, 30 + Math.sin(a) * 26);
      ctx.stroke();
    }

    ctx.restore();

    // linhas de velocidade
    if (state.speed > state.maxSpeed * 0.55) {
      const alpha = (state.speed - state.maxSpeed * 0.55) / (state.maxSpeed * 0.45);
      ctx.strokeStyle = `rgba(120,200,255,${alpha * 0.55})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const off = Math.random();
        const sx = W/2 + side * (W*0.28 + off * W*0.2);
        const sy = horizonY + Math.random() * (H - horizonY) * 0.7;
        const len = 30 + Math.random() * 80;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + side * len * 0.3, sy + len);
        ctx.stroke();
      }
    }
  }

  function drawParticles3D() {
    const arr = parts.slice().sort((a, b) => b.z - a.z);
    for (const p of arr) {
      const pp = project(p.x, p.y, p.z - state.bikeZ);
      if (!pp) continue;
      const a = Math.max(0, p.life / p.maxLife);
      const size = Math.max(1.2, p.size * Math.abs(pp.scale) * 0.9);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W/2, H*0.6, Math.min(W,H)*0.35, W/2, H*0.6, Math.max(W,H)*0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStartHint() {
    if (gameStarted || gameOver) return;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = `bold ${Math.min(W*0.06, 36)}px system-ui, sans-serif`;
    ctx.fillText('Segure ▲ para acelerar', W/2, H * 0.55);
    ctx.font = `500 ${Math.min(W*0.038, 18)}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('◀ ▶ para desviar · botões à direita para truques', W/2, H * 0.6);
  }

  // ============================================================
  // LOOP
  // ============================================================
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0.001) dt = 0.001;

    horizonY = H * HORIZON_RATIO;
    recalcK();

    update(dt);

    ctx.fillStyle = '#05030a';
    ctx.fillRect(0, 0, W, H);

    drawSky();
    drawGround();
    drawRoad();

    const sorted = objects.slice().sort((a, b) => b.z - a.z);
    for (const o of sorted) drawObject(o);

    drawParticles3D();
    drawBike3D();
    drawVignette();
    drawStartHint();

    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
