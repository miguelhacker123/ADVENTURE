<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bike Wheelie 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; color: #fff;
    font-size: 18px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,.6);
    pointer-events: none; user-select: none; line-height: 1.5;
  }
  #hud .best { font-size: 13px; opacity: .8; font-weight: 500; }
  #hint {
    position: fixed; bottom: 20px; left: 0; right: 0; text-align: center;
    color: #fff; opacity: .75; font-size: 14px; pointer-events: none;
    user-select: none; transition: opacity .6s;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>Pontos: <span id="score">0</span></div>
  <div class="best">Recorde: <span id="best">0</span></div>
</div>
<div id="hint">Toque para pular · Segure para empinar</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  let groundY = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H - Math.max(70, H * 0.14);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Estado ----------
  const bike = {
    x: 0,
    y: 0,
    vy: 0,
    angle: 0,          // rotação da bike (radianos)
    onGround: true,
    wheelie: 0,        // 0..1 progresso do wheelie
    holding: false,
    wheelRadius: 0
  };

  const GRAVITY = 2600;        // px/s²
  const JUMP_VELOCITY = -980;  // impulso do toque
  const HOLD_GRAVITY = 300;    // gravidade enquanto segura (levita um pouco)
  const MAX_WHEELIE = 0.75;    // ângulo máximo (rad)
  const WHEELIE_SPEED = 3.2;   // velocidade de empinada

  const obstacles = [];
  let obstacleTimer = 0;
  let spawnInterval = 1.6;

  let speed = 420;
  let score = 0;
  let best = +(localStorage.getItem('bikeBest') || 0);
  bestEl.textContent = Math.floor(best);

  let worldOffset = 0;
  let gameOver = false;
  let airTime = 0;
  let wheelieTime = 0;

  const clouds = [];
  for (let i = 0; i < 7; i++) {
    clouds.push({
      x: Math.random() * 2000,
      y: Math.random() * (H * 0.45) + 20,
      s: 0.6 + Math.random() * 0.9,
      sp: 0.15 + Math.random() * 0.25
    });
  }

  function reset() {
    bike.x = W * 0.22;
    bike.y = groundY;
    bike.vy = 0;
    bike.angle = 0;
    bike.onGround = true;
    bike.wheelie = 0;
    bike.holding = false;
    bike.wheelRadius = Math.max(14, Math.min(W, H) * 0.032);

    obstacles.length = 0;
    obstacleTimer = 1.0;
    speed = 420;
    score = 0;
    airTime = 0;
    wheelieTime = 0;
    worldOffset = 0;
    gameOver = false;
    scoreEl.textContent = '0';
    hintEl.style.opacity = '.75';
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = Math.floor(score);
  }

  // ---------- Entrada ----------
  function pointerDown(e) {
    e.preventDefault();
    if (gameOver) { reset(); return; }
    bike.holding = true;
    hintEl.style.opacity = '0';
    if (bike.onGround && bike.wheelie < 0.15) {
      // toque rápido = pulo
      bike.vy = JUMP_VELOCITY;
      bike.onGround = false;
    }
  }
  function pointerUp(e) {
    e.preventDefault();
    bike.holding = false;
  }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);
  // teclado para testar no PC
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) pointerDown(e); });
  window.addEventListener('keyup', e => { if (e.code === 'Space') pointerUp(e); });

  // ---------- Obstáculos ----------
  function spawnObstacle() {
    const type = Math.random() < 0.35 ? 'rock' : 'ramp';
    if (type === 'rock') {
      const w = 26 + Math.random() * 26;
      obstacles.push({ type, x: W + 40, w, h: w * (0.8 + Math.random() * 0.6) });
    } else {
      const w = 60 + Math.random() * 60;
      obstacles.push({ type, x: W + 40, w, h: 22 + Math.random() * 26 });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (gameOver) return;

    // velocidade aumenta com o tempo
    speed = 420 + Math.min(score * 1.4, 520);

    // ---- Física vertical ----
    if (bike.holding && !bike.onGround) {
      // segurar no ar deixa o pulo mais "flutuante"
      bike.vy += HOLD_GRAVITY * dt;
    } else {
      bike.vy += GRAVITY * dt;
    }
    bike.y += bike.vy * dt;

    if (bike.y >= groundY) {
      if (!bike.onGround) {
        // aterrissou: bônus por tempo no ar
        score += airTime * 60;
        airTime = 0;
      }
      bike.y = groundY;
      bike.vy = 0;
      bike.onGround = true;
    } else {
      bike.onGround = false;
      airTime += dt;
    }

    // ---- Wheelie (empinar) ----
    const targetWheelie = (bike.holding && bike.onGround) ? MAX_WHEELIE : 0;
    if (bike.wheelie < targetWheelie) {
      bike.wheelie = Math.min(targetWheelie, bike.wheelie + WHEELIE_SPEED * dt);
    } else {
      bike.wheelie = Math.max(targetWheelie, bike.wheelie - WHEELIE_SPEED * 1.8 * dt);
    }
    // ângulo real: empina pra trás (negativo no canvas)
    bike.angle = -bike.wheelie;

    // pontos por empinar
    if (bike.onGround && bike.wheelie > 0.3) {
      wheelieTime += dt;
      score += dt * 25 * bike.wheelie;
    } else {
      wheelieTime = 0;
    }

    // pontos por distância
    score += dt * 12;

    // ---- Mundo ----
    worldOffset += speed * dt;

    // spawn
    obstacleTimer -= dt;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      spawnInterval = Math.max(0.75, 1.6 - score * 0.0015);
      obstacleTimer = spawnInterval * (0.8 + Math.random() * 0.6);
    }

    // move e colisão
    const frontWheelX = bike.x + Math.cos(bike.angle) * bike.wheelRadius * 1.7;
    const frontWheelY = bike.y - bike.wheelRadius - Math.sin(bike.angle) * bike.wheelRadius * 1.7;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * dt;
      if (o.x + o.w < -60) { obstacles.splice(i, 1); continue; }

      // colisão com as rodas
      const hitX = bike.x + bike.wheelRadius * 0.6;
      if (hitX + bike.wheelRadius > o.x && hitX - bike.wheelRadius < o.x + o.w) {
        const obstacleTop = groundY - o.h;
        // roda traseira
        const rearBottom = bike.y;
        if (rearBottom > obstacleTop + 4) {
          gameOver = true;
          best = Math.max(best, score);
          localStorage.setItem('bikeBest', Math.floor(best));
          bestEl.textContent = Math.floor(best);
          return;
        }
      }
    }

    // nuvens
    for (const c of clouds) {
      c.x -= (speed * 0.06 + c.sp * 30) * dt;
      if (c.x < -150) {
        c.x = W + Math.random() * 300;
        c.y = Math.random() * (H * 0.45) + 20;
      }
    }

    updateHUD();
  }

  // ---------- Render ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1a2e');
    g.addColorStop(0.5, '#2d3561');
    g.addColorStop(1, '#f4a261');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sol
    ctx.fillStyle = 'rgba(255, 220, 150, 0.9)';
    ctx.beginPath();
    ctx.arc(W * 0.78, H * 0.28, Math.min(W, H) * 0.07, 0, Math.PI * 2);
    ctx.fill();

    // nuvens
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    for (const c of clouds) {
      const r = 30 * c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.arc(c.x + r * 0.9, c.y + r * 0.15, r * 0.75, 0, Math.PI * 2);
      ctx.arc(c.x - r * 0.9, c.y + r * 0.2, r * 0.65, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    // chão
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, '#3a2b4a');
    g.addColorStop(1, '#151020');
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);

    // faixa
    ctx.strokeStyle = 'rgba(244, 162, 97, 0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();

    // marcas de velocidade no chão
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 3;
    const dashW = 60;
    const offset = worldOffset % (dashW * 2);
    for (let x = -offset; x < W; x += dashW * 2) {
      ctx.beginPath();
      ctx.moveTo(x, groundY + 14);
      ctx.lineTo(x + dashW, groundY + 14);
      ctx.stroke();
    }
  }

  function drawObstacle(o) {
    const top = groundY - o.h;
    if (o.type === 'rock') {
      ctx.fillStyle = '#5a4a6a';
      ctx.beginPath();
      ctx.moveTo(o.x, groundY);
      ctx.lineTo(o.x + o.w * 0.5, top);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.moveTo(o.x + o.w * 0.5, top);
      ctx.lineTo(o.x + o.w * 0.75, groundY);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.closePath();
      ctx.fill();
    } else {
      // rampa
      ctx.fillStyle = '#7a5a3a';
      ctx.beginPath();
      ctx.moveTo(o.x, groundY);
      ctx.lineTo(o.x + o.w, top);
      ctx.lineTo(o.x + o.w + 14, groundY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(244, 162, 97, 0.25)';
      ctx.beginPath();
      ctx.moveTo(o.x + o.w, top);
      ctx.lineTo(o.x + o.w + 14, groundY);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBike() {
    const r = bike.wheelRadius;

    ctx.save();
    ctx.translate(bike.x, bike.y);
    ctx.rotate(bike.angle);

    // sombra
    ctx.save();
    ctx.rotate(-bike.angle);
    const shadowScale = Math.max(0.2, 1 - (groundY - bike.y) / 300);
    ctx.fillStyle = `rgba(0,0,0,${0.25 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(0, groundY - bike.y + 2, r * 1.8, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // quadro
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = Math.max(3, r * 0.22);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 1.7, 0);      // roda traseira
    ctx.lineTo(-r * 0.2, -r * 1.5); // selim
    ctx.lineTo(r * 1.4, -r * 1.3);  // guidão
    ctx.moveTo(-r * 0.2, -r * 1.5);
    ctx.lineTo(r * 0.9, -r * 0.1);  // tubo central
    ctx.moveTo(r * 0.9, -r * 0.1);
    ctx.lineTo(r * 1.7, 0);         // roda dianteira
    ctx.stroke();

    // banco
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(-r * 0.25, -r * 1.6, r * 0.5, r * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();

    // guidão
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.beginPath();
    ctx.moveTo(r * 1.4, -r * 1.3);
    ctx.lineTo(r * 1.6, -r * 1.7);
    ctx.stroke();

    // ciclista
    ctx.fillStyle = '#4ecdc4';
    ctx.beginPath();
    ctx.arc(r * 0.15, -r * 2.0, r * 0.42, 0, Math.PI * 2); // cabeça
    ctx.fill();
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = Math.max(3, r * 0.28);
    ctx.beginPath();
    ctx.moveTo(r * 0.1, -r * 1.55);
    ctx.lineTo(r * 0.6, -r * 1.1); // corpo
    ctx.moveTo(r * 0.15, -r * 1.4);
    ctx.lineTo(r * 1.2, -r * 1.35); // braço
    ctx.stroke();

    // rodas
    ctx.fillStyle = '#111';
    [-r * 1.7, r * 1.7].forEach(wx => {
      ctx.beginPath();
      ctx.arc(wx, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#666';
      ctx.lineWidth = Math.max(2, r * 0.15);
      ctx.beginPath();
      ctx.arc(wx, 0, r * 0.55, 0, Math.PI * 2);
      ctx.stroke();
    });

    ctx.restore();
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W * 0.09, 56)}px system-ui, sans-serif`;
    ctx.fillText('Bateu!', W / 2, H * 0.42);

    ctx.font = `600 ${Math.min(W * 0.05, 28)}px system-ui, sans-serif`;
    ctx.fillStyle = '#f4a261';
    ctx.fillText('Pontos: ' + Math.floor(score), W / 2, H * 0.52);

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = `500 ${Math.min(W * 0.04, 20)}px system-ui, sans-serif`;
    ctx.fillText('Toque para reiniciar', W / 2, H * 0.62);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp

    update(dt);

    drawSky();
    drawGround();
    for (const o of obstacles) drawObstacle(o);
    drawBike();

    if (gameOver) drawGameOver();

    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
